尾反丨月三日明生之名又普對反向色也三居兩反頭也脥謙琰反腹下也都罪反丨大腫貌呼罪反丨俗音水李音里女九反食也又古音肘胣移尓反引腸又裂也又敕紙反苦忝反腰左右處也音現急也又俗時忍反肗音汝魚敗腂今玉篇音纍皮起也郭氏又俗力果胡瓦二反腇或作奴罪反與脮同魚也又於偽反􅍧蘇本反切熟肉更煮也腆俗腆正他典反厚也善也忘也至也二正肯今苦等反可也二浩音晧或作臇正子兖反臛少汁也二膹浮鬼反臛多汁也又房吻反切熟也脘音𬋩胃府也又俗胡板反正作睆音吕脊丨也􅡗舊藏作同上腩奴感反煮也䑍俗於井反正作癭瘤也䑆俗音養音管肥丨或作今武粉反説文云筋頭也筋音斤二音紂腿後也又小腹痛也舊藏作丨方免反敝貌也玉篇虛講反肥也隨函又音古侯反反丨相黏也又陟加反不密也䏧女亞反膩也食證反孕也音寄四柱也丁定反貯食也又音丨腧傷遇反五藏丨也於丗反丨憶也韌音刃勞丨也膪上烏嫁反下陟嫁反丨丨肥貌也許放反山名腅徒濫反相飲也玉篇又餅丨䐄胡紺反食肉不猒也俗徒困反正作遁古對反腰忽痛也誤芳貢反正作賵􅉠也俗常利反二例反胡計反喉脈也又胡結反膜丨二同俗左浪反二俗音疏俗於訃反正作隂風也俗烏對反胦俗於敬反正作眏臎七醉反鳥尾上也先卧反骨膏也胕音附肺丨也䏒普見反半體也俗于句反俗所諌反䐆倉代反大腹也腃俗音眷正作眷還顧也人遇反舊藏作膭以醉反肉􅔂貌胙音祖祭餘肉也俗􅋯正音具瘦也又音翟二入聲俗音隻俗音寂􆇋俗育正余六反長飬覆丨也二􆄻音託丨脪也滴也澆也俗俗通渠云反二䑈俗書若反正作美目也俗音䐞音若脆腝貌也䐚音即膏澤也䐲直立反半生半熟又直輒反也膕古麥反腳曲貌也蒲末反脛無毛也一曰股上小毛也䏳旨熱反脟也脟音劣也䐘其虐反丨丨大笑也腋盈益支亦二反胳丨在肘後也相逸反脛上骨節也臆音億胸骨也脈俗脈今莫厄反血丨也幕也以醎養丨血理之分行於骵中曰丨正作脈二脊精亦反背丨也二俗肋正音勒䝱丨也丨者撿勒五藏也二膜音莫丨也又莫胡反梵語曩丨也玉篇瘦也目丨音曽目小作態瞢丨也眱音夷熱視不言也又大兮反古堯反倒懸首也俗瞿正音俱左右視貌二二俗音希正作晞陽露滳也二俗覘正丁兼丁念二反目垂貌二宅耕反安審視也章倫反目也盿盿旻民二音玄目視二䀬音全目眇視貌籕文古文音眉丨毛二呼圭反玉篇云音也俗倉胡反䁲正莫佳反視也睷乾健二音出香嚴隨函眒音甲鳥獸驚貌也又時刃反張目視也况于反丨膢夾貌音啼丨視困貝莫經反合眼丨丨也又莫見反眩丨也又莫賢反暗未明也音賔古文音融古文音陽􅝯俗正疾鹽思暫二反閇目內思也二或作今音旻視貌也二瞇音玉篇眇目貌也二同瞟普澆反明察也又撫反丨睽明視也瞦許其反目童子也與之反玄眩二音目童子也武延反密緻也矊武延反童子黑也又丨眇逺視也古玄反視貌視貌火玄反亦視貌三眙與之反肝丨縣名又田吏反久視貌合作􅑥見隨函睥俗布迷反舊藏作腴音俞肥丨盺俗音欣或作力丁反二䀽音延相顧視也䁢似泉反好貌也音賔丨暫見也又恨視貌當侯反丨眵目汁睼俗烏耕反正作字呼交反丨瞎也音煩上聲二俗正音古音丨也三睒失冉反暫見也盾食尹反于丨即矛丨也又徒損反人名也二俗眪正音丙明也二於阮反目病也又音腕大目貌又烏括反小無媚也䀕直引反瞋怒目貌也同上目童子也又吉刑兆曰兆丨也二薄啓反俗俗明也眕之忍反目有所恨而止又厚重也三眇彌小反一目少也又視不正睜疾井反丨不恱視也眫俗眯正音米物入目中也二瞼音撿眼丨也睹音覩看也見也俗睆正戶板反大目也又笑二俗睴正胡本五悶二反困視貌也二䁪俗音斬睍音現小目貌也矘他朗反丨䁳目無精也又失志貌莫朗反矘丨也眅布綰普綰蒲綰三反目中多白貌又大也俗奴頂反莫頂反丨睛目細貌俗瞴正音武微視也二俗烏朗反俗他典反正作面慙莫板反視貌俗覩妒二音俗昌者反俗於矩反俗陟雨反䁗俗苦改反苦礦反丨然舉目又好貌也方免反敝貌玉篇又香兖反回視也郭移又胡慣反方免反敝貌也盶音阮目白貌也古了魚列二反音頂三足兩耳鐺屬也䀾音覩人多也古了反烏板反丨目貌古文音首二古文同俟䁂音限丨可畏視也音首去聲眴眴許縣反目動也下又音舜又如勻反又相輪反眩丨也三瞚瞬音舜目動也二眩玄絹反丨惑也視不明也目無常主也於計反目中丨也奄覆也音下悶也安也又目中白也二俗䀎通正莫見反斜視也四正眺今他吊反逺視也又目不正也二睞勒代反傍視童子不正也睇音弟邪視也音悵失志貌也眊莫報莫角二反目少睛也眷音眷回顧也音視看丨也下又音匙亦視貌也二䁅音孟丨盯瞋目貌也苦候反丨瞀也瞀莫候反丨也又莫角反目不明也又莫胡反睚五賣反裂也丨眥怒目貌又五佳反二同俗通眥正士賣反睚丨也又五佳反三通眥正在詣反視也又目際也又才賜反亦目丨也二睥睨上匹詣反下五計反丨丨視人貌也俗烏半反正作䏺手丨也覘丑熖反視也又式熖反莫報反玄目細視也詣糸二音根視也盼正通匹辨反美目也二眮徒弄反目顧視貌亦轉目也俗正時刃反古文人姓二俗􅷃正丑絳反直視也二瞰苦濫反視也古文音照四䀸征例反目光也又丑例反蔽目也又旨熱反目明也俗羊至反正作貤重物次弟矔音貫張目舊藏作䀎莫見反二俗音俗居偽反正作丨睹瞶音貴極視又俗五怪反正作瞶呼貫反國名在流沙三音刃眩丨俗之刃反正作賑論文作經音義作丨陷丨沒也在智度論俗香反二通正雖醉反正視貌潤澤也又子對反際也三於蓋反丨隱也于况反美光也入聲四俗二今正音接目丨也目傍毛也七眤俗尼乙反又音日正從日二䀲目病睦音目親也敬也和也又姓二或作正許轄反一目盲也二俗矚正之欲反視也覩也二俗或作䁻正書藥反美目貌也三睩音鹿視貌也音歷丨視明貌也𥘉八反丨視貌也眣徒結反目出也眰丑栗反目不明也又俗同上莫結反目赤又瞎也胡結反䁾丨目赤也丁結反丨􆄪也音血丨惡貌也彌二音汗面貌也𥈙郎逹反目不正也眛音未目不正也䀛音永不正視也又莫拜反丨眼久視也瞙音莫瞽丨也俗丑列反今正音藥矐丨視貌也二俗眨正側洽反丨眼也二矐呼各反重目又失明也又户各反望也䁯二或作正呼葉反閇一目也又音疊三音攝目動之貌音釋睒丨急視也於決反目深貌也二或作矆正許縛反大視貌三矍居縛反視遽説文云欲走也阻立反淚出貌古穴反目患也睰莫八反視丨也玉篇呼沒普沒二反急視貌也䀣莫八反惡視也又音祕亦直視貌也晣之列反目明貌舊藏作許乙反丨響也䀨呼八反視丨俗正匹滅反目翳也二女洽反又舊藏作留瞐莫角反美貌也俗䁆正於葉反閇目也二䀷音劫目視貌䁍苦洽反目丨也又口陷也瞱筠涉反目不記也瞁呼覓反驚視呼覓反眼也又音􅟕通睫正五洽反丨戲謔貌也音士㮑反二音育望也又目明貌䀫古洽反眼細視或作正音麥邪視也二䁺音釋視貌五甲反視貌呼末反視髙貌也音食音鹿丨也側略反日部第六曦許冝反日光也又光明盛貌也俗暿二正音日氣乾也三音良度也稱也又去聲昕音欣日欲出也晜古昆今古渾反兄也後也同也又姓二晡布孤反申時也四俗正音昏暗也五暒或作晴正音情天丨雨止也或作睲二俗莫丁莫定二反正作冥二字暲音章日明也二或作曼正莫官反路逺也又音万長也三俗丑庚反正作瞪直視也晠俗晟正音成食器也又氶正反明也熾也亦器也二暸音聊明也音郎芳無反時古㫑俗音時一古文同上正篇古文上音春下音時七余反暆音移東丨縣名五剛反舉也音貪􅔟俗古昨勞反丨輩也我也衆也又曉明也今與曺同又呼鳥反二俗明孟二音正作俗正陟遙反蟲名二居陵反巨容反俗音間正作􅳌人目多白㬈音溫昷音溫仁丨諸比類也與昷同旻丨天旻武巾反和也二烏甘反音晨義同音單又去聲晑古營香兩二反明也晐古來友明也曛許云反日入也又黃昏時也暟俗五來反正作暟雪白貌曨盧紅反日欲出􅲿呼光反旱熱也似泉反同嫙好貌他昆反日𥘉出貌晶音精光也曑俗所今反正作參𤾥俗音層正作𤾥目小作態也旴况于反日始出也晆苦圭反丨别也晲五兮反曭他郎反俗正音潛古於丨縣名二或作朝正直遙反人姓二俗音正作閇目內思也㫴俗呼交反正作倉來反曐古文音星同上俗於容反癤也音煩音尤音遷音其上聲暡烏孔反氣盛貌也晃晄胡廣反明也暉也日光也二昊胡老反丨天也同上晧胡老反光也明也日出也胡老反明也旰也光也曜也又姓亦太丨也俗蘇口反莫孔反暡丨日末明也又俗音蒙古老反明白也旿音五明也暐于鬼反丨曄日光盛貌也昞俗昺正音丙光明也二二俗暖正奴管反溫丨也與暖三同三古昴正音卯西方星名也二昉方同反明也式兩式亮二反少時也亦久也又許兩許亮二反俗古瓦反正作咼㫱奴板反溫濕也又丨諌反音晚音項昑玉篇立錦反明也二同暏音覩朝欲明也於阮反丨晚也舊藏作皂五果反眼也朗新藏作眼字蘇老反昈音戶明也又文綵伏俗之忍反正作炅古逈反光也又音桂人姓是古文音是晚旡逺反丑兩反通也明也舒也昄方滿薄板二反大也切也暻俱永反明曲見悟也又許永反暕占限反隂旦日明也將序反音體九究二音暗烏感反丨藹暗也冥也又衣檢反丨丨日無光也藹於蓋反晛顯現二音日光貌也又奴見反義同子感反人姓俗正莫朗反日無光也二今晥正胡管二明也又縣名二舊其九反二晱失舟反古了反明也清也俗音免王作冕冠丨也晷居水反影也規也音祖古文音鬼俗七罪反正作霜雪狀也暅許晚反日氣也又古鄧反去聲音下白在間也於敬反影也映音同上又於浪反反暗也昡俗古縣曬所賣反日暴乾也又所寄反曠苦謗反光明也又久也逺也大也又姓替他計反廢也滅也代也冒莫報反覆也又莫比反十也曀於計反隂風也亦翳也日又反晏通正烏周反安也天清也二曜戈笑反日充照也暈音運日月傍氣也古恨反今作艮卦名也於蓋反日色也曖音愛日暗貌也古文音照丑㫱丑晏反赤色也子閏私閏二反早也明也敬也􅧵奴代反無光也新藏作雖遂反視貌又子對反周年也舊藏作音謂丨類也晦荒內反冥也又月盡也通正子對反周年也二音值㫢句反㬮奴按反安也溫也㫬俗昫正香句反日光也二晤音悟明也朗也㬗奴見反日光也昲芳味反日光又乾物也氣俗音氣正作盵俗時刃反正作眘人姓㬬俗其遇反正作䂂㬓通正匹妙反置風日內含乾二俗音愧正作大視也或作旰今古案反日晚也晏也玉篇云半乾貌二正暀旺二今于况反美光也三皆音照三古鄧反曔音競明也曙常恕反日欲曉也俗他吊反正俗視也暳呼惠反小星也毗祭反暵音漢日氣也音運同暈旵丑鑒反暳息反入聲白部第七貌俗音完丨全也或作正音婆頭白貌也又音波人老面白貌也二三俗得侯反正作皚五來反霜聖白貌古泉正音全丨水又錢别名二皅俗普巴反三古又音皇古文星字音皇音暉音男上聲皓胡反素也白也皎古了反明也皎也又珠玉白貌也皎古了反白也又匹白反皎古了反日光也皀烏了反合也又彼急居立二反榖香也又音貌與貌同皛胡了反明也又普伯反亦打丨又莫百反呼鳥反白丨也皉千禮反白色也輔米反明貌也皠七每反霜雪白狀也皔音旱白貌也正皏今