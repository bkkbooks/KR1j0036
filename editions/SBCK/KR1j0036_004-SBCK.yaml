body:
  text: 痱二音􅏂風丨病也下又扶沸反熱瘡也又蒲罪反丨癗也俗音崖疸七余反雍丨也二俗􅪜通瘳正音抽病差也愈也四疵疾移反黒病也瘖於今反也俗瘡正楚莊反丨痍也或作創刑刃傷也古今作今作丨二痤昨禾反癤也舊蔵作痃音賢音賢丨癖病也古文陟尼反今作胘皮厚也云之反愚也二俗正音流又去聲丨腫起也三二俗正吕團反丨病也三痊此縁反丨病差也痳音林丨歴病也痍音夷瘡丨也俗二正音戈瘡也下一又苦禾反秃瘡也三痟音消渴瘦病也痋徒冬反丨動病也亦丨痛也又俗文中反疼音同上丨痛也徒登反丨痛也下又俗音疼也俗音容㾠俗音狂俗音原二俗古瘭正布遥反丨疽病名也亦疋遥反四俗􅻐􅤙二或作正西斯二音丨疼痛也又病也四俗正蘇官反丨也二瘉羊朱羊主二反尓疋云勞病也於支反身􅇥也又於蟹反挫丨也痿於爲反丨黄痺濕病也音黄丨病也家賈嫁三音腹内乆病也於玄反骨節疼痛也痽俗丁回反痂音加瘡丨也二俗音西俗他丁反俗五奚反俗呼剛反三俗呼甘反正作憨癡甚也瘍音羊傷頭瘡也又音亦病相染也俗音俗俗通正巨攴反病也又俗丁礼反三音支疾也疻音支毁傷也痴㾻上丑之反下直魚直㩀丑㩀三反丨丨者不進不逹之㒵玉篇又病行㒵也俗通㾹正士佳反瘦也反士賣反疾也三二俗􅵅正宅加陟加二反痂丨瘡瘢痕也三㽳況于反病也癠齊劑二音病也又短小也㾄音由玉篇云似癉癉音丹火丨小兒病又音壇風在手足病也又丁佐反勞病又迻俗他丹反風病也㾞正音由病也又臭􅁖􅁏也俗或作正氏壬反腹内故病也三㾾俗力占反俗莫婆反正作􅐣丨尼俗音蒙俗音摩正作塵也俗泉元二音随函云合作厜危反山㒹㒵在僧伽羅刹經又俗他猥反余廉反病也二俗音霞正作瘕㾰音胡丨物在喉中也俗胡交反俗許今反正作廞也陳也俗音哀俗音師音青㾍奴来反病也俗也凋反正作斗旁耳也疔俗音丁㾉音零病也俗音寛俗音盲俗音呉俗音愛正作丨丨鹿遊也相承户呈反俗音京正作疘音公下部病也俗側皆反㾂呼来反病也疨呼加反丨病也莫江反酒病也瘏音徒病也㾕所臻反寒病也疝音山丨痂病也痀舉朱反曲脊也音軍㿈􅀋也俗上音郎下音武正作廊廡二字俗士連反迻俗音皆正作疾香嚴牽切韻音其乆反正作客芳無普胡二反病也疴俗痾正音阿病也又苦嫁反小兒驚也二瘽勤近二音病也音徒病也与瘏同􅒃三俗正㿉今杜回反隂病也五都回反病名也音侯瘡癭也俗音身俗音􅁈屈也俗三居幽反腹􅇥病也二痁苫店二音病也㾫音篇身枯也俗籕文今䖏占汝塩二反皮剥也三音農痛也痎音皆瘧疾兩曰一發也癯其俱反少􅁏也俗音干又上聲俗㿏正音群痺也二􅍙五還反丨痺也玉篇又音同上俗奴耕反俗奴侯反正作䨲兎子也􅻏疋江反腹病也痑他干吐何二反力極也又馬病也又丁佐反病也昨何反病丨又􅀄懈反病丨也相承所迢反病也此二字切不和俗㾋正音休丨息下病也二俗才安反疳舊蔵作甘烏􅀆反痜痿秃二音或作音瘡痦普盃反當盖反丨下病也又竹倒反赤白痢也又音帝􅓼古療正力照反丨治病也亦作膫二痛俗貢反丨病也又病也傷也㿋蘇到反皮上起小痒瘡也今作瘙同瘙同上疥丨也音噐許􅁾反困極也詩云昆夷丨矣二俗烏卧反正作字音又顫丨也又病也顫音戰二俗疹疢二或作正􅐄今丑刃反丨病也又􅃙忍反亦病也六五俗通正於例反埋也蔵也玉篇又於計反七字癆郎到反丨瘌􅁖人也二俗古外反二俗明􅀏反正作廟俗音厠㾏音注丨病也疩或作正疾酔反病也二㾒尼慮反㾻丨病也出川韻當故反乳病也又竹嫁反痗誨妹二音老病也㽹芳万反吐丨也􅵳音貫病也俗疚正音救病也二痓玉篇音熾􅁖病也郭迻俗竹乙反􆆶疋俻反玉篇云氣滿也音步瘡也音路痛丨疾病也俗烏卧於膾二反俗音病瘄俗倉故反正作厝置也瘹音吊丨星狂病也失亮反憂也三俗㾭正側救反四疿方味反熱生小瘡也俗正側界反病也二㾧苦卧反秃丨㾺莫嫁莫晏二反牛馬病也郎計反智二反瘦黒也或作正疋俻反玉篇云氣滿也三俗疸今音旦癀病也又上聲二俗㿅正斯義所􅀉二反病也二或作疛正直又反心腹病也反音例二􅸳音遇疣也俗音􅁾丨􅁖也二俗巨禁反正作􅤉牛舌病也俗蘇豆反㾯三俗烏對反正作丨也音運病也又上聲胡計反小兒病也又尺制反曳薛二音痢病也二烏懈反病痛也㾝尺舎反泄也香靳反瘡中冷也二同痣音志黒子也㾐音例二痢音利病也俗音悼傷也俗通正蒲拜反与憊同疲極也又病也三入聲疫營尺反丨人皆病也俗音落㾇音目丨病也又俗七余反癤今正音節瘡丨也二古文同上女黠反瘡痛也瘴音障丨毒也熱病也俗古瘠今情亦反瘦也病也從脊音資亦反三俗先吐反正作爕和也㿇相承先入祥入二反痛丨丨也音義作習瘜音息丨􅁖􅁏也何各反俗俗今瘧正魚畧反丨病也三俗音即瘌盧逹反痛也又癆丨不調也疙魚乙反癡㒵也俗正并滅反字統云腫滿悶而皮裂也二或作癟正疋滅并滅二反枮病也二或作瘼正音莫病也二㿓正今古洽反丨蹄足病也二痷於劫反病也音渇熱病也郭迻又俗音謁俗食律反正作秫二俗音尺正作俗阻力反正作仄或作正与力反痒丨􅁋丨也二胡郭反㾰丨也奴􅁑反痛也俗苦八反正作劼用力也俗音三正作奭盛也去劫反病劣也俗音角去劫反欠氣也俗音邑俗烏甲反俗為甲反正作屋壊也音伏病重發也俗音極呼麦許逼二反頭瘡也正今居月反氣逆病也二俗正音血瘡裏空也又古穴反二或作􅏿正陟五反寒瘡也二㿑音藥丨丨病也或作今夫涉反少氣也土香嚴又苦呌呼牒二反病息也二􅱵所責反瘮丨寒㒵瘯千木反丨癝皮膚病也音忽狂病又許聿反㽺居立呼合二反病劣㒵也於反三徒活反馬脛傷也又丑劣反私列反玉篇病也俗阻六反正作俗音虐癖疋擊反痃丨病也音歴瘰丨也三俗正烏合反短氣也骨部第十四髏音樓頭骨也二俗二正舌官反尻髀上也尻音苦髙反四二俗骸正户皆反丨骨也三䯊苦何反􅂰骨也又苦訝反髖骨髀上即􅺛骨也俗骯正五丸反䯊丨也二俗徒昆反正作殿􅁏俗正五髙反蟹大脚也二骹苦交反脛骨近足細䖏也与跤同俗烏花反俗許君反骿部田反併助也髍音摩水病䯢音摩偏病髗音盧頭丨髐呼交反玉篇与髇同丨箭也俗五􅀆反髈俗歩郎反正作膀髎今或作力遥反髋骨名也二上宅江反下苦江反丨丨骨也俗音支俗音方正作肪脂也二俗於塩於焰二反正作饜飽也俗力知反許交反丨箭也骬音于􅐳丨也二同苦􅀲反髂上骨也或作正音牙髂也二骺音侯骨丨骰音頭丨子也又音古䯑䯖上苦光反下音郎骨聲也音形骨也䯓苦圭反肩骨苦商反丨骨也俗正五􅀲反䯞丨髂骨也二失車友骨也髃音愚骨在􅈩前也又魚口反肩前丨骨上聲䯗毗米反股也三同髄三俗髓省正息委反骨中脂也五毗忍反膝盖骨也正髁二今苦瓦􅆎骨也下又口化口外二反臋骨也臋音徒昆反三骽他每反丨股䯗也俗音鎻舊蔵作俗之勇反正作蹱二二古文音體骫俗骩正音委骨曲也又姓三二俗胡感反正作頷􅦡古本反禹父名也二同髃五口反前丨骨也骾古猛反或作今以沼反肩骨二骳文彼反屈曲也俗正胡朗苦浪二反丨髒身盤也二息淺反少也於許反肩骨巨綺反小骨也苦本反俗以沼反肩骨也俗正莫郎反丨骩蟠身也二丁吕反去聲或作古岸反肋䝱骨也今作幹字二髂苦嫁反􅆎骨也又俗音格口反与䯊同音帝背也二骭下晏反脛骨也又音肝䯘胡乱反􅃮丨也二同正䯣今丘㟴反􅂰柱地也二古外反詩云丨弁如星也又骨也又㑹括二音䯠俗音奥正作䐿俗正資智反丨枯骨二資智反鳥䑕之骨也苦浪反丨髒也口外反􅧥必嫁反川韻云刀丨也䯟徒對反丨愚人也髒則浪子朗二反丨體盤也俗音睡入聲􅀘各反胷丨肩脾也䯇苦没口八二反勤也力作也䯉烏没反咽中息不利也䯜古歴反骻間汗也又音昔骲歩角反箭頭也又普木反骨鏃名也其月反尾本也骼音格骨丨也俗土角反􅦅俗音甲陟劣反續骨也俗徒結反俗或作許玉反正作丨顱即髑髗也二正骱通今頭葛反堅骨㒵三俗䯏正古活反骨端也三篇又音刮三胡􅁑反丨􅚯扇骨音􅉥肩髆又俗音湯戸八反齧骨聲也莫八反丨小骨也􅙡當没反丨䮩獸名也胡郭反房亦反弓弭䮩音骨丨䮩獸岀北昨没反小骨也俗正北角反骺也二二俗音憶正作臆舊蔵作勒疋角反骨箭也頁部第十五㶊五俗二正以之反頷也養也輔車骨也七䫋誤頺俗頽正杜回反􅁀風也又無髮也三五關反銑也愚也顦昨焦反丨顇也或作憔同音盧頭丨也顛丁年反墜也隕也隕于敏反顀直追反項丨也或作音婁正作髏都回反母丨夏冠名也或作追頨許縁反丨妍美頭也又音雨孔子頭也顝苦回苦骨二反大頭㒵也於支反美容㒵也顒愚㐫反仰也又丨丨然君之徳也俗正五髙反髙頭也二俗㛲正户來反頥下也又古来反頬也二音叉項丨骨也顋蘇来反丨頷也顬人朱反顳丨耳前穴動也俗呼空反正作谾俗相命反正作􅁂􅓄音須待也口咸反面窊也上音侯下音遐丨丨言語無度也音斯好也顭俗正呼弘反惛迷也二烏紅反毛名也或作正音婆丨丨勇舞㒵也二口甘反醜㒵顐上苦昆反一五昆反丨丨秃無髪也又上亦五昆反下又戸昆反頝䫜上口交反下於父反丨丨頭凹不媚也上音刀下音豪丨丨大面㒵也頿俗相俞反䪸或作䫒今音悶頭名殟丨又無所知也二音求戴也䫏音欺方相也之延反頟也音賔頭憒滿也一曰頭骨頄音求頬也武延反􅀟生也顅音慳頭髪少㒵也二或作正居隨反丨小頭㒵三音堯頭髙長㒵頎音析頭長㒵音零瘦也俗音崖正通音煩玉篇云醜也二音俄齊也又音我側弁頭也頕都甘反頬也俗徒登反顓音專丨頊又姓音胡牛頸下垂䪹音丕大面也頵居筠反大頭也又於倫反亦大也俗五郎反䫞去消許么二反大額也音欺方相也䫆音成頸也顴音􅁠頬骨也誤音傾側也在西域記第六卷音規在百縁經上聲俗顙正蘇朗反頟也叩頭也再拜也頟五格反二居井反項也前曰丨後曰項也又平聲失忍反舉眉視人也又平聲頷乎感反牙丨也三同項乎講反胭也䫂丁可反醜㒵也乃頂反頂丨也䫉俗正疋米反頭也二疾共反好也莫頂反眉目間也余湏反水名州名又姓又巨反余頃巨頃二反禾也又穗也俗二正胡郎反頡丨也下又都感都紺二反顲丨也顲盧感反面黄醜丨也又力稔反丨然作色㒵也􅷯或作正音父頬骨也二顆苦果反小頭也又數也䪵俗音雅䋶省正息􅁃相拱二反前兩足也二䫲呼感反食不飽也正苦感反丨疾也頠魚委反閇習容止也俗正古文去反曰也丨敏也今作湏三去頴反竟也䫩桑感反顉丨揺頭㒵誤新蔵作字義合作頨音雨孔子頭也在梁弘明集第一卷俗音主俗音顯􅐫甚反丨䫴無㒵懦劣也䫴渠飲反切齒怒丨也欽錦反丨醜㒵士錦反丨也䪳音尹面叙也虚我許何二反頭皃也踈兩反醜㒵又初丈反上苦老反下五老反丨丨大頭也顠疋沼甘少二反髪白㒵也俗正之徍反頭銳長也二頛廬猥反頭不正㒵口猥五罪二反頭不正也又音欺大頭也二同䪾二俗之忍反䫰或作今正力忍良刃二反頭少髪㒵又顔色胗丨也三音善反倨視也頍俗今丘弭反弁㒵又舉頭㒵也二音逺靣不正也顗魚豈反靖也樂也頲正今他頂反丨直也二二俗渠九反上又音信顃二同古廻反光也輝也下又玉篇談塩二音面長也俗五巧反籕文音頂二跪逹二音䫀古懇反頬後也䪴章荏反頭骨也上且撿反下魚撿反丨丨不平㒵顩魚撿反䫡丨狭面銳頥也亦丨也胡本反頭面形圎也昌旨反玉篇云面大也音撫又舊蔵作規在旨縁經胡老反天也又天邊氣也去聲俗正内反洗面也二徒乱反面圎也顁丁定反題也音縣顋下也毗志反首也或作音号白首人也莫内反味前也俗正顡今五恠魚旣二反頭蒯丨也又不聡明也蒯音苦反二頇音岸頭無髮也俗二正音喻和也呼也三音剃二同古文字二同㥧順枕二音䫡口䧟古䧟二反丨顑面長㒵也又苦斬苦咸五咸三反義同二顑五䧟反䫡丨面長㒵也俗俗通顇正􅁗季反痩􅁖㒵也三俗顧正音故眷丨􅒯視也二都困反挽縱掣丨也三俗正音淚丨種也又善也法也四俗正羊去反先也安也也怠也廁也樂也二三俗顖正音信會也今呼丨門也四音􅀾四支動也今正音又顫丨也疾也或作亦得二纇盧對反絲節也頪盧對反難曉也俗皮媚反正作贔丨也或作頫正他吊反伭頭聽也川韻又音府伭頭丨首也二俗盧對反正作頪俗音陷音喻入聲頬兼葉反丨輔也目下耳前曰丨額俗頟正牙格反丨也二烏葛反丨也俗正苦骨反頭秃無毛也二烏没莫骨二反内頭水中也頡胡結反丨飛上下㒵也頔音笛好㒵也徒各反丨顱也又丑格反盖也頜古合反方言云丨頷也或作正苦結反丨短人也二俗正蒲結反丨短㒵也二顳而涉反丨顬􅁂骨也䫎止恱反頭短㒵䪼之恱反面秀骨也顣二俗將六反俗正疋各反面大㒵也二江西徑音經自切五狹反烏葛反与同鼻丨也舊蔵作額五陌反鄂正在續髙僧􅀓頢古活反小頭㒵也音岳􅀃文云面前丨玉篇云鼻髙也五各反嚴敬曰丨俗正五各反面髙㒵二䫦古盍反丨車頜骨也䪺俗同上部第十六丑略反􅀃文云乍行乍止也從彳止聲几走之属皆從丨也俗邀正音澆又於消反􅃒也要也求也二逶迤上於為反下徒何反行㒵也下又音移遅二俗遟遲二正直尼反晚也徐也乆也緩也又姓四逾音俞過也越也遑音皇急也逑音求匹也聚斂對合也暹音纎日光進也七廵反丨巡退也古或怍逋正博􅀌反懸也又平也三三俗䢬二古今遷正七仙反從也變也移也㫒也与亦同七同上字林云登也七仙反䇹丨竹名迁七仙反塟擇也又標記也迂音于逺也由也又憶俱反曲也又於武反曲廻㒵也二同俗逵正渠追反隠也又交道九逹也二音渠丨麦也遺音唯亡也失也又加也贈也又有餘也又姓遐戸加反丨逺一三俗杜回反正作隤也竹丨也二俗今正徒丁反草莖也五音科軸也又陟􅀲反棰也二俗音庭正化二字遒即由自由二反盡也逎即由反從也迫也又縣名由遥二音行也音由貴玉也音由􅀷視也二俗古逌通􅷚今正音由逺也又氣行亦行㒵也又与靣同中形樽也六䢟二俗䢊古逰通遊正音由丨放循歴也五俗音蒙俗正音征与征同行㒵也又俗音延二遨通正五髙反丨逰也二俗音親俗戸官反俗古今音徒道丨也三俗音消二俗正戸開反反也退也親也復也三俗息由反远二俗丨尤二音郭音廵俗音恭俗㪷二音迗逇上五禾反下徒本反玉篇云丨丨違天下也俗廻反音追雷也舊蔵作清俗清清漸二反相承堆推裴匪四音􅵫辿丑連反緩歩也二同楼􅈁二音二同舊蔵作迷又郭氏俗呼角在廣弘明集第卄四卷中徒聊反丨也䢒音交㑹也三俗音廉正作盛香噐也又鏡丨也四俗音邊俗遼正音聊逺也又水名二迡玉篇音遟通正陟連反丨又移也又直連直二反二正今陟倫反丨邅也二來賚二音至也就也二俗遄今市縁反速也疾也三䢣七俗今余昭反逺也行也八俗音縁二俗音延古文音憂音毫音違新蔵作灾舊蔵作違在續髙僧􅀓第六卷舊蔵作􅃒誤七余反正作趄音申二俗或作音懷胡罪文反正作代相也又去聲七字遆俗随函音弟又音提俗音甚逞􅐫領反決也疾也通也極也盡也選思􅁈思管思縜三反㨂擇也迨徒乃及及也二俗力展反工作輦音武胡果反語過也古文音道俗或作今音尒近也三迆上移尓反下力尓反丨丨連接也俗子礼反音此異也俗音舞俗正戸並反草名也二音乃􅙝二同音起去聲迿峻縣二音出表辝也音赴俗迋正于放反徃也勞也二二俗正徒計反丨又厎反去也三俗音淡二俗遯或作遁正音舒逃去隠避也四三俗求位反正作匱逝時制反丨徃也行也遾時制反逮也逗音豆住也止也又丨遛也䢝依嫁反次弟行也古俗正音退曰行也三二或作今古􅀱反遇也三俗徒對反俗逅正胡反邂丨也二胡界反丨逅不期之意也亦参差也或作逭正胡貫反逃也歩也行也周也􅅮也迭也二俗音競或作遡正音素行也讃也二􅈥正反陟利反挫辱也逜音悟干丨也以見反相顧視而行也俗迓正五嫁反迎也二俗正去智反避也二遃音彦行也音制迥也度也䢭似面反遮也又羊綿反移也又音延行㒵也􅏒二作迵今徒弄反過也亦通逹也二二俗䢯二遴今良刃反難行也又姓四中句反不行也音救恭謹行也音㑹无違也二同俗盧候反二俗他􅃸反正作䜴二字自投下也迕音悟遏也俗正下計反不進也二邁埋拜反徃也老也超也逺行也二之夜反甘丨也逯三俗逮正徒愛反及也興也行及前也又徒帝反四俗二正􅀻閏反疾也又音信三蘇困反恭也遁也順也避也從也便也邏郎佐反逰兵也避毗義反迴丨也去也􅃉雖遂反深也逺也􅃍通遽正其據反息也疾也戰慄也又竟也務也平也二俗古文苦告反相違也二迸百諍反散也古定反路也或作徑這音彦迎也三篇又之石魚則二反然也音嚴申􅃗反郭迻音遮俗音愛正作靉遉丑正反邏候也古􅃸反䢙音敗入聲迭俗正徒結反道也相更易也二俗迄正許反臻極届至也二二倍音逸迹資昔反足丨也俗迪正音笛道也進也正也蹈也二䢮音笛雷也三俗疾葉反正作捷䢱徒俗反遦也遦音貫盧盍反丨遢行皃也遢他盍反邋丨不謹事也䢔上胡合反下徒合反丨行相及也餘律反行皃也还俗不浮二音俗音捺随凾音逹遹音聿述也自也百遵也舊蔵作子聿子骨蘇􅃿三反俗所洽反正作瑞莫也同迄許訖反魚厥反音勿逺也音􅃙長也又張開也俗正的吊二音至也二俗正丑角反逺也一曰警夜又丑畧反畧丨行皃也二丁叶反丨走也俗今先叶反丨也二逽女畧反走也徊猶徊徘也或作俗徯正胡雞反有所望也亦作丨踁字又胡礼反待也二徉上音相下音佯丨丨徒也今徛正丘竒反丨竒也舉足以度也二陟庚反長角也俗絛或作他刀反正作絛編絲爲之二衕同㓊二音丨通街也徂昨胡反徃也芳容反使也俗或作正疋丁反使也与同三􅂫彫反丨丨飛羽聲又音宿丨然也口皆反俳丨行􅁖也徕音来還也又力代反勞也人銜反丨開皃音令道也俗令其悲反丨䔧垢腐皃又音妹􅀧筆也二戸經反行皃也音䒱行不正皃音􅂊不齊也俗正徒聊反獨行歎息皃也二俗鞗正音條草也切韻作䩦二或作正音仙行皃也二徸昌容反欲行皃音由行也布反行皃也音他行皃也􅜃音夷行平易音憂丨遊也音啼丨反待也亦行皃三同音東行皃也又羊刃反俗正上一音攅下二五官反丨丨失途皃子紅反數也二俗去乹反近作過也二俗今戸庚反撲也平也又山名亦姓三二古文音申邊反同徒丨黨也又歩行也空也也音従俗音胡上聲很胡墾反丨戾也以淺反建也溢也豊也又姓又水潮宗於海也通徙正斯紙反移也二并弭反使也従也軄也徥是二音行皃也余隴反巷道也俗徴正陟里陟􅁜二反召也明也成也虚也證也又姓二音䡄丨跡文彼反丨丨猶遅也衙音語行皃又音牙丨府亦縣名虚豈反楚人呼猪也或作于􅀑反正作􅰜大風皃㣫之勇反相跡也又古文動字亦踵字㣤音踐跡也又行皃音踐街也又䠛也衜衟二古文道字術也丨路也二古雅反且也借也又姓通正女乆反習也二徎他頂文并二反雨徑也古文徃字随凾音引可以丨塗炭也上又俗失忍反二新蔵作􅆂胡感反水入舡也去聲䘘四俗御今魚㩀反侍丨又理也追也享也日也又姓五北教反丨直吏官也衎苦且反樂也定也徿良用反行不正也俗正劒反行皃也二徝陟志反施也徇曰衒名行也詞閏反求也從也又􅀻閏反徧也二古定反道也路也又邪小道路也衒􅸹音縣目媒也行賣也又自矜也二俗五到反慢也倨也正作微徧音遍周也盡也衖今正胡降反街也与巷同又姓二音巨入聲竒得丨失也獲也有所丨与䙷四同正徹今直例反通也逹也道也明也又丑列反二食反技丨法也又道藝也又姓彶音􅇥遽也又丨丨似有所追也彿芳勿反彷丨也蒲木反侍從人也彴之若反撗木渡水也初戢反行皃戢音阻立反所律反循也􅛕音格至也俗或作正臣畧反倦也切韻作五音俗行不住也似足反風丨与俗同得合反行皃􅂫合反行皃也㣙徒歴反行皃于勿反行皃也倉歴反衒古文音訓食部第十八䬢䬭六俗饕二正他刀反貪財曰小八饑居依反榖不熟也俗古飢正居脂反丨餓也餧也又姓三䭍三俗或作餬今音胡􅀉食也又糜也五四俗䬫正一今音提􅀉食也又都奚反又丨餬也六䬾音同上餹丨也音修􅆀嗞味爲丨􅄳徐􅄹反飴也俗古飴正以之反􅄳也三胡交反殂也又非榖而食曰丨与又有同三俗正都回反丨子也四音侯乾食也士咸反不廉也俗音咸俗徒端反䬲俗音鈎里凝里證二反馬食榖氣流下也二俗側皆反正作齋四俗或作􅧮正音修丨饋飰也六俗餴或作正甫文反􅧮丨飯也三俗安姑反餻音髙糜也俗音供餫或作餛正戸昆反丨飥也二徒昆反丨音蒙盛食滿皃也餦音張丨餭􅄳也餭音皇餦丨也俗􆄖正所鳩反飰丨也二俗羊句反正作勾齊遇也俗音倉喰湌飱音孫以飲澆飰也上一又俗倉安反三俗飡二正倉安反丨食也三奴冬反䭢丨強食又女江反亦强食也女耕反丨充實也舊蔵作禽音尼餌丨鋤弓反丨饞貪食也音籠丨餅餤徒甘反尓疋云甘之進也又梢進也􅊡之延反厚粥也二同俗或作正居言反粥也三俗餂或作音甜二俗吕珎反賁零餌乜籀文􅛰正饔今於容反熟食也三䭣或作餈二今疾資反飰餅也餻也三餥非匪二音餱也一曰相請食也䬯奴兼反祖謁而饗也又女廉反南楚呼食麦粥也音丨餌也又五桓反饄或作正音唐丨䬾黍膏也二俗音將音希二同音鎗上聲餒奴毎反餓也俗盧敢反俗音麨䭛俗音敢正作噉俗䭕正子敢反澉丨旡味也二書兩反曰西食也二同飷音姐無食咮也三俗􅂫感反正作二俗或作䭉正息委反餹䬾方言云餅也四餞疾演才箭二反以酒食送人也黏也去演反乾麺餅也二俗音勇来可反丨鈎也音稔熟食也二同䬳愽管反屑米餅也於里反噎聲䬿音尾也䭑良舟反廉也又小食也又丘檢反食不飽也子舟反食薄味也􆇩川韻良冉反食無昧也饊音散丨飰䭊或作正音影飽也二䬷或作正音䭉飫也二俗正奴管反女嫁二曰送曰丨女也二音視貪食也飳􅫂天口反餢丨餅也二同􅥌俗奴罪反去聲館古玩反丨舎也丨驛之舎有作舘亦同俗饉正音近無榖曰飢無菜曰丨二時戰反食也餔音歩餹丨也餹音唐餧於偽反丨飲也俗飤今飼正音寺食也与食丨畜也三饌士戀反具食也或作饋正求位反丨餉也二俗餌正如忘反食也二俗飵正昨悟反相謁食也二俗餼正許反餉也又生牲曰丨也玉篇又許乞反飽也二􆄗俗或作餉正失向反饋也三俗古外反䬺䭥二俗䭐正余亮反丨餌也三俗丘今於熖反飽也丨􅁖也又於簾反三二俗二遍飫􅷩二今依據反飽也也又賜也六俗正女救反􅄂飰也二俗力救反或作饎今昌志反尓疋云酒食方言云熟食也二俗正与縣反飽也二飣丁定反貯食也俗正子峻反食餘也二俗音俻苦到反餉軍也二俗音遂俗補昧蒲昧二反新蔵作餌仍吏反餟陟衛反休祭又陟劣反􅀕酹也酹音音稅小餟也又郎外反門􅀕也以芮書芮二反小餟也子焰反疾也音焰美食也市焰反足也之恕反大麋又豕食也䬬於亮反飽也俗正音賛羮和飰也二於廢反飰􅆨也音咡㑹也俗正子耐反装飾也二都豆反丨飣也烏恨反饐飽也又烏困反相食也許􅁾反飰具也䭓饐五恨反食飽也下又乙反食傷熟也又音噎氣不能食也二飰通􅽁飯二正符万反丨食也三入聲䭞音亦岀西川篇俗之六反三俗呼各反正作􅋯羮丨餄古洽反丨餅饁筠輒反餉田也餗音速鼎實俗音腹俗音酌音截丨食也􆇘舊蔵作鑠音式若反銷丨通叔正音厄飢皃也二音厄飽聲䭆女厄反丨炙餅餌名居六反饘也烏郭反味薄也䭂音邑食飽許訖反飽也与􅅩反養也餣於業反餹也芳逼反飽皃俗正於物反飴和豆也人於月反義同二烏葛胡葛於芥於􅄢四反飰傷􅆨穢氣也餝六俗正􅂛織反裝也也華麗也清絜也七二俗飻二古餮二今他結反貪食曰丨七餑蒲􅃿反茗丨也䭒音息食丨也奴塔反食皃也又丨也迻又俗音奴罪反都塔反丨也飶毗必蒲結二反食之香者也飥上音􅀶下音託丨丨也俗􅥪正音甲丨餅饆属也二音未馬食榖也蝕音食日月丨也部第十九麦俗正音脉白虎通云金王而生火王而死亦姓也二俗素和反正作莎二俗或作正音牟大麦也四四俗二或作麩正芳無反麥皮也七音胡黏也古作或作正音来大麦也二俗䴭正音才麹也二敷容反煑麦也俗古玄反正作䅌麦丨也符支反餅也正今昨何反榖麦淨也一曰春麦二俗正莫紅反麹生衣皃反麥粥汁也又音去音餅索丨也去聲俗俗通麵正莫見反破麥之丨也三二俗平秘反正作糒糗也初反麦丨也所晏反餅麹也入聲􅎘五俗麹正去匊反也又姓六䵂音􅅇麩也誤舊蔵作赶其月反舉尾走也又居言反音未􅋗也俗或作􅲄今蘇骨反麥屑也三下没反丨糏也正作杚戸八反麹名舊蔵作熱字在僧護經郭氏又俗音五刀反音格砕麦舊蔵作麹音責蘇叶反二俗正羊即反麥丨之穴部第二十舊蔵作窺在破邪論窺犬規反丨􅀚也􅀼且也小視也烏􅀲反丨凹也深也又水名二同䆥俗今䆤正音川丨穴也孔也通也三䆼俗窼今窠正苦禾反窟也巢丨也或作同三俗窂正音勞養也堅固也二窴音田塞也又堂練反囯名䆙三俗窯二正音揺陶師燒瓦丨也五圭椎乃二音甑下孔也又俗音窯二古二正音窓牅也又聡也四三俗竂正音聊窓也穿也亦小空也四音聊空也亦􅄫丨今作寥二俗正窬今音俞穿丨也又門邊小竇也又音頭今穿也又音豆古文今作竇子三穹去宫反髙也窿力中反穹丨天勢也音要二俗星醒腥二音丨悟也古文字宅耕反丨響也烏萌戸萌二反丨也音零中反丨宏閒大㒵也居道反丨龍出川韻烏交反䆱二魯甘反下他甘反丨丨薄大也二俗音覉窚音成屋容受也正作窚音辰星宇天子所居俗七余反正作岨穻音于虫篇穴也功穿二音䆖二俗戸萠反正作宏大也䆑宅耕反小突也音寅俗音情俗音竀丑亨反正視㒵宅加反窊丨􅀷㒵也扶浮二音俗而容反正作毳飾也俗於元反正作屈也俗䆨正音寜天也二俗音阿音窓音寛音延俗渠憍反俗正与之反室東北隅也二俗竆正渠弓反􅂌所到囯也二上陟倫反下祥亦反丨丨下棺也又厚也穸夜也上又徒昆反火現穴中也音陳二音衡音招上聲正窶俗其矩反貧無礼也二烏了反丨窱􅀷静也与杳亦同吐了反窈丨􅀷逺也又他吊反叫丨亦􅀷䆳㒵窕徒了反窈丨寛也好也又滛也美也色也烏了反逺也􅀮也窅烏了反􅀷目㒵或作正羊主反噐中空也亦病也又􅈸也二苦簟反鹿名也窘渠殞反􅇥迫也空旱反烏本反丨㘴也二同􅐛子朕子禁二反漸也濕也俗五口反窞二或作今徒感反坎傍入也玉篇又音坎三俗音象俗音殞正作雲起轉也又雷也窵音鳥知拱反俗七稔反杳叫二音音掌音去聲窨於禁反地屋也正􅐎今疋㒵反起釀也又實也是也俗音霍音莫二䆘烏甲反人神脉刾穴也古文居六反徒結反不平也陟格反窟也俗音塞二音縮俗突正陁骨反觸也欺也􅀃文犬從六中岀也二􅠈音伏地窒也䆢或作䆕今苦穴反旡門戸也又於决穿㒵二穵烏八反空也又手丨為穴也俗音蜜窇蒲角反土室也窡竹滑反滿口食㒵也窋竹律反物岀在穴㒵又丁骨反音虐角部第卄一觔二俗音斤音􅀌角也礼噐酒爵也俗觥二正古撗反角為酒噐可受七升有過者一舉而盡也三䚡蘇来反角中骨也甫嬌反馬銜也与鑣同徒和反牛無角与牠同俗音炎音巾音傷酒噐也必迷反撗角牛名觠渠貟反曲角也三俗古還反正作鱞字去竒去綺二反角一俯一仰也俗䚭正音宣揮角也二烏􅁅反曲角中也或作觩今渠幽反厄曲㒵二㓩渠幽反角爵㒵或作正息營反赤角弓二䚗俗正音江舉角也二正􅗧今音端角丨獸名􅃺如豕角善為弓二觰陟加反角上廣也䚬俗方人反二俗觽今正許規户圭二反角錐童子佩之又銳端可以觧結也四俗古行反俗五交反二俗陟庚反正作角長㒵喧羲二音牛角一俯一仰也字由反収繳角也音疑丨獸角㒵又音嶷丨兵角名䚣伭啼二音獸角不正䚧也与觻同王勿反美人角也歹部第卄二歹五割反殘丨也􅷕音祥女􅀑㱠苦胡反丨痺痩􅁖也古文音禍也音昏病也又未立名而死殫音丹盡也殅音情雨夜丨見星也殂在胡反死也殱音尖滅也盡也殃於良反丨咎凶敗也㱚昨干徂旦二反禽獸食餘也上又古文􅁏字二同俗力居反皮丨在何反小疾病也或作殍正芳無平表二反餓死也又符鄙反草木枯落也二殭居良反死不朽也㱶音彭丨死人胮也作曺反也殏音求也居冝去竒二反死也弃也㱡仙疑反殑丨􅖖於爲反枯死也飱音孫飲澆飰也舊蔵作弘殤音傷反丨未減人死也或作今所姧反單干别名也二殦郭氏俗音昌脂古尭二反又川韻音刀二俗音俞正作􅃾􅏂丨俗正音亨㱶丨枯死也二音終没也音州上聲㱛三俗正昌兖反殘也盡也又對卧也四俗古殄正徒典反絶也盡也三殞俗正於敏反殁也也二俗殀正於小反殁也少死也短折也二俗音善㱙音朽枯也胡果反古禍字􅃇蔵作弭殆徒乃反危也近也胡罪反不平也音􅊲丨打㱟疋美敷羇二反枝折也又音彼㱬􅖖上烏賄反下池毎反丨十知人也殕芳武反食上生白毛也又􅀒二音亦物敗也隨凾云誤合作㱙音朽枯也又俗鉤苟二音二俗雅推二音芳反俗叵反俗祚感反正作弓弦也俗子了反丨絶舊蔵作琰殑其極反欲死也又凝等反梵語河名也音殿去聲殠昌呪反丨敗􅁖氣也殨胡對反􅁏爛也必刃反丨殮也殮力驗反殯丨也音賜盡也死之言丨也殪於計反死也謂一發而死音丨嗘極也死㒵也俗正恣次二音丨死而復生也二俗正他計反殃也二俗下戒反㱵方問反殨也當故反死販也音例死也音近埋丨也㱴才賜反骨也郎外反疫病也又力卧反亦病疲也先外反瘦病也他計反丨極困也於盖反死也俗音拜二俗音㒵舊蔵作而遇反許穢反極困也殉廵閏反丨以人送死生埋曰丨從晉文公時有也入聲殖時力反種也埋也生也歾俗正音没死也終也盡也二殟烏没反心悶也又烏昆反俗音六正作戮也七六子六疾又三反丨也㱸㱤上扶歴反下擊昔二音丨丨欲死之㒵也俗正紀力反􅇥性也又誅也二殰音獨殤胎也又􅁏敗曰丨也􅿗音洛殂也子律反死也終也㱞古文冝及反今作岌危也巨勿反礓也或作正音葉病半眠起也二或作殗正於葉於葉二反丨病也二直葉反殗丨病俗正許劣反盡也二奴没反殟丨心乱也五角反卆死也殐上音榖下音速丨丨死㒵殈呼反鳥􅆑破也音莫死也俗徒結脂利三反舊蔵作桀渠列反口合反丨死也魚乙反水流㒵二或作上扶歴反下先擊反丨新死之㒵也今作㱸㱤二字力部第卄三力水反侮也犯也欺也与夌同劬其反丨勞也用力者勞也音擎武也強也力也汝羊反丨逼迫㒵也音匡丨勷也勦主父反䡖捷也又子小反勞也音牟勉也􅭍音毫後健也正㔙今甫音反大也二上客庚反下苦淮反丨丨人有力也芳夫反古文從字又烏八反古文音勲放丨堯字居貟反玉篇勞也劷音羊􅂆也正俗口庚反信也二勆音郎有力也古文音兵音從音經上聲勉音免勗丨勤強也􅂆丨也勐其杏反丨也又嚴也亦害也􅁖也与猛義同居堰反吃語也二或作正其兩反迫也勉也力也三俗勨正羊兩徐兩二反勉也二音兩丨勞力拒也勜烏孔反丨劜屈弱㒵㔦余兩反勉也音去聲勵音例免也􅂆也俗正結正反強也健也二劾苦戒反勤力作也劭二俗常照反正作字俗劵正去願反約也契也又大曰丨丨曰契也二余制反劬勞也二俗勮正其㩀反勤務也又疾也懼也二勱莫芥反勉也強也音俗或作通正音慮􅀰也導也又音盧七劤音斯多力㒵勬音眷勤也又居貟反亦強健也㔣盧對反推也音例勡疋妙反劫也㔗扶沸反牡勇之㒵也音木入聲劣力别反弱也鄙也少也俗勃正蒲没反也􅁖逆也二㔜俗同上劦音叶同力也香嚴又音麗勰音叶思也今作勰俗勠正音六力也併力也又音流二二俗許玉反正作勗勣音積丨功累徳也俗劮正音逸䂊也弄也二劼苦八反用力也又勤也固也眘也居月反強力也劜乙鎋反勜丨音刀遼東大名也勊苦勒反自強也子恱反丨断物也㔓業反二尼六反二方結反大力之㒵勎力竹反劽音列立部第卄四竛竮上郎丁反下普丁反行不正也或作竛俜五古文龍字俗䇕或作䇓正音湏待也三音端齊等也又上聲又音博竴七廵反喜也二或作正口乖反物不正㒵也三俗正七廵反改也正也二竤或作竑今戸萌反量度也二俗音坈俗音田塞也俗音端俗正増繒二音巢高㒵二古文言字音龍上聲俗竪今音樹立也又童僕之末冠者也又姓二靖疾井反立也思也理也審也亦作静字竫疾井反停安也与上亦通䇃二古文床史反玉篇同俟待也竦息拱反敬也執也跳也上也不善抑􅁖也攱居委反枕也又居僞反載物也俗竘正音口健也又立主反巧也二胡改反堅丨神人也竬立主反丘也都罪反木實垂㒵蒲下反短人立也音几立也他􅀧反竝音並俗知兩反俗正直吕反乆立也与佇同二音龔去聲􅔡俗競古竸正擎敬反争也強也逐也髙也􅃍也三站知陷反丨立也二音值竨徒吊丁立知角三反􅔲音義正也忌羇三音胡計胡礼二反音智江西随凾俗音竹遇反俗音韻䇐􅀋利立三音臨也音住香嚴又俗音主入聲其謁反盡也盡忠不愛其身也翊羊即反輔丨也又郡名也羊即反鹿伏二音見􅀑㒵也二同竐俗䇍正􅀄六反齊等也与珿同二良渉反羸也䇎七雀反驚也王伐反竚立也鹿部第卄五麁麄倉胡反踈也大也物不精也又不善也二䴢俗麋正武悲反鹿属也二麤倉胡反浙韻云行路逺也又驚防也鹿之性相背而食慮人獸之害也麒麟上音其下音隣瑞狩也君王仁至出見也麐古文音麟二俗正儒湏二音鹿子也三麞音章獸名鹿属也䴤音生獸名大如兔也三俗麛正音迷鹿兒也四麑五􅀆反子也音圭鹿属也籕文倉胡反今作鹿又音塵麘俗音香麎音辰牝麋又音淳俗音瓶古文音塵俗麢正郎丁反丨羊獸名二胡官反鹿一歳也麙五咸反豹絶有力䴧於爲反鹿􅁏也䴦音銀獸名似絡而八目䴥通正音加雄鹿也二俗麀二正音􅁨丨丨鹿逰也又雌鹿也三麕正麏今居筠反鹿属也二麉或作二正室牽二音鹿有力也又苦定反三俗或作正音亰獸名一角似鹿牛尾也音􅬨音􅄂鹿二歳也上聲麈音主似鹿而大尾可爲拂也麌愚雨反牝鹿也又丨丨群聚㒵也俗麂正音几黄鹿也二􅝤音似鹿一􅀊曰􅬨􅀊曰丨麔平表其九二反牝鹿也俗䴠正烏老反玉篇又烏兆反鹿子也二麃旁表房表普保三反皆鳥毛変色也又獸似鹿也毗忍反去聲􅪲羊恕反大鹿也􅶓在見反二正或作音助􅍪子名又音祚犬也二良刃反壯騏麝今正神夜反似麞而䐡有香也二入聲麜音栗􅍪壯麌牝丨也俗正音速麋鹿迹也二兀部第卄六兀五怱反高危㒵此部与凢部相渉憶俱反盤旋古尫今烏光反丨也二豗音􅁅相丨擊也二呼回呼懐二反丨􅯁馬病也又許􅀑反虵丨也􅯁往懷徒回二反虺丨馬病也同上余昭武田二反二俗蒲交力吊二反俗正徒􅀆反跛行㒵二􅿥上音緘下音界丨丨行不正也一曰物不中也丁泥反不能行也或作今戸圭反丨行􅁖二正今丁􅀆徒􅀆二反不能行爲人所列二音竿也上聲布火反行不正㒵時勇反足丨病也音板丨瓦又俗北官反上力瓦反下胡瓦反丨丨辛苦行不得也力口反高㒵上烏賄反下他猥反丨丨行病也烏感反丨跛足也丘彼居綺二反一足行㒵也去聲上烏内反下他内反丨丨癈風苦􅀬也則个反行不正也􅿥音界二同或作今盧卧反病也二歩􅀱歩卧二反下卧反郎卧反行不正也卼丘愧反則足也又跛也上丘召反下牛召反髙不平㒵又切韻玉篇上牛召反下立召反舉頭丨丨不安也入聲音骨骨也又戸骨反丨露也亦骨也􅘕五骨反􅙠丨不安皃也許勿反辛律反不能行也音逆反倦丨也目曜二音丑角反跛也与踔同音兀同則色部第卄七艵疋丁反縹色也呼鷄反痛聲也俗音顔俗七廵反正作鈹丨裂也俗音名俗正呼奚反黄病色也香嚴又户鷄反二上聲䒋於丈反氣流㒵正䒍今俗正上二疋朗反下二莫朗反丨丨無色状也去聲艶音焰美色也俗疋㒵反音養二俗歩教反正作䶌二字靘上莫定反下千定反丨丨青黒色也俗音眷入聲艴蒲没反丨然不恱也音昔俗音鵲正作皵俗音色􆇚白二音普活反丨栬無色音末丨色不􅀷也赤部第卄八䞕正今人朱反火色也又羊朱反色落也二徒冬反色赤也音雄赤䖝名赮胡加反日赤色也二俗二或作頳俗通赬正丑貞反赤也六上聲䚂古正􅎼今尼板反靣慙也愧也靣赤也三㫱奴板反温濕也又女諌反赭音者赤上也二正䞔今音尾人名也三去聲音熾入聲赫亨格反大也發也明也盛也赤也又覆姓連氏也許逼反色也赩許力反大赤也赥許擊反􅀏聲也許六反絳也又火或反赤也一部第卄九居言反􅙷古文音人音􅀄口懷胡罪二反澤名火奚反音之音無祖􅀆反薑蒜爲之居冝反古􅀪反巫音無丨覡也今之師丨男曰丨女曰覡丨音形的反业三古文音丘二古文音天音焉古文音天古文音天同上二音􅀄二音丘上聲他敢他念二反音䡄音古文五字音瓦韭音九菜名也二俗二或作古文丁礼丁奚二反星名也五音聚又音炒去聲俗亘正古蹬反通也遍也竟也二互古文音㸦又都奚反丨羗􆉓莫報反新蔵作亞丨次也就也又俗乙加莫可二反音正音夜俗七乱反居側反入聲俗正記力反􅇥也疾也􅃐也又去吏反數也􅃍也二五割反术無頭也五各反丁結反谷部第三十谿苦奚反水注谷曰丨作溪亦通谸音千聲􅀋云三里􅀃文云丨望山谷間毒也於驚反谷也谾許江反空谷也又呼東反孔空也俗正呼勞反丨䜮􅀷谷也二䜮勞聊二音丨也豂音聊空谷也豅音籠大谷也谹戸萌反谷中響一曰谷名符分反谷名音侯谷名在戒高二同谼戸公反大丨谷寺谽谺上火含反下許加反丨丨谷中大空㒵䜱䜪上音謾下音求丨丨亭名豃呼檻反險㒵私閠反普患反谷名良渉反谷名豄音讀溪谷名䜯渠竹反谷名弋部第卅一俗弋羊軄反橜也亦丨射又姓也二二俗今音歌三音娬俗正音灾天火也二俗其俱反七羊反莫侯反音脂二上聲音勇音旱去聲試式二音徒弄反正作戙俗二正側吏反大臠也或從戈作胾三二或作式志反大逆也臣虐其君曰丨亦作煞字入聲弌弍弎上一次二下三也音識音習莊畧反古文莫結反音弋瓮骨也音弋缺盆骨也二黓音弋皂丨䄩音弋禾丨忒二差也他徳反從人求借物也三􅠀音特食禾虫也尓疋云食虫也傷食反法也敬也度也用也俗隿正与力反取也又繳射也或作弋繳之􅀂反二音越三徒結反利也又國名廾部第卅二廾人執反􅀃文云二十也今爲二十字异与之反巳也又音異丨哉歎也舉也㢣二音擎􅳑古還反見川韻􅞿諸反對舉也古文音言上聲古或作弇今於斂反蓋盖也三即兩反􅂆丨也助也厲也成也譽也去聲毗􅃑反􅁖也困也又姓苦計反丨約也又苦結反丨闊也音忌音弄三羿音詣能射人名􅀃文從羽也古文拜字苦計苦結二反入聲古文音掬福四二音或作俗音莫二余六反兩手捧物也二俗弈正音亦美㒵又博丨也三入部第卅三音欽㒲古文音則二式車反古文音當丘弭去智二反望也従人作正力稔反与同火舒也古文尺止反箭也二四古文時正反車丨也古文羊恕反二俗當盖反姉入秦入二反三合也従一入聲二宅甲反俗知甲丁箧二反古文音聶俗籴俗通音笛市買米粟也二攴部第卅四攴普木反撃也此字与支三字相涉古正音魚捕魚也二巨支反丨路也宅耕反撞也觸也二去竒反不正也力塩反丨鼔謂以杖丨撃也与同古音羊今作􅀭音竒米之別名也古今去竒反宗庿宥坐之噐也又居冝反筯取物也又傾也亦作㩻字二普胡反丨屋壊也疋夷反丨也徒冬反撃空聲也音白所也又姓俗筆巾伯閒二反音也又苦交反武恒反古安反進也􅜙羊穰二音㪅古行反丨改償代也又古孟反姑如二音二同上聲敺烏口反擊也音度塞也閇也㪜都果􅀄委尺兖三反試也古口反丨扣打也敽音紹盾也音典主也常也必礼反丨也又普礼必詣二反㪒研礼反㪏丨擊聲也又音倪敤苦果苦卧二反研理也㪃呼可反撃也㪆丁礼反隠也同上先孔反推丨􅅮撃也昌尹反乱也音以大也音癸許委反正作毀壞也俗音口力小反長㒵音敏徒可反音語柷丨樂噐也㪛音杴打也武婢反撫也愛也安也昌兩反音序音覩伴也音古音礼布也又音離􅛴倉刀反平持也又古文与操同音魯去聲俗毗反困劣敗也正作敝俗音􅃱陟利反至也㪋音汗禦也也止也俗正音恠毀也二音乱煩也莫半反丨旡彩也側救反苦恠反同㕟􆄭去智反􅂫見反言散也或作胡教􅁅斈也孝也成也或作音頓支義反多也音散分離布丨也又上聲二或作他旦反丨獸旡文章㒵布卧反今作播余刃反擣也古文教字籀文音敗音敗音慮入聲音􅅇匹也軰也當也對也主也俗正音摑手打也与摑同又音格撃也二音必盡也而陟反使也徒活反強取也二㪬丑角反授也㓨也又音濁築也敊丑六反病丨㒵正他合反大食也三胡􅁑反呼末反欥水也又烏未烏八二反取物也音一皈反部第卅七郎撃反丨隔也尓疋云鼎款足謂之丨又古核反縣名又姓或作音而煮也古文音􅀽今作垣丨墻也又姓許犞反炊氣㒵諸延反粥也与饘同居随反三足釡有柄者也音傷烹也古文音羮丨臛也二俗今才心似塩食心三反皆甑属又徐林反鼎丨上大下小釡也三上聲音古古文音煑正今初巧反丨乾也二或作正作孔反軌丨一名素華又子紅反釡属又姓二去聲子孕反炊噐也今作甑二同方味反陽丨二同仍吏反入聲俗古今余六反糜也又賣也又音祝三余六反􅀃文云稀飡也音􅊗去滓也俗或作音辱大鼎也二音藥内湯中薄出之蒲没反釡溢也音速鼎實与餗同部第卅八郎撃反丨隔也尓疋云鼎􅅃足謂之丨又古核反縣名又姓籕文音而煑十部第􅞀二二俗正北官反弃糞噐名也又姓下反音畢三三古文音保相次也或作正音集詞之集也二昌十反字統云㑹聚也卆俗今正倉没反丨急也逺也又子聿反終也盡也既也自也三卉許貴反丨衆也草之惣名也又上聲二三同音世音乱都回反卩部第􅞀三卩子結反与同瑞信也或作卪亦同俗正落管反無乳者曰丨生也二音尤境上舎也亦督丨古官号也又姓卸司夜反􅄙丨也又俗音尤厀相逸反脛上骨節也音却退也音髮血部第􅞀四烏含反正今音髙生也又姓二音殘正作噐也俗衁今音血也二或作布胡反􅤀居依反血􅀕也音亭定息也衃芳杯反血凝也玉篇又音孚音忌衅許近反牪血也􅀕噐也牪羊眷反苦紺反凝血也二同徒紺反羊血凝也又玉篇空紺反衈仍吏反煞鷄􅀕也又周礼注云割牲耳血及毛以􅀕也䘑三俗正莫厄反血丨也白虎通云以醎養丨血理之分行於躰中曰丨四二俗衂正音鼻出血也又女六反折挫也三音蜜衋許力反傷痛其也音鉢二或作胡臘反何不也正從血作􅁲部第􅞀五音䖍在陁羅尼中二音衡六字音西五音貞二俗音夫二古文音因音胡籀文􅓒今徒聊反草木實丨丨熟也二音前㔽俗卣正音酉中形罇也又音由二二音近俗昌吕反音梁音記音􅃱音㑹音峻音呼音噐古文音尅二四俗正先結反字林云䖝名又殷祖也五音伏獸㒵又姓古文音栗同上音乗音虚部第􅞀六北末反足丨刺也音登升丨也胡戒反䓗丨俗正音廢賦斂也二倉案反三女為丨美女㒵或作今蒲末反除草也又普末反二音發丸六反兩手丨􅊫初八反丨丨細言也又同察丨諦也知也至也監丨也又姓卓部第􅞀七俗正音干丨濕也字様云本音䖍今借音耳二疋㒵反繛古巾部第􅞀九巾丑列反草初生㒵也許貴反丨衆也草之惣名也又上聲音草莫胡反古文子朗反許勿反疾也疋部第五十俗七羊反正作趍走也征列反古人姓又經音義音帝俗陟利反疋覓反音智益部第五十一虫名蠲古玄反也契也明也二子与他念二反徐弃反古隘丨陕也賹烏懈反丨記人物也三昌玉反或作正於草反最属二艗五歴反丨舟丨頭為鷁鳥也地名膉肥也齸音益尓疋云糜鹿曰丨牛羊曰齝並吞而反出嚼之也齝􅐫知反三壹部第五十二俗疋鄙反或作蘇朗反鼔匡木也亄乙䔬反貪食魚鳥之别名也或作懿乙䔬反美也大也温柔聖克也又姓二乚部第五十三徒聊反力珎反水在石間也居幽反目繚也古文音㪯乨二古文始字初也音長音次亂音亂理也兵㓂也不齊也音决音間乢二音盖甲部第五十四俗音牽或作上音代下音妹翈音匣翮上短毛也三俗正音匣丨也音文甲反四俗通正音匣孝聲云水溝相著也三苦洽反音授音存部第五十五余律反述也循也遂也通正直小反始也􅀄也正也敏也長也二同上閈也又姓或作音四䑕也又羊吏反束部第五十六或作今士交反蒜束也二􆂈音陁丨􅀒音韋束也貴齊二音俗普胡反上聲􅀥音早木菓名俗音俟正作四俗二今古典反小束也六去聲代束二音亦振反俗羊制反正作裔入聲郎葛反辛丨也􅁄記逆反酸木也􅀻七反經音義作膝經文作丨非也勅俗敕通正音也勞也固也中又古文速字三二或作今蒲北反丨道縣名又丁壯㒵又音逼三之亦反古德反丨草生也奴得反記力反力也音速今作榖丨動物也二俗勅􅃿反正作敕音得弱也部第五十七音􅀟音秘慎也告也一曰逺也又毗蜜反排丨覕必刃反不見㒵二同俗正􅐫亮反七丨又香草也二誤新蔵作音蒲北反音瑟瑟音蝨樂噐也或烏恠反俗於刧女傦二反俗奴叶反正作聲絶也古文音不􅄂部第五十九雜狚合反集也市也也穿也二三古文音初音兹音祈衡拽二音音調于元反爲也於也曰也行也哀也引也牟合反俗正去爲反傷也落也壊毁少也二胡刀反丨也又俗作號大呼也息邪反少也凹烏􅀲烏烏冾二反象形古字今作窪相由反熟食有滋味者也又進獻也㒹古文丁年反二古文乎字屯陟倫反難也厚也楚江反通孔也古文今音形字正今奴侯反兎子也二古文音戈三足釡也又音螺今作鍋鏍二字徒渾反聚也又姓蒲交反瓠也又樂噐瓠音胡俗髙反正作變體正作變體正作變體正作變體土髙反正作五俗音兠玆古文音兹此也又姓又音玄亦古文黒也居良反界也也境也當也是爲反草木花懸也又古文手字也二俗直尼反古文音新音髙同大鼓也二同古文爲字俗正力珎反水在石間也三二俗今音經直皮曰丨也又古文胡頂反水脉也三音君㸙止虵反吴人呼父或作正居幽反曰繚也二音多俗籕文今人朱渠轉二反柔皮也三㸖新蔵作葅七余反菜也音義云古文尋子徒回反􅁀風也音吟衆立㒵從三人也舊蔵作塲居随反余針反玉篇行㒵又氏任反亦行也古文疾容七恭即容三反今作從古文音􅀽今作垣墻也又姓二經音義作古文音仙字在真陁羅所問經幫博反衣治履也㴝俗黎今􅀰奚反衆也又姓又力脂反二厷户萌反夂息遺楚卮二反丨行遟㒵也新蔵作熈音許其反和也􅎧丁回反玉篇云小塊也音无音言古文古文􅀘耕反今作絣振墨也二同俗通渠追反丨龍又州名囯名獸名正作夔二音陁􅠟音祈危也又古哀反二俗呼交反今作哮也去居反古文音水或作正音萠田民也又野人也二俗音饒俗都回反俗奴回奴㝡二反音三音唐俗音耻也俗音要音爭亦去聲二俗正音支酒丨三来筣二音郷名在扶風又丨牛俗今許規戸圭二反角錐童子佩之又銳端可以解結也二俗魚韋反俗戸圭反兢居陵反丨丨慎也音􅀖二莫交反籕文古文音眉丨毛二古艱今古閑反丨難二下江戸冬二反丨服也夆符容反制反又敷容反丰芳傛反丨美好也又伏風反音生音眞音羊同輰􅃓古文音紅音臣音星音延二音􅀄二音君音􅁨音神音焉上聲俗正古文音起二二或作二今音産粟米也又􅀄绾反磨粟也四古犬反小水深廣尺曰丨也二哿古我反嘉也舊蔵作昌兖反對卧也籕文音覩今作堵垣丨食枕反桑丨也㠯古文以字疋古文雅字正也待也又音踈丨足也丐弥兖反不見皃氶耴蒸字上聲呼晉譙王名又食􅁜反佐也翊也音梴古文在字余兩反俗烏街烏􅀲二反蝦墓之属也居語反二同俗苦本反正作閒門限古文兵凡反臽苦感反小也二音上音祖音土音水奴可反撓也音敢二同音轉古文朕字古文音誕力小反也又宫中道也二同古文字匕音比丨匙又丨首劎属也音烏懸㒵也牟感反嚮梵音也音武粉反今作刎二古文音好古文音善王都也張吕反􅀃文云盛米具也又田噐也俗昌兖反正作音聚作老反賦作丨曰也丄古文上字古文下字之忍反顔丨􅀋慎之事也丑小反意氣息皃􅫎俗音􅀧􅚀音有音幸㚘古文音伴音夘俗正阻史反止也又兹里反又音弗二音后古文音我音馬徒􅀧反門丨二同俗今正丑几反移蚕就寛三爸蒲可反楚人呼父也俗勒可反正作剆二同咫音紙丨尺也八寸曰丨也音尓音我音在其九反二音俗音二日古文音頂烏敢反信四二音音帝俗香靳食二反蒲慢反俗胡貫反三俗直例反正作豕也亦姓扶佛反獸名山海經云丨如人黒色毛長而披髪疾念反俗今音乱埋也二於靳反所依㩀也又於謹反皕俗音秘或作常句反老人行㒵也古文都貫反方味反古文行界反俗音音弟古文音弟㒸音遂從意也巿音又舊蔵作布胡卦反靠苦到反相違也音息羊制反二同二或作方問反丨掃正俗古文作代反重也兩也三古文妙字音飰泉水也音到人姓正今是照反到懸鈎也二俗苦計反正作契俗莫報反音音去俗七賜反卡三古文貢反或作正直又反卦兆辝也二徒乱反夘壊也今音盖乞也四古文烏懈反陟利反不行又頃丨也去眷反􅀕祀也籀文雖反俗正音䖝二奴教反同一計反他吊反賣米粟也音耀古文詞閏反逺也今作侚古文音載今作載染丨也古文姓字古文音􅀕音誡古文音諫音潤字音用二古文音事音㑹古候反音盖都豆反丨競也俗志反又音煞古文音盗古文音樹良刃反慳也俗京例反俗居正反俗音患正作或作去反正作劵数也俗初向反音救強擊古文正字又平聲又俗万久反􅈥正反逺也􅂫浪反同㯥音㑹尼教反同􅜨古拜反分流也音正音禍音謂音纛毒導二竟集訓云左丨形如竿以羽或牛尾為文三俗正嗇今音色愛息也又積也慳貪也又田夫謂之丨天也五糴音笛巿買米粟也俗正分勿反丨也二丈甲反丨也胡甲反矗􅀄六丑六二反齊也直㒵也䖃音藥丨丨風吹水㒵也古文知列反今作哲智也同上或作五葛反俗正楚洽反又七廉反古噐也二俗正丑玉反行丨二居􅅞反与同舊蔵音泄􅙠五結反丨不安㒵也古文音厥音莫誤普擊反正作劈裂也胡得胡槩二反推窮罪人也音鉢古文力字音六音玉俗古今音畢弃糞噐也三刧接二音古合反楚革反正也古文音色音勿古文音亦誤俗音昨二音若与弱同古文音亦小幕曰丨
