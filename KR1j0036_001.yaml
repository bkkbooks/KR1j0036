􅑳音鹿舟名也艏二俗䑵正音木小艖也三音伏舟也音佛玉篇大舟也五骨反舩危也䑥舩㒵䑪五合反舩動也二魚乞反舩行也艗五曆反丨舟舟頭為丨鳥也俗音伐舺俗音甲舴艋上張格阻草二反下音猛丨丨小魚舟也魚及羊入二反舩行也䑽或作正吐盍反兩槽大舩也二艧烏郭反舳直六反丨艫䒆丑列反舩行也或作䑿今音宿舩名二䒁或作音習篖丨修舩具也正作篖音唐艊音白芳逼反又音伏音活舟行也毛部第卄二音來又力之反毛起也氂氂十俗氂正力之反毫丨也十一字㲪音登毷丨也毛席類又去聲也􅚊俗同上㲘氍七俗二古氍正其俱反丨毹毛席毯褥之属也毯他敢反十字㲙㲣毺六俗毹正霜俱反氍丨也七毬音求毛九擊以為戯也二俗氈正章延反扞毛為席扞音古早反三玉篇音如犬多毛也俗奴加人諸二反正作拏二字俗音眉音零毛結不理也俗麾正許爲反以旌旗指衆也二俗音毛毠或作正音加丨㲚毛衣也二㲚音沙丨也俗音雖二俗㲨正而容反毳飾也今作䩸二正今徒聊反丨酕鳥毛也或作㲖正蘇彫反羽翼丨蔽也二俗毿正蘇含反長毛㒵二二俗音咨俗音毛俗音延俗音袍俗章輪常輪二反俗如終反細毛也正䩁今芳非反細毛也二􅪭府文反丨丨毭罽也㲍上音仙下音支丨丨罽也又輕毛皃㲬音焦兠鏊上毛飾也􅦷芳文反毛落也㲥音唐毦罽也子容反罽属也女江反髪多也二俗徒刀反之延失然二反二音須二同􅨷音門毛飾也呼髙反丨攪也三古侯古二俗普悲反正作髬字又去聲胡刀反長毛也或作女羊反正作鬤丨乱毛也上聲毯正㲜俗吐敢反毛席出土蕃二㲎三俗通又音婁氀正力主力朱二反丨毼毛布也五􅺬三俗俗通正北朗反罽丨通俗文云織毛曰罽邪文曰丨五氄或作􅻛正而隴反鳥細毛也二氅昌兩反鶖鳥毛也音縷薄顯反丨毛領也音十去聲四俗耄正莫告反惛也老也八十九十日丨五居例反氈属也四俗毳正七稅昌稅二反鳥獸細茸毛也又断也亦姓五二俗苦頓反俗音散㲝俗㲝正莫報反鳥毛盛也又而勇反毳毛也二莫報反莫報反鳥輕毛也覒莫報反邪視也二同㲒俗歩報反鳥伏夘也或作毻正他卧他外二反鳥易毛也二毭音豆􅪭罽也上音具下音奈丨丨多毛也㲕郎外力恱二反毛色班也㲒經音義作蒲報反鳥伏卵也在増一阿含經第四十九卷入聲俗俗通㲲正徒業反西國毛布也三翕毛三俗毾正他盍反丨㲪毛席也四毩五俗古毱正渠竹反皮毛之丸也七蒲没反丨毛短也蘇骨反丨也二俗毼正胡毛布也三同上三俗音的二或作㲱正良渉反丨毛長毛也三眊莫角反目少精皃俗音拂八俗即反正作目丨也或作毣今音木思皃一曰毛濕也又莫角反好㒵也二㲫蒲木反㲢丨毛領也俗正音栗丨㲨罽毛也二渠勿反鳥短毛也徒木反丨旗也斤部第卄三俗音亭機其勒三音縣名亦草名又姓斦語斤反二斤也江西隨函音薪斪其俱反􅓯也音斯上聲俗斷正都管反絶也又徒管反亦絶也截也又都貫反决丨也二斧方武反丨鉞也勒可反力也三俗正音頂三足兩耳亦鎗属四今正音謹黏土也二古文徒短反去聲古文都貫反上音向下都浪反俗正今北芮楚稅𥘉鎋三反断也三音誓入聲俗斸正􅓯今陟玉反斫也钁也三三俗斲或作斵正竹角反削也亦斫属也五正斮今側畧反斫也又側角反亦斬也二㪾音格擊也斱張畧反斫也或作丑格反開也巾部第卄四幖俗正布燒反丨幟也二幢濁江反翳也旛也童也其皃童童也㠻􅛽二俗音希帷于悲反圍也又在旁曰丨也幃音韋香囊也又單帳也幡芳袁反丨幟也帆凡梵二音舩上使風慢也帡疋庚反蒲丨正音卑冕也冕音免帤女余反幡巾也音宛幡也是支尺支二反与眂同􅳄音空巾也衣祑也音綿与芇同又音帝幬直由反單帳也􅜳通帉正音芬巾也二􅯋盧甘反先縁長也亦作檻疾陵反帬令俗音群与裠裙同二相居反徂宗反帛丨又布名㠿即移反布名也呼光反蒙掩也音牟幩音墳飾七上聲帑他朗反金帛藏也又音奴􅓍也音皎行縢丨脛布也幌胡廣反帷慢也音三二音草㡑子了反首飾也於絞反靴韈丨又去聲音鳥絹丨音虎許偃反盖也車上慢覆也去聲帊普反大幞也幞音伏帕普嫁反正作怕丨懼也昌志反幡也幖丨也又音試丨方山名帶當盖反衣丨也又地别名也一㡢莫半反幕也帷也帔披義反衣丨也又芳羈反帒音代盛物丨也幤三俗幣正毗祭反帛也四隨函云合作印字􅽲雖遂反深赤色也㡧陟孟反開張盡繒也音帝經音義音帝与同頃丨大名也應法師作同又随經音武出兠沙經丑例反習也㡂音倒帛餘也二同幆俗去例反正作愒恐人􅍤稅二音佩巾也扶沸反丨隱也莫報反帥所類所律二反佩巾又將丨也入聲幅音福絹邊也正帙今地質反書丨也二帓音末忘也或作亡發反幄於角反大帳也同上幕音莫帷丨也又姓芳勿反韜髪也韜音叨音卓帟音亦小幕曰丨俗或作音亦二􆁑俗正北未反一幅布也又音弗毳也二苦洽反冠丨也帞莫百反頭巾也私列所例二反殘帛也又音雪丨祧花也幘音責冠丨也帹所甲反面衣也胡臘反吹火丨又俗於盖反古文紀力反同棘陟律反勹部第卄五勹布交反丨包也從曲身皃又音曵古文音旬十曰一丨也匍音蒲丨匐也俗勻正羊廵反齊等均平也二匉訇上普耕反下呼萠反丨丨大聲也下又姓匔音弓謹敬之皃也匑丘弓反音舟啚也七廵反退也音旡或作包今布交反也又姓二音占烏交反目深也俗芻或作正惻于丨豢也又姓豢音患三匋徒刀反飬丨音丨奴也勼居求反聚也音上聲音引勽音抱㔪音魯匐也去聲矛取粅也三音木与鶩同鳬属玉篇又音佳同鵻鳥名俗䂇正女六反利也二許擊反弟也䂆去的反禾部第卄七稠直流反穊也衆也多也穊音既三俗正稽今古奚反滯也孝也同也當也㽜止也又山名亦姓又音啓五俗稊正地奚反丨子草也三古文同上俗秔正音更稲也或作稉二稭音皆麻禾之稈也与䕸同稈古旱也秥二俗女廉反正作煔穅苦剛反米皮也音希丨稠也又俗直利反正作正香字芳氣也稞音科靑丨麦名也又胡瓦反淨也一穰汝羊反禾黍穗餘也落戈反榖積也䅧於塩於禁二反丨苗之美也一􅏢魯登反廉威又菜名也䄬二俗或作移正羊支反遺易轉也又姓四俗稴正嫌咸二音不作稲也又禾不二正稹今音真穊也又之忍反緻也亦聚也二穜童重二音丨稑先種後熟也秶俗音資音来丨麰之麦又書吕反麰音牟秊音年穀熟曰丨俗秠正音丕黒黍也二稃芳無反榖皮穮俗筆苗反音奔古玄反麦也䅨音香䆅疾資反積禾也音營俗音俱音行或作正徒干反禾也二穘饒繞二音音宛俗正鋤針反禾欲秀也二䅡音蘇隨國云合是稱字經文名丨丗界二字舊蔵作科秢舊蔵作衿渠攴反適也音徒穗也稂音郎草名似莠䅝音空稱稈也稓而容反穠丨也穠女容反花木厚也又而容反䅲渠脂反麦下種也二秦匠津反國名又禾名二二或作䅳正士于反欀三䄻桃叨二音稲也二俗稵正子之反禾生皃二俗或作正音支穗也又音知禾再生也三俗正渠容反稰也又渠隴反穫也二稰相居反落也又私吕反熟穫也同上秛普冝反禾租也三俗二正布玄反丨豆也五秙音胡正作黏力塩反禾名署魚反署預又他呉他魯二反丨稻也穲音離丨黍行列也䅻音離丨丨黍稷垂也秜力之反稻死来年更生也䅊宅加反開張也又縣名北萌反音封疋人反香氣也上聲稟彼錦反以榖賜人也与也穚二俗穚正居表反禾秀也三秆稈古旱反禾莖也二同稍所爪反漸少也向盡也又所教反穔俗穬正古猛反榖芒也又不熟也二稻稲音道有芒穀也秔也三稔如審反歲熟也又年也秕音比穅丨也秲直里反稲名丨禾又音種丨也二或作䆏今浮鬼抶畏三反紫莖稻不黏也三音狗人九反禾正今丁果反禾垂皃又音端二秒今䅺二或作正音眇禾芒也四魚紀反禾盛㒵䅎音酉稛苦本反成熟也音美正䅏今尾味二音粥也二音社音吕自生稻也二古文音補䄯古典反小束也玉篇云禾十把也亦小束也二秬其吕反丨黒黍二俗音似正作耜耒丨二俗䄪正音鳥禾穗垂皃三將几反千億也又丨㷌縣名芳尾反穗皃也䆀莫亥莫代二反禾傷雨也穥音与方善反䅎音酉穏俗正烏本反持榖聚又安丨也二穖音幾禾盛也二音受去聲穢於吠反丨悪也秏呼到反减也少也蒲賣反稻也似稻而別也稼音嫁丨穡也音快麁糠也二俗稺正直利反晩禾也三穂穟音遂禾秀也二同􅣴音遂禾稷成皃也稚直利反晩也小也㓜丨也秨祚二音禾嫁動之皃也穧子計在詣二反穫也又刈禾数也音歩俗音弄相承又敗反稧胡計反丨事也也或作正奴卧反秫多也二上古文授字什也又姓之順反束桿也䅗思累反禾四把也又於偽反積也䅜是偽反小積也乂居企反強皃穛􅧎子笑反禾先熟下又物縮小也又皮角反熟禾也二秺秅丁故反禾丨束也又縣名二同丑亮反齋丨也二同其季反魚祭反二同卑正疋正二反作弄反稚致二音古文音季音祭黍丨入聲俗穡正音色稼丨也二􅼥古俗稷正音即五榖之惣名也三穫胡郭反刈也稸丑六反積也聚也又許竹反水菜也与蓄同䄶蒲沒反丨神禾秀不成聚向上皃也又平宻反丨禾重生也阻瑟反䄶丨也通稡正則骨反䄶丨也二䅥吾列反長禾也音葛長禾也或作葛子二音禾長也今作䅥二字皮逼反蒲也古文俗正音未丨馬也又俗音米二莫結反禾也秫音述黏榖也俗正蒲禾反丨也二普木反丨草生穊也古文王字􅿖下没反糠丨米之堅者眷不破也又胡結反居六反稙音陟早種禾也或作穋正音六黄丨稻名二稑音六穜丨後種先熟也穪俗正蒲結反禾香也二俗秳正音活春榖不潰也二秩直質反積也次也當也以官相次也秸古八反丨槀音側稫丨禾宻蒲也二同稫普逼反丨稄經音義切居竭反長禾也俗穱正側角反稻䖏種也二秷陟栗丁結二反古文稷字音即五榖惣名䄷音石說文云百二十斤曰丨經自切烏合反􅮘苦沃反禾熟也又古得反䅵古沃反禾皮也又地名又之若反五榖皮也䄸音粕也或作秝正音歴稀踈也二音頰丨穧穧音劑一􅰨音弋黍禝蕃蕪皃於六反黍稷盛皃也二同二俗正𥘉立𥘉甲二反種也三之六反音禄隹部第卄八或作讎今市流反疋也仇也二雔巿流反丨雙鳥也雕古文音刁今作鵰字二俗俗通雛正士于反鵷丨也亦小鳥也与鶵同四舊蔵作辝在大莊嚴經德紅反鳥名睢七余反丨鳩又同濉水名又許維反丨盱視皃音圭丨谷名新蔵作子泉反鑚也在續髙僧傳第比九卷雃五堅反正也玉篇又音牽太公子名香嚴又客耕反力兮反烏含反丨鶉与䳺同俗古文音難丨易也艱丨也三与居反雞二名雞古兮反說文曰知時畜也易曰巽為丨音倉丨維鳥名通正音純䨄丨也二􅨼居隨反子丨鳥大如布榖如純反鷄晚生者也音溜垂睡二音雅鳥别名雂渠淹反鳥喙也玉篇又古林反􅭐音紅鳥肥大鳴丨然也䨂音秋鷂也通正子心反雞之别名也二音如鴿也䧲干旱二音音維或作正音從南楚人言雞也二䧷音柔人姓䧺雄兮弓反丨䳄也又羽弓反此二同離二音離烏玄反群鳥也上聲古雉今直几反度也陳也理也又野雞也二䧸古剪二音音晃甲噐也又音欲凖古文准字均平丨度也隽通雋正徂兖反鳥肥也又姓二􅵁昌耳反昌勇反小鳥飛也俗此角公万二音隼思尹反鷂也又祝鳩也去聲古今正時呪反賣物与日丨買物持去也三新蔵作頫他弔反伭頭聽也他吊反雊古候反雉丨㲝音帽鳥毛盛也力又反丨雉晩子也䧴音睡鳥名音務雞雏也峻信雖三音奮丨鳥張毛羽也入聲俗音木正作鶩字翟音笛雉也又姓又音宅丨陽縣名也亦