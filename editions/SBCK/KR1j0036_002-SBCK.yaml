反丨水滿㒵也又音琰俗音講丨水流也港正同上溥音普廣也大也浦音普丨濵也大水有小口曰丨又姓􅆂胡感反水入舩也又胡南反丨冰也滔二同上和泥也又深也混胡本反丨隂陽未丨而為一也滓阻史反穢也澱也俗澣正浣通胡管反濯也洗丨也三俗古文莫孔反丨澒無知也又与濛同二莫孔反丨澒大水皃又平聲涳丨細雨也澒胡孔反丨水銀滓也又濛丨与鴻同俗洒洗二正先礼反滌浣丨浴也又音跣姑丨律名也三滉胡廣反丨瀁水㒵也通正弥弥隣二反滅也没也盡也又水皃二乃頂乃定二反泥丨又浞也瀴莫頂反丨涬大水㒵也又作溟同涬胡頂反瀴丨也又逄孔反汅通沔正弥兖反漢水别名又郡名二湎弥兖反丨也涊年典反淟丨也又音忍水名也淟他典反丨涊􅁖酒滓濁也􅜲之少反池丨也􅐯俗正莫朗反丨沉通俗文云水廣大㒵也二通沆正沉今胡朗反􅐯丨也亦丨北方之氣也下一又直深反没也止也三澥胡買反渤丨海之別名又水皃也徒本反混丨也澿渠飲渠禁二反身寒丨也潬徒旦反水中沙丨也又俗他丹反泫玄犬反露光也又丨然流㒵也俗通泚正千礼反水清丨也二􅘞踈有反丨也又所休反小便也溩安古反水丨也舊藏作陛淲俗汻或作滸正呼古反水岸也又水聲也三㵋音買水名也漊力主反雨丨丨也又汝南人謂飲酒酔為丨也潣浼音毎水流平皃二同濙烏逈反汫丨小水㒵汫徂頂反丨濙也玉篇又口冷反丨涏徒冷反小水㒵切韻徒頂反寒音巨井反沝之累反二水流合也古文音似淼名小反大水也沛子礼反水名与濟同㵲或作潕今音武水名在南陽二俗音啓俗郎果郎号二反􅘍徒可反沙水徃来㒵与沲同灝胡老反丨􅃞水勢逺也或作正徐兩反丨逺也又徒朗反水大之㒵也二或作汱正古犬反墜也伏水也又音大濤丨二㳆俗他口反音掩雲雨皃㵵音聚水聲亦去聲渺敷沼反丨溔水名亡小反溔羊沼反浩丨大水也㵿胡了反水渺丨㒵潽音普玉篇云水也香嚴俗蒲鑒反或作音海蘇果反水名或作正以轉反濟水别名也二溆徐㠯反水浦也汿徐吕反溝水亦除水汕音産魚浮水上也又所晏反魚乗水上也正㴰通百買反水名二泱烏朗反滃丨水㒵又扵良反亦水流皃滃烏孔反大水㒵瀉悉也反丨水又司夜反吐丨也又音昔醎土也涘床史反水岸涯也浘音尾水流皃又丨閭海水淺䖏也溤音馬水名莫梗反滬音戸水名靈􅀛􅀒河圖出䖏也悮古文徒朗反正作盪滌丨二直里反渳濔綿婢反水流㒵二同瀰音礼水流㒵也音弭川韻流水㒵郭氏又俗羊祥二音滻音産水名沚或作洔正音止水渚也又止也小可以丨息其上也二音父水名音頂丨濘水㒵奴管反湯也又奴􅅍反浴餘汁也俗力稔反寒丨正作􅏮二俗或作正武忍弥兖二反丨池縣名又食􅁜反亦水名四淰乃忝反水流㒵又音審丨水動也湳奴感反水名又人姓㴆蘇老反􅃗忍反瀋昌飲反汁也俗正音隠水名二㵍莫本反丨憂也与懣同七罪反清水㒵漼七罪反水深皃也上烏猛反下胡猛反丨丨水廻旋也漅子小反水名子小反􅜷酒也􅜷音鹿丑領反丨泥正俗居偃反水名二音井洧榮水反水名也氿正㲹俗居水反水涯拈土也二渿音染去聲三古二正子計反丨渡也益也定也止也又上聲五泳音詠遊也潜行水中也􅃞余亮反水名瀁余亮反丨水溢蕩皃又余兩反滉丨水㒵溉灌上古愛反丨亦灌也又水名也又音既澆漬也下音貫丨澆也漬也聚也溉也注也沃也鼻丨涕他計反丨淚目汁也或作洟下又上聲二俗正音注時􅀨普丨也又音樹二濽今正音賛丨水濺也濺音即見反二汙烏故烏卧二反丨染也也􅁾也洎居噐反􅁏汁也又渠噐反至也及也漲知亮反水大泛也又音張涱俗同上汜或作泛二正芳梵反浮也亦流㒵也三烏定反小水也潰胡外反亂也叛也漏也俗瀑正蒲報反􅇥􅀨也二湩都弄反乳汁也又都勇反濁多也湊倉奏反歸也又水交㑹聚也俗正􅀻閏反深丨也二􅀻閏反水名也淤於反水中青埿也俗􅂀正普賣反水之分流也二漱蘓奏所又二反丨口也涁三俗㵕通滲正所禁反丨漏也五潠蘇困反丨水也与同瀬音頼湍丨也沸非未反騰丨也灆或作濫今盧淡反丨失猥􅄂也二瀚胡旦反丨海北海也又鎮名俗濩正護鑊二音布丨多霤下皃也又一反丨澤縣名二普盖反流皃也又水名又音貝郡名又姓浿普盖反亦水名澱堂練反丨滓也亦藍丨也淀正俗堂練反陂丨泊属也又淺泉也二胡戒胡愛二反丨也澌音賜丨盡也又水也礼注云死之言丨也澮古外反水名也又俗注瀆也泮音丨水􅄙散也汰太闥二音丨過多也音豆水丨也与同蒲勘反響梵字溸四俗泝今正音素舟中水者丨斗也又逆流而上也六漬箭賜反浸漚丨也濞疋詣芳俻二反水名也㵺疋詣反水名疋詣反水聲也疋詣反水名音慮丨漉也二古文音訓二俗烏故反正作汚新蔵作汚汛音信灑也又􅀟掝反古文音淨也二俗音翅沁七反水名疋俻反丨水或作澨今時制反水名也二滊許氣反水也出玉篇郭又音深溷胡困反濁丨也㳷經音義晦退二音云丨潰也香嚴又音泯泴二或作正音貫淨也亦澡手丨洒也今作監三涫音貫沸也在見反水荒曰丨漴士亮反􅀨疾下㒵又士絳反水所衝也瀵方問反水名又疋問反水浸也湴蒲鍳反深泥也玉篇又女鍳奴監二反泥丨也埿蒲鍳反深泥也玉篇又女鍳符鍳二反亦泥丨也力救反水丨也淛仁例反水名㳃俗正七内反染也犯也寒也二汶音閂水名或作沴正今郎計反妖氣也三呼貫反水散也同上澰二俗瀲正力驗反水波泛丨也三音濿音例以衣渡水曰丨亦石渡水也渲息絹反小水也音護寒凝又下各反注樹二音二澳音奥深也水名又音郁隈也水内曰丨􆁷苦盖反舩著沙也泝俗溿或作沜正音判水涯也三他反俗灎正灔今音熖激丨水波動㒵也三音紺縣名涖音利臨丨与莅同誤似面反在愚經第一卷㵪似面反餘也又欽敬也􅈇在到反水運榖㴃音􅀋悲丨也淚音􅀋涕丨也舊蔵作汏音太烏卧反泥著物也又於阮於丸二反又舊蔵或作浣郎計反渧丨漉也渧音帝通貫反水名㴈舊蔵作垽魚靳反澱胃之丨也􅜐古送反水名出䂊章汭而銳反水名古文淨字㵧扵反丨清也必嫁反水名潞音路州縣水名􅥉古旦反丨丨水流皃又音汗亦浩丨潦或作澇正郎到反淹也又水名又音老上􅀨落水也下水名也二涮所患反丨洗也又茶别名也瀃音賜同澌盡也俗音使正體漬字灟音漏俗而遇反音孟丨津河又平上二聲二子計反入聲洑音伏洄流也澓音伏丨流也或作洑丨亦通又姓滑患八反丨利也美也不􅉣也涸何各反丨竭也盡也渧俗今滴二正音的水丨也四二俗灋正音法丨合也常也刑也䡄也三溺埿的反丨沉也㴔六俗澀澁二今澀正色入反丨不滑也九激古歴反疾波也又姓渤蒲没反丨澥海名浡同上丨然興作也液音亦津丨也又姓泊傍各反止也溼失入反水沾也濡也澤音宅􅃳也下有水也又㤙也漯濕他合反水名又俗失入反二渥扵角反也厚也漬也洽咸夾反也潤也和也浹胡甲反丨水湅相著也又子叶反洽也通也徹也丨辰十二月也㳿丈甲反浹丨也又徒反又音特牛也亦除去也又姓㳤俗正時六反善也清淳也二俗同上俗正烏酷反灌也漬􅃳也二濯音濁澣丨也又姓澣音胡管反泄􅀻列反歇也减也漏也􅂥同上溧力乙反丨水縣名泣去􅇥反無聲出涕也􅄋音歴滳丨也測􅀄力反丨度也俗滌正音笛丨除洗蕩也二汲音􅇥引也􅂑也又姓浞士角反水丨足也通濼正疋各反陂丨大池也下又音落水名又藥暦二音二俗通今正他逹反泥滑也四俗洫正許逼反溝丨也二許逼反疾流也音􅏾丨波勢也士力反丨淢水勢也浂俗泆正音逸滛丨也二漠音莫渉丨也又施也茷也澈直列反水澄丨也汨音覓丨羅江在䂊章又古没干笔二反流疾㒵也又亂也瀆徒木反溝丨也淴烏没反水出聲也又俗色立反濊呼未反水聲又呼外反水名也又烏外反丨注深廣也又滂沲多也录音鹿夲也亦刻木也又特計反粴子也又羊至反猪別名㵶俗正音節水也二㲺資悉反水濽也又音節亦水出也溘口合反可也至也依也奄也淖字林女角反三蒼昌若反又徒歴反又奴教反泥丨也潔音結清也靜也又精微也瀷音弋水聚也潩音弋水名也普活反水丨也古文普未反今作丨水也㵓或作湜正常軄反水清也二正泬今音血丨寥空㒵又音穴二音未塗拭也呼北反水名浙􅈲熱反江名一曰丨米也舊蔵作溺俗漞正莫狄反或作汨丨羅水名二通汔正許乞反水涸盡也二濮音􅁲水名氻二或作泐正音勒疑合也玉篇又泉聲也三潏余律古穴二反泉流㒵也又水名􅀻反持牛亦除去又姓二同俗淧正音蜜溢也二沕音密塵濁又音勿丨穆也洌例二音水淸也絜也泎士陌反瀺丨水落地也俗音落溙五俗俗通正音七水名又黒丨又姓七字音筆丨去滓也俗正芳滅反漂也玉篇云丨􅄋水㒵也二􅃰俗涿正竹角反郡名二泏苦没反漚池也又竹律反水出㒵古文音渴飢丨也湆音泣羮汁汋士角反二井一有水一無水也又市若反􅄢丨或作音洛古文法字二㵸或作正音藥煑也亦水名二音宿丨寒風氣㒵洬音宿音煞水也漍古麦反丨水也滀丑六反水聚也湒入反雨㒵也濇色澁二音不滑玉篇又音甾㳊俗正祥亦反潮丨二渞隨凾云合作淴音烏没反水出聲玉篇又音怱淈下没古忽二反泥水出丨泌彼密毗秘二反丨瀄泉水陕流㒵又音秘淂音得水㒵又丁力反㴇古文渉字俗正先撃反丨米也二滭音必沸水㒵濗音覓􅄋丨水淺也㳌胡甲反古麦反水裂㒵澼普撃反丨造絮者也火麦反丨水聲亦水名火麦反水流㒵正溹二今所責反小雨也三俗蒲没反徒合反阻立反和也潝許級反水㒵也浥音邑濕􅃳也所立反溻他盍反火部第四烡三古炚炛三俗􅊍正音光明照瑩静也七爞音同旱熱也烔音同熱也又赤丨丨也㷮作勞反火燒餘木也又炮也焦也二燑炊二俗音烔俗􅁅今正呼回反死火也三烟俗煙正伊賢反臭也火氣也泉也二熈變體正許其反和也廣也長也二煌熿音皇光明盛㒵也又焜丨炫燿也二焜音混火光也徒昆反大也火盛也又丨煌郡名也熊羆上音䧺狩名似豕而大下彼眉反似熊而大黄色熛布遥反火星飛也俗二古文音漂三俗煨正烏􅁅反煻丨火也二煻音唐􅁅火也譙昨焦反國名又姓俗樵正昨焦反柴新也二
