body:
  text: 􅟼三俗音庭焄或作二正許云反火氣盛㒵也三勲同上功丨也㷥􆂬二俗正者仍反熱氣也又冬􅀕也又去聲三􅑒三俗正􅇓二音皆火滅也四焭今煢正渠營反􅀌獨也二塋音營基丨也又俗同上爃俗音榮二俗炰炮二正歩交反合毛炙物也一曰裏物燒也四炃二俗燌正符文反燒也与焚同三音煩燒炙也又同上古文布胡反迯也竄也今作逋燐二或作二正力珎力刃二反􅀑火也四㷠鄰二音􅄦火也烊音羊焇丨又丨熖也焇音消丨鑠也与銷同俗音旻熵二俗忝商􅃴三音炡音征爚煹也熬俗通正五髙反煎丨也二扵云反􅃄丨天地氣也俗音珠煽失連失戰二反火盛㒵也古正二或作燖今徐兼反以湯沃毛令脫也五徒含反火熱也又徐兼反以湯沃毛令脫也膲音焦人之三丨也俗籀文正燋或作即遥反与焦同傷火也下一又音捉火炬也四二俗古炱正徒哀反丨煤也四或作煤今莫回反炱丨􅁅集屋也二正通今他昆反火色又常輪反明也又徒敦反三烰音孚火氣也㶼音哀熱甚也膋音聊膓閒脂也氏林反丨烓行竈烏携反行竈也又口回反亦明也俗苦回反正作恢大也烘呼東反火㒵又音紅燎也熢二俗烽或作㷭正芳容反丨火夜曰丨晝日燧也四炘許斤反熱㒵又火氣盛也俗音燈正熝今烏刀反埋物􅁅中令熟二俗音熒檾玉篇扵營反丨麻也又苦反丨麻也切韻野死草也焳俗音堆煪自秋反丨熮烋許交反炰丨又許􅀹反灲俗灱正許交反乾也又熱也二􅢹昌占反丨丨衣動㒵􅴜二古文音灾燍音斯火斯焦又先井反俗音勞俗去王反炋㶨俗音丕火也二俗与終反煯俗音皆煇音暉曰色也俗失遮反正作奢二正許委反火盛㒵又日中火也四燝二俗音煑􅲼或作燹正息淺蘇典二反字統云逆野火又許位反義同二所下所􅄙二反俗音嚮側下士知二反二俗音㶵或作音熟也力展反小然火也煣人九反屈申木苦老反火乾也㷄賄貫二音楚人云火也舊蔵作盪徒朗反滌丨煦况雨香句二反温也􅀃文無火㶴尺氏反晟也晟音成杰音仕二同力稔反火舒也即兩反或作燷今盧感反黃焦也二㷆音􅀒丨熾也烜况晚反光明也又姓司丨氏以陽遂取木火於日月也又舊蔵作煖許􅀽反人名在廣弘明集第十九音盞俗於􅎻反正作偃丨仰也又仆也倒也息也又姓奴典反去聲燿亦照反照也光明也熠丨也炷之戍反燈丨也或作今正呼貫反火光明也三俗煉正音練燒丨也二㶦二俗燼二正詳刃反燭餘也四二俗爆四正布教布角歩角普駮四反皆火列聲也灹也落也灼也六瑩鎣恚併反丨飾也磨丨珠玉使明靜也二熆㷿炎五俗通今省爓正羊贍反火光也火氣也下又徐閻反八燒失照反放火也自然為丨􅀍人音少炫胡絹反燿也明也火也煫􅥂㸂三俗燧正音遂烽丨火也四爌苦謗反大也空明也久也逺也又呼朗反開􅀰也又苦光反俗音助佐也益也煰二俗燥正乗到反乾丨也三燗俗爛正郎且反火熟也又丨也二燦倉旦反丨爛光明也三俗通或作㸑今七亂反炊丨也又千楦反六七亂反灼丨也出籕文二俗通炕二正苦浪反乾也五熾昌志反盛也猛火也熩俗音戸皮秘皮逼二反炒丨火乾物也煬余亮反炙也向暴也又音羊丨金也烷俗音院或作醮子妙反􅀕也二􅟼俗音定音謂火狀也㶺俗炶或作煔今他念反火光也又胡甘反三焮火靳反火氣也灹陟嫁反火聲也炔炅音桂俱人姓下又古頂反日光也二炤正今音照燭也明也二炓力吊反火光也俗音性爡貸二音二俗音愧子峻反燃火也又倉聿反火燒亦火滅也或作正力照反以柴祭天名也又平聲二㷳正今五且反火色也二爁力焰反丨焱火延也又音濫亦火皃音媚焅熱也焪去衆反火乾物也俗平遍反七内反鋻也又子内反鋻音見熭衛越二音乾也二爟音貫烽火熂許既反燹火也灷士戀反摶飰也炏或作烗二今苦反熾火盛也三俗正市照反二舊蔵作壊誤舊蔵作熯音漢火乾也音頼火之毒丨也灹呼貫反明也音􅦔入聲烼許勿反火煨起㒵直律反烼丨火煨煙出㒵俗欻正許勿反忽也火氣盛㒵也二􅃛戸八反丨惠也二俗通􅉯正而列反􅋹也四書育反㷫二俗熨正扵勿反又扵胃反丨㪷火展帛也三焲音亦火光也熤俗焴煜二正音育火光也燿也下一又為立反火㒵也三爍書若反灼丨也灼之若反丨樂也又燒也三俗正書藥反儵丨光㒵也又音藥煜丨光明㒵儵音式六反四炙之石反燎丨也􅀃文從􅁏在火上㸌俗音霍正作霩燚俗音亦俗二通㶿正蒲没反煙起皃四熀俗古燁正為輙反煒丨火光盛㒵也三熚音畢火聲也又丨炥火㒵也又俗音燁炥音佛火㒵也烙音落燒丨也俗音雜俗􅜱正胡郭反熱也二烈音列猛丨也又光也熱也火也中丨也業也􅌊如恱反燒也熻音吸熱也舊蔵作䯜古歴反出道地經皮逼反火乾也籕文岀玉篇三同上或作四俗正呼木呼各二反熱皃也二􅝂俗正蘇反和也熟也二蘇叶反熟也亦和也文字指歸從辛炎也犖吕甬反丨牛雜色也音布角也熼音弋火光也又俗音㶿燱俗音憶俗爀正呼格反火色也二焱呼覓反火花也又音亦火也焯之若反明也又火氣也蒲未反火氣也於歇反火光也又中熱也出玉篇或作燲正虚業反火氣丨上也二烢三或作􅐫革反裂也与同燠於六反熱也又於告反燩口角苦的二反火燥物乾也俗正今音亦火甚之㒵三熠為立羊入二反丨燿熒火光也俗爝正即畧反炬火也莊子云日月出而丨火不息也二炈音伇䘮家塊俗音煞音赤白澤也俗烏古二没烏反焃呼麦反赤也又許赤反丨光也或作燭正之欲反丨二烏括反火烟出俗炟正當􅁑反火起也二俗音疾熶三俗倉括反正作手取也㷦三俗火覓反正作驚視也俗音著正今音弗火光也又畢丨􅀑火也二熄音息蓄火也或作正焟今音昔火乾也三二或作今士洽反湯􅊪菜也􅊪音藥三燏音聿火光也㸅音節燭餘也又音即煿􅀘各反廹於火也与爆亦同出川韻俗熆正胡臘反玉篇吹火切韻作㥺下又俗音焰二胡沃反灼也他歴反望見火㒵也焅苦沃反熱氣也又音皓旱氣也灻音赤紀力反􅇥也疾也􅃐也又去吏反數也遽也㸎玉篇音鍤􅐫􅂺反火光也又音聶也今爩正扵匆反烟氣也二歘許勿反今作居質反土部第五墻俗全羊反正作牆㙠烏奚於計二反塵埃也又相言噟辝也噟扵敬反坯俗通坏正普反丨末燒瓦丨也二塠垖四俗通堆正都回反土聚丘阜也六三俗坑正客庚反坎塹壑䧟也四二俗填今正音田塞也滿也加也又陟反丨壓也四疆壃居良反界也垂也境也當也二六俗坈而勇反地名二同􅟓方尾反址音止基丨塀必郢反埜二古今以者反郊牧之外曰丨又石反村丨也三堵都古反垣丨又姓俗奴老反正作腦也坦他􅂴反平也明也安也寛也垛垜徒果反射丨也二同㙐埵多果反下垂皃也二俗􅊘正知勇反墓也種也二塪二俗坎二正苦感反坑也險也陷也四壤人兩反土也塵也又臘節童少以木為之作戯撃也於蹇反擁水也又去聲音婢玉篇云下也又符支反丨附也堄研礼反埤丨城土女墻也垗地直小反禎也二二或作正都礼反隴坂也又音􅁓三音紙著也俗坂正音反坡也二通正徒古反瓶也又口含反亦瓦器也二徒古反塡也安古反村丨也墾二正俗口佷反耕丨也三埽蘇老反除也弃也培音部丨塿小阜也或作㟝又音裴埋也隨也助也益也落口反培丨也㙄蒲礼反下也圯皮美反毀也覆也又与支反土橋名也俗正初朕反砂土丨也二俗墠正音善除地平坦曰丨也二音善白土也胡黤反堅土也三俗堡或作堢正音保丨障小城也五音字五罪反音垢埯烏敢反坈丨又今之􅀲丨也直尓反落也二埢音卷􅊘土也埫塎上􅐫勇反下音勇丨丨不安也佫音㙔于􅀑反丨墷也塕埲上烏孔反下方孔反丨丨塵起也正今胡老反土釜也二音墥他管反或作音代以土堨水三古文尸閏反今作舜㘫才性反丨也二直利反垞􅐫嫁􅐫革二反垻必嫁反蜀人胃平川為平丨力制反音􅀕醋錯二音埬俗堜正音練丨塘墟名二莫弄反云􅂖也音照隄也界也堩古鄧反路也􅲎尺志反赤土也圠於􅄢反玉篇同埋也二古文壊字俗音院塂胡反坪或作今音病地名二埾才句反垛也奴到反三墱都鄧反力救反土日丨音鄰二古文地字古文音旣墊都念反下也又徒叶反地名也二同堓音岸古文地字音計音聖音世入聲壁卑積反垣也墻也垤田結反蟻封也二俗二正徒反城上垣也即女墻也四􅱖二俗同上坴音六大塊也􅐉二俗埴正常軄反黏土也又和也埏丨打瓦噐也三并列反大阜也􅘖蒲没反塵起也二俗通坼正今􅐫格反分也裂也又音岸義同又音尺五四俗正呼各反溝也谷也坑丨丘墟也五埸音亦壃丨也二俗正音􅁖白土也三正􅜘今墽二或作經歴反塼坏别名也四墆徒結反貯也止也俗墣正普木疋角二反土塊也二音未壤土也圼或作㘿正奴結反塞也二堨烏葛反擁丨也音其豆丨也音麦丨霄又音麦丨草也荺舊蔵作筠蘇彫反草名蒿也又縣名亦姓俗蘞正音亷蔓草也二薟歛二音白丨藥名也音由水丨草亦作莜又臭草蘨音由草盛㒵或作正音瓊草旋二音亭丨歴也或作今居幽反草之相丩二新蔵作􅂪新蔵音甾田不耕曰丨煑仍反葅也䒰音匡草名莘所臻反地名又姓莉直尼反人姓蒒音師草名蔩以脂反莵􅀲也又音演薋疾資反蒺梨也莙音君牛藻菜又渠殞反俗正音脂丨葅也二葹式支反草名扷心不死也䔟音移萎丨草蕠音如丨藘草也茬或作正士之反丨平縣名二相氶敬冝反薼誤􅞉正芳無反花葉也二葑音封菜名䔲音登金丨草也音皆麻稈也葴音針酸漿草也䕴􅠢二俗正昨焦反柴丨也又木名也三二或作今呼官反化也三茪音光草名菗直由反茶也又菜名䔮音斯草生水中其花可食俗通䓱正音柴丨葫藥也又随反二或作音正作賤事㒵也或作䓉今以遮反草名二茄音加荷莖也又姓又求迦反丨子也荀相輪反草名又姓菠音波芇音綿相當也又賭物相亭也葳音丨蕤藥名蔣音將菰丨草又即兩反國名亦姓音脾荃音詮香草名􅚄音郎丨毒藥名也音灾上音紬下音除丨丨葱別名也蓒音軒丨芋草名音丘俗音毛又音老俗芟正音衫伐草也二音菩提二字莫朗反草木冬生不死也又音菩薩二字茱上音殊下音俞丨草名也俗菰或作􅋎正音􅀌丨又丨蔣草名也三俗菑二或作􅫱正側持反田不耕曰丨也四蔞音樓商丨蒿可食也又力朱反丨蒿又其矩反丨數音胡多草㒵又俗音􅀌苛音何政也煩也怒也又上聲菛俗音門俗音親艼音丁丨香也音他渠幽反去角龍也与虬同艽音求獸辱又地名芃音蓬丨丨草盛皃又音馮草名菘息弓反丨菜名䓙古懷反草名艿如乗反草名蘡伊盈反丨薁藤也薁音郁蒹古添反荻未秀者也葭音加丨蘆又徒玩反草名甫煩反丨籬也又音煩二俗荽䒘二或作正音雖胡丨香菜也五俗䔺正恱吹反藍莠也又音隋二蘇和反丨草可爲雨衣也又素囬反丨丨蘂下垂皃蘅戸庚反杜丨香草大草曰杜􅀂也蕪音無荒也古蓀今音孫香草也二芩巨今反黃丨也居依反葅丨草也葅也余反蔵菜也与蒩亦同蒩七余反苞丨又則吾反茅丨藉封諸侯丨以茅又則古反菹側魚反菜和醋也二蘪音眉丨蕪香草即茳蘺也茳蘺上音江下音離丨丨蘪蕪也新蔵作郭迻音他蔵則郎反丨莨莨尾草也莨魯當反童丨草名也藏昨郎反隠也深也収也匿也又則郎反善也厚也亦丨獲又徂浪反庫丨也菆側愁反草名又蓐也又初注反鳥窠也苹音平萍别名也菄音東丨風草也又俗音練􅽅而容反三芊音千草成㒵蓍今􅆱正音尸蒿屬巫者以爲䇿二茧丑中反草名蒡薄庚反菜也一名荵隠以蘇可爲葅藷音諸丨蔗甘蔗也又音除越人呼署預為甘丨又常恕反丨藇也藇音余莞草又音序姓也又音与蕃蕪又音藷丨也堕凾云合作蛬音渠容反蟋蟀也蛬渠容居悚二反蟋蟀也棻音焚香木名也蒐音搜茅丨草又春獵也莫經反丨菜堯時􅃸月草大月卅日小月卄九日花乃也蕘如招反蒭丨草也蓐食倫反牛丨草似蘭青黒色也經音義作興字芄音丸蘭草名音草名有毒可爲藥苀胡郎反東丨草名又音剛葉似蒲藂生也芭蕉上􅀘加反下音焦丨丨葉煑可以紡績爲布也荼音途菜也又俗音茶胡耕反夲也也枝主也蘆音盧葦未秀者也又丨菔菜名藂俗古正殂紅反草木聚生也三茅莫包反草名菅草也荷音何蓮也又上聲丨負也萎於爲反怨也弱也也丨黄病也芙蓉上音扶下音容丨丨花之巳發也俗葩正普巴反花也又草花茷盛皃二莎蘇禾反丨草也莏同上手捼丨也䓾蔢上音娑下音婆丨丨草水之盛皃也莣音亡草名似芉皮可為索也三俗古瞢正莫登反目不明也又音夢雲丨也五茨疾資反茅丨也䒵俗薅茠二正呼毛反秐也去田草也三芹音勤水菜也薨呼弘反大臣死曰丨茹音如恣也相牽引也又姓又音汝乾菜也􅆨也貪也􅄂也又人恕反菜丨也又噉牛也荕音斤骨也丨􅁏之力也又姓蘿音羅女丨松丨又丨菔菜名也茵音因褥也俗薑正居良反辛菜名也二荖舊蔵音差藤或作䕨正藤今徒登反丨蘿也又丨苰也苰音弘三苔徒来反丨鮮石木之衣也俗䔶蕛荑四玉篇皆音提草名也下又音夷莁丨香草也五必迷反丨庥也二蒿也芘音毗丨䔧荆蕃也又俗作蓖二苷音甘丨草藥名又丨蔗也皆該二音草根也茺音充丨蔚草名也音煩丨茂滋息也又蘺也屏也又方煩反亦屏也汝羊反荷也又音箱草名也蔫於乹反萎丨物不鮮也主仍反進也厚也衆也薰也又去聲音芙丨也苞音包裏也又豊茂也藂生也又姓苫失廉反草覆屋也又姓芸蕓音云丨薹名也二音臺芸丨菜名也音草名又大麦也萇直良反丨楚􅟵生也蔓上母官反丨菁菜名也又音万筵也􅀲葛之丨也下音精菜英曰丨也川韻登騰二音丨瞢目不明也又都鄧反丨也茸而容反草生皃也菅古顔反草名也又姓葌蕑古顔反丨蘭香草名也二音臻草盛皃也士臻反木跬生也萄徒刀反蒲丨也萪音科丨生海邊葉䀔可為也葐蒀上符分反下於云反丨丨香氣盛皃也俗薔正疾良反丨薇也又音色菜􅖋也二蘠匠羊反丨薇也与薔同薇音微薔丨也俗毗連反或去聲正作箯䔖力應反丨也二徒丁反草莖也芎去弓反丨藭香草也根曰丨藭苗曰蘪蕪也或作藭正音窮芎丨也二蘩音煩皤蒿也萱音喧忘憂草也葋其俱反艼熒也俗正如佳反葳丨藥名也又草木花垂皃也又丨賔五月律名也二葷許云反臭菜也虆力追反􅟵也萍音瓶水上浮丨也䓑音瓶馬帚似也俗通正音萌屋棟也三蕄莫耕莫登二反尓疋云存存丨丨在也音萌芀可爲彗也芀徒聊反花也俗苕正徒聊反丨菜也二正今魯甘反染草又姓二䔠二俗莦正所交反􅀃文云􅁖草也又音消三蘼文悲反薔丨藥名也敷容反蕪菁苗也蕡符分反草木多實也䒥母官反相當也蓷昌佳他廻二反草名又益母也芣苢上音浮下音以車前牛舌也上又音綿停當也莤音由水草又軒于草也其機勤三音縣名亦草名又姓莀古文音農音萌葵渠維反怕巴反上聲藴於粉反丨積包蔵也荏苒上而審反丨菜也又丨苒也下音染草盛皃也又丨丨展轉也葦于􅀑反蘆丨也俗藕正五口反蓮丨也二􅗰古旱反草莖也堇音丨菜也又音芹水菜也音謹黃土也䒺音謹穰草也俗藪今蘇口反澤無水有草曰丨又大澤也二蓊烏孔反大也英也又丨􅉱草盛皃也蕊草􅀄生也如水反花䰅也又垂皃䰅音須蕋蘃蘂三同上五俗藻正音早文也又色也二蘯蕩徒朗反放恣也又水名亦姓二胡感反丨蓞芙蓉半開皃也􅴓二俗萏二正徒感反菡丨芙蓉未發者也四􅓂息委反丨靡也与靃同又音霍蓏郎果反􅀃文云木實曰果草實曰丨又有核曰果無核曰丨又陸生曰果水生曰丨通藳俗古老反正作稾禾稈也二菒古老反乾草也音草名於逺反紫丨藥名也又丨茷木名也亦姓苑於逺反園丨囿也韮音九菜也正作韭字菲芳尾反薄也微也悵惋也又菜名又芳非反芳丨也茅或作苧正直吕反草名也二莠音酉似禾非禾之草也蒱俗或作莆正音甫蓮丨堯之瑞草也三葆音保鳥羽飾也􅌲渠􅉖反地丨也又姓芉亡尓反与􅫗同苡音以薏丨蓮實也又云車前亦云當道亦名牛舌也薺祚礼反甘菜也苨奴礼反薺丨也二同或作正奴礼反華茷盛也上又奴叶反病劣皃也二同音爪草名也蘤韋委反花也榮也蒍俗蔿正韋委反人姓也二荇莕何耿反菜名高音謹与同以瓢爲酒噐婚礼用之也蕈慈荏反􅌲生木上也玉篇又商錦反莾俗莽今莫朗反丨草又姓二食審反木丨也又知林反蘌音語丨蘙也苘古䔛今去頴反野死草也二古文音子蕇音典葶􅏣子也音逺丨志藥名又韋委反丨草亦姓䔸音表草名薙直凡反辛丨辛夷别名又他計反除草也菼他敢反荻也荵音忍藥草也俗正今倉古反草死也三通茈正音紫丨薑又丨草也二古文失旨反今作􅜴同音魯杜衡别名也魚矣魚力二反草盛皃也作礼反草盛皃俗通蓰正斯氏反草也三蔪慈染反麦秀皃也莒居許反草名又􅀦名亦姓葰蘇果沙瓦二反丨人縣名二同蓓蕾上薄亥反下落猥反丨丨花欲綻皃随函音聚二或作子小反菜似薺舊蔵作跛丁敢反又音占四同通正徂兖反葍丨也二􅚘音犯法也常也式也前也或作茝正音止香草也又昌海反二芷音止白丨藥名又丨陽縣名二俗正音止丨蒻小苹也二或作正徒口反草蓐也二葈随凾云合作枲息反麻有子曰丨無子曰苴也音耿芋莖也苟古口反且也亦誠也又姓蓼音了辛菜也又音六丨莪也二蕆丑善反俻也新蔵作古典反苪音丙著也蕒音買吴人呼苦􅛧曰苦丨􅛧其吕反苦丨江東呼苦蕒也俗同上蕌古藟今力水反葛丨菜似也二蘽九水反藤也古典反蚕衣也䔿上音夲下音慈夲反草藂生皃葸思子反質慤㒵也去聲蔽必稅反掩也障也隠也情夜反􅀕丨也俗正莫􅃸反又莫布反豊也美也盛也滋丨也二巷下降反里也小街也与街同蓻俗蓺正種丨也今正魚祭反丨能也靜也常也准也才也法也又禮樂書數射馭六丨也四䕃扵禁反丨覆也又平聲藺良刃反丨草名又姓䔏􅀄救反丨薺也俗芋正王遇反夲草云有毒草也食之煞人以􅁅水煑之乃可食食巳至不飢岷山多出又音于草或皃二薜荔上毗計反下力計反丨丨香草名又覆姓藎徐刃反進也又草名能染作金色著陟慮反成也立也明也反也􅀘也又張畧反所丨也又知吕反任也又直畧反貪丨也音屋苫也莇直㩀反草名莝倉卧反斬草也之夜反苷丨也蔚音畏茺丨草也苹通正􅁗酔反集也聚也二莅音利臨也胡紺反苗丨心欲秀也羊稅羊雪二反萌牙初生皃又草木盛㒵也蕢求位反盛土噐也又苦恠反又名也音帝人姓也莫鄧力鄧二反丨居例反草似芥又音計又州縣名亦姓芆俗䒘正五盖反歴也老也長養也又草名又姓二莬音問親生草也菢薄報反鳥伏夘也莚余戰反蔓丨也又平聲草名薦作見反丨席也草也進也又姓葂舊蔵作音遂古文音挍茤俗芰正渠􅀉反􅁜丨生水中有子可食也二正薤今胡戒反葷菜也二䕞􅖎上音浪下徒浪反丨丨毒草名也蓎俗音􅖎䔉今蒜正音筭葷菜也二荐在見反再也仍也數也於反丨也又蕪也草也正蔲今呼豆反荳丨藥名也二音帝草木綴實菓丨也蘱音􅀋草也一名蕫如鳥尾可食之矣䔽於盖反盖覆也又清也微也又於例反藹於盖反丨樹繁茂也又姓胡計反屧丨也蘸䧟反以物内水中也䓶音頼丨蒿也下又郎逹反亦蒿也二􅯈通薍正五慣反草名二藋徒吊他吊二反􅀺丨也莫報反老丨与耄同舊蔵作在廣弘明集第二丨七眷芿而證反草不剪也蔳三俗菚或作蒨正倉練反草盛皃亦草名五茜食練反草名可染絳色也萰郎電反草名也三古文音證蒟九遇反丨醬又其矩反芮而稅反草生狀又姓也䔯苦故反醋葅也才外反藂也又小皃蔦吊鳥二音􅀉生草也俗􅀘過反音歩亂草又音蒲丨攎収亂草也蘙於計反以障也䔬意共二音連翹草名䓞郎計反紫草也􅈍音惠香草蘭􅏪作見反畜食也莧侯間反菜菓名也良刃反草名薈鳥外反草盛也蓥舊蔵作鎣鳥定反丨飾薯常恕反根可食也菸依倨反息草舊蔵作羡芐音下蒲苹草又音戸地黃也上或作丑芥反毒虫也今作香嚴又他刺反亦虫名二夫反二舊蔵作夢新蔵作音草名布過反蔟倉􅃸反太丨正日名也又干木反蚕丨也二音又同丨也莵他故反丨絲草名也葪音計草名又州名亦縣名俗正初患反奪也逆也二入聲苾上毗反下測于反丨丨梵語草名有其四徳故今存之也測于反同上二二俗菽正音􅅩豆也三萩俗荻正徒歴反􅜰也二蔔蒲北反蘆丨也二二俗月不明也火不明皃今俗正莫結反丨無也七葺子入反茨也又七入反修補也七入反丨累修補也又子入反茨也又音習俗正魚列反妖丨也二俗正魚列反餘枿也又姓二音上与司蘗博厄反黃丨蔛胡谷反石丨草也胡谷反水菜可食也古木反丨草藥名蔌送各反菜茹之㹅名也又姓莂彼别反種穊移蒔也藿呼郭反香草也又豆葉也蒺音疾丨䔧也􅡒二俗􅋹今如恱反憢丨也三苜蓿上音目下音􅀫丨丨草名也紀力反􅇥􅃙草也䕓音察草丨也蔍音鹿丨蹄草也音笛盛種噐也葯於角於略二反白芷葉也音若杜丨香草名蒻音若荷葉也又笋丨也俗音責正作笮芅音弋羊桃也或曰􅀑桃苵徒結反尓雅云稗布地生穢草也又也音徒藥反或作糵正魚烈反米麴丨也二音憶似菊而苦也五各反花丨也蒲没反蘩母也俗音正作荅或作芛正余律反草初生也二䕎二俗或作正音福草名也四葍音福也茢音列桃丨可以爲帚除不祥也俗薁正於六反蘡丨也二二俗苃正音鉢蓽丨又根丨也三倉歴反草名新蔵作䇿楚革反二新蔵作苾俗正多葛反蕈丨也二音丗三同二俗蘀正音託葉落也三䒗乞迄二音香草名也俗正五革五二反丨綬草也二或作正音悉牛丨也二䓇音赫萆房益反􅀨衣也荚通莢正古叶反蓂丨皂丨榆丨也又姓二古文蜜字音􅄂亂草也又在叶反戸簾也䓤音忽丨也蓋胡臘反苦丨芨音􅇥烏頭别名也又俗及笈二音負書箱也苙及立二音白止也音及冬􅀲也或作古􅃛反今作秸也蘇叶反草名也俗莋今在各反縣名二菉音録丨蓐草或作音録水名今作渌蓐音辱草丨又薦㭉新蔵作􅒒奴叶反病皃蕝子恱子芮二反束茅表位􅏣音歴葶丨子也茖音格山䓗也荲許六反羊蹄菜名蓫直六反馬尾草名又丑六許六二反亦羊蹄菜名俗正所洽反丨莆瑞草也二萗郭氏作筞字艻音勒蘿丨香草䕙音截草丨蒦玉篇音穫丨落藥也又一虢反川韻驚視皃芍市若反丨藥又七崔反陂名又音的蓮子也􅺀音塔丨布音集菩丨音弗草木盛皃新蔵作厥蓽音必織荆門也紀力反薳别名也鳥酷反同沃古文音岳薏音憶丨苡蓮實也俗音芴音勿土􅀲也茁微反草牙又止律反或音笛也音革口部第七嚬毗寅反丨㗛皃滅眉也咤􅎥加反五俗正語巾反丨頑也􅁖也左傳云口不道忠信之言曰丨六嘲陟交反丨諕也調也三俗呺三通嚻正許饒反丨諠也大也動也不安靜也十一赤之反丨戲㗛也嘶音西鳴也哆􅐫加陟加尺氏三反張口也又車者反丨脣下垂皃也又當可反語聲也嗞子之反丨嗟憂聲也囉力何反嘍丨又小皃語又力沙反嘙二俗音婆在呪中俗音陁在呪中􆉇俗音奢俗音呵俗音凾二俗其凝反嗏二俗音茶可以爲飲也三俗力夷反三俗嘷正胡刀反熊聲四俗咷正徒刀反丨也二嗔昌真反