body:
  text: 崇禎戊寅元夕徐􅎾興公識新修龍龕手鑑序燕臺憫忠寺沙門智光字法炬撰夫聲明著論乃印度之宏綱觀迹成書實支那之令躅印度則始摽天語厥號梵文載彼貫線之花綴以多羅之葉開之以字緣字界分之以男聲女聲支那則創自軒轅制于沮誦代結繩於既往成進牘以相沿辨之以會意象形審之以指事轉注洎乎史籀變古文為大篆程邈變小篆為隸書蔡雍刋定於石經束晳網羅于竹簡九流競􅕽若百谷之朝宗七略遐分比衆星之拱極尋源討本備載于埤蒼廣蒼叶律諧鍾咸究於韻英韻譜專門則字統説文開牖則方言國語字學于是乎昭矣矧復釋氏之教演于印度譯布支那轉梵從唐雖匪差於性相披教悟理而必正于名言名言不正則性相之義差性相之義差則修斷之路阻矣故祇園髙士探學海洪源凖的先儒導引後進揮以寶燭啓以隨函郭移但顯于人名香嚴唯標于寺號流傳歲久抄寫時訛寡聞則莫曉是非博古則徒懷惋歎不逢敏逹孰為編修有行均上人字廣濟俗姓于氏派演靑齊雲飛燕晉善于音韻間于字書覩香嚴之不精寓金河而載緝九仞功績五變炎涼具辨宫商細分喉齒計二萬六千四百三十餘字注一十六萬三千一百七十餘字并注惣有一十八萬九千六百一十餘字無勞避席坐奉師資詎假擔簦立祛疑滯沙門智光利非切玉分忝斷金辱彼告成見命序引推讓而寧容閣筆俯仰而強為抽毫矧以新音遍于龍龕猶手持於鸞鏡形容斯鑒妍醜是分故目之曰龍龕手鑑惣四卷以平上去入為次隨部復用四聲列之又撰五音圖式附于後庶力省功倍垂益于無窮者矣時統和十五年丁酉七月一日癸亥序
