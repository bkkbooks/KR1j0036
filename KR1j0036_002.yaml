二甒音武罌丨㼴五口反盎名盎音烏朗反正㼬今音幸丨㼳有耳瓶也二㼳所景反㼬丨也㼦音拱也㼫胡瓦反大口也徒果反甌也㼮音敘瓪音扳丨瓦又俗北官反去聲或作甕二正烏貢反瓶江瓦之大者也三盎二俗烏浪反正作盎盆也瓽丁浪反大甕一曰井甃又大盆亦姓俗甃正側救反井丨也二楚鑒反􅑥屬也俗甈正去例反尓匹云瓳也二音帝丨瓽大㼻也魚記反大罌也㽀直正反罌也古縣反底孔也胡懴反大盆也俗正土戰反器緣也二舊本作古文夜字力救反也入聲苦結反丨瓶受一斗也甋音的瓴丨甎也音曆瓦器也二俗正良涉盧叶二反踏瓦聲也三正今普八反車破聲又或同上二二新藏舊藏江西隨函古獲反瓦器也西川隨函合作罌烏耕反亦瓦器也在道地經罒㼣音百㼿丨井甃也正今郎的反有腳鼎也二俗音擊正作墼土丨俗苦結反正作㼤瓶也或作正辛律反不能行也二許勿反二俗正女刮反也亦刻出瓦也二即葉反半瓦曰丨也音卆音卓甓扶亦反瓴丨㼾磚也犬部第草一猒俗正於閻反丨飽也犬甘肉心無丨足也又去聲二猜倉來反疑也恨也於竒反加也倚也長也施也歎也美也又上聲丨報狌或作猩正音生丨丨能言似猿聲如小兒二俗猿二正音袁大猢也獼猴之屬三舊藏作猿獼猴上音彌下音侯猿猱之屬猱奴刀反猴屬也猱俗同上俗㹳正音吾猿屬也二獑猢上士咸士銜二反下音胡丨丨似猿而白猊上蘇官反下五兮反丨丨食虎豹也即師子出西國㹞犾玉篇皆語斤反犬爭也又俗音狄二狺同上音胡狢也又姓貓俗麥包反正作貓字俗正音加丨豕子路佩丨二㹢或作正音加丨玃也玉篇又音哥二敕於反獸名也或作正音胡丨狗小犬也二猷音由從也若謀圖道也徒昆反小豬也狸力之反野貓也俗音毗正作貔汝羊反戎屬也狉二俗作匹悲反狸子也今作豾通正五髙反犬髙四尺者曰丨也二猖音昌丨狂也㺎音容丨獸名也莫經反小也㺗充山反也音疑犬怒也又音拳縣名獅音師猛獸也又犬生二子也俗丁侯魚訖二反通獳正音獳朱丨獸名似狐而魚翼出則國有恐也又女溝反犬怒也二古文音搜春獵也俗嗥正音毫熊虎聲二㹫音夷狨丨也狨音戎細布也獹音盧韓丨犬名必兮反丨犴獸也又牢獄也犴五干五二反與犴同胡地狗似狐而小又音寒俗丑知反俗遭曺二音俗丁年反音煩丨犬鬪也􅏈音魂似犬人面也音柴其江反多毛亦作猶音尤犬吠聲也狙七余反子也又七慮反犬齧足也獶俗正奴刀反獸名又奴巧反犬驚也二㺜通正奴刀女交二反長毛犬也二猦音風丨􅳎獸如猿逢人則叩頭小打便死得風還活也音緣丨㺦兔走貌又丑戀反草中走也音連丨猭犬走貌也又丑人反義同狑音零犬也二同俗音毛或作正音思辨獄相察也又息利反二獠音聊夜獵也又張絞盧晧二反西南夷别名也許云反北方胡名丨煮也猵音邊獺屬猋必遙反群犬走也􅰉乙咸乙陷二反犬吠聲也或作㹶今徒丁反猱丨猿也二音窮獸似虎食人也五間反犬間聲狍薄交反獸名目在腋下也俗獌正莫還反狼屬也二獚音黃犬名犿獾呼官反野豚也二同俗都聊反俗獢正許憍反猲丨短喙犬也二俗音雄正作熊獸名或作音郎丨毒藥名猑古渾反丨禽獸名也􅽟音柴狼屬也二同𧲱於良反峱奴刀反山名也􅥡留栁二音似鼠而大食竹根也上聲猥烏每反穢雜也不正而濫曰丨也説文衆犬吠也狔蟻反猗丨也二俗狡正古巧反疾也健也猾也狂也二誤音保􅚦力水反飛丨獸也獎即兩反狗也俗音犬獖蒲夲反宋犬也又扶文反羊名玁或作獫正虛撿反丨狁玉篇云北狄也下又廉斂二音犬長牙喙也二音尹獮息淺反狄獵曰丨丨殺也或竹㺑正所檻反㺝丨犬吠聲也二㺝下斬反大囓聲也一曰惡犬吠不止也狗古口反犬也二同獬胡買反亦丨豸獸名􅳎莫口反猦丨獸名也玀經音義作阿婆二字上烏可反下蒲我反謂僂要而行也在樹提伽經中或作􅨓正神紙反獸名似狐出則有兵也上又豕紙反二虛豈反楚人呼豬也又音希三俗羊苦常預二反正作墅字通㺒正奴巧反擾亂也又下巧反事露也二獷古猛反犬不可陌近也又居往反丨平縣名直尓直買二反玉篇云似鹿一角也㺐側絞反正作䝖􅩅二俗上音巨下音虛去聲狃女又反習也就也又狐狸也又女九反相狎也􅜦虛器反夏后氏有澆丨寒浞子名浞音士角反二俗正五晏五見二反逐虎犬也三尺制反狂犬别名也三俗博教反古縣古掾二反𥚹急也狾猘居例尺制征例三反狂犬别名二同獁莫嫁反獸名也㹿俗徒到反犽五嫁反獸名也或作音岸今作犴獸名狧或作正古外反狡丨小兒戲也又古邁反二余又反黑猿也古縣反躍也疾跳也狽俗音貝呼貫反文彩明貌也又姓也獟五吊反狂犬也俗狚正音旦獦丨似狼也獦音葛二貌狠四俗音貌儀同也俗狖狖二正今余救反獸名似猿四㹨俗余救反音備切韻云車軾也或作犺今苦浪反猰丨不順也二狩書救反冬獵也入聲𩢷上知格反下莫百反丨丨驢父牛母也俗亦鐸二音俗烏各反俗女律反獵七雀反玉篇獸名又才藥反𤞞榖欲二音獨丨獸如赤豹五尾也俗音適七藥反宋國良犬也𥘉洽反犬食也古文他歷反犳之若反獸名二俗狧狧二今吐盍他合二反犬食也四音滑狡丨也二俗祖葛反俗二今古轄反雜也又烏黠反丨貐獸名龍首食人也又苦結反丨抗不仁也貐音庾或作猲正許謁反丨獢短喙犬也又許葛反二俗正音即犬生三子也二許月反獸名又走也舊藏作獵二俗正音戟丨獸三狎胡甲反習也近也俗正村沒反丨暴疾也食丨也二獵良涉反捕丨也四時之田春曰狩夏曰苗秋曰捕冬曰丨俗獦正音葛丨狚似狼文質也又俗音良涉反狚音且二狹侯夾反隘也隘厄介反狄音笛北丨也又姓狢胡各反狐丨也俗玃正居縳反大猿屬也二二或作今書藥反犬驚貌也三獺他逹反水狗也音博丨䍫獸名似牛九尾四耳目在耳後也䍫音陀二俗正勒沒反丨篇射也三狊呼覓反犬目視又古覓反亦獸名猿屬也豕部第草二豕施是反豬别名也豬音豬徒昆反豕子也同上音加雄豬也與猳同豯音兮豕生三月也恱吹反豶名也豶音墳野豬也又音煩豲音元豕屬豧芳無芳遇匹候三反豕聲也又豕息肉也俗􅘻正古來戶來二反豕四蹄白二莫經反小也豜俗或作􅢢正音肩豕三歲曰丨三許衣許豈二反豬也豵今正子紅反豕生三子也二力屯反獸名也貒他端反似豕而肥也又去聲音蒙似豕也豝音巴豕也􅻝音同獸似豕也豩古文百貧反毗連反豬也􅼞音雄豕獸名豱音溫短項豕名蘇干反豕也豠或作正云魚反豕屬二胡刀反丨俠也亦州名奴刀反山名也上聲燹蘇典許位二反野火也二俗䝐正羊捶羊委二反也又徒卧反豬别名也三豤康很反豕食貌也又去演反豕齧也音母獸名也䝏力主反貒子也切韻雖主反玉篇士羽反小豬也二同去聲音惱雌狢也䝖音爪獠丨之九反猛獸也去聲豿俗豹正包教反丨似虎團文花黑而小於虎上又呼構反二貇二俗古貌二正音貌儀容也五貁余救反獸名似猿俗俗通魚既反果決也二􅡐音四狸子􅤘踈吏反貉也二同獌莫半反狼屬竹用反乳也正今皮寄反二䝞舊藏作舜在辨正論獌音万獸名似狸俗古反入聲􅽜二俗二或作今貈出説文出孝聲胡各反䝖屬也七貊音陌蠻丨之邦也貘音陌食鐵獸也似熊黃黑色出蜀中也貀或作豽今女滑反獸名似狸也二貜居縛反大猿也音力遼東犬名也貉音陌北方獸名又胡各反地逹反水狗也與獺同部第草四胡刀反大呼也也痛也號呼交反丨呷也又音豪丨也今甝正胡甘反白虎也二直離反虎聲又竹燻名䖜音銀孟虎爭聲二俗正五間胡犬二反虎怒貌也二上音烏下音徒楚人呼虎曰丨丨也或作音池胡交反音同黑虎上聲二或作今胡犬反獸名似犬多力一曰對爭出西海三二俗或作音虎三去聲薄報反丨虎無杖手搏也二同二或作今魚既反虎息也三虥士諌普患二反虎毛淺也二同入聲𧆥胡甲反虎習貌二䖛音索音覓説文云白虎丨也所責反虎驚又詐逆反音革虎聲也旱丨也二音竹俗章欲反音域小兒鬼也魊音或鬼丨旋風也二二俗音􅟕走部第草六􅦇音俞越也過也又傷遇反馬丨前也趍通正七俞反走也疾行也二音希走貌丨也䟇居依反走貌也丁年反走貌也許緣反疾走貌也俗音羊匹昭反行疾貌直離反輕薄貌也趧音啼丨鞻四夷樂名或作今取私反倉卆也二誤新蕆作趄七余反趄七余反赼丨也趦俗赼正取私反丨趄不進也二通䟂正母官反行遲貌也二彼為反許其許記二反音由音余丨丨安行貌戶來反畹意也䟒渠貟反曲腳也音焉東夷舞䟃𧽼上二倉含反下一徒含反丨丨走貌也音渠走也趪音黃丨丨舞貌又張設貌又音光䞮上博孤反下他胡反丨丨伏地貌下又俗音徒俗趬正去堯反行輕貌又去囂反亦起貌二􅧱音袁玉篇云走也一曰各也音湯走貌也又他曆反跳貌俗趫正去遙巨二反善走又緣水也二䞴俗趟正上一陟交竹教二反下二竹知孟二反丨丨跳躍也䞚綺二音玉篇云丨丨鹿走貌一曰行也七廉反俗赹正渠營反獨行貌上又俗五髙反二通正直連反移也又張連反同行難也二或作正音賢疾走貌二趖蘇禾反丨疾也躍𧾱二同音劬走顧之貌下又音憮健也二䞗倉來反説文疑也七羊反趍走也上聲赻二俗音渠委反與跪同張丨也􆈍虛斗反俗趛牛錦反頭疾行也赾丘隱反跛行貌跬立弭反半步也舉一足曰丨再舉曰步與跬同安古反走輕貌正踊今余拱反行貌一曰頓走踏地也二趲則散則且反散走也居許反行貌俗音了音糾式也二俗知奄反趡千水反走也趭子小反急也又子笑才笑二反走貌也又同上立忍去刃二反行貌音此淺渡也趁尼展反踐也去聲躁則到反動也擾也又疾也䞯芳遇反疾行貌也二或作北諍反散丨也正作迸字千夜反丨腳立也俗趠正勑教反行貌也又敕角反逺也二俗音教􅽔俗音去跳他吊反越也又他洞反雀行也二俗踣䞜三或作今芳遇匹候蒲北三反丨僵也六透俗正他候反自投下也二俗撫鳯反正作􅸱香仲反瞢丨遁徒困反都計反走貌也渠院反俗正今丁計反走也一曰窮也三二或作今丑側反跳也踰也二三俗趣正七句反丨向也又倉狗反丨馬掌馬官名也又七足七俱二反四音逝踰也趐俗音翅俗丑戀反正作猭犬走草中也許縣反走貌又居聿反亦走急也俗音造赲二俗力庶反俗音到俗薄半反正作叛趥千仲反行貌䞪疾亮反行貌也趂丑刃反逐也䞥音又走貌音救䞭音迅入聲俗正于伐反超也逾也揚也又姓二䟏書藥反躍走也又音歷動也趢音鹿丨趗小也又音録丨小兒行也丑玉反丨小貌行貌趗千木反趢丨也又七玉反俗正丑律反走也二二俗虛恱反􅱸羊即反進趣貌也通䞘正其訖反行貌也二趕其月反舉尾走也又音乾音陌越也今作驀䞚蒲末反同旱丨也俗正蒲末反行貌也又取私反倉卆也二去吉反走貌也音迹俗徒歷反正作丨也䞽所戟反僵仆貌士洽反行疾貌或作正丑格反半步也二蹕音必玉篇原行貌切韻丨行池也俗躍正他歷反丨跳貌二俗渠􅟕反趌巨乙反直行也又音吉丨􅨤走貌􅨤堅列反丨􅺻跳貌又居謁反走貌赽正今古穴反烏疾行也二􅺻居月反跳丨也趩音敕行聲也或作䞞今音佛走貌又普末反二趉其月反行越也趉九勿反走貌趜渠竹反丨趍體不伸也俗通正所六反趜丨二俗𧾢正才結反傍出前也又音吉走意也二䞵知劣紀劣二反小跳又走丨丨俗才恤反正作摧丨居聿反走急也正䟐今音歷丨行貌也二或作趚今正七迹反䟐丨也三正趞今七雀反行貌二䟉之欲反小兒行貌也音結走貌音疫羽部第草七皇音黃羽舞名又音王翴音連丨翩飛相及也羾二或作正音紅蟲飛貌也三蘇雕反羽翼也芳無反丨細毛也翪子紅反聳翅上貌􅡇芳文反􅌭丨飛貌許么反也翏正今音聊髙飛貌也二翁烏紅反老稱也亦鳥頭毛又姓匹賔反飛貌也䎕呼萌反群鳥弄翅也二同翃戶萌反蟲飛也所臻反羽多也翑其俱反鳥羽也二同其俱反馬左足白也俗今巨嬌反丨飛貌二俗髙亦二音翹渠反舉也也危也逺貌也翶翔上五高反下音祥丨丨逍遙蟠回自在貌也翩上音篇下音畨丨丨飛也又翻覆也翶翔貌也翷通正力珍反分羽飛貌也二許緣反小飛蟲也翢他刀徒刀二反羽葆幢也俗翎正音零鳥羽也二翍普碑反丨張之貌胡郎反翓丨也通􅲏今許延反飛貌也二渠支反丨丨飛貌也􅬾是支反群飛也翬音暉飛貌又雉五色備也翲匹昭反鳥飛貌翧音暄飛來也䎁俗音胡人名也俗翭正音侯飛聲也又羽𥘉生又去聲二音于飛貌二同􅨎翑翵其俱反鳥羽也又俱兩反曲羽也三同上聲䎂音保彩羽也正翦今音剪截羽也二去聲三俗翳正於計反葆也也障也隱也奄也又平聲四翡上扶未反赤羽雀也下七醉反音羽雀也雄曰翡雌曰翠二古翨三俗翅通翅正音施鳥兩羽也七翥之恕反飛也舉也􅔘呼會反鳥飛也二或作羿正音詣能射人名説文從羽也三二或作正羊制反鳥飛也三或作正音惠六翮之末又音曵亦鳯六翮也二二或作正徒到反舞者所執三於劒反劒羽入聲或作今盧盍反丨莫大羽飛𥘉起貌二徒盍反丨俗今許聿反飛貌二俗正匹各步各二反飛去也二奴勒反蟲名也莫大羽音塔飛盛貌也音押音六與戮同三䎀許月反飛貌􅢅翼羊即反輔也翅也助也美也恭也又州名又姓二翋俗翌正羊即反明曰也二俗或作正行革反鳥羽本也三許逼反羽聲也音域飛聲也翕許及反火炙也百起也又動也斂合合聚盛也翖許及反人姓名也䎑音祿水上飛也翓胡結反丨飛上下也所甲反捷也又色立反疾飛也翣所甲山洽二反棺衣也形如扇以木為匡呼角反鳥肥也甫勿反舞者所執也許考反小鳥飛也二同毣音木思貌一曰濕毛也又莫角反好貌上盧合反下他合反丨丨翻飛貌也蛡羊即反丨丨蟲行貌虎伯反飛疾貌誤徒合反鳥毛也皿部第草八皿旻永反器丨也又盆丨也盟音明誓約也又音孟丨津河也盂今正音于盤丨飰器也二苦回反丨器屬也三俗盩二切韻盩玉篇張流反水曲曰丨又丨厔縣名厔音窒六盅丑中直中二反器虛也二音溫仁丨諸比類也音雷器也俗正音昭器也二奴冬反二䀃郎奚反以瓢為飲器也㿼俗正堅反盞也二盉和俰二音調五味器也䀂上音安下音殘丨丨大器九􅦝音羊杯也古文布胡反今作餔晚食也上聲蕩徒朗反條丨搖動貌又吐郎反丨突也䀁有右二音抒水器也二同簠俗簠正匍夫二音丨簋祭器也二俗簋正音䡄簠丨祭器受斗二內圎外方也二碗古文烏管反小也今作碗音杜器也音猛盨相主反丨負物几也又音所載醋也其矩反丨盨負載器也俗盬今音古盬也咂也又不固也二或作今音古器也二俗㿿今音雅酒器也二古巧反器也䀊古巧下巧二反溫器也又丨濁也籕文俗二或作音海宍醬也四去聲泴上聲羊主反病也又微弱也奴每反傷瓜也二力忝反瓜名也平表反物落貌魚偃反瓢也音祖音禮俗音始踈瓦𥘉瓦二反古文禮字去聲音訓二古文音愛俗音練正作瓜丨於靳反所依據也於刃反今作印同入聲二俗居碧居縳二反正合作攫字蒲角反瓜丨也二􅚩徒結反瓜丨從瓜正二音弗香嚴又田結反小瓜也音劣撮取也二音福陟栗反丨音陟甲反俗正莫必反不見貌又貧字從此也二矢部第卅一矢式視反弓丨又正也直也施也陳也誓也同上矬藏禾反丨短也二音增弋射矢也俗丑知反上必兮反下祖兮反丨丨短貌失羊七羊二反傷也二同於盈反呼官反俗音胡上聲矯居反妄也詐也從手者正三俗音短俗或作古矤正矧今失忍反詞也况也長也五䂔刑頂反小貌也二於巳反短貌也矲上薄買反下苦騃反丨丨短貌也去聲音智上兵吠反下牛吠反丨丨短小貌也俗音患入聲䂐竹律反短貌也又知劣反矱王縳反黍部第卅二黍今黍正舒吕反説文云孔子曰丨可以為酒故從禾入水也二正黐今丑知反黏也所以捕鳥也二黏正黏今女廉反相著固合也二古文音胡今作黏也音誅黏貌或作正郎奚反衆也又姓又力脂反二音香上聲井弭白賣二反黍屬也􅭓正今音汝丨黏也二音謹黏黍貌去阮反黏貌今正苦典苦見二反穄別名也二䵜上奴董反下力延反丨丨果子多也去聲所賣反不黏貌入聲䵒俗䵒正尼質反膠黏也二正䵗今蒲北反黍豆潰葉也又符逼反二俗正竹益反黏也二蒲結反正作馝大香也部第卅三郎古反丨薄也醎丨也音咸苦也不淡也古文同上古今才何反鹽曰醎丨二竹咸反味七廉反水和鹽又古斬反也音懷戎狄鹽也乙懷反鹽也亦作字音溫戎狄云鹽也音消煎鹽音矜苦也上聲古斬反也也胡朗反鹽澤也薄犬反蜀人呼鹽也去聲在細反也同􅟍倉奏反南夷名鹽也入聲音尺狩也又或音魯音接九部第卅四俗正許交反虎聲也二厹厹音求地名下又人久反獸迹足蹂地之處也二音兼音求俗烏光反正作訄丘求二音迫也俗正丸而二音丸屬也二􅠤渠追反鍾丨辟惡也俗馗正渠追反道也二音干股也烏光反香嚴又音注上聲俗口反正作檾野死草也俗時勇反足丨病也正作字古雅皮玉爵也二同俗丨正羊主反量也二斢㪹上天口反下郎斗反丨丨兵奪人物也去聲或作斣今都豆反亂也又角力走也又物之俱等也二入聲俗正音角量也平木斛也二音的量也苦洽反丨斫部第卅七舒吕反雀丨切韻小獸名善為盜易曰艮為丨也正今音離小鼠相銜行也二音終豹文鼠也正今音兮丨鼠也又甘口鼠所食之物至盡不痛也二音唐丨鼠一月三易腸也音煩丨鼠音錐鼠名上音精下音劬丨丨小鼠也鼮音亭丨似鼠豹文音斯丨鼠通􅤜今胡南反似鼠旡耳也二鼯音吾似鼠上聲正今房粉反地中行丨鼠也又扶文扶門二反二鼴音偃丨鼠似鼠形大如牛好偃河而飲水也􅴄音耳鼠耳而勇反丨鼠也音栁似鼠而大去聲二俗􅥨正子峻反石鼠出蜀中毛可為筆三鼬余救反蟲名似鼠余救反鼠屬鼤而問鼠名入聲驅正今音博丨也二䶅音洛鼠名也陀骨反鳥鼠同穴其鳥曰鵌其鼠曰丨丨如鼠而短尾也鵌余徒二音鼫音石丨鼠螻蛄也䶂的酌二音鼠名又才藥反鼠似兔而小也胡狄反名也益厄二音鼠屬也部第卅八許兩反獻也祭也臨也向也歆也又奉上也二同章輪常輪二反二俗通正都昆反迫也又姓四俗正都昆反器似甌瓿二舊藏作鶉常倫反宜利反蘇浪反亡也二入聲俗歰正所立反不滑也從四止與澀同二􅵋必亦反跛也與躄同所立反枲部第􅞀一枲息里反麻有子曰丨無子曰苴也苴音七余反俗正子侯反麻幹也二昌真之忍二反纑也即由反聚也又束枲也郎到反麻莖大也渠眷反緣鞾縫也音代直質反帆索也子部第􅞀二孳子之反丨息也孖子之反雙也孡古文他哀反今作胎孜音兹厚也亦篤愛也孥音奴妻丨也孯二俗苦間反正作掔同也俗音齊從糾二音嬰於盈反孩兒也上聲娩免晚二音子母相解丨身也二或作孴正擬耀二音多盛貌也三古文音好玉篇音躰保小兒也子古文音子敘順二音音子去聲俗正今而遇反少小幼稚也又生也又姓三古文音季竹用反俗蒼反正作美女貌俗許既反正作息也孠音寺孨士戀反謹也又立反戢丨聚貌音阻立反同上郭氏又音啾㝂音制蝗子也音既玉篇丑證反川也香嚴音孔音字入聲俗通孛正沒蒲昧二反丨星也三孹俗博厄反正作擘分丨也鼓部第􅞀三鼓通鼓今鼓正公戶反鍾丨也字從􅠭音叨從皮者非也三於巾反鼓聲也正今音同鼓聲也二或作瓦器瓶也三徒含反瓦罌屬也與壜同下江反罌屬也同上古今音盧瓦器也二音浮小缶也音雷樽丨酒器也音尊酒器也音零似瓶有耳音崔玉篇器也香嚴素回反俗正音刑酒器也其形似酒鍾二同音疏於容反汲器也音盧瓦器也革鞋反古今音由瓦器也二疾資反瓦器也與瓷同上聲或作張吕反盛米器也之酉反器也徒啓反器也香嚴音提今芳武反弓把巾也玉篇子乳反香嚴同上去聲音貫汲水器也二俗正呼嫁反孔丨破裂也三時戰反器緣也呼貢反孔丨也都念反音聖入聲苦恱反少也也破也古的反吹丨也老部第􅞀六呼昆反也音老􅫎二音陷丨也三阱口冷徂醒二反丨涏𤌌俗正烏回反又音營二古文𥘉向反𥘉也始也懲也音澄必亦反理也古反數也喜部第􅞀八囏皆古文古間反丨難今作艱四古文奴干奴案二反今作難丨昜艱丨也嚭俗匹鄙反正作嚭大也俗乙䔬反正作溫柔美大也古部第􅞀九俗辜正音孤罪也負也二古文同上俗居陵反古文音敦嘏古雅反大也福也逺也隨函云誤合作方蹬反束棺下之二二古文音克勝也能也乃部第五十通戶圭反持也提也二俗戶圭許圭二反正作觽角錐也俗子泉反又戶圭反俗正丁果反木垂貌二㚉音古多債利也二俗古孕今羊證反懷丨也四章刃反二耐乃二音鼎大者曰丨也俗音勢俗普擊反正作劈剖裂也音力俗音卓里部第五十一俗正里之反福也又理也二干求反與同結病也二俗烏兮反正作水黑也俗音擎正作黥俗烏間反正作黑色也音亡俗巨炎反正作淺黑色音毗狸里二音俗烏奚反美石黑色也俗於糾反俗七感反正作俗都感反正作垢黑俗烏感反正作黭丨黮二力巳反時證反音坎陷二音坈穽也音迷丨似龜不中食音麻子奚反舁音余對舉也舀羊小反也抒水也二舅渠久反母之兄弟也亦夫之父也又姓䑗徒朗反春也待米精也持尓反居許反共輿貌也之睡反杵擊也之睡反杵臼也䑔二俗正音伐舂米又芳廢反䑗也三音昨穿丨也二同匹各反舂也玉篇又音插音昔履也又古文鵲字亦人姓也部第五十六音蛇又禃葛反音蛇又舊藏作馳在續髙僧傳第七卷色弋支羊氏二反卑也反丁也反足也反并也反俗音舐成二反二比部第五十七音毗小籠屬也二同音勞二同音毗丨齊名音卑是部第五十八相承歸燥二音息淺反丨寡也匙正俗是支反丨筯也二􅬾是支反群飛貌也韙于鬼反是也俗正他禮反撗首杖名二㼵音弟小盆也音取鶗徒了反之日反二首部第五十九與之反與頤同丨養也又也音專丨斷首也俗䭭正音首人初産子也二渠追反丨龍又州名亦獸名似牛一足無角聲如雷皮可為鼓也二俗古文苦禮反今作也首至地也三俗馘正音截耳也又獲也或作聝二俗音甫正作果部第六十郎果胡果二反二夥胡果反楚人云多又五果反五果反又同上二初瓦反下又所瓦反二側巧反龍手鑑上聲卷第二
