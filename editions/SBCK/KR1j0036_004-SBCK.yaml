又古縣名又姓鄨并列必􅀕二反縣名也許及反地名二俗正丘逆反人姓三古盍反地名鄴音業縣名又姓郏古洽反丨地名又丨城縣又姓而蜀反郟丨地名在河南音􅁻丨城山名􅞣音弗人姓亦郡名音􅀂地名五各反囯名又姓古文音郛祥亦反郷名鄚音莫縣名音葛郷名五各反囯名与鄂同鄐許六反􅀳邑名鄜音鹿地名又芳無反丨州名也邮笛由二音郷名亭名音七地名也郃音合丨陽縣名又姓足部第十二趺二俗跗正甫無反足上也又符遇反三跟剛恩反足後曰丨足容反丨迹也踰俗踰正与朱反度也越也二蹊音􅀆丨徑也七何反丨趺也跳音徒結反䟭二俗通古跳正徒聊反躍也踉也踴也上也又去聲五二俗丑反又音容躇上音紬下音除丨丨猶豫躑躅也俗羗遥反􅢶俗正音存踞坐也二踟音池丨蹰也跦或作正蹰今音厨踟丨猶豫行不進㒵也三䠆音長丨跪拜也著地也跰部田反丨足病也䟓丑庚􅃙貞中三反皆跉丨行不正也又細長㒵跉吕貞反丨䟓也又郎丁反亦行不正㒵趻俗士今反去竒反脚跛也又居綺反俗音㽞踡巨貟反丨不伸也汝羊汝兩二反丨丨疾行也二或作正丁年反頓什也三三俗音唐正作踢失踞也又丨䟮頓伏㒵也俗同上或作今七羊反行㒵也又敬也集也冝也止也動也二俗音􅥟俗力貟反俗五髙反蹣蒲官母官二反丨􅘐跛行㒵也􅦪􅘐三俗正今蘇于反蹣丨行㒵也五跔俱劬二音手足衆也俗音踈䟧音田踏地聲也䟞俗布門􅀄交二反俗音皆蹁布玄反行不正㒵又部田反丨躚舞㒵二俗或作正音仙舞㒵四俗烏加反俗音􅁜俗音蹥俗運聮二音俗徒彫徒加三反或作正􅾳今音緾脚所踐䖏也切韻又日月行也三俗音賔二正蹪今杜回反躓仆也二􅋸音陁蹉丨也􅽻俗音撗俗音科䠮俗音騰俗呼剛反俗星􅄺二音俗式車反正作賖俗良除反蹖書容反丨蹋也躘蹱上音龍下傭鍾二音小兒行㒵音邊足趾不正踷俗丑加反跛也俗部迷反蹌七羊反和鳴也俗䠧正直加反丨跱行難㒵又丑加反二胡郎反獸迹也与迒同二俗通古蹄今音啼丨足也五俗音旬俗蹻正起喬其畧二反舉足髙也二躋子􅀆子計二反昇也登也踑二俗居之反正作基本也跤苦交反近足細䖏脛骨也􅕭或作今音毫樂名也二踚音倫行也俗音羗二俗音良俗音韋俗蹂正耳由人乆二反丨踐也二􅏳舊蔵作躝躝音閑踰也二踃蘇凋反跳也俗正昨含反止也二跆徒哀反踏丨連手唱歌也􅘠疋胡反馬跌跡也又薄胡反俗音昆俗張由反􅫯音煩足有文也俗丘言反音徒俗音􅁳二上五禾反下徒禾反丨丨大跛也苦江反蹋地聲音匡丨也跜上渠追反下音尼丨丨梁拱開一曰行踐㒵也䠬經音義作􅫌登鐙二音失卧也極也在别譯阿含經第二十九音吒跧莊貟反丨伏屈蹴也渠追反左脛曲也䠍胡加反脚下也或作趽今音方趼也又音傍脚脛曲也二䠙音傍踉丨也趼通正五堅反獸跡又五見反丨骨也二跎音陁蹉丨音煩熊掌也七廵反退也踉音郎丨䠙行㒵又音良跳丨也二俗或作正昨何反踏也四或作正測鳩反獸跡也二通䟘正音剛肆伸脛也二礶巨貟反曲脊行也一曰曲脚上聲足也跙徐吕反行不進㒵也䠄他典反跡也亦行㒵二同於逺反軆屈也跣蘇典反丨足以足櫬地也蹆俗徒罪反俗或作力稔反正作􅅒二俗音几或作正丘弭反舉足也又窺癸反半歩也二丘弭反丨開足㒵也踽丘雨反獨行㒵俗子尹反􅰟俗魚撿反二俗㡳帝二音距其吕反鷄丨也跈正奴典徒典二反蹈丨又女展反止也二蹍女展反􅌃也􅂂也跓直主反勇足也女尓反脚破也又同跈䠪他短反行速也䠉俗烏板反二二俗音擾俗初瓦反又音侯俗余兩反俗他果反俗在酒反以冉反疾行㒵踳尺准反丨駮相乖舛也踓千水反蹴也又以水反走也子礼反走也俗音走俗音䎡丘弭去智二反踶丨与􅉥同跓俗張主反二俗正渠几反拜也䠆丨也三音氏積聚也正䠅俗苦本反豕足也二音母丨偶山名跁傍下白嫁二反丨跒短人也通跐正音比蹈也履也又音紫行㒵又側氏阻買二反二人善奴典二反躁丨又踐也續也執也行㒵也䟫昌兩反踞也又音尚跒口下反跁丨行㒵也俗徒礼反二俗普火反踸丑甚反丨踔行無常㒵也踝胡瓦反在足兩側髙骨也踹舡䎡反丨脛膓也二容腫反丨上也躍也二蹔慈染反進也又俗音慈濫反正作暫也俗蹇正九輦反跛也又姓又居偃反卦名也二俗音我跛布火反足丨也二俗䟼正音武踐也履也三踐前剪反循也􅂂也䟖誤趾正音止足也二俗蹝躧二正所綺所􅀉二反徐行㒵又舞􅂂也三跂䟣二俗正丘弭去智二反垂足也玉篇又舉一足也又去竒反丨噐也三跪渠委去委二反䠆丨亦作丨拜也二俗跱正直里反行難進也三去聲刑定反脚丨也蹬音鄧蹭丨也又音鐙丨􅂂也階級也道也蹈音盗踐也行也􅂂也俗躁正祖告反動也􅇥也或作亦通疾也二丁佐反小兒行也又當盖反倒也䠦三俗躓正陟利反蹋也玉篇音智丨頓四䠔􆈈俗音蓫深也二踞居御反􅀝物垂足實坐也二俗今正苦化反越也兩股間也又苦瓦反腰丨也又平聲吴人云坐又音桍踞也四俗通正音帝蹋也又俗胡故反三隨凾音帝須丨天名䟝音逺索彄也彄音苦侯反俗䠊正扶反刖足也二䟔芳付反行急又仆也踔知教反猿跳也又􅃙敎􅃙角二反跛行也䠒二俗或作胡故反或上聲丨跪􅀟膝者地三俗跘正基應二師音平患反江淮間謂丨坐即開膝坐也玉篇者盤丨足也二俗去智反正作􅉥俗音俗音跱􅭣音務長跪又拜也俗正昌焰反馬􅇥㒵也二俗音計俗言句反胡爱反行㒵也疋詣反玉篇行也居衛反丨洩苦也䟺音貝步行㒵又蒲盖反丨行不正也踒烏卧反跣丨也吉䠣正息絹反足也􅂿也又也二躤慈夜反踐也俗徒困反俗苦嫁反正作髂腰丨巨㓜反丨醜行之㒵二同丘謬反丨蹌行㒵也又香仲反跳走也䠢音夢丨􅸱疲行㒵也􅸱香仲反苦定反一足跳行也躪二正躙蹸二今浪力反蹂丨踐也四俗郎佐反俗音療胡困于問二反􅯓音次跇丑例反丨踰跣躍也又音曳四同蹛音帶踶也踶音弟蹋也之刃反足動也俗苦故反丑丗反躍㒵二或作正疋妙疋行䡖㒵也三俗音塞入聲蒲未反行㒵也䟹音劣蹶丨跳踉也誤正他逹反足趺也二踥子獵反行㒵也又音妾良渉反踐也踙通踂正尼􅂺反足不相過也二䠈俗正他骨反丨前不進也又丨蹋二勒􅃿反丨也蹃女白反蹈也音若足文音牒小走聲趵百角反足擊也踾普逼反蹋地聲􅹍都合反跛行也􅨬都合反丨趿􅀛行又他合徒合二反跳也趿蘇合反進足也舊蔵作蹀音牒蒲結反丨行㒵也䠟音徐步也跲刼甲二音却行也又音笈丨丨行也趹古穴反足痛也音􅁲足􅃌間相著也蹜音縮烏鵲飛其掌丨在腹下紀力反私盍反丨行㒵也音藥跳也􅵖跿二俗徒各反丨跣足㒵二俗踛正音大翹丨也三俗古麦反俗接刼二音跊俗音未俗倉未反俗正直列丑列二反二踘居六反困丨踏踀七玉反絆足也許月反走㒵徒合反俗倉結反俗剌畧二音俗奴叶反俗音疾俗音遏俗音瑟俗巨音反􅀂覓古覓二反踞㒵也一䟾陟劣反跳也跕音恬丨又丁叶反堕落也二俗蒲北反伏也仆也􅝌二俗蒲結反躡女􅂺反登也履也蹈也􅇥也慈術反獨也駭也蹋也又摧丨也躑呈炙反丨躅行不進也蹢同上又音的蹄也詩云有豕白丨也躅直玉反躑丨也二躍音藥迅也跳也進也止也蹐音積丨地小歩也蹟資昔反不修道丨也二俗跋正蒲末反丨足行㒵也又也三俗知革反俗踧正子六反丨踖行而謹敬也又徒的反丨丨周道也二俗同上踿七俗正子六反迫也􅇥也近也八字俗躃正蒲擊反倒也又俗普擊反二躄必益反跛也行不正也又俗普亦房亦二反俗跖一正音􅃗足􅂂踐也三五俗通蹶正居月反失也走也速也嘉也又僵仆也又居衛反丨􅂥苦也七踣蒲北反斃也到也又作仆又匹候反誤二俗陟格反正作開張也三俗於入反跡音積足丨也通正􅰭今徒叶反丨􅉜行不穏也三􅉜蘇叶反􅰭丨也正踖今音積踧丨敬㒵也又音廗踐也二蹵俗蹴正七六反丨蹋也二䟣丑律反獸跡也又丨賜獸名左右有首也他歴反也又音唐丨䟮頓㐲㒵也三俗音揬烏合口合二反跛丨也音拂跳也舊蔵作踱音鐸踱徒合反跣足蹋地也又丑畧反与疋同咥丨乍前乍却也正俗渠玉反踡丨也又曲也從也俛也二跮丑栗反丨也又丑利反忿戾也躒音歴速迹也又音洛人名輔丨也􅦪俗除列反音甲行㒵也俗奴逹反俗倉族反俗蒲反俗音發疾反足疾也音必跛也又行止也俗音歴俗正七玉反迫也二􅤳俗音逐俗許六丑八二反踋俗音脚俗羊反俗跑正音雹秦言蹴也二許月反走㒵也音義禹厥反俗音靂姉未反丨蹙行㒵或作䟩今去約反歩丨上又五髙反二俗正音兀丨跀也二跀音月玉篇云􅞨丨断足刑也躠音跋丨行不正㒵蹗䟿二音鹿行㒵下又音録㳟丨也二俗正渠勿反足刃也玉篇強也二蒲各反丨􅌃也祥亦反丨踐躩居􅅞丘􅅞丘碧三反切韻盤避㒵玉篇屈足也舊蔵作蹹徒合反齧丨在六反集三他合反行甚也俗踏正他合反丨著地也二蹋蹹徒合反齧也又踐也履也二跾式六反走疾也長也俗徒合反跌徒結反部第十三女厄反疾也又士莊反亦病也疲音皮勞也倦也極也力中反固疾也殘丨病也三俱通丁年反丨狂病也二癇􅻁音閑瘨病也二俗正痕上二歩官反瘡丨也下戸恩反瘢丨也俗疣正音尤瘡也二
