徂感二反大魚也䲃音早魚名似鯉雞足鱤音感魚名音舅鯞之九反鱖丨魚名也䱋音拱鯤魚子也胡老反大鰕也音礼同鱧魚名也俗直稔反正作魚名似鰕苦管反魚名鮑薄巧反丨魚又姓䲒胡買反鮦魚也去聲鱒才悶友魚也鮜音后丨魚名也鱠古外反魚細切作丨也音謂魚似虵四足食魚也䰺二俗魪正音戒魚名三魡多反玉篇取魚也䱴或作䱎今古鄧反魚名又平聲二鮒音附魚名音頼魚名䱤音陷魚名楊故反䰽音貝魚名食之煞人也鮇音未魚名音至魚名鱀渠記反魚名正鮬今音歩魚名又苦孤反婢妄魚名二鱟音候魚名形如車文青黒色十二足似蟹長五六尺子如麻子􅧖烏到反魚名也音化魚名鰶音祭魚名而用反魚名入聲俗􅣀正并列反蕨菜也二正通䱜今倉各反魚名也三音録魚名也鱳洛鹿二音縣名也䱅音末魚名也莫結反丨魛今鮆魚也古正今音列魛魚也名鱴魛今鮆魚也三鮩毗必反魚名也又蒲杏反鮅音必鱒魚也又毗必反􅾿呼盍反丨魚名也鮥盧各五格二反魚名也俗正橫麦反魚名二音格海魚以鯾肥美鮚渠乙反􅑕也魻俗音甲俗音竭鱷二正鰐今五各反魚名三􅠧鯽資昔反魚名下又子力反二同鰿二革資昔二反尔疋云紫貝也俗胡谷反正作斛丨斗也正今古厄反丨魚名二俗䱮通正五陌反􅱚丨魚名三音必魚名又新蔵作鱓音善亦魚名也魠音託魚名魚名音業魚盛也二或作魶今音納丨似鼈無甲有尾口在腹下二鰨他盍反魚名似鮎四足也或作䱙正失竹反魚名上又俗音由正作䱔䱔丨小魚二誤同上鯜音妾魚名鱖居月居衛二反大口細鱗有班文又曰婢魚鰼音習魚名䱡居六反魚名有兩乳也鰂鱡昨則反鰞丨魚也一曰河伯也二同鮊音白魚名鰒蒲魚反土莽魚名好食也鮯古合反魚名六足鳥尾也徒活反魚名音叶魼他盍反比目魚別名也下又去魚反二同䱻戸八反魚名鳥翼聲如鴛鴦也鱊聿述二音丨䱁魚也䱁音歩鱍北末反魚棹尾也鯥音六魚名似牛虵尾鱐音宿魚腊也䰴音訖魚逰也俗䰲正烏八反䱀丨魚也二通正子聿反䱙鮪別名也二鯣羊亦反丨鱺也傍各反魚似鯉千日也俗鰪正安盍反丨鱂魚名二鮿音輒婢丨魚即青衣魚也䱒扵業反塩漬魚也魳子荅反魚名誤舊蔵作鰐五各反魚名舊蔵作俗音竭戈部第卅六俗在郎作郎二反正作蔵字栽音灾種植也㦵陟朱反戈也口甘反煞也刾也戡口甘反勝也克也又張甚反巾斫也俗正音干丨盾也二烖古文音灾戵其俱反戰丨㦸属也子㢘反丨盡也二俗正子㢘反也銳意也又持戈也二韯息㢘反丨細又山韭也音析王丨戣渠追反丨兵噐㦸属戧七良反傷也戔昨干反傷也賤也又丨丨束帛也莫侯反㦸也同矛二音三音縁上聲俗古文余隴反猛也踊也二亡范反刃也戭音演長槍又檮丨八元名音我音剪福祥也尺尹反丨岀也音我去聲戯今戲正許智反丨謔也弄也兵也施也歇也又姓又平聲下又古文呼字二戍傷注反遏也止也徒人荷戈也戴都愛反頂丨也又姓二俗今式志反大逆也臣虐其君目丨下煞上也或作煞三胾側吏反大臠也蛓七賜反丨毛虫也俗女利反音謝古文扵吏反楚絳反捍舩木也戙徒弄反舩䌫所繋木也昌志反赤土㒵䵧才代反染丨也音穢入聲側略反同斮斬也音格戰也㦻古文音習今作襲因也及也古文或二音戜古文國字戚親也慼倉歴反憂也懼也病也二􅑯俗他德反戮音六刑丨也煞也辱也㦸京逆反戈丨也俗音摑正作字阻立反丨斂止衆也㦶徒結反常也利也又國名俗正音或水流也二二古文蒲没反丨逆悪乱也王勿反美人吹角也直口反大也俗古文音軄二同戝音賊戔丨虚用財物也戞古八反揩也常也礼也俗音摑音識音國二音滅囗部第卅七囗雨非反丨見大物失聲也又文字音義云回也象圍䢌之形也囹音令丨圄也圊音青厠也團徒官反圎也圗三俗圖正音徒与啚同釋名云謀計議度也四舊蔵作一回字园五丸反圎削也与同落官反圉丨圎也音雷音因烏侯反俗字音誇音烏音酬音由火玄似泉二反䂓也俗去貟反水丨俗㘥正音由鹿媒二囮五禾反烏者媒俗音乖俗扵元反㘟音䆫川韻云孔穴也俗囦正烏玄反丨深也又水猪也二俗音囚圌巿縁反倉也圜户閞反丨圍也又音貟囷去倫反廩也圎倉曰丨又谷倫立殞渠殞三反囩羽巾爲贇二反田十二頃也又回也圁音銀丨陽縣名也困剛二音上聲圉養馬也又姓俗圄正音語囹丨周時獄名反徒損反小廪也古文起字倉敢𥘉朕二反音乳古文古字二俗音繞􆆻其九反俗三今居永反光也四􆉄吉永反圃𥙷布二音園丨種菜曰丨也去聲圂胡困反厠也又豕所居處也音倦圈求願反邑名也又上聲欄丨也亦姓徒㱢反砰石聲囿音又園丨也又畜魚鱉之処也又于目反入聲音質苦角反革聲音合于厥反囻囯五俗或作古或反邦囯也正作國字六㘝或作正女甲反手取物也又女減反二􅕫乙鎋反駱駞鳴也音莫俗㘠正音逼二圔音押丨穴也香嚴又音押二俗音益圛音亦回行也一曰丨丨者叔雲半有半旡也于厥反二韋部第卅八俗正他刀反蔵也䧟也寛也二䪗戸加反履跟後帖也音因䪜昌占反屏也又昌焰反鞍小障泥也虚嚴反胡𬒳也古侯苦侯二反射丨捍也三同口云方吻二反他刀反正作韜上聲韖人九反車軔軔音刃􅰜于鬼反大風皃韡于鬼反華㒵也韞扵粉反丨犢犢音獨呼典反在背曰丨在胷靷在腹曰鞅在足曰絆也去聲韒息妙反刀室也五俗通韛正蒲拜反丨囊吹火具也七求位反繡韋也或作二韔丑亮反弓衣也韌音刃丨也二俗音泳永旱韗音運理鼔工也同䩵又休願反或作韏正去願反曲也又革中断也又音倦縁鞾縫也二許願反作鼓工也䪐音秘弓絏也絏音泄入聲無發反足衣也与同蘇合先立二反小兒履也与靸同韣燭獨蜀三音皆弓衣也韎