  text: 龍龕手鑑入聲卷第四釋行均字廣濟集木莫􅁲第一竹張六第二系莫狄第三肉如六第四目莫第五日人質第六白傍陌第七玉魚欲第八石常􅃗第九革古核第十邑於汲第十一足即玉第十二疒尼厄第十三骨古忽第十四頁胡結第十五􅐫略第十六彳丑亦第十七食乗力第十八麥莫獲第十九穴胡决第二十角古岳第卄一歹五割第卄二力良直第卄三立良入第卄四鹿盧谷第卄五兀五忽第卄六色所力第卄七赤昌石第卄八一於悉第卄九谷古鹿第三十弋羊織第卅一卄人執第卅二入人執第卅三攴普木第卅四黒呼北第卅五舌食列第卅六鬲郎擊第卅七鬲郎擊第卅八學胡角第卅九莫狄第四十出昌律第􅞀一十時入第􅞀二卩子結第􅞀三血呼决第􅞀四􅁲博木第􅞀五音得車丨也又宅庚反桂也又􅐫庚反又去聲俗槗正橋今渠妖反梁也三杝音他丨車也又俗徒可力知二反檎巨今反林丨也㯲俗音同上捉也梣鋤今反青皮木名也枮陟林反鈇丨也斫木質也又俗時任反桑丨也二森所今反多木髙皃也同上長皃也梢所交反枝丨也櫨音盧欂丨柱上木也又木名也音博榣余昭反木名也棆音輪木名也梴􅐫延反木長也柊音終木名㰘桋二木名音夷水噐一名戽斗戽音虎三檬音蒙似槐葉黄㮬烏紅反水丨子果名也桏渠容反柜栁即容七恭息恭咨用四反皆木名松葉栢身出北上也楷音皆木名又古八反􅀕大席也杬音元木名出預章煎其汁蔵果及夘不壞樽音尊酒噐樈音驚鑿栢榰音支丨柱也柱屋之歆也檆古㰇正音衫丨松木下又子廉反玉篇伐也二榵而容反木名似檀也樔鋤交反鳥穴居也又也杓漂標二音北斗柄星也又市􅀂反枰丨棚音水盛箭噐也又薄登薄庚二反棧也閣也􅫩疾移反無丨木一召榆檠音擎所以正弓也又渠敬反丨子疊名櫻烏耕反丨桃杭胡郎反州名音表絡絲工隻杉音衫木名似松埋之不朽枇音毗丨杷果木冬花夏熱桄音光梯丨横木也橫音光長安門名巒反蘇和反織具也音斯丨桃山桃也梔音支丨子木實可染黄朾宅耕陟耕二反伐木聲也又徒頂反俗音愁㮎二俗布廽反椯巿縁反木名㰋音頻木名俗音賢正作㭹地名奴當反居幽反髙木名也䍒誤音浮正作􅇠也框去王反棺門也俗正音劉木也二小樹藂芷也樼二或作正音臻丨子小栗也下又士臻反木藂生也三士臻反木藂生日丨与三同柤側加反煎藥餘也又茶脚也樝側加反似梨而醋也或作柤椸音移衣架也俗通樛正居幽反木枝下垂者也枚莫豊枚也亦姓桅五回反舩上丨竿也又居委反短矛也橰音髙丨也余廉反木名余廉反歩丨長廊也莫耕反屋棟也与甍同棼枎文反椱屋棟也枌枎文反白榆木名也俗楠二正音􅀯木名也三汝塩反梅也子如杏而醋俗槄正􅁟刀反水名即今山秋是也二􅒎音义丨杷田噐也楨音貞木名也又丨幹亦女丨也梳音踈櫛丨也櫛音阻瑟反椿􅃙淪反木名也柯音哥枝丨斧丨也又姓莫經反丨樝梨属醋而且香也橿居良反鋤丨又紫丨木名也俗音因正作禋􅀕也直由反丨木也槐音回木名又姓又音懐俗正音懐木名尓疋云小而靑曰槐葉大而黒曰丨也二楩歩連反木名也櫰公回反木名如棠而圎實如木􅀲食之多力也又音懐彬筆旻反文皃椒正􅎛今音焦木名又姓二楸音秋木名楒音思相丨木名梫子林反木名火玄反椀属也玉篇音古玄反椀謂之丨音箱丨木皮中有丨白米樢之可為􅔇也又俗音讓楇玉篇過媧二音木名又車釭盛噐也枰音平丨仲木名又博􅈰又或音枋音方木名也朷音刀木心也棬丘貟反屈木爲丨樁書容反橦也又陟江反橛也橑音聊盖骨也又音老屋丨簾前木也一曰欄橦音童木名花可為布又鍾幢二音木名也槦音容箭笴也二或作榕今通切韻音松梓通玉篇音容木名也三梥古文松字俗正音胡名下尖上大也二或作棇正忩二音尖頭檐也二杠音江旌旗餙也一曰床前横椏音鴉木也或作許冝反正作杓丨也㭜音戎木名査二或作楂正鋤加反水中浮木也又姓上豆醋也三音􅄹柱也孔子曰夢奠两丨是也檉􅐫貞反木名􅀃文云楊丨河栁也或作正楚尤反板木不平也二􅖗音茶春蔵草葉可以為飲曰丨槯昨回反木名堪作杖也㮴蘇􅇜反舩名枆或作正音毛冬桃也二通桃正徒刀反果名又姓二櫅祖奚反丨榆堪作車轂尓疋云白梡胡官反木名岀蒼梧子可食玉篇又音完義同又苦管反噐名也或作橝正徒舎反木名􅁅可染也又徒􅀧反屋柅名也柅音尼二所冝郎計二反梁棟别名也又音礼小舩也許憍反玄丨星名樘直庚反􅀃又云柱也亦丨觸也柁音陁又徒可反棊正音其同園丨也㭿五郎反飛丨斜桷也桮音盃棸音紬妙也亦上聲櫜音髙輡也百車上囊歩田反木名也桁胡郎反丨也上聲柂徒可反正舩木也又音移木名枕章荏反又之任反丨席也枉於徃反丨屈也濫也梗音耿直也又藥名也於蟻反丨柅也又於離反木名也柅女蟻反椅丨也又尼你二音亦木名也棍胡本反木名也音義云古本反閞線丨子也棓歩項反大杖也又音浮又俗蒲交反棒歩項反打也杻音􅐫丨械也枳音紙木名又居紙反木名似橘也音􅊲木枯乾也或作薧二同音􅊲木名也音丨栁噐也古文音栁小楊也朽休九反腐也爛也枸俱雨反木名子可食江南謂之木蜜䏻薄酒味上烏可反下奴可反丨丨木四枝乗盛皃也檁力稔反舎也机居履反木丨小案之属也梱苦本反門限橜也又俗戸昆反栱居恐反斗丨也板布綰反平闕木也樐古櫓正音魯望楼別名也又木名二梐傍礼反丨枑行馬也又方奚反榜北朗反木片也又俗白盲反笞也杂五俗朶二正丁果反水上垂皃七杪弥小反梢也木末也櫸木名柜音舉栁也二柿音士果木椑丨也梓音子木名楸属梠音吕桶端木也亦名連綿亦名雀丨屋丨屋檐皆方言異也􅂎音起丨梓木名又苟丨也亦姓神吕反橡也又直吕反織丨也又除也取也挹也後也岀也今正音礼大舩名二椀烏管反噐物也或作正今輕礼反兵欄也三棧士産反丨閣也亦木道也又姓桶他孔徒孔二反木丨噐也栐音永木可為笏也江西随凾音牛紀五代二反苦减反不安也㦿苦减反牗也一曰小戸􅕠布莾反敎也見郭迻音㮯胡本戸昆二反木未破也楕他果徒果反木噐名也柺古買反老人柱杖也楺人九而由二反屈木也􆁼而兖反丨也又紅藍也以墊丑郢二反丨似杮也􆁽古瓦反老人柱杖也楛音户木名堪作失幹随凾音宛於逺反為衣入裏也楮覩楮二音丨木名也椲于􅀑反木名可屈為盂杍音子工木匠或作梓㯍槳即两反檝属二同誤枓正音斗柱上方木也二樢音鳥欓多朗反木名俗正音早与􅀥同二椇俱雨反枳丨木也梩舊蔵作理在婆須􅁡論音本玉篇根本也音瓦竹几反二子了反木忽髙也但湼二音胡黤反欄丨也二俗垛正徒果反射丨也三檥音蟻幹也附也整舟向岸也与艤同又俗許羈反栩况雨反柞木亦地名槱音酉積木燎以􅀕天也音去聲古候反丨合也架也成也乱也盖也槌直􅀋反蚕丨也又直危反打也橈奴敎反木曲也又如昭反械胡介反噐丨又相丨也楯食閏反兵噐也亦釣丨也楱倉奏反揷也柄彼命反􅁠也柯也本也二枑柢都計反木根也下又都奚反訓同二楦通正許反靴履模丨也又法也二喿蘇到反群鳥聲丨也㮣古愛反平斗木也又量也槪玉篇音同上梪音豆邊丨也又古食噐也又俗音短榭祥夜反臺丨又臺上起屋曰丨音䂊丨樟木名也俗省今蒲拜反韋囊吹火具也三古且反檀木也俗七乱正作㸑棟多貢反屋丨也稳也桴也於靳反棟也􅆃也櫬初近反空棺也楝音練木名也柘之夜反木名亦姓又俗音託櫃求位反丨箧也楴他計反丨杖整髪釵也俗正音俻木名其穂可食也二俗檖正音遂陽丨木名也二樺通俗檴正胡化反木名也下一又胡郭反丨落亦木名也三􅏄芳癈反斫木斥零丨也又方未反蔽也音照梙俗槵正音患無丨木名也二棹直教反舡中橃水木也柾俗柩正渠救反尸丨礼記云在床曰尸在棺曰丨丨之言乆也二榨誤正側嫁反打油具也二檟音價木名枊五浪反繫馬柱也又平聲楙莫候反尓疋云一名木􅀲實如小􅀲味酢可食二俗古浪古郎二反正從手作舁也也二俗同上二俗正音託擊丨三桔音結丨梗也㯓通榻正音塔床丨也二榍木名也先結反木丨也下又古八反櫻桃也二柣直質反門限也又千結反尓疋門閾也閾許逼反核下革反菓中實也榤渠列反鷄栖木也二俗正渠列反夏王名也又菜名三臬五結反門也榅烏没反丨桲菓也桲蒲没反榅丨似樝槲胡谷反木名也橘居聿反菓名也正檄今胡狄反符丨二尺書也二楫通正子葉反舟丨也二接集二音舟丨也櫂音宅方言云小竹木子爲丨子也又濁棹二音二或作正陟革反蚕㭬也又音徳木名也三柷之六昌六二反尓疋云丨州木名也椄即葉反栽丨續木也槒俗音畜正作慉榓音􅁡木丨香樹名也二樚音鹿丨櫨也樀的笛二音屋梠也音結丨槹没水具也棭俗亦夜二音正作掖他括反木丨也音葉薄㒵也􅀄革反村丨也又竪木編以爲之櫝音獨凾也又曰小棺㰌音角以木渡水今呼峉勺是也古文其月反木入土也今作橛樾王伐反樹隂也櫛阻瑟反巾丨也欂􅀘各反丨櫨柱上枅也又平㦸反苦結反丨㓕断絶也櫍音質行刑用斧丨也渠列反有所表識也㭯音􅂺木小葉也㯈或作樕正音速槲丨木也二音宿木名又木㒵誤杓正市若反木丨也二棤音昔皮甲錯也櫟音暦木名柞属又音藥丨陽縣名􅇫音暦馬丨极其􅂺反驢上􅀒板也椱音伏織丨卷繒者張畧反擊也又音筯柞昨作二音木名二同通籌音紬筭也二初尤反酒丨也篅正今市緑反倉丨也二簾力塩反箔丨也簞都干反丨笥小箧也䈥音斤竹名出曰南九真可為弓絃也籘徒能反􅟵生似竹也二籮音羅篩丨也篩音師竹也又丨籮也昨何反籠属也笞音癡捶擊也籢力塩反香丨也与匳同應法師作籢力占反丨鼓也二俗正居其反丨可以取蟣也三䇬昌朱反丨䇿也笙音生樂噐也䇶俗筩正音同竹丨也二􅰣力居反丨䈝竹名􅠚去魚反飰噐也䈝相居反竹名也筇渠容反竹名可為杖也䇯而容反竹頭有文也簫􅂫凋反樂噐編管為之以象鳯翼也舜時作苦回反箭竹名也陟􅀲反馬筞名也汝羊反丨䉛􅜷米竹噐也䉛音郁􅜷音鹿箶音胡丨簏又竹名也音胡程也又音􅀌方也音􅀌竹名也箕音基丨箒也亦作簸也簷音塩與檐同丨楹也䉚莫耕反竹筍也音牌大桴即筏也䈱他刀反牛􅞠也䈲薄官反篾也又北官反捕魚笥也笭箐上音零下音精丨丨小籠也䉁音零竹名也薄經反竹丨也音尸􅁲籌也武巾反竹膚也筣力之反竹名也䈵烏紅反竹盛㒵也竼俗蓬馮二音正作芃䈔或作笳正音加丨簫卷蘆葉吹之也二筬音成丨筐織具也䇸音呈筵也筵音延席也并迷反梳丨也音聊宗廣盛􅁏方竹噐也音聊竹名音盧丨西竹出㑹稽一曰䉫丨亦竹名正音調或作竽正音于丨笙也二扶非反竹名䇞音甘竹名音都竹名䈯音真竹箭也䉑音無黒皮竹也籈音真尓疋云所以鼓也笣許交反竹名又音包䇦於良反音鍾長節竹也篍音秋􅀃文云吹簫也笀音亡正作芒草丨䇾音言大簫籖七亷反竹刾也箊音於竹名丑居反竹篾名也䇨通正薄紅反車軬也音二笗音冬竹名所冝反􅜷也􅜷音禄筲所交反斗丨竹噐也舊經作筌俗丑中反正作草名魯甘反盛物竹噐也簹上音云下音當丨丨竹名也音筕篖上戸郎戸庚二反下音唐丨丨竹笪也音郎車籃一名􅀏丨又音浪竹名也􅀏音替簥居喬反大管也又音橋田噐也音専折竹為卜籌也又音圎竹噐也䈕音匙玉篇笙簧也箯卑連房連二反竹与也通今牋前二