反鳥伏卯也或作毻正他卧他外二反鳥易毛也二毭音豆􅪭罽也上音具下音奈丨丨多毛也㲕郎外力恱二反毛色班也菢經音義作蒲報反鳥伏卵也在增一阿含經第四十九卷入聲俗俗通㲲正徒業反西國毛布也三翕毛三俗毾正他盍反丨㲪毛席也四毩五俗古毱正渠竹反皮毛之丸也七蒲沒反丨毛短也蘇骨反丨也二俗毼正胡毛布也三同上三俗音的二或作鬣正良涉反丨毛長毛也三眊莫角反目少精貌俗音拂八俗即反正作目丨也或作毣今音木思貌一曰毛濕也又莫角反好貌也二㲫蒲木反㲢丨毛領也俗正音栗丨㲨罽毛也二渠勿反鳥短毛也徒木反丨旗也斤部第草三俗音亭機其勒三音縣名亦草名又姓斦語斤反二斤也江西隨函音薪斪其俱反􅓯也音斯上聲俗斷正都管反絶也又徒管反亦絶也截也又都貫反決丨也二斧方武反丨鉞也勒可反力也三俗正音頂三足兩耳亦鎗屬四今正音謹黏土也二古文徒短反去聲古文都貫反上音向下都浪反俗正今北芮楚稅𥘉轄三反斷也三音誓入聲俗斸正􅓯今陟玉反斫也钁也三三俗斫或作斫正竹角反削也亦斫屬也五正斫今側略反斫也又側角反亦斬也二㪾音格擊也斱張略反斫也或作丑格反開也巾部第草四幖俗正布燒反丨幟也二幢濁江反翳也幡也童也其貌童童也希􅛽二俗音希帷于悲反圍也又在旁曰丨也幃音韋香囊也又單帳也幡芳袁反丨幟也帆凡梵二音船上使風慢也帡匹庚反蒲丨正音卑冕也冕音免帤女余反幡巾也音宛幡也是支尺支二反與眂同􅳄音空巾也衣祑也音綿與芇同又音帝幬直由反單帳也􅜳通帉正音芬巾也二􅯋盧甘反先緣長也亦作檻疾陵反裙令俗音群與裙裙同二相居反徂宗反帛丨又布名㠿即移反布名也呼光反蒙掩也音牟幩音墳飾七上聲帑他朗反金帛藏也又音奴􅓍也音皎行縢丨脛布也幌胡廣反帷慢也音三二音草幧子了反首飾也於絞反靴襪丨又去聲音鳥絹丨音虎許偃反蓋也車上慢覆也去聲帊普反大幞也幞音伏帕普嫁反正作怕丨懼也昌志反幡也幖丨也又音試丨方山名帶當蓋反衣丨也又地别名也一㡢莫半反幕也帷也帔披義反衣丨也又芳羈反袋音代盛物丨也幤三俗幣正毗祭反帛也四隨函云合作印字􅽲雖遂反深赤色也幀陟孟反開張盡繒也音帝經音義音帝與同頃丨大名也應法師作同又隨經音武出兜沙經丑例反習也㡂音倒帛餘也二同幆俗去例反正作愒恐人􅍤稅二音佩巾也扶沸反丨隱也莫報反帥所類所律二反佩巾又將丨也入聲幅音福絹邊也正帙今地質反書丨也二帓音末忘也或作亡發反幄於角反大帳也同上幕音莫帷丨也又姓芳勿反韜髮也韜音叨音卓帟音亦小幕曰丨俗或作音亦二􆁑俗正北未反一幅布也又音弗毳也二苦洽反冠丨也帞莫百反頭巾也私列所例二反殘帛也又音雪丨祧花也幘音責冠丨也帹所甲反面衣也胡臘反吹火丨又俗於蓋反古文紀力反同棘陟律反包部第草五包布交反丨包也從曲身貌又音曵古文音旬十曰一丨也匍音蒲丨匐也俗勻正羊巡反齊等均平也二匉訇上普耕反下呼萠反丨丨大聲也下又姓匔音弓謹敬之貌也匑丘弓反音舟啚也七巡反退也音旡或作包今布交反也又姓二音占烏交反目深也俗芻或作正惻于丨豢也又姓豢音患三陶徒刀反飬丨音丨奴也勼居求反聚也音上聲音引勽音抱㔪音魯匐也去聲矛取粅也三音木與鶩同鳬屬玉篇又音佳同隼鳥名俗䂇正女六反利也二許擊反弟也䂆去的反禾部第草七稠直流反穊也衆也多也穊音既三俗正稽今古奚反滯也孝也同也當也畹止也又山名亦姓又音啓五俗稊正地奚反丨子草也三古文同上俗粳正音更稻也或作粳二秸音皆麻禾之稈也與秸同稈古旱也秥二俗女廉反正作煔粳苦剛反米皮也音希丨稠也又俗直利反正作正香字芳氣也稞音科靑丨麥名也又胡瓦反淨也一穰汝羊反禾黍穗餘也落戈反榖積也䅧於鹽於禁二反丨苗之美也一􅏢魯登反廉威又菜名也移二俗或作移正羊支反遺易轉也又姓四俗稴正嫌咸二音不作稻也又禾不二正稹今音真穊也又之忍反緻也亦聚也二穜童重二音丨稑先種後熟也秶俗音資音來丨牟之麥又書吕反牟音牟年音年穀熟曰丨俗秠正音丕黑黍也二稃芳無反榖皮穮俗筆苗反音奔古玄反麥也香音香䆅疾資反積禾也音營俗音俱音行或作正徒干反禾也二穘饒繞二音音宛俗正鋤針反禾欲秀也二䅡音蘇隨國云合是稱字經文名丨丗界二字舊藏作科秢舊藏作襟渠攴反適也音徒穗也稂音郎草名似莠䅝音空稱稈也稓而容反穠丨也穠女容反花木厚也又而容反𦔌渠脂反麥下種也二秦匠津反國名又禾名二二或作䅳正士于反欀三䄻桃叨二音稻也二俗稵正子之反禾生貌二俗或作正音支穗也又音知禾再生也三俗正渠容反稰也又渠隴反穫也二稰相居反落也又私吕反熟穫也同上秛普冝反禾租也三俗二正布玄反丨豆也五秙音胡正作黏力鹽反禾名署魚反署預又他吳他魯二反丨稻也穲音離丨黍行列也䅻音離丨丨黍稷垂也秜力之反稻死來年更生也䅊宅加反開張也又縣名北萌反音封匹人反香氣也上聲稟彼錦反以榖賜人也與也穚二俗穚正居表反禾秀也三秆稈古旱反禾莖也二同稍所爪反漸少也向盡也又所教反穔俗穬正古猛反榖芒也又不熟也二稻稻音道有芒穀也粳也三稔如審反歲熟也又年也秕音比粳丨也秲直里反稻名丨禾又音種丨也二或作䆏今浮鬼抶畏三反紫莖稻不黏也三音狗人九反禾正今丁果反禾垂貌又音端二秒今秒二或作正音眇禾芒也四魚紀反禾盛貌䅎音酉稛苦本反成熟也音美正䬿今尾味二音粥也二音社音吕自生稻也二古文音補𢆚古典反小束也玉篇云禾十把也亦小束也二秬其吕反丨黑黍二俗音似正作耜耒丨二俗䄪正音鳥禾穗垂貌三將几反千億也又丨㷌縣名芳尾反穗貌也䆀莫亥莫代二反禾傷雨也穥音與方善反䅎音酉穩俗正烏本反持榖聚又安丨也二穖音幾禾盛也二音受去聲穢於吠反丨惡也耗呼到反減也少也蒲賣反稻也似稻而別也稼音嫁丨穡也音快麁粳也二俗稚正直利反晚禾也三穗穟音遂禾秀也二同􅣴音遂禾稷成貌也稚直利反晚也小也幼丨也秨祚二音禾嫁動之貌也穧子計在詣二反穫也又刈禾數也音步俗音弄相承又敗反稧胡計反丨事也也或作正奴卧反秫多也二上古文授字什也又姓之順反束桿也䅑思纍反禾四把也又於偽反積也䅜是偽反小積也乂居企反強貌穛􅧎子笑反禾先熟下又物縮小也又皮角反熟禾也二秺秅丁故反禾丨束也又縣名二同丑亮反齋丨也二同其季反魚祭反二同卑正匹正二反作弄反稚致二音古文音季音祭黍丨入聲俗穡正音色稼丨也二􅼥古俗稷正音即五榖之惣名也三穫胡郭反刈也稸丑六反積也聚也又許竹反水菜也與蓄同䄶蒲沒反丨神禾秀不成聚向上貌也又平密反丨禾重生也阻瑟反䄶丨也通稡正則骨反䄶丨也二䅥吾列反長禾也音葛長禾也或作葛子二音禾長也今作䅥二字皮逼反蒲也古文俗正音未丨馬也又俗音米二莫結反禾也秫音述黏榖也俗正蒲禾反丨也二普木反丨草生穊也古文王字􅿖下沒反粳丨米之堅者眷不破也又胡結反居六反稙音陟早種禾也或作穋正音六黃丨稻名二稑音六穜丨後種先熟也稱俗正蒲結反禾香也二俗秳正音活春榖不潰也二秩直質反積也次也當也以官相次也秸古八反丨稿音側稫丨禾密蒲也二同稫普逼反丨稄經音義切居竭反長禾也俗穱正側角反稻處種也二秷陟栗丁結二反古文稷字音即五榖惣名䄷音石説文云百二十斤曰丨經自切烏合反􅮘苦沃反禾熟也又古得反䅵古沃反禾皮也又地名又之若反五榖皮也䄸音粕也或作秝正音歷稀踈也二音頰丨穧穧音劑一􅰨音弋黍禝蕃蕪貌於六反黍稷盛貌也二同二俗正𥘉立𥘉甲二反種也三之六反音祿隹部第草八或作讎今市流反匹也仇也二雔巿流反丨雙鳥也雕古文音刁今作雕字二俗俗通雛正士于反鵷丨也亦小鳥也與雛同四舊藏作辝在大莊嚴經德紅反鳥名睢七余反丨鳩又同濉水名又許維反丨盱視貌音圭丨谷名新藏作子泉反鑽也在續髙僧傳第比九卷雃五堅反正也玉篇又音牽太公子名香嚴又客耕反力兮反烏含反丨鶉與䳺同俗古文音難丨易也艱丨也三與居反雞二名雞古兮反説文曰知時畜也易曰巽為丨音倉丨維鳥名通正音純䨄丨也二􅨼居隨反子丨鳥大如布榖如純反雞晚生者也音溜垂睡二音雅鳥别名雂渠淹反鳥喙也玉篇又古林反􅭐音紅鳥肥大鳴丨然也鶖音秋鷂也通正子心反雞之别名也二音如鴿也鳱干旱二音音維或作正音從南楚人言雞也二鴤音柔人姓雄雄兮弓反丨䳄也又羽弓反此二同離二音離烏玄反群鳥也上聲古雉今直几反度也陳也理也又野雞也二䧸古剪二音音晃甲器也又音欲凖古文準字均平丨度也雋通雋正徂兖反鳥肥也又姓二􅵁昌耳反昌勇反小鳥飛也俗此角公万二音隼思尹反鷂也又祝鳩也去聲古今正時呪反賣物與日丨買物持去也三新藏作俯他弔反玄頭聽也他吊反雊古候反雉丨㲝音帽鳥毛盛也力又反丨雉晚子也䧴音睡鳥名音務雞雛也峻信雖三音奮丨鳥張毛羽也入聲俗音木正作鶩字翟音笛雉也又姓又音宅丨陽縣名也亦姓雒音洛鳥也又姓余叶反鵲士雀反説文云丨知大嵗之所也字林作鵲同鵠古沃反鳥多似鵲雥徂合反群鳥飛貌或作古覓反伯勞也弓部第草九弦俗弦正音賢弓丨也又姓二俗音彌又經音義音薎在放光般若第一二俗彌正音彌益也久也長也三強音強弓有力也又居亮反凥徑硬也許緣反角弓貌也弸普耕反丨丨彋也又薄萌反弓弱貌也戶萌反弸丨開張貌也彋同上謨莫二音二㢭􅋶三俗正他刀反弓衣也四彄苦侯反弓丨也俗􅓡正音胡弓也二徒干徒按二反糾也射也又行丸也亦丨棊也二所交反弓丨也枯烏二音滿引弓有所向也音枯小弓也正今烏玄反弓曲也一曰弓上下直二音煩生養之貌或作正音遙弓副也上又音燒二古文音西今作􅤙二字痠丨亦病也散也低煦二音弖互户二音弜巨支反強丨也又其兩反弓有力也音水音流尺招反古文七羊反或作通正都昆反丨盡也天子丨弓也上一又音民二巿于反兵器也音陀或作正必耕反弓也二除流反弮丘貟反古縣名又音眷曲也又書丨今作卷音渠音申狂強二音居言反去魚反彎烏還反丨弓放箭也音州音彌同上聲弭正名反弓衣也又姓古文同上弤丁禮反舜之弓名也弛失尓反釋放棄廢也又易丨弩奴古反丨怒也弓丨也音水居兩反頭二俗莫耕反田民野人也疇直由反誰也等也匹也也又田丨又二人為匹四一日丨二俗畋正音田獵也又音殿平也三畛音真田界也又之忍反田間道也二畿渠希反京丨也地方千里曰國丨也疄或作正鄰二音田壟也二􅯡苦奚反小畚也二俗音泉畻音乘二同或作正音恭也二居冝反耕也音西或作畾正音雷田間也二碑箄二音地名玉篇又田也二同畦戶圭反枼丨畬今音余田三嵅也二或作今音奢燒種田也又音余丨田三嵅也二􅡡失羊反稓也稓音秦昔反俗西緣而注二反而緣而兖二反城下田也古文郎迥反疁音流田不耕而火種也㽥而由反良田也㽨昨何反殘嵗田也音披耕也音來耕外舊場也畇詢旬二音墾田也又羊旬反丨原隰也古文音旬是也耕二古文耕字音踈窗也二舊藏作毗時昭反町他丁他頂徒頂三