啼下一音決丨丨鳥名春分秋分鳴丨則衆務歇也鶱許言反飛舉貌鳩胡官反丨鵌鳥也正鵐今音無鳥名二𪃍音愚鳥似秃鶖也鴜即移疾移二反水鳥也昌脂反與鴟同俗音烏於容反丨渠水鳥也俗音陵䲮俗元憍二音鳲音尸丨鳩也俗䳕正音浮丨鳩二鳩二俗鳩正居求反鴿也丨聚也三俗正鷏今音田蚊母鳥也三或作鷜今音樓野鵝也又力朱反鵱丨也二昨仙反丨丨鳥也鵬通鵬正步崩反大鳥也二巨支反雞也或曰也鷛或作正音容丨渠鳥名似鴨雞足也二鸍彌絁二音鳥名一名沉鳬似鴨而小也􅬩部迷反丨鷺水鳥也正鴖今音旻鳥似翠喙赤也二􅯝音愚鳥名現則大旱􅛯或作今彌遙反工雀即巧婦也二鶕俗正音竒丨鵌鳥名似烏三足六尾自為牝牡丨音母二鴸音朱鳥名似人首也䳩於消反鳥名狀如山雞也𪆴渠惟反丨鴆鳥鶅側持反東方雉也鷷音遵西方雉名竒盆丨鳩鳥或作鳻今音大鳩二鶢二俗雞爰工音鳼音文鳥名音松或作正音詩丨丨鳥名二音移鳥名音枚鳭上陟交反下女交反丨丨黃鳥也上又音焦與鷦同鷐音辰丨風鸇鳹巨淹反自啄鳥也又渠今反鶼音兼比翼鳥也或作鷣今余針反鷂之别名又弋笑反一曰負雀别名二鵧薄丁反二音針丨鴜水鳥名也音心鳥黑色也䴀上音蒙下音同丨丨水鳥也鸆語俱反鸅丨一名姻澤也姻音護音煩丨鴅鳥名隼音隹小鳥也上聲俗䳅正音𥿄丨鵌鳥也似烏赤足二鵡鵡音武鸚也下又音母義同二塢或作島正都老反海中有山曰丨也又音鳥二烏了反水鳥名足近尾不能行也音府鳥名俗鸓或作鸓正力水反飛生鳥名紫赤色似蝠而長又音雷三昌兩反鶖鳥毛也䳝音部小鳥也鴙二俗直几反正作雉二鴇鴝鴇四俗鴇三今音保大鳥也七鳸􅟾音戶鳥名二同􅕯音可丨鳥扶乘樹上拪也䴈或作正烏老反鳥名也二或作音戶今作􅟾音父丨鳼越鳥也莫項莫江二反鳥也薄顯反丨鵲也奴了反鳥名俗音鳥俗徐兩反與同又音鳥以小反雉鳴也又羊水反去聲鷙音至執鳥也謂鷹鸇之屬能執衆鳥者也二鷲音就鳥名多子黑色也鷺音路白丨鳥也鴆鴆二俗正直禁反丨鳥也三或作鵏正音步丨䜴鳥也二鷂羊笑反鷹丨也許運反丨鶘􅊲聲云怪鳥也鴳鷃烏澗反丨雀也又鶬丨鳥也二鵋渠記反丨鴆鵂鶹鳥今之角鵄也䲦音大鳥名狀如鳬三曰有耳經自切青反在四阿含慕抄鷧乙䔬反鸕鷀也玉篇又音翳鷖於計反鳥似鳯也又烏號反鳬屬二俗正苦候反鳥子也生而須哺曰丨自食曰三俗音貫俗䳚正苦旦苦葛二反丨鴡鳥似雞冬無毛曰夜常鳴也二鴡音且䳚丨鳥也奏湊搆三音鴣上之夜反下古胡反丨丨鳥不衝北飛也音志鳥也音曳飛星鳥也䳲音振鳥名也正隼今私閏反飛也又音笋鷂也二音鴻也音兔木丨鳥有毛角也二同訓二音倉蓋反丨鳩鳥入聲舊藏作鸖三俗鸖正何各反似鵲而嘴長仙丨祥鳥也三鶴俗同上俗音足鵲七雀反説文知太歲所在巢常背之與鵲同俗鸀正鳿上二之欲反下一魚欲反丨頭黃觜目足赤大如鴨六首鳥也鵓蒲沒反丨鴿也鶡胡葛反丨似雞鬬必至死也鵒音欲鴝丨鳥也似反舌鳥兩翼班白為異鶩音木又音務鳬屬也或作正五曆反革丨鳥也二俗鶂或作正五曆反水鳥也博物志云雄雌相視而有孕也三鷢渠月反白丨鳥也陟格都歷二反雞屬戇鳥也鸄經曆胡狄二反鳥名似烏倉白色也并列反鵂鶹別名也俗正并列并祭二反雉屬而小有冠也二鴩徒結反哺豉鳥也或作鴩鴩音逸鵏豉鳥也音積鳥名也鷽于角胡角二反山鵲之屬也舊經切胡骨反三俗鶻正戶骨反鷹屬也又骨滑二音丨鳩也又丨隨陽鳥也四或作􅨰正音獨丨軬乙鳥也二俗鷟正七甬反丨也二音嶽丨鳯屬也普木反鳥也鶺俗鶺或作正音積丨鴒鳥一名錢母大如燕鵛下有錢文也三俗正音格鵋鶀鳥名也下又音洛鳥􅖂水鳥二􅣍音洛似雕黑文赤頭也鴀音不䳕鳩出玉篇俗音惡水丨鳥也二鴗音立水狗小青鳥似翆食魚一曰天狗音畢丨鴋鳥名白面色也鸊二或作鸊今抶歷反丨鳥名似鳬而足近尾也三鳨音力似鳬而小也二同音略鳥也居縳反三首鳥也􅨊音習丨鴣鳥名鵽知滑反黃雀也又當括反或作鷫正音宿西方神鳥也二鵙古覓反伯勞也鴷音列啄木鳥鵴居六渠六二反鳴鳩今布穀鳥也鴶古黠反丨鵴俗去謁反正作朅胡瞎反􅗾也􅗾軋葛二音丨鶡也鸐音濁山雉長尾也俗鴪正音聿飛快也二或作鷸正余律反鳥名二俗鶟正陀骨反丨鶘鳥名似雉青身白首也二䳳辛聿反小鳥名也或作鵱今音六丨鷜野鵝也二鶌九勿反丨鳩也又去勿反丨鳥名古叶反俗音宿鳪音卜雉丨鼠名也􅖂音卜烏丨水鳥似水也鵠胡沃反異鳥名也􅜈音乙丨燕也木務二音與鶩同亦鳬屬也馬部第十馬莫下反人乘丨以代勞釋名曰大司馬武也大惣武事也説文云丨字四點驅五俗驅二通正俱反馳也奔也八字俗駰正音因白馬黑隂也又于巾反二俗騠正音提駃丨馬也又丁奚反二馳直知反騖也走也奔也騖音務駝正駝今音陀馲丨也二驍古堯反丨騎武健良勇也俗驕正居喬反馬髙六尺也二驪音離馬深黑色也又姓䮖音昌馬名騎音竒又竒寄反乘也又姓騾盧戈反丨馬也騏音其丨驥馬也倉含反丨駕説文云駕二馬右者曰丨也馴音旬善也從也擾也俗騱正音兮驒丨野馬名又馬前中白也二騜音皇馬名駩音詮白馬黑脣也駗力珍反馬色也驎通驎正力珍反騏丨白馬黑脊也二駢部田反駕三馬也騚音前四蹄皆白也音乾騮馬脊黃也都年反馬額白今戴星馬也音宣丨額馬也俗駣正徒刀反馬四歲也二徒刀反丨駼馬獸名似馬也駼音徒騊丨獸也烏魂反丨驪俊馬也騟音俞紫色馬也俗騷正蘇遭反愁也二二俗博昆反走也二􅬼音回馬名䭹五剛反千里駒也或作正子紅反馬丨也二駸志反馬