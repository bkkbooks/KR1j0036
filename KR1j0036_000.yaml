front:
  text: 夢溪筆談云幽州僧行均集佛書中字為切韻訓詁凡十六萬字分四卷號龍龕手鏡燕僧智光為之序甚有詞辨契丹重熙二年集契丹書禁甚嚴傳入中國者法皆死熈寕中有人自虜中得之入傳欽之家蒲傳正帥浙西取以鏤板其序末舊云重熙二年五月序蒲公削去之觀其字音韻次序皆有理法後世殆不以其為燕人也右夢溪所談如此􅎾四十年前讀之偶扵萬曆己酉過杭州購得此書乃髙深甫家所藏宋板宋𥿄也深甫有印記前序有統和十五年丁酉乃宋太宗至道三年也寔契丹原本非蒲帥重梓于浙西者計今七百餘年卷帙完好夢溪所云重熙二年者又後統和三十餘年予考其序摠有一十八萬九千六百餘字也行均字廣濟智光字法炬夢溪未詳矣
  hash: sha256:d6a0147906189862c37e8e17706bbf24c2669eb2fefc2a6cc6642002bdfd21fa
