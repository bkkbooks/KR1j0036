  text: 龍龕手鑑上聲卷第二釋行均字廣濟集手書九第一䖝許偉第二水書䡄第三火呼果第四土他魯第五草倉老第六口苦后第七女尼吕第八鳥丁了第九馬莫下第十阜房九第十一广魚撿第十二厂呼旱第十三侯古第十四米莫礼第十五雨王矩第十六酉羊九第十七齒昌里第十八耳而止第十九瓦五寡第二十犬苦泫第卄一豕施是第卄二直尓第卄三虎呼古第卄四􅀑居偉第卄五走子口第卄六羽王矩第卄七皿旻永第卄八文兩第卄九爪側巧第三十矢或視第卅一黍書吕第卅二鹵郎古第卅三九居有第卅四几居履第卅五斗當口第卅六書吕第卅七享許兩第卅八此雌氏第卅九止諸市第四十枲息里第􅞀一子即里第􅞀二􅈜公五第􅞀三小􅀻少第􅞀四􅇲方九第􅞀五老盧計第卌六井子請第卌七喜虚里第卌八古公五第卌九乃奴海第五十里力止第五十一尒兒氏第五十二凵丘犯第五十三黽莫杏第五十四􅍫其九第五十五也羊者第五十六比卑履第五十七是常紙第五十八首書九第五十九果古火第六十手部第一揈火横反丨擊也五俗下一又玉篇音􅁫正􅃙皆反以拳加物也六扠􅐫佳反以拳加人也亦作俗摣正責加反丨手取物也又与􆂯抯略同二千多反丨合和也二二俗正呼毛反除田草曰丨三撾陟􅀲反丨捶也三俗倉丸七乱二反正作鑚􅗋二字丨擲也摫二俗或作正居随反裁也四􅐫居反丨蒲也二俗拏挐二正女加反並相牽引也又搦也玉篇又乃下反下又女余反亦相牽引也三都甘反丨仼也負也舉也以木荷物也探他含反丨􅂑也二摧昨回反折也阻也挫也捫音門丨摸也以手撫摩也摹俗摸正莫胡反以手丨搭也又音莫捫丨也二攀俗正普斑反丨引也接也二摽疋遥反丨撃也土凋反丨撥也又徒了反丨動也二㩲渠貟反丨變也冝也也平也重也始也稱也又姓縳謀反丨抱也二俗揺正羊昭反丨動也作也又姓四㩒擒二今捦正及林反丨捉也􅇥持也三排歩皆反傍丨用在身傍禦攻也㧌俗撓正呼髙反丨攪也下又奴巧反丨乱也二挻式延反丨撃也柔也和也取也長也掊蒲交反手丨也又俗音浮攙士咸反丨刾也又楚銜反丨上舩也揗二俗正音廵手相安慰也又俗音順摩丨也三捜俗或作􅊧正所丘反求也索也聚也三俗音挑搯士刀反丨捾也又俗苦甲反捾音烏活反㨨二俗正音抽丨抜也除也去也引也三摳苦侯反丨衣攐衣又豈俱反訓同又俗昌朱反户丨也攐音去乹反揩口皆反摩拭也又苦反摸也法也拭也􅂢音縁弃也攅在丸反聚也又音讃訟也二俗正蘇刀反爮也刮也三宅耕反撞也觸也与三同掁直庚反觸也撜直庚反又俗都鄧反正從木音縁菓名也二俗攘正汝羊反除也逐也也又揎􅃑出臂以手御也又而亮揖丨也音伊入反三撐􅐫庚反撥也又丨拄也拑巨淹反持也摶徒官反丨風也㩛三俗同上四扡音他曳也二俗直尼反正從土二三俗疾羊反舩柱也捎所交反蒲丨良馬名也又也又相焦反揺動也音彡抔歩侯反手掬物也俗㽵牡二音正作裝字側交反丨搯也又側巧反亦亂搔也俗音慈掑音其􅂝今攜正圭反持也提也二俗􅐫皆楚佳二反正作搋字奴何反丨也􅵶乙皆反推也又背􅀒㒵挨烏皆反􅀝也又扵騃反打也又扵攺反亦撃也又俗音族擡音臺丨舉也抄初交初教二反丨掠􅂑也与鈔同挼素囬反撃也又奴禾反丨莏也又摧也捼奴回反摧也又手摩物也攎音丨斂盧也俗正素何反摩丨也二挲同上揌蘇臺反擡丨也又俗音惣搒白盲反丨輔也又笞也打也搼或作捲正拳今渠貟反力也也屈手也三正通音上舉也又俗音拸音移加也又弋紙反攄􅐫居反舒張散布也攓去反丨綰也亦縮也音新攡音離張也操倉刀反持也又七到反志也俗掔正苦閑苦堅二反固五厚也持也二搴去反丨衣也与褰同二俗通正楚尤反手丨也四揂揫即由反聚也細也二五堅反揧破也又摩也俗正徒刁反擇也捾出也二子紅反撮也把髪也俗通摱正莫官反丨覆也三拈奴恬反手􅃌􅂑物也都回反丨撲物也許為反謙也作也又裂也亦􅃌丨也抨普耕反彈也五髙反撃㒵也搫盤婆二音除也又披散也又婉轉㒵拼伯耕反繩丨也又從也攺也俗或作拋今正普包反丨擲也投也又普教反丨車也四音持也又俗音鋪撣徒干反丨觸也又丨碁石也亦掉也又上去二聲抪王篇普胡反開張遍布也又愽胡反展舒也又俗音搪音唐丨揬也通或作㩥正所咸反好手㒵也又息㢘反三捄九朱反玉篇法也切韻盛士也詩云丨之儒從木者音求揪俗音秋正作楸抯側加反挹也又徐野咨野才野三反皆􅂑也拫根反急引也俗支􅂄二音撕音西提也俗必迷反正作抬二俗􅐫之反正作笞擵俗攠二或作音摩丨抄也三㨤苦懐反揩摩也㧨俗求二音音韋选也摷正或作落堯側交二反擊也二扏音求緩也亦從木作朹丨繋梅也据音居拮丨手病也二俗苦回反揎音宣手發衣也二同搸二字郭迻音同音臻聚也又琴瑟音房連反不􅍋也苦廻反又音開二俗玉郎反俗耳由人乆二反正作揉屈太也音孫捫丨摸􅟥也七廵子寸二反推也又人名姓香嚴又九反俗㧥或作正所臻反從上擇取物也三歩皆反音弥批疋迷反推轉擊示也又房密反舊蔵作渕烏玄反深也扳音班挽也又古文攀字引也摞力戈反理也或作摞字二俗音靈䆫丨俗宅加反正作揁玉篇音貞引也郭迻又音􅐫人反通㧿三俗摐正七容反丨打也又音䆫亦打鐘鼔也五攐二正攑今立言反舉也正丨衣也下又音舉起也三音堅縣名又音賢地名扵尢反丨屈撏士占徐林二反丨􅂑也㩜魯甘反丨持也舊蔵作舊蔵作羾音紅䖝飛音名音咨二俗音剛舉也苦胡反空也也㧫音而搦也舊蔵作標擟或作正音弥丨㺃山名也二揋烏􅁅反丨掎又國名㨡戸昆胡本二反手推也揄音俞丨􅀭詭言也又動也又徒侯徒口二反引也俗音正作櫩屋丨擂音雷研物拥俗古掤今音氷以手覆矢又弓強也又俗音三音余共也摪音將扶丨也二同扛音江舉鼎少􅀃文云撗對舉也今摎正音交束也橈也又音流亦絞縳也又姓二俗音来正作梾木名也或作撢今余針反探也又玉篇音潭丨二抲音呵丨下江反丨䉶㠶䉶音􅀟女皆反揩丨摩拭也捿俗音西正作捿鳥丨扔音仍引也又列也掄音輪手轉也又力昆反擇也一曰貫也悮􆁗正㩬今許羈反擊也三去魚反撃也㨓音勞丨閉也二許撟反玄丨星名正從木二捈他胡反卧引也徐㢘反丨􅎥草木也揱音消長㒵又所角反纎也又長臂也又所教反木上小也攏音籠房丨又力董反丨畧又物丨籌也酒律摛􅐫知反舒也又俗音離山丨㧢音因就也㨉音旻撫也擠祖􅀆反丨排也摏書容反撞也㧶口耕反琴聲也古文戸公反搈音容不安也二俗音劉正作木名也揚音羊舉也導也明也拪音西俗音音牟俗正似泉似戀二反揎也轉也二挮俗啼躰二音音耶搥都廻反􅎥也又直追反棒丨也又丨髻也音或作扷也俗音踈撋如縁反􅀃文云按摧􅇥也都昆反上聲俗揣今正􅀄委反量也䖍也試也動也除也又摇也又音釧度也又俗音􅅮三拯此字無疊韻取䒱字上聲丨㧞也救也上舉也助也二抆武粉反丨拭也擾俗正而􅜲反丨乱也煩也二拖徒可反引也又音施持物惠人也拕俗同上揜古正音母手丨指也二攞勒可反丨裂也捛二俗正音吕師丨也与旅字同三攪古反手丨動也俗抱正薄老反捉也持也二㨐方垢反衣上撃也俗撚正奴典反以􅃌丨續緊也二㨋昌者反丨裂物壊也玉篇又諸也反撃也撦同上撼胡感反丨動也九展反丨搌醜長皃也又俗音擅􅌹丨也搌知演反束縳也又丑免反丨也烏絞反丨拉也擺捭北買反丨撥也亦姓二古文音􅃌摌所簡反以手㧡物也㧡音亥動也㧲􅂫感反丨摇動也俗㧬正音拱厄持也二奴鳥反􅎥也扵許反打聲也摾俗巨兩反㨊或作撱今羊捶反弃也又撞也又他果反器文狹長也二二俗正音動也三摙力展反擔運物也搴􅠡九輦反也二同拐俗古買反正作柺老人杖也㨵即淺反切也古挸或作擟正古典反丨振拭面也三抮呼典反引戾也音紙丨掌也􅀃文云側手撃也二俗烏騃反下又竹例反俗音動俗音栁捆苦本反丨取也直尓反二攤奴伹反按也又他丹反丨開亦緩也俗竹几之日陟栗三反攩他朗反丨擴搥打也又胡曠反亦打丨也㨪俗胡廣反正作㨪讀書床揃即淺反丨滅也二擏居影反所以正弓居影反丨除音粉動也俗扮正一房吻反握也又芳粉反二俗摻二今所斬反執抉也三烏感反手覆也抂扵往反或作搑正而勇反推㒵也二㧴音我也音魯摇丨正今許偃反手約物也二摬扵丙反申打也撑俗音掌㩰子小反菜似薺俗拲二正居悚反兩手共持也下一又居王反義同三㩓許委反手丨傷也音兆扭女九反丨手轉皃又陟有反丨按也俗音唯正作埻射的也又宅耕反撙則損反促也挫趍也㨔俗胡感反俗音顯義合作捴俗㧾古捴今音惣普也皆也合也衆也四担多旱反笞也又俗音抌章反㧋火犬反捵也捵􅐫展反丨出也音好掞舒染反動也俗傍礼反正作梐􅃙里反去聲控苦貢反持也引也告也音患以身貫甲也又古還反又去聲也昌制反曳也制也又昌折反􅠖二俗昌制反俗􆄬正苦浪反丨舉也拒也遮也捍也二悮抗今苦浪反義同上四撞直降反擊也刺也擣也又宅江反丨突也二俗正古􅃸反擩也擩音人注反三挫祖卧反摧也折也音亮一􅂑也也笞也治也正今時戰反專丨也二􅁺以絹反官名也必刃反棄也排也厈也挊挵三俗貢反二俗正余制反又羊設反牽引拖丨也三捩郎計力結二反拗丨也又琵琶撥也今正古代反滌也􅑄也又許旣反拭也􅑄音潜二同俗烏半反手丨也正作腕掛俗通挂正古賣反懸丨也止也二挍音教撿丨又􅊲丨也二俗皮證皮氷二反依几也正作措倉故反舉丨也投也捕音歩丨捉也援于眷反丨衛護助也又于願反亦姓按烏漢反抑也安也揾烏困烏没二反以手捺物之皃也撩力吊反治病也又丨擲也又力鳥反扶也又力堯反取物也捍音汗丨也扞音汗衛也以手丨也又古旱反丨􅄬物也音厄展反古文音拜古􅫵二或作捃今居運反也拾也􅂑也四薄報反鳥伏􅆑也俗㨾正余亮反揩摸拭丨也二􅠜俗抃通拚正皮變反撃也三􅀘過反布也揚也放也弃也揀練簡二音丨擇也摜古患反丨帶也擋丁浪反摒丨也二俗音舊正作柩屍在棺曰丨正今作紺反手丨物也又子敢反二二俗正陟利反到也又刧財也又陟里反􅃌也三挏俗音洞摓扶用反切韻勞灼􅀛兆也莫貢反㩨音惠裂也又卦也俗音謝撌俗求位反丨檻也又丘位反俗音悟或作正其記反諱也二俗掆正古浪古郎二反梢舁舉也二古文音亂理也通擩正人注反丨莝手進物也又奴豆反丨不􅄙也二俗力刃反正作撛所拜反􅂸舊蔵作古反也㩌方味反川韻云南人呼相也㧦呼縣反撃也徒弔丨反同掉俗蒲拜反次火也許既反捸俗特計反正作下也又縣名亦人姓捔音角掎丨也又土角反􅍴丨也搠俗音朔握扵角反持也把也搦女角反持也又尼白反捉丨也又正也􅟥蘇各反丨模也插三俗挿正今初洽反刾入也五扱初洽反引也取也級也也俗掐正苦甲反捻也爪丨也二掘渠物反穿斸也􅓯音陟玉反挹伊入反酌也斟也持也又音邑鳥短氣也伊入反丨讓也進也又相居反􅂑水具也掇多括反拾丨也又陟劣反亦拾􅂑也搮力乙反以手丨物也攉古岳反􅀭丨大舉也又苦岳反擊也扮俗扴正古八反手􅃌丨物也二抓二俗擘正悲厄反分丨也以手治物也三音卓撃也推也又俗音􅁺五俗正疾反尅獲也欣也勝也成也疾也獵也六挟俗挾正胡貼反懷蔵持護也二拹二俗拉正郎合反摧折拗丨也三或作又竹聲正盧盍反与粒訓同二搚与拉擸俱同又摺丨相和也摺之渉反疊也又音拉敗也􅩟才盍反擸丨和􅄂也又􅀻盍反搕丨糞也搕烏合反以手盖丨也又丨糞也㨁常軄反柱杖也又俗直􅊂反搏􅀘各疋各二反皆撃也㩵五割反撃也又才結反五割反伐木餘丨也皆俗正從木作枿五拆二俗音坼普木反拂畧打聲也二俗搨正㩉通都盍反手打也又俗音塔四或作撻正他逹反打丨也二俗抜正蒲八反丨擢也盡也又蒲未反迴丨也二丨目也抉伊决反出也又挑也二他反除也誤也遺也又徒活反􅄙丨也捾烏括反取也又胡官反乱摩也揳先結反㩢丨不方正也二㨝同上丨也二俗正莫結反丨也二俗所六反正作縮音葉度也又音牒摺丨也二俗音搦拂芳勿反撃也除也去也拭也擗房益反撫心也古搤扼二今音厄持挽捉握也三挓俗知格反裂也張也正作磔二揬徒骨反搪丨也俗挬正俗通蒲没反按也三押音甲丨捒也又音鴨丨署也捒楚草反扶丨也又所草反丨擇取物也又所去反裝也捻奴貼反指丨也􅡼音雹相丨也音叶二俗或作拓正音託手承物也又姓又之石反四摑古麦反挻丨打也或作二撤直列反除去壞㓕也又發丨也拀之六昌六二反丨止也樂噐也音滅手拔也摩丨也抺音未丨摋麋也音抺丨也揥他歷反手挑丨也又丑列飾也搙女角反揾也又奴豆反柱也摝音鹿振也渠列反強􅁀也捇呼麦反丨掘土也經音義又丑格反開也掝呼麦反丨裂也摕徒結反捎取也又音弟取也又音帶搥也扑普木反打丨也又俗音朴撅居月反撥物也託頓二音或作捊正郎括反手也也摩也取也或作乎下又俗他得徒得二反二㧹俗正他得反擊也又俗音特二二俗其月反正作盧葛反撥丨手披物也􅑃二俗捏正年結反捻也捺也三舊蔵作音張草反普活反艾丨也攃蒼葛反足動草聲亦揩也抶􅐫栗反丨打也挌音格打也又音恪亦擊也也又止也正也􅠎苦擊苦弔二反旁擊也撽胡狄反符丨􅀃文二尺書也又苦吊反旁擊也俗正苦結反丨提也持也又苦計反手也二㧊俗正普未反推丨也二􅚹普厄反射中聲也俗正末反逼也又排也二俗同上二俗音必正作㮿丨鉢羅花樹也經音義作蹴于六反指丨也應是掓字音式六反拾也在阿含經弟九卷郎没反俗掓正今式六反拾也三阻立反丨斂也㩧音朴擊也又音雹打聲也抇戸骨反牽物動轉也拮音古丨据手病又音結義同挃徒結反􅎥也又陟栗反撞也抈音月折也又俗五活反正作相去樹皮也㩪胡結反捋取又􅍑結反蒲北方擊也㧙音筆也二同舊蔵作剥在阿育王壞目因縁經也摭之石反拾也又作拓紀逆反持也古反丁結陟栗二反撞也与挃同居玉反持也抐内骨奴困二反揾丨按物水中也摵子六反到也又所責反殞落皃搭音塔摸丨又音荅打也扢居􅡧古忽戸骨古代四反昔摩也擽音畧擊也搰胡骨反掘地也俗擆正張畧反置也二㨹音雪滅丨也撫俗音亦俗正千木反玉篇促也二􅳥与即反拭也俗古麦七入二反撧子雪反手丨断也二或作似絶反拔也二挒音列也㧅音木曰乗抾去劫反挹也子列反摘去也胡結􅍑結二反束縳也俗或作正昨没反手丨也四螽􅏑二正音終丨蟴虫名也五蟴音斯丨也蚣俗虹正音紅丨蜺也又音降青丨也二蛟音交丨龍也螻上音婁下音􅀌或云仙蛄蟪蛄石皆螻姑之異名也蠄俗螭正􅐫知反無角龍也二音毗虫名古或作蚍今音毗蜉也四蜉音浮蚍丨也俗俗通融正以戎反知也朗也又姓也三䖠二俗螈古蚖今愚􅀽五官二反蠑丨守宫蚚蜴蝘蜓四種異名也四蜈蚣上音吴下音公蝍蛆䖵蜒也能制虵下又音鍾􅆉螽虫也蚰蜒上音由下音延江南大者蜈蚣小者丨丨也俗蝣正音由蜉丨也朝出暮死虫或作䖻二蠑音筞丨蚖蚚蜴别名也俗音公俗螝正居追胡對二反蚕蛹也二蟬音蟬蜩也不食之虫仲夏月丨始鳴也螇音􅀆丨螰虫名似蟬也螕邊奚反牛虱也蠅余承反蒼丨虫也􅑺莫經反丨蛉桒虫也毛詩云食苗心虫曰丨蛛音蛛蜘丨也或作徒登徒得二反正作􅠀二字食禾虫也蜪徒刀他刀二反尓疋云蝗子也俗通正五髙反蟹属也三俗䗏正音捜蛷丨也二俗蛷正音求丨虫名也二舊蔵作螗􅉬弋支反逶丨也㽵子云􅂵衣朱冠也蝭啼帝二音寒蟬鳴也蛇古虵正食遮反毒虫也又姓又弋支反丨丘地名又音也亦人姓二或作蜱正符支反蛸蟷也又弥摇反亦虫名蠰音霜齒桒蝎虫也又傷餉二音蟷音當丨蜋亦螗蜋也蛸音梢蟰子喜子也又音消丨虫即􅡯蟭也又長脚蜘蛛又姓蟯音饒人腹中虫又去消反二俗螵正符消疋消二反丨蛸虫名也三蟰蘇凋反丨蛸長攲桒虫也二俗蛔或作今音廻人腹中丨虫也四蝤音由木中虫也又即由疾由二反丨蛑似蟹而大生海邊也䗋或作蛑今音牟蝤丨似蟹而大二蛉音零虫名也汝占反大虵也蛅汝占反黑丨食檀木虫也螐音烏蚅丨蠋虫大如􅃌白色也莫汪反螻蛄也蠐上音齊下音曺虫名也蟥音黄丨蛢音蒲結反蛢音瓶以翼鳴虫或作蟾正軄廉反丨蠩蝦蟇也又視廉反丨光月彩也二蠩音諸踞丨一頭數尾長二三尺左右有脚状如蚕可食也蜍署魚反丨也又音余蜘蛛也􅧅音加米中虫也蟛蟚音彭丨蝟似蟹而小也二同俗或作今音移尓疋云蝓丨螺􅑕也又音斯守宫别名也三蜝音其蟛丨似蟹而小也蚐俗或作正直尼反蟻􅆑也三俗尺之反正作嗤㗛也音義􅃙之反香嚴寺之反蝯音爰亦猴年五百歳化爲玃螉烏紅反蠮丨也蠮音噎蝖音喧蠀螬也蠀取􅀻反丨螬蝎化也􆂰二或作蛬正渠容居悚二反蟋蟀也三蛩渠容反丨巨也蠊音廉蜚丨虫名正蟫今徒含反衣中白魚也二蟡為反涸水精一身兩頭似虵可取魚鼈也蜲扵為反丨􅉬也蚵音何蛶蠪蝑相居反蜙丨也蜙息恭反丨蝑虫名也俗正部田符眞二反丨珠也二音螊音咸海虫可食也郎禾郎果二反二或作今音秋次丨也三音因蝚音柔虫名也渠惟反虫名也蜊力脂反蛤丨也音縁蝗子也一曰蟻子蝩直容反蚕晚生者也又軄容反丨􅏑虫名也俗戸交胡刀二反蛝閑根二音虫名所江反虫名䗔音侯虫也蟼音亰丨蛙也􅡻音啼螗丨小蟬也俗煩盤二音䖶音豕掘地也蜻音青丨蜓亦蟪蛄别名也又音精丨蚙也力􅌹反虫名也蚶呼談反􅑕属也蟉正通渠幽反丨幽龍也又音聊也二虬渠幽居幽二反無角龍也都聊反丨蟉茅中小虫也音離分破也又音亦刀刾也音棃同蟍螏丨也蟍同上蝓音俞丨蝸牛又神朱反虷胡安反丨蟹一名蜎虫也蚷俗螶正音渠獸名也二俗或作䳋今徒紅反鳥虫名三或作蟭今音焦䗚丨螗蜋􅆑也二䖢弥遥反蚕初生也或作音蛾蚕丨也蚿音賢馬丨虫也一曰百足􅰏音錢鳴丨也本集作蛛蛭二字經音義作丨非也蚟音王丨孫虫名丨一名蜻蚓即今促織也䖽或作力脂反蜛音居丨蠩也蟱音無也􅪔音風玉篇虫窟也音沙螓音奏蜻虫似蟬而小丨蠜音煩蛗螽虫也蠪音籠赤駮如狐九尾爪音如小皃食人名䗁丨又虰蟲亦獸名也虰丑丁反蠪丨也上聲蠢赤尹反出也作也動揺㒵也又与偆惷四同二姑五反丨毒媚惑也蠹神也蠹音都固反又音野二蠓莫孔反蚊丨也蟣居豈反蝨子也蜚非尾反咸丨虫也又扶沸反神異經云南方蚊翼下有丨虫生於九􅆑子復生九而俱去蚊亦不知也明目者見之又古飛字今古音早丨也二俗蚪正音斗蝌丨虫也二蟻魚綺反大曰蚍蜉小曰丨子二蚓音引蚯丨也􅑕二俗蜯通蚌正白項反丨蛤也四蠒古典反蚕衣也蠕二俗通正而兖反虫動㒵又而乆反丨蠢虫名也四䗊􅽣蠎四俗正莫朗反㝡大虵王也五蛘羊掌反痛丨也又蟻名与癢痒亦同蚠俗蚡正房粉反丨䑕也与鼢同又平聲二音婦丨螽虫也俗正於典反丨蜓也二二俗蜓正徒典反守宫異名也又音廷蜻丨也三於逺反丨蟻蚯蚓也蛹余隴反蚕丨也音礼大舩名也音礼小舩􅀘也蚥音甫蜛丨螳蜋别名也又音父蟾蜍别名也俗蜢正音猛蚱丨虫名二䗾或作蜆今音現赤頭黒虫一名縊女善自縊也又音顯小虫也二䗆音管雨下虫名也余兩反虫丨蜄俗􅜹正蜃今時忍時刃二反海丨大蛤属也三􅡂上音暑下音負丨丨虫名俗音里魚名蜽上音下音兩丨丨虫名也又石之精也蛕呼罪反土丨毒虫也又俗音廻二俗音險蝺舊蔵作瑀音雨石似玉也蟢音喜丨子虫也蜾音果丨羸虫名許兩反虫丨也巨豈反蟬也去聲螚奴代反小蝱䖝也螮音帶丨蝀虹也蚋蜹而稅反蚊丨也下又而恱反二蠆今䘍正丑芥反毒虫也二俗螙古蠹正當故反食木虫也三音惠丨蛄也他外書芮他卧亦雪四反皆虵蟬昜皮也䖭音眷丨蠾别名也蠣力制反蚌蛤屬也螆俗正音次虫似也二蚝七志反丨毛虫有毒也䗲良刃反熒火也音射虫名音愛䗢音造蛀二或作今音注虫名三舊藏作􆈚蘇到反疥丨􅃇蔵作蘇因反丨水舊蔵作嗽蘇奏反香句反幺蚕也苦到反丨􅔒蝎虫螅俗去例反正作憩息也蜡鋤嫁反年終􅀕名与􅹒同䖨或作䗪正蔗隻二音􅡂蝜虫名也二蟃音万螟蛉虫也失亮反桒蠒虫也蟦扶沸反蠐螬虫也蝟音謂虫名毛如針又彭丨或作䗯正音進虫名二音務䗍名也二同經音義同餌蠫郎計反割破也又俗音螺二蛽俗音貝同丑芥反毒䖝也二入聲二俗或作螫正施隻反又呵各反虫行毒也四二或作正呼各施隻丑略三反虫行毒也三俗蠍正香謁反螫人虫也二蝎音曷虫名也又俗同上蠈層則反食禾虫也尓疋云食節曰丨五俗蝨正音瑟蟣丨也六俗正音特食禾虫也二蝠音福蝙丨也俗音䘃上音織下音墨方言云蝙蝠異名也蛺蛱古叶反丨也二同正今徒叶反蛺丨也二俗蛭正音質水丨䖝也二俗蜴正音亦蜥丨也二俗蜤二或作蜥正先撃反丨蜴也四先撃反丨也音覓䖧奴􅁑反蠚螫也又知列反俗正音色虫名也二螰音鹿螇丨虫名蟪蛄也古歴反螇丨水虫名也蚸音歴尓疋二丨虫名也俗正他逹反蝲丨也二蝲正俗郎􅁑反丨蟽也二􅜽音積虫名也或作螏今音疾丨蟍也二魚列反虫蝗鳥獸之恠也蟘他德反虫名也蟄直立反虫蔵丨也䘊莫結反丨􅵷小虫風春雨磑者也虴蛨上知格反下莫百反虫名也䗷音憶小蜂也䗶俗通正盧盍反丨也二蚱音責丨猛虫也直炙反蠋直玉反丨虫名又之欲市玉二反皆虫名音或虫名短爪状如鼈三四寸有三足含砂射人乆則為害也又音域蚅音厄丨蠋大如􅃌似蚕虫也之欲反􅃖丨又音蜀也䘅奴勒反虫名似䖟而小青班色齧人也俗正蒲結反蟥蛢虫二䗇渠竹反蟾蜍别名也􅠸子六反蝍丨蚇蠖也蚇蠖上昌石反下鳥郭反丁丨出伸虫也蠮烏結反丨螉細腰􅉕也螉音翁音畧渠丨朝生暮死虫也蛶音劣尓疋云髙珂虫也又郎活反義同蟋音悉丨蟀蛬也或作蟀正音率蟋丨也二蠞音截丨似蟹生海中也􅨒音刼石丨虫形似􅀛脚得春雨即生扵石上也知列反今作蜇同䖩毗必反黒蜂也䘁或作􅝺正列反丨似蟬而小也二音伇丨虫名蛚音列蜻丨蟋蟀也蛥音舌丨蛈蟪名也蝍即節二音丨蛆蜈蚣也正音瓦蛤蟹属也俗同上蝁烏各反虵名二同蚗古穴反丨蛥蟪蛄虫名也䘌尼質反小虫也􅉶女力反虫食病也螲陟栗反螻蛅物也蛣去􅁻反丨虫名音迊俗魚列反􅻯俗音特音弋虫丨也􅧳正蛤今古合反􅑕也二蟆音莫小蚊也二同蝮芳福反丨虵也色如綬帶最毒或云􅳐俗音畧正作􅡯布各反丨蜼螗蜋外也音哲蝃音拙蛛也水部第三淹扵炎反丨乆也㽞也滯也漬也敗也也洴音瓶澼丨也澼音普的反湔則前反洗也又音箭亦水名潜俗正音潜丨没也蔵也沉也深也止也二􅆓㳂音縁丨縁也順流而下曰丨二同湌俗音喰㳭湺三俗今㳄正似延反口液也五俗正音魚燧人之丗天下多水故教以丨又水名二浮泡上伏牟反下音抛浮䡖