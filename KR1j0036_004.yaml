  text: 龍龕手鑑入聲卷第四釋行均字廣濟集木莫卜第一竹張六第二系莫狄第三肉如六第四目莫第五日人質第六白傍陌第七玉魚欲第八石常隻第九革古核第十邑於汲第十一足即玉第十二疒尼厄第十三骨古忽第十四頁胡結第十五丑略第十六彳丑亦第十七食乘力第十八麥莫獲第十九穴胡決第二十角古嶽第草一歹五割第草二力良直第草三立良入第草四鹿盧谷第草五兀五忽第草六色所力第草七赤昌石第草八一於悉第草九谷古鹿第三十弋羊織第卅一草人執第卅二入人執第卅三攴普木第卅四黑呼北第卅五舌食列第卅六鬲郎擊第卅七鬲郎擊第卅八學胡角第卅九莫狄第四十出昌律第􅞀一十時入第􅞀二卩子結第􅞀三血呼決第􅞀四卜博木第􅞀五音得車丨也又宅庚反桂也又丑庚反又去聲俗槗正橋今渠妖反梁也三杝音他丨車也又俗徒可力知二反檎巨今反林丨也㯲俗音同上捉也梣鋤今反青皮木名也枮陟林反鈇丨也斫木質也又俗時任反桑丨也二森所今反多木髙貌也同上長貌也梢所交反枝丨也櫨音盧欂丨柱上木也又木名也音博榣余昭反木名也棆音輪木名也梴丑延反木長也柊音終木名㰘桋二木名音夷水器一名戽斗戽音虎三檬音蒙似槐葉黃㮬烏紅反水丨子果名也桏渠容反匱栁即容七恭息恭咨用四反皆木名松葉柏身出北上也楷音皆木名又古八反祭大席也杬音元木名出預章煎其汁藏果及卯不壞樽音尊酒器樈音驚鑿柏榰音支丨柱也柱屋之歆也檆古㰇正音衫丨松木下又子廉反玉篇伐也二榵而容反木名似檀也樔鋤交反鳥穴居也又也杓漂標二音北斗柄星也又市若反枰丨棚音水盛箭器也又薄登薄庚二反棧也閣也􅫩疾移反無丨木一召榆檠音擎所以正弓也又渠敬反丨子疊名櫻烏耕反丨桃杭胡郎反州名音表絡絲工隻杉音衫木名似松埋之不朽枇音毗丨杷果木冬花夏熱桄音光梯丨橫木也橫音光長安門名巒反蘇和反織具也音斯丨桃山桃也梔音支丨子木實可染黃朾宅耕陟耕二反伐木聲也又徒頂反俗音愁㮎二俗布廽反椯巿緣反木名㰋音頻木名俗音賢正作㭹地名奴當反居幽反髙木名也䍒誤音浮正作兔也框去王反棺門也俗正音劉木也二小樹藂芷也樼二或作正音臻丨子小栗也下又士臻反木藂生也三士臻反木藂生日丨與三同柤側加反煎藥餘也又茶腳也樝側加反似梨而醋也或作柤椸音移衣架也俗通樛正居幽反木枝下垂者也枚莫豐枚也亦姓桅五回反船上丨竿也又居委反短矛也橰音髙丨也余廉反木名余廉反步丨長廊也莫耕反屋棟也與甍同棼枎文反椱屋棟也枌枎文反白榆木名也俗楠二正音南木名也三汝鹽反梅也子如杏而醋俗槄正土刀反水名即今山秋是也二􅒎音義丨杷田器也楨音貞木名也又丨幹亦女丨也梳音踈櫛丨也櫛音阻瑟反椿敕淪反木名也柯音哥枝丨斧丨也又姓莫經反丨樝梨屬醋而且香也橿居良反鋤丨又紫丨木名也俗音因正作禋祭也直由反丨木也槐音回木名又姓又音懷俗正音懷木名尓匹云小而靑曰槐葉大而黑曰丨也二楩步連反木名也櫰公回反木名如棠而圎實如木瓜食之多力也又音懷彬筆旻反文貌椒正椒今音焦木名又姓二楸音秋木名楒音思相丨木名梫子林反木名火玄反碗屬也玉篇音古玄反碗謂之丨音箱丨木皮中有丨白米樢之可為􅔇也又俗音讓楇玉篇過媧二音木名又車釭盛器也枰音平丨仲木名又博局又或音枋音方木名也朷音刀木心也棬丘貟反屈木為丨樁書容反橦也又陟江反橛也橑音聊蓋骨也又音老屋丨簾前木也一曰欄橦音童木名花可為布又鍾幢二音木名也槦音容箭笴也二或作榕今通切韻音松梓通玉篇音容木名也三梥古文松字俗正音胡名下尖上大也二或作棇正忩二音尖頭簷也二杠音江旌旗飾也一曰床前橫丫音鴉木也或作許冝反正作杓丨也械音戎木名查二或作楂正鋤加反水中浮木也又姓上豆醋也三音盈柱也孔子曰夢奠兩丨是也柳丑貞反木名説文云楊丨河栁也或作正楚尤反板木不平也二􅖗音茶春藏草葉可以為飲曰丨槯昨回反木名堪作杖也㮴蘇邅反船名枆或作正音毛冬桃也二通桃正徒刀反果名又姓二櫅祖奚反丨榆堪作車轂尓匹云白梡胡官反木名出蒼梧子可食玉篇又音完義同又苦管反器名也或作橝正徒舍反木名灰可染也又徒點反屋柅名也柅音尼二所冝郎計二反梁棟别名也又音禮小船也許憍反玄丨星名樘直庚反説又云柱也亦丨觸也柁音陀又徒可反棊正音其同園丨也㭿五郎反飛丨斜桷也杯音杯棸音紬妙也亦上聲櫜音髙輡也百車上囊步田反木名也桁胡郎反丨也上聲柂徒可反正船木也又音移木名枕章荏反又之任反丨席也枉於往反丨屈也濫也梗音耿直也又藥名也於蟻反丨柅也又於離反木名也柅女蟻反椅丨也又尼你二音亦木名也棍胡本反木名也音義云古本反閞線丨子也棓步項反大杖也又音浮又俗蒲交反棒步項反打也杻音丑丨械也枳音紙木名又居紙反木名似橘也音􅊲木枯乾也或作薧二同音􅊲木名也音丨栁器也古文音栁小楊也朽休九反腐也爛也枸俱雨反木名子可食江南謂之木蜜能薄酒味上烏可反下奴可反丨丨木四枝乘盛貌也檁力稔反舍也機居履反木丨小案之屬也梱苦本反門限橛也又俗戶昆反栱居恐反斗丨也板布綰反平闕木也櫓古櫓正音魯望樓別名也又木名二梐傍禮反丨枑行馬也又方奚反榜北朗反木片也又俗白盲反笞也雜五俗朵二正丁果反水上垂貌七杪彌小反梢也木末也櫸木名匱音舉栁也二柿音士果木椑丨也梓音子木名楸屬梠音吕桶端木也亦名連綿亦名雀丨屋丨屋簷皆方言異也𣏌音起丨梓木名又苟丨也亦姓神吕反橡也又直吕反織丨也又除也取也挹也後也出也今正音禮大船名二碗烏管反器物也或作正今輕禮反兵欄也三棧士産反丨閣也亦木道也又姓桶他孔徒孔二反木丨器也栐音永木可為笏也江西隨函音牛紀五代二反苦減反不安也㦿苦減反牗也一曰小戶􅕠布莾反教也見郭移音㮯胡本戶昆二反木未破也楕他果徒果反木器名也拐古買反老人柱杖也楺人九而由二反屈木也􆁼而兖反丨也又紅藍也以墊丑郢二反丨似柿也􆁽古瓦反老人柱杖也楛音户木名堪作失幹隨函音宛於逺反為衣入裏也楮覩楮二音丨木名也椲于鬼反木名可屈為盂杍音子工木匠或作梓槳槳即兩反楫屬二同誤枓正音斗柱上方木也二樢音鳥檔多朗反木名俗正音早與棗同二椇俱雨反枳丨木也梩舊藏作理在婆須蜜論音本玉篇根本也音瓦竹几反二子了反木忽髙也但涅二音胡黤反欄丨也二俗垛正徒果反射丨也三檥音蟻幹也附也整舟向岸也與艤同又俗許羈反栩况雨反柞木亦地名槱音酉積木燎以祭天也音去聲古候反丨合也架也成也亂也蓋也槌直類反蠶丨也又直危反打也橈奴教反木曲也又如昭反械胡介反器丨又相丨也楯食閏反兵器也亦釣丨也楱倉奏反插也柄彼命反權也柯也本也二枑柢都計反木根也下又都奚反訓同二楦通正許反靴履模丨也又法也二噪蘇到反群鳥聲丨也概古愛反平斗木也又量也概玉篇音同上梪音豆邊丨也又古食器也又俗音短榭祥夜反臺丨又臺上起屋曰丨音豫丨樟木名也俗省今蒲拜反韋囊吹火具也三古且反檀木也俗七亂正作㸑棟多貢反屋丨也穩也桴也於靳反棟也脊也櫬初近反空棺也楝音練木名也柘之夜反木名亦姓又俗音託匱求位反丨篋也楴他計反丨杖整髮叉也俗正音備木名其穗可食也二俗檖正音遂陽丨木名也二樺通俗穫正胡化反木名也下一又胡郭反丨落亦木名也三􅏄芳廢反斫木斥零丨也又方未反蔽也音照梙俗槵正音患無丨木名也二棹直教反船中橃水木也柾俗柩正渠救反尸丨禮記云在床曰尸在棺曰丨丨之言久也二榨誤正側嫁反打油具也二檟音價木名枊五浪反繫馬柱也又平聲楙莫候反尓匹云一名木瓜實如小瓜味酢可食二俗古浪古郎二反正從手作舁也也二俗同上二俗正音託擊丨三桔音結丨梗也㯓通榻正音塔床丨也二榍木名也先結反木丨也下又古八反櫻桃也二柣直質反門限也又千結反尓匹門閾也閾許逼反核下革反果中實也榤渠列反雞栖木也二俗正渠列反夏王名也又菜名三臬五結反門也榅烏沒反丨桲果也桲蒲沒反榅丨似樝槲胡谷反木名也橘居聿反果名也正檄今胡狄反符丨二尺書也二楫通正子葉反舟丨也二接集二音舟丨也棹音宅方言云小竹木子為丨子也又濁棹二音二或作正陟革反蠶椓也又音德木名也三柷之六昌六二反尓匹云丨州木名也椄即葉反栽丨續木也槒俗音畜正作慉榓音蜜木丨香樹名也二樚音鹿丨櫨也樀的笛二音屋梠也音結丨槹沒水具也棭俗亦夜二音正作掖他括反木丨也音葉薄貌也𥘉革反村丨也又竪木編以為之櫝音獨函也又曰小棺㰌音角以木渡水今呼峉勺是也古文其月反木入土也今作橛樾王伐反樹隂也櫛阻瑟反巾丨也欂輔各反丨櫨柱上枅也又平戟反苦結反丨滅斷絶也櫍音質行刑用斧丨也渠列反有所表識也㭯音輒木小葉也樕或作樕正音速槲丨木也二音宿木名又木貌誤杓正市若反木丨也二棤音昔皮甲錯也櫟音曆木名柞屬又音藥丨陽縣名櫪音曆馬丨極其輒反驢上負板也椱音伏織丨卷繒者張略反擊也又音筯柞昨作二音木名二同通籌音紬算也二初尤反酒丨也篅正今市緑反倉丨也二簾力鹽反箔丨也簞都干反丨笥小篋也筋音斤竹名出曰南九真可為弓絃也籘徒能反􅟵生似竹也二籮音羅篩丨也篩音師竹也又丨籮也昨何反籠屬也笞音癡捶擊也籢力鹽反香丨也與奩同應法師作籢力占反丨鼓也二俗正居其反丨可以取蟣也三䇬昌朱反丨䇿也笙音生樂器也䇶俗筒正音同竹丨也二􅰣力居反丨䈝竹名􅠚去魚反飰器也䈝相居反竹名也筇渠容反竹名可為杖也䇯而容反竹頭有文也簫蘇凋反樂器編管為之以象鳯翼也舜時作苦回反箭竹名也陟瓜反馬策名也汝羊反丨䉛􅜷米竹器也䉛音郁􅜷音鹿箶音胡丨簏又竹名也音胡程也又音孤方也音孤竹名也箕音基丨帚也亦作簸也簷音鹽與簷同丨楹也䉚莫耕反竹筍也音牌大桴即筏也䈱他刀反牛􅞠也䈲薄官反篾也又北官反捕魚笥也笭箐上音零下音精丨丨小籠也䉁音零竹名也薄經反竹丨也音尸卜籌也武巾反竹膚也筣力之反竹名也䈵烏紅反竹盛貌也竼俗蓬馮二音正作芃笳或作笳正音加丨簫卷蘆葉吹之也二筬音成丨筐織具也䇸音呈筵也筵音延席也并迷反梳丨也音聊宗廣盛肉方竹器也音聊竹名音盧丨西竹出會稽一曰筣丨亦竹名正音調或作竽正音于丨笙也二扶非反竹名䇞音甘竹名音都竹名䈯音真竹箭也䉑音無黑皮竹也籈音真尓匹云所以鼓也笣許交反竹名又音包䇦於良反音鍾長節竹也篍音秋説文云吹簫也笀音亡正作芒草丨䇾音言大簫籖七亷反竹刾也箊音於竹名丑居反竹篾名也䇨通正薄紅反車軬也音二笗音冬竹名所冝反􅜷也􅜷音祿筲所交反斗丨竹器也舊經作筌俗丑中反正作草名魯甘反盛物竹器也簹上音云下音當丨丨竹名也音筕篖上戶郎戶庚二反下音唐丨丨竹笪也音郎車籃一名笑丨又音浪竹名也笑音替簥居喬反大管也又音橋田器也音専折竹為卜籌也又音圎竹器也𥶛音匙玉篇笙簧也箯卑連房連二反竹與也通今箋前二