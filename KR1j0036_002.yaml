body:
  text: 􅟼三俗音庭焄或作二正許云反火氣盛貌也三勳同上功丨也蒸􆂬二俗正者仍反熱氣也又冬祭也又去聲三􅑒三俗正潛二音皆火滅也四焭今煢正渠營反孤獨也二塋音營基丨也又俗同上爃俗音榮二俗炮炮二正步交反合毛炙物也一曰裏物燒也四炃二俗燌正符文反燒也與焚同三音煩燒炙也又同上古文布胡反逃也竄也今作逋磷二或作二正力珍力刃二反鬼火也四粦鄰二音鬼火也煬音羊焇丨又丨熖也焇音消丨鑠也與銷同俗音旻熵二俗忝商適三音炡音征爚煹也熬俗通正五髙反煎丨也二于云反煙丨天地氣也俗音珠煽失連失戰二反火盛貌也古正二或作燖今徐兼反以湯沃毛令脫也五徒含反火熱也又徐兼反以湯沃毛令脫也膲音焦人之三丨也俗籀文正燋或作即遙反與焦同傷火也下一又音捉火炬也四二俗古炱正徒哀反丨煤也四或作煤今莫回反炱丨灰集屋也二正通今他昆反火色又常輪反明也又徒敦反三烰音孚火氣也㶼音哀熱甚也膋音聊腸間脂也氏林反丨烓行竈烏携反行竈也又口回反亦明也俗苦回反正作恢大也烘呼東反火貌又音紅燎也熢二俗烽或作烽正芳容反丨火夜曰丨晝日燧也四炘許斤反熱貌又火氣盛也俗音燈正熝今烏刀反埋物灰中令熟二俗音熒檾玉篇于營反丨麻也又苦反丨麻也切韻野死草也焳俗音堆煪自秋反丨熮烋許交反炮丨又許尤反灲俗灱正許交反乾也又熱也二􅢹昌占反丨丨衣動貌􅴜二古文音災燍音斯火斯焦又先井反俗音勞俗去王反炋丕俗音丕火也二俗與終反煯俗音皆輝音暉曰色也俗失遮反正作奢二正許委反火盛貌又日中火也四燝二俗音煮􅲼或作燹正息淺蘇典二反字統云逆野火又許位反義同二所下所解二反俗音嚮側下士知二反二俗音飪或作音熟也力展反小然火也煣人九反屈申木苦老反火乾也㷄賄貫二音楚人云火也舊藏作蕩徒朗反滌丨煦况雨香句二反溫也説文無火㶴尺氏反晟也晟音成杰音仕二同力稔反火舒也即兩反或作燷今盧感反黃焦也二㷆音負丨熾也烜况晚反光明也又姓司丨氏以陽遂取木火於日月也又舊藏作暖許袁反人名在廣弘明集第十九音盞俗於􅎻反正作偃丨仰也又仆也倒也息也又姓奴典反去聲耀亦照反照也光明也熠丨也炷之戍反燈丨也或作今正呼貫反火光明也三俗煉正音練燒丨也二㶦二俗燼二正詳刃反燭餘也四二俗爆四正布教布角步角普駮四反皆火列聲也灹也落也灼也六瑩鎣恚併反丨飾也磨丨珠玉使明靜也二熆㷿炎五俗通今省爓正羊贍反火光也火氣也下又徐閻反八燒失照反放火也自然為丨𬒳人音少炫胡絹反耀也明也火也煫􅥂燧三俗燧正音遂烽丨火也四爌苦謗反大也空明也久也逺也又呼朗反開郎也又苦光反俗音助佐也益也煰二俗燥正乘到反乾丨也三燗俗爛正郎且反火熟也又丨也二燦倉旦反丨爛光明也三俗通或作㸑今七亂反炊丨也又千楦反六七亂反灼丨也出籕文二俗通炕二正苦浪反乾也五熾昌志反盛也猛火也熩俗音戶皮祕皮逼二反炒丨火乾物也煬余亮反炙也向暴也又音羊丨金也烷俗音院或作醮子妙反祭也二􅟼俗音定音謂火狀也煔俗炶或作煔今他念反火光也又胡甘反三焮火靳反火氣也灹陟嫁反火聲也炔炅音桂俱人姓下又古頂反日光也二照正今音照燭也明也二炓力吊反火光也俗音性爡貸二音二俗音愧子峻反燃火也又倉聿反火燒亦火滅也或作正力照反以柴祭天名也又平聲二㷳正今五且反火色也二爁力焰反丨焱火延也又音濫亦火貌音媚焅熱也焪去衆反火乾物也俗平遍反七內反鋻也又子內反鋻音見熭衛越二音乾也二爟音貫烽火熂許既反燹火也灷士戀反摶飰也炏或作烗二今苦反熾火盛也三俗正市照反二舊藏作壞誤舊藏作熯音漢火乾也音賴火之毒丨也灹呼貫反明也音􅦔入聲烼許勿反火煨起貌直律反烼丨火煨煙出貌俗欻正許勿反忽也火氣盛貌也二黠戶八反丨惠也二俗通熱正而列反爇也四書育反尉二俗尉正于勿反又于胃反丨斗火展帛也三焲音亦火光也熤俗焴煜二正音育火光也耀也下一又為立反火貌也三爍書若反灼丨也灼之若反丨樂也又燒也三俗正書藥反倏丨光貌也又音藥煜丨光明貌倏音式六反四炙之石反燎丨也説文從肉在火上霩俗音霍正作霩燚俗音亦俗二通㶿正蒲沒反煙起貌四熀俗古燁正為輒反煒丨火光盛貌也三熚音畢火聲也又丨炥火貌也又俗音燁炥音佛火貌也烙音落燒丨也俗音雜俗穫禾火正胡郭反熱也二烈音列猛丨也又光也熱也火也中丨也業也􅌊如恱反燒也熻音吸熱也舊藏作䯜古歷反出道地經皮逼反火乾也籕文出玉篇三同上或作四俗正呼木呼各二反熱貌也二􅝂俗正蘇反和也熟也二蘇叶反熟也亦和也文字指歸從辛炎也犖吕甬反丨牛雜色也音布角也熼音弋火光也又俗音㶿燱俗音憶俗爀正呼格反火色也二焱呼覓反火花也又音亦火也焯之若反明也又火氣也蒲未反火氣也於歇反火光也又中熱也出玉篇或作燲正虛業反火氣丨上也二烢三或作丑革反裂也與同燠於六反熱也又於告反燩口角苦的二反火燥物乾也俗正今音亦火甚之貌三熠為立羊入二反丨耀熒火光也俗爝正即略反炬火也莊子云日月出而丨火不息也二炈音伇喪家塊俗音煞音赤白澤也俗烏古二沒烏反焃呼麥反赤也又許赤反丨光也或作燭正之欲反丨二烏括反火煙出俗炟正當葛反火起也二俗音疾熶三俗倉括反正作手取也瞁三俗火覓反正作驚視也俗音著正今音弗火光也又畢丨鬼火也二熄音息蓄火也或作正焟今音昔火乾也三二或作今士洽反湯草瀹菜也草瀹音藥三燏音聿火光也㸅音節燭餘也又音即煿輔各反迫於火也與爆亦同出川韻俗熆正胡臘反玉篇吹火切韻作熆下又俗音焰二胡沃反灼也他歷反望見火貌也焅苦沃反熱氣也又音皓旱氣也灻音赤紀力反急也疾也趣也又去吏反數也遽也㸎玉篇音鍤丑輒反火光也又音聶也今爩正于匆反煙氣也二歘許勿反今作居質反土部第五墻俗全羊反正作牆㙠烏奚於計二反塵埃也又相言噟辝也噟于敬反坯俗通壞正普反丨末燒瓦丨也二塠垖四俗通堆正都回反土聚丘阜也六三俗坑正客庚反坎塹壑陷也四二俗填今正音田塞也滿也加也又陟反丨壓也四疆壃居良反界也垂也境也當也二六俗坈而勇反地名二同􅟓方尾反址音止基丨塀必郢反野二古今以者反郊牧之外曰丨又石反村丨也三堵都古反垣丨又姓俗奴老反正作腦也坦他懶反平也明也安也寬也垛垜徒果反射丨也二同㙐埵多果反下垂貌也二俗冢正知勇反墓也種也二塪二俗坎二正苦感反坑也險也陷也四壤人兩反土也塵也又臘節童少以木為之作戲擊也於蹇反擁水也又去聲音婢玉篇云下也又符支反丨附也堄研禮反埤丨城土女墻也垗地直小反禎也二二或作正都禮反隴坂也又音𥿄三音紙著也俗坂正音反坡也二通正徒古反瓶也又口含反亦瓦器也二徒古反填也安古反村丨也墾二正俗口佷反耕丨也三掃蘇老反除也棄也培音部丨塿小阜也或作培又音裴埋也隨也助也益也落口反培丨也陛蒲禮反下也圯皮美反毀也覆也又與支反土橋名也俗正初朕反砂土丨也二俗墠正音善除地平坦曰丨也二音善白土也胡黤反堅土也三俗堡或作堢正音保丨障小城也五音字五罪反音垢埯烏敢反坈丨又今之瓜丨也直尓反落也二埢音卷冢土也埫塎上丑勇反下音勇丨丨不安也佫音㙔于鬼反丨墷也塕埲上烏孔反下方孔反丨丨塵起也正今胡老反土釜也二音墥他管反或作音代以土堨水三古文尸閏反今作舜阱才性反丨也二直利反垞丑嫁丑革二反壩必嫁反蜀人胃平川為平丨力制反音祭醋錯二音埬俗堜正音練丨塘墟名二莫弄反云穀也音照隄也界也堩古鄧反路也􅲎尺志反赤土也圠於罽反玉篇同埋也二古文壞字俗音院塂胡反坪或作今音病地名二埾才句反垛也奴到反三墱都鄧反力救反土日丨音鄰二古文地字古文音既墊都念反下也又徒叶反地名也二同堓音岸古文地字音計音聖音世入聲壁卑積反垣也墻也垤田結反蟻封也二俗二正徒反城上垣也即女墻也四􅱖二俗同上坴音六大塊也􅐉二俗埴正常職反黏土也又和也埏丨打瓦器也三并列反大阜也𡋯蒲沒反塵起也二俗通坼正今丑格反分也裂也又音岸義同又音尺五四俗正呼各反溝也谷也坑丨丘墟也五埸音亦壃丨也二俗正音惡白土也三正墼今墽二或作經歷反磚壞别名也四墆徒結反貯也止也俗墣正普木匹角二反土塊也二音未壤土也圼或作涅正奴結反塞也二堨烏葛反擁丨也音其豆丨也音麥丨霄又音麥丨草也荺舊藏作筠蘇雕反草名蒿也又縣名亦姓俗蘞正音亷蔓草也二蘞斂二音白丨藥名也音由水丨草亦作蓧又臭草蘨音由草盛貌或作正音瓊草旋二音亭丨歷也或作今居幽反草之相丩二新藏作蒙新藏音災田不耕曰丨煮仍反葅也䒰音匡草名莘所臻反地名又姓莉直尼反人姓蒒音師草名蔩以脂反莵瓜也又音演薋疾資反蒺梨也莙音君牛藻菜又渠殞反俗正音脂丨葅也二葹式支反草名扷心不死也䔟音移萎丨草蕠音如丨藘草也茬或作正士之反丨平縣名二相氶敬冝反薼誤􅞉正芳無反花葉也二葑音封菜名䔲音登金丨草也音皆麻稈也葴音針酸漿草也𧂒􅠢二俗正昨焦反柴丨也又木名也三二或作今呼官反化也三茪音光草名菗直由反茶也又菜名䔮音斯草生水中其花可食俗通𦸺正音柴丨葫藥也又隨反二或作音正作賤事貌也或作䓉今以遮反草名二茄音加荷莖也又姓又求迦反丨子也荀相輪反草名又姓菠音波芇音綿相當也又賭物相亭也葳音丨蕤藥名蔣音將菰丨草又即兩反國名亦姓音脾荃音詮香草名􅚄音郎丨毒藥名也音災上音紬下音除丨丨蔥別名也蓒音軒丨芋草名音丘俗音毛又音老俗芟正音衫伐草也二音菩提二字莫朗反草木冬生不死也又音菩薩二字茱上音殊下音俞丨草名也俗菰或作苽正音孤丨又丨蔣草名也三俗災二或作􅫱正側持反田不耕曰丨也四蔞音樓商丨蒿可食也又力朱反丨蒿又其矩反丨數音胡多草貌又俗音孤苛音何政也煩也怒也又上聲菛俗音門俗音親艼音丁丨香也音他渠幽反去角龍也與虬同艽音求獸辱又地名芃音蓬丨丨草盛貌又音馮草名菘息弓反丨菜名䓙古懷反草名艿如乘反草名櫻伊盈反丨薁藤也薁音郁蒹古添反荻未秀者也葭音加丨蘆又徒玩反草名甫煩反丨籬也又音煩二俗荽䒘二或作正音雖胡丨香菜也五俗䔺正恱吹反藍莠也又音隋二蘇和反丨草可為雨衣也又素回反丨丨蘂下垂貌蘅戶庚反杜丨香草大草曰杜若也蕪音無荒也古蓀今音孫香草也二芩巨今反黃丨也居依反葅丨草也葅也余反藏菜也與蒩亦同蒩七余反苞丨又則吾反茅丨藉封諸侯丨以茅又則古反菹側魚反菜和醋也二蘪音眉丨蕪香草即茳蘺也茳蘺上音江下音離丨丨蘪蕪也新藏作郭移音他藏則郎反丨莨莨尾草也莨魯當反童丨草名也藏昨郎反隱也深也收也匿也又則郎反善也厚也亦丨獲又徂浪反庫丨也菆側愁反草名又蓐也又初注反鳥窠也蘋音平萍别名也菄音東丨風草也又俗音練􅽅而容反三芊音千草成貌蓍今蓍正音尸蒿屬巫者以為䇿二繭丑中反草名蒡薄庚反菜也一名荵隱以蘇可為葅薯音諸丨蔗甘蔗也又音除越人呼署預為甘丨又常恕反丨藇也藇音余莞草又音序姓也又音與蕃蕪又音薯丨也墮函云合作蛬音渠容反蟋蟀也蛬渠容居悚二反蟋蟀也棻音焚香木名也搜音搜茅丨草又春獵也莫經反丨菜堯時候月草大月卅日小月草九日花乃也蕘如招反芻丨草也蓐食倫反牛丨草似蘭青黑色也經音義作興字芄音丸蘭草名音草名有毒可為藥苀胡郎反東丨草名又音剛葉似蒲藂生也芭蕉上輔加反下音焦丨丨葉煮可以紡績為布也荼音途菜也又俗音茶胡耕反夲也也枝主也蘆音盧葦未秀者也又丨蔔菜名藂俗古正殂紅反草木聚生也三茅莫包反草名菅草也荷音何蓮也又上聲丨負也萎於為反怨也弱也也丨黃病也芙蓉上音扶下音容丨丨花之巳發也俗葩正普巴反花也又草花茷盛貌二莎蘇禾反丨草也莏同上手捼丨也䓾蔢上音娑下音婆丨丨草水之盛貌也莣音亡草名似芉皮可為索也三俗古瞢正莫登反目不明也又音夢雲丨也五茨疾資反茅丨也䒵俗薅茠二正呼毛反耘也去田草也三芹音勤水菜也薨呼弘反大臣死曰丨茹音如恣也相牽引也又姓又音汝乾菜也臭也貪也雜也又人恕反菜丨也又噉牛也荕音斤骨也丨肉之力也又姓蘿音羅女丨松丨又丨蔔菜名也茵音因褥也俗薑正居良反辛菜名也二荖舊藏音差藤或作藤正藤今徒登反丨蘿也又丨苰也苰音弘三苔徒來反丨鮮石木之衣也俗䔶蕛荑四玉篇皆音提草名也下又音夷莁丨香草也五必迷反丨庥也二蒿也芘音毗丨䔧荆蕃也又俗作萆二苷音甘丨草藥名又丨蔗也皆該二音草根也茺音充丨蔚草名也音煩丨茂滋息也又蘺也屏也又方煩反亦屏也汝羊反荷也又音箱草名也蔫於乾反萎丨物不鮮也主仍反進也厚也衆也薰也又去聲音芙丨也苞音包裏也又豐茂也藂生也又姓苫失廉反草覆屋也又姓藝蕓音云丨薹名也二音臺藝丨菜名也音草名又大麥也萇直良反丨楚􅟵生也蔓上母官反丨菁菜名也又音万筵也瓜葛之丨也下音精菜英曰丨也川韻登騰二音丨瞢目不明也又都鄧反丨也茸而容反草生貌也菅古顔反草名也又姓葌蕑古顔反丨蘭香草名也二音臻草盛貌也士臻反木跬生也萄徒刀反蒲丨也萪音科丨生海邊葉䀔可為也葐蒀上符分反下於云反丨丨香氣盛貌也俗薔正疾良反丨薇也又音色菜􅖋也二蘠匠羊反丨薇也與薔同薇音微薔丨也俗毗連反或去聲正作箯菱力應反丨也二徒丁反草莖也芎去弓反丨藭香草也根曰丨藭苗曰蘪蕪也或作藭正音窮芎丨也二蘩音煩皤蒿也萱音喧忘憂草也葋其俱反艼熒也俗正如佳反葳丨藥名也又草木花垂貌也又丨賔五月律名也二葷許云反臭菜也虆力追反􅟵也萍音瓶水上浮丨也䓑音瓶馬帚似也俗通正音萌屋棟也三蕄莫耕莫登二反尓匹云存存丨丨在也音萌芀可為彗也芀徒聊反花也俗苕正徒聊反丨菜也二正今魯甘反染草又姓二䔠二俗莦正所交反説文云惡草也又音消三蘼文悲反薔丨藥名也敷容反蕪菁苗也蕡符分反草木多實也䒥母官反相當也蓷昌佳他回二反草名又益母也芣苡上音浮下音以車前牛舌也上又音綿停當也莤音由水草又軒于草也其機勤三音縣名亦草名又姓農古文音農音萌葵渠維反怕巴反上聲藴於粉反丨積包藏也荏苒上而審反丨菜也又丨苒也下音染草盛貌也又丨丨展轉也葦于鬼反蘆丨也俗藕正五口反蓮丨也二􅗰古旱反草莖也堇音丨菜也又音芹水菜也音謹黃土也堇音謹穰草也俗藪今蘇口反澤無水有草曰丨又大澤也二蓊烏孔反大也英也又丨鬱草盛貌也蕊草𥘉生也如水反花鬚也又垂貌鬚音須蕊蘃蘂三同上五俗藻正音早文也又色也二蕩蕩徒朗反放恣也又水名亦姓二胡感反丨蓞芙蓉半開貌也􅴓二俗萏二正徒感反菡丨芙蓉未發者也四靃息委反丨靡也與靃同又音霍蓏郎果反説文云木實曰果草實曰丨又有核曰果無核曰丨又陸生曰果水生曰丨通藳俗古老反正作稿禾稈也二菒古老反乾草也音草名於逺反紫丨藥名也又丨茷木名也亦姓苑於逺反園丨囿也韭音九菜也正作韭字菲芳尾反薄也微也悵惋也又菜名又芳非反芳丨也茅或作苧正直吕反草名也二莠音酉似禾非禾之草也蒱俗或作莆正音甫蓮丨堯之瑞草也三葆音保鳥羽飾也􅌲渠愍反地丨也又姓芉亡尓反與􅫗同苡音以薏丨蓮實也又云車前亦云當道亦名牛舌也薺祚禮反甘菜也苨奴禮反薺丨也二同或作正奴禮反華茷盛也上又奴叶反病劣貌也二同音爪草名也花韋委反花也榮也蒍俗蒍正韋委反人姓也二荇莕何耿反菜名高音謹與同以瓢為酒器婚禮用之也菌慈荏反􅌲生木上也玉篇又商錦反莾俗莽今莫朗反丨草又姓二食審反木丨也又知林反蘌音語丨蘙也苘古檾今去頴反野死草也二古文音子蕇音典葶􅏣子也音逺丨志藥名又韋委反丨草亦姓䔸音表草名剃直凡反辛丨辛夷别名又他計反除草也菼他敢反荻也荵音忍藥草也俗正今倉古反草死也三通茈正音紫丨薑又丨草也二古文失旨反今作屎同音魯杜衡别名也魚矣魚力二反草盛貌也作禮反草盛貌俗通蓰正斯氏反草也三蔪慈染反麥秀貌也莒居許反草名又國名亦姓葰蘇果沙瓦二反丨人縣名二同蓓蕾上薄亥反下落猥反丨丨花欲綻貌隨函音聚二或作子小反菜似薺舊藏作跛丁敢反又音占四同通正徂兖反葍丨也二􅚘音犯法也常也式也前也或作茝正音止香草也又昌海反二芷音止白丨藥名又丨陽縣名二俗正音止丨蒻小蘋也二或作正徒口反草蓐也二葈隨函云合作枲息反麻有子曰丨無子曰苴也音耿芋莖也苟古口反且也亦誠也又姓蓼音了辛菜也又音六丨莪也二蕆丑善反備也新藏作古典反苪