師作兠在呪中先箭反縫衣丨也三俗通正直利反宻丨也三直利反刾丨針縫也紺古暗反靑而赤色也綴陟衛反連丨也又知劣反合著也絮息去反綿丨也又抽㩀反和調食也又尼恕反人姓也累力偽反丨帶連及也古作絫厽同紊音問乱也盧暫反維舩丨也俗縵五莫半反無文繒也又紕丨又音慢二繢相對反􅀞丨也繪音㑹丨五釆也或作繢綜子宋反機縷持絲交者曰丨綻丈辨反衣縫解也組音同上􅀘縫也俗綟正郎計反黃色衣也又練結反絲麻丨也二與至反重多也玉篇又移異二音麻也郭迻又武悲反絆也繋音計􅅞也又音系易之丨辝也音􅀊布細而踈者皆曰音恵悵也繀蘇對反織丨也絖或作纊正苦謗反細綿丨又絮也二絢許縣反文綵皃也絆音半馬丨也求位反織餘也居例反氈􅀋也絭去願反束腰也又音眷連弩也又居玉反纕臂縄也繸音遂佩玉丨也継俗繼正音計紹出續也二縋直偽反縄懸也縙俗而用反緭音謂丨繒也緯音謂經丨也又姓繡息救反五色俻也又姓俗余四反紣俗正通子對反㑹五色也上一郭迻又胡卦反三胡卦反絃中絶也胡卦反丨微乖違也綪倉見反青赤色又側耕反礼云齊則丨結佩也隨函云誤合作僣子念反在弘明集第一卷徒外反細紬也絳古巷反染色又州名亦姓或作今則救反衣不甲也亦子也二綉音秀音忌連針也繝古莧反今作橌胡卦反絲結也同絓字音進淺絳色也舊蔵作􅐐而遇反音患縞文又糺也糿舊蔵作㓜在經音義俗正烏計反自丨也二系胡計反同系紒戸計反心不了也俗尼救反入聲䋢普結反馭右回也又方結反軛也上音密下音􅁡皆俗字見舊經音音忽微也二俗盧逹反俗正音􅁲尓疋云裳削幅謂之丨丨朝􅀕之眼也一所角反緘也䋚新蔵作翊羊軄反馮丨郡名縬子六反丨繒文皃音叶丨纊禇衣纅音藥絲色也音必冠縫也音骨丨結也二同䋏音昨組也絀竹律反縫也又音黜羊律反丨長繘余律居二反級綆也子括及結丨也俗正居玉反靴丨子緾連者二去㦸反絺丨葛衣也縌音逆古佩禭也七􅁑反縠属也􅛻莫結反細絲也二同􅕒去月反狄人衣也又九勿反翟衣也七入反績也續也䌌七反連丨也或七入反玉篇又之葉反俱通三俗正音結丨麻端爲也二音結清也靜也縶陟立反繫也絆也拘也䌇俗索正桑各反縄也散也盡也二紩直曰反經也績音積紡丨也継續也也􅔗􅀻列反繫也下又徒叶反西國布丨也四縮所六反退斂短丨也俗絡正音落絡絲也二繹今正音亦大也理也終也長也陳也卷舒也二級音急等丨也給音急供丨也又姓俗纆正莫北反縄索也二纈胡結反帛染爲花也之欲反帶也二域洫二音衣縫也俗或作紱正夫勿反丨綬也三紼二或作通綍正夫勿反大索引棺車也又乱麻也四䌦􅅇道二音緑色㒵也絰徒結反䘮冠也又纕也紇俗正胡没反孔子父名也又胡結反二繳之若反矰丨也又下革反衣丨衣領中骨也又音皎緾也与憿同矰音曽綽昌若反寛也亦緩也与古文同䌎毗藥反又略字轉舌呼即反丨續也相承音碧音泄俗音錯正作縒二形丨綜乱也部第四如六反骨丨也或俗作亦通書変骵作月故与月部相濫耳俗臍二正俗音斊膍丨也四俗二今正許容反膺丨也四胭臙音煙丨喉也又去聲三丑㐫反直也均也䏾二俗胖古膖正今普􅀖反丨脹腹滿也五奴紅反㿈潰腫血也肝音干丨肺也婢弥反心丨也二俗胞正布交疋交二反胎丨也二脬疋交反腹中水府尿丨也肪音方丨也四俗今蘇干反脂肪也五䏧二俗昌支反目汁凝也正従目作四俗二正丁尼反皮厚也六腥胜音星犬豕臰也二俗臊正蘇刀反􅆨也犬豕膏臰也二肌居夷反丨骵也舊蔵作髋音寛苦官反正從骨􅑟膠二同音交丨漆亦大學也又皮丨煎皮成之肤音夫皮丨也又美也傳也俗䏣正七余也丨虫也二徒昆反尻也尻苦刀反奴􅀆人􅀆奴何三反雜骨醬也胲古来反足指下毛也􅏂父非反肌丨多也胚俗肧正芳盃反懐胎一目謂之丨二腸俗音膓胎􅄍来反胞丨也臚正今音臚皮丨腹前曰丨又鴻丨寺也二誤舊蔵作􅃾􅃾羊朱反腹下􅏂也二胹俗臑正音而煮也二􅳺音儒嫩軟㒵又而兖反脚疾也肬音尤丨贅也腫也病也与疣同俗肣正胡南反鞴囊柄也二腤烏含反丨煮也􅧐俗正作含反丨外善也二音夷猪丨也新蔵作豚豚正今徒昆反方言去豕子也三五俗戸交反正作丨饍也膭公回胡對二反􅏂大㒵又以酔反疾也䐗音猪与豬同豕也朐其俱反脯丨也又姓俗正音髙脂也丨凝者曰脂也二俗音侯俗音邊俗音消伶音荼膛俗音堂肱古弘反臂也四俗徒登反螣徒登徒德二反丨虵又曰食禾虫也鰧徒登反魚名倉身赤尾也幐徒登反囊可􅅁者也膡徒登反美目㒵也謄徒登反移書丨土也縢徒登反行丨也音加腹病也俗正音叉腵丨脯也二腣仾帝二音丨胿胅腹也音奚腣丨也膎戸佳反脼也食肴也脼音兩俗胵正昌脂反膍丨鳥蔵也二俗音耽䐎丁奚反丨強脂也古膋今音聊膓間脂也二腓音􅏂脚腨膓也又扶未反病也俗戸乖反胢俗苦何反正作䯊肢俗胑古今音支四丨也三二俗臉正士廉反丨臛也又力斬反羮属也三腮俗蘇来反正作顋徐兼反丨剥猪羊也与燖同䐩古哀反􅏂㒵又公回反畜胎脠也正作骽腲脮上烏每反下他每反丨丨􅏂㒵也下又奴罪反魚敗也䐘奴管反温丨也下又奴困反丨也二徒古當古二反腹丨也䏖直引反赤丨也又羊忍羊刃二反當脊肉也通胗正之忍反丨皮外小起也亦脣瘡也又居忍反二脡他頂反脯朐也二俗音乳脯音甫乾丨也䐔䏲俗上博顕反下吐奚反正作匾􆂇也腑音府肺丨也䐮􅀄限反皮丨也脼音兩膎丨也或作朓正他了反月行疾出西方也二俗竹主反􅀄斬反臉丨也又七廉反丨臛也与臉同䐏尺准反􅏂也俗於舉反俗朏二正普乃反月未盛明也又芳尾反丨月三日明生之名又普對反向色也三居兩反頭也脥謙琰反腹下也都罪反丨大腫㒵呼罪反丨俗音水䤚音里女九反食也又古音肘胣移尓反引膓又裂也又􅃙紙反苦忝反腰左右䖏也音現􅇥也又俗時忍反肗音汝魚敗腂今玉篇音累皮起也郭氏又俗力果胡瓦二反腇或作奴罪反与脮同魚也又於偽反􅍧􅂫本反切熟肉更煮也䐌俗腆正他典反厚也善也忘也至也二正肯今苦等反可也二㬶音晧或作臇正子兖反臛少汁也二膹浮􅀑反臛多汁也又房吻反切熟也脘音􅃹胃府也又俗胡板反正作睆音吕脊丨也􅡗舊蔵作同上腩奴感反煑也䑍俗於井反正作癭瘤也䑆俗音養音管􅏂丨或作今武粉反􅀃文云䈥頭也䈥音斤二音紂腿後也又小腹痛也舊蔵作丨方免反敝㒵也玉篇虚講反􅏂也隨函又音古侯反反丨相黏也又陟加反不密也䏧女亞反膩也食證反孕也音􅀉四柱也丁定反貯食也又音丨腧傷遇反五蔵丨也於丗反丨憶也肕音刃劳丨也膪上烏嫁反下陟嫁反丨丨􅏂皃也許放反山名腅徒濫反相飲也玉篇又餅丨䐄胡紺反食肉不猒也俗徒困反正作遯古對反腰忽痛也誤芳貢反正作􅈖􅉠也俗常利反二例反胡計反喉脉也又胡結反膜丨二同俗左浪反二俗音䟽俗於訃反正作隂風也俗烏對反胦俗於敬反正作眏臎七酔反鳥尾上也先卧反骨膏也胕音附肺丨也䏒普見反半軆也俗于句反俗所諌反䐆倉代反大腹也腃俗音眷正作睠還頋也人遇反舊蔵作膭以酔反肉􅔂㒵胙音祖􅀕餘肉也俗􅋯正音具瘦也又音翟二入聲俗音􅃗俗音􅄫􆇋俗育正余六反長飬覆丨也二􆄻音託丨脪也滴也澆也俗俗通渠云反二䑈俗書若反正作美目也俗音䐞音若脆腝㒵也䐚音即膏澤也䐲直立反半生半熟又直􅂺反也膕古麦反脚曲㒵也蒲末反脛無毛也一曰股上小毛也䏳旨􅀬反脟也脟音劣也䐘其虐反丨丨大􅀏也腋􅄹益支亦二反胳丨在肘後也相逸反脛上骨節也臆音億胷骨也脈俗脉今莫厄反血丨也幕也以醎養丨血理之分行於骵中曰丨正作衇二脊精亦反背丨也二俗肋正音勒䝱丨也丨者撿勒五蔵也二膜音莫丨也又莫胡反梵語曩丨也玉篇瘦也目丨音曽目小作態瞢丨也眱音夷􅀬視不言也又大􅀆反古堯反倒懸首也俗䀠正音俱左右視㒵二二俗音希正作晞陽露滳也二俗䀡正丁兼丁念二反目垂㒵二宅耕反安審視也章倫反目也盿䁕旻民二音伭目視二䀬音全目眇視㒵籕文古文音眉丨毛二呼圭反玉篇云音也俗倉胡反䁲正莫佳反視也睷乹健二音出香嚴随凾眒音甲鳥獸驚㒵也又時刃反張目視也况于反丨膢夹㒵音啼丨視困貝莫經反合眼丨丨也又莫見反眩丨也又莫賢反闇未明也音賔古文音融古文音陽􅝯俗正疾塩思暫二反閇目内思也二或作今音旻視㒵也二瞇音玉篇眇目㒵也二同瞟普澆反明察也又撫反丨睽明視也瞦許其反目童子也与之反玄眩二音目童子也武延反密緻也矊武延反童子黒也又丨眇逺視也古玄反視㒵視㒵火玄反亦視㒵三眙与之反肝丨縣名又田吏反乆視㒵合作􅑥見随函䁹俗布迷反舊蔵作腴音俞􅏂丨盺俗音欣或作力丁反二䀽音延相頋視也䁢似泉反好㒵也音賔丨暫見也又恨視㒵當侯反丨眵目汁睼俗烏耕反正作字呼交反丨瞎也音煩上聲二俗正音古音丨也三睒失冉反暫見也盾食尹反于丨即矛丨也又徒損反人名也二俗眪正音丙明也二於阮反目病也又音腕大目㒵又烏括反小無媚也䀕直引反瞋怒目㒵也同上目童子也又􅁻刑兆曰兆丨也二薄啓反俗俗明也眕之忍反目有所恨而止又厚重也三眇弥小反一目少也又視不正睜疾井反丨不恱視也眫俗眯正音米物入目中也二瞼音撿眼丨也睹音覩㸔也見也俗睆正戸板反大目也又􅀏二俗睴正胡本五悶二反困視㒵也二䁪俗音斬睍音現小目㒵也矘他朗反丨䁳目無精也又失志皃莫朗反矘丨也眅布綰普綰蒲綰三反目中多白㒵又大也俗奴頂反莫頂反丨睛目細㒵俗瞴正音武微視也二俗烏朗反俗他典反正作面慙莫板反視㒵俗覩妒二音俗昌者反俗於矩反俗陟雨反䁗俗苦改反苦礦反丨然舉目又好㒵也方免反敝㒵玉篇又香兖反迴視也郭迻又胡慣反方免反敝㒵也盶音阮目白㒵也古了魚列二反音頂三足兩耳鐺属也䀾音覩人多也古了反烏板反丨目㒵古文音首二古文同俟䁂音限丨可畏視也音首去聲眴䀏許縣反目動也下又音舜又如匀反又相輪反眩丨也三瞚瞬音舜目動也二眩玄絹反丨惑也視不明也目無常主也於計反目中丨也奄覆也音下悶也安也又目中白也二俗䀎通正莫見反斜視也四正眺今他吊反逺視也又目不正也二睐勒代反傍視童子不正也睇音弟邪視也音悵失志㒵也眊莫報莫角二反目少睛也睠音眷􅅆頋也音視㸔丨也下又音匙亦視㒵也二䁅音孟丨盯瞋目㒵也苦候反丨瞀也瞀莫候反丨也又莫角反目不明也又莫胡反睚五賣反裂也丨眦怒目㒵又五佳反二同俗通眦正士賣反睚丨也又五佳反三通眥正在詣反視也又目際也又才賜反亦目丨也二睥睨上疋詣反下五計反丨丨視人㒵也俗烏半反正作䏺手丨也䀡丑熖反視也又式熖反莫報反伭目細視也詣糸二音根視也盼正通疋辨反美目也二眮徒弄反目頋視皃亦轉目也俗正時刃反古文人姓二俗􅷃正丑絳反直視也二瞰苦濫反視也古文音照四䀸征例反目光也又丑例反蔽目也又旨熱反目明也俗羊至反正作䝯重物次弟矔音貫張目舊蔵作䀎莫見反二俗音俗居偽反正作丨睹瞶音貴極視又俗五恠反正作瞶呼貫反囯名在流沙三音刃眩丨俗之刃反正作賑論文作經音義作丨䧟丨没也在智度論俗香反二通正雖酔反正視㒵潤澤也又子對反際也三於蓋反丨隠也于况反美光也入聲四俗二今正音接目丨也目傍毛也七眤俗尼乙反又音日正從日二䀲目病睦音目親也敬也和也又姓二或作正許鎋反一目盲也二俗瞩正之欲反視也覩也二俗或作䁻正書藥反美目㒵也三睩音鹿視㒵也音歴丨視明㒵也􅀄八反丨視㒵也眣徒結反目出也眰丑栗反目不明也又俗同上莫結反目赤又瞎也胡結反䁾丨目赤也丁結反丨􆄪也音血丨􅁖皃也弥二音汗面皃也䀳郎逹反目不正也眛音未目不正也䀛音永不正視也又莫拜反丨眼乆視也瞙音莫瞽丨也俗丑列反今正音藥矐丨視皃也二俗眨正側洽反丨眼也二矐呼各反重目又失明也又户各反望也䁯二或作正呼葉反閇一目也又音疊三音攝目動之皃音釋睒丨􅇥視也於决反目深皃也二或作䂄正許􅅞反大視皃三矍居縛反視􅃍􅀃文云欲走也阻立反淚岀皃古穴反目患也睰莫八反視丨也玉篇呼没普没二反􅇥視皃也䀣莫八反􅁖視也又音秘亦直視皃也䀿之列反目明皃舊蔵作許乙反丨響也䀨呼八反視丨俗正疋滅反目翳也二女洽反又舊蔵作㽞瞐莫角反美皃也俗䁆正於葉反閇目也二䀷音刧目視皃䁍苦洽反目丨也又口陷也瞱筠涉反目不記也瞁呼覓反驚視呼覓反眼也又音􅟕通䀹正五洽反丨戯謔皃也音士㮑反二音育望也又目明皃䀫古洽反眼細視或作正音麦邪視也二䁺音釋視皃五甲反視皃呼末反視髙皃也音食音鹿丨也側略反日部第六曦許冝反日光也又光明盛皃也俗暿二正音日氣乾也三音良度也稱也又去聲昕音忻日欲出也晜古昆今古渾反兄也後也同也又姓二晡布􅀌反申時也四俗正音昏闇也五暒或作晴正音情天丨雨止也或作睲二俗莫丁莫定二反正作㝠二字暲音章日明也二或作曼正莫官反路逺也又音万長也三俗丑庚反正作瞠直視也晠俗晟正音成食噐也又氶正反明也熾也亦噐也二暸音聊明也音郎芳無反时古㫑俗音時一古文同上正篇古文上音春下音時七余反暆音移東丨縣名五剛反舉也音貪􅔟俗古昨勞反丨軰也我也衆也又曉明也今与曺同又呼鳥反二俗明孟二音正作俗正陟遙反虫名二居􅁜反巨容反俗音閑正作􅳌人目多白㬈音温昷音温仁丨諸比􅀋也与昷同旻丨天旼武巾反和也二烏甘反音晨義同音單又去聲晑古營香兩二反明也晐古来友明也曛許云反日入也又黄昬時也暟俗五来反正作暟雪白皃曨盧紅反日欲出􅲿呼光反旱熱也似泉反同嫙好皃他昆反日􅀄岀皃晶音精光也曑俗所今反正作參㬝俗音層正作㬝目小作態也旴况于反日始出也晆苦圭反丨别也晲五􅀆反曭他郎反俗正音潜古於丨縣名二或作晁正直遥反人姓二俗音正作閇目内思也㫴俗呼交反正作倉来反曐古文音星同上俗於容反癤也音煩音尤音遷音其上聲暡烏孔反氣盛皃也晃晄胡廣反明也暉也日光也二昊胡老反丨天也同上晧胡老反光也明也日岀也胡老反明也旰也光也曜也又姓亦太丨也俗蘇口反莫孔反暡丨日末明也又俗音􅂪古老反明白也旿音五明也暐于􅀑反丨曄日光盛皃也昞俗昺正音丙光明也二二俗暖正奴管反温丨也与暖三同三古􅄧正音夘西方星名也二昉方同反明也式兩式亮二反少時也亦乆也又許兩許亮二反俗古瓦反正作咼㫱奴板反温濕也又丨諌反音晩音項昑玉篇立錦反明也二同暏音覩朝欲明也於阮反丨晩也舊蔵作皂五果反眼也㫰新蔵作眼字蘇老反昈音戸明也又文綵伏俗之忍反正作炅古逈反光也又音桂人姓昰古文音是晚旡逺反丑兩反通也明也舒也昄方滿薄板二反大也切也暻俱永反明曲見悟也又許永反暕占限反隂旦日明也將序反音體九究二音晻烏感反丨藹暗也􅄀也又衣檢反丨丨日無光也藹於盖反晛顯現二音日光皃也又奴見反義同子感反人姓俗正莫朗反日無光也二今晥正胡管二明也又縣名二旧其九反二晱失舟反古了反明也清也俗音免王作冕冠丨也晷居水反影也䂓也音祖古文音􅀑俗七罪反正作霜雪狀也暅許晚反日氣也又古鄧反去聲音下白在閑也於敬反影也映音同上又於浪反反暗也昡俗古縣曬所賣反日暴乾也又所􅀉反曠苦謗反光明也又乆也逺也大也又姓替他計反廢也滅也代也冐莫報反覆也又莫比反十也曀於計反隂風也亦翳也日又反晏通正烏周反安也天清也二曜戈􅀏反日充照也暈音運日月傍氣也古恨反今作艮卦名也於盖反日色也曖音愛日暗皃也古文音照􅐫㬄丑晏反赤色也子閏􅀻閏二反早也明也敬也􅧵奴代反無光也新蔵作雖遂反視皃又子對反周年也舊蔵作音謂丨􅀋也晦荒内反􅄀也又月盡也通正子對反周年也二音值㫢句反㬮奴按反安也温也㫬俗昫正香句反日光也二晤音悟明也朗也㬗奴見反日光也昲芳味反日光又乾物也㫓俗音氣正作盵俗時刃反正作眘人姓㬬俗其遇反正作䂂㬓通正疋妙反置風日内含乾二俗音愧正作大視也或作旰今古案反日晩也晏也玉篇云半乾皃二正􅙬旺二今于况反美光也三皆音照三古鄧反曔音競明也曙常恕反日欲曉也俗他吊反正俗視也暳呼惠反小星也毗祭反暵音漢日氣也音運同暈旵丑鍳反㬩息反入聲白部第七皃俗音完丨全也或作正音婆頭白皃也又音波人老面白皃也二三俗得侯反正作皚五来反霜聖白皃古泉正音全丨水又錢别名二皅俗普巴反三古又音皇古文星字音皇音暉音男上聲皓胡反素也白也皦古了反明也皎也又珠玉白皃也㿟古了反白也又疋白反皎古了反日光也皀烏了反合也又彼急居立二反榖香也又音皃与皃同皛胡了反明也又普伯反亦打丨又莫百反呼鳥反白丨也皉千礼反白色也􅀘米反明皃也皠七每反霜雪白狀也皔音旱白皃也正皏今普幸