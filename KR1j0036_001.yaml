  text: 龍龕手鑑平聲卷第一釋行均字廣濟集金居音第一人如隣第二言語軒第三心息林第四山所閒第五車昌遮第六長布遥第七門莫奔第八刀都勞第九衣於希第十示巨支第十一牛語求第十二爿疾羊第十三文武分第十四支章移第十五皮符羈第十六方甫良第十七風方容第十八几武兵第十九亠徒侯第二十舟織流第卄一毛莫袍第卄二斤居忻第卄三巾居銀第卄四勾布交第卄五矛莫浮第卄六禾戸戈第卄七隹織唯第卄八弓居戎第卄九田徒年第三十宀武延第卅一羊与章第卅二身失人第卅三尸式脂第卅四魚語居第卅五戈古禾第卅六囗玉非第卅七韋雨非第卅八音於金第卅九多得何第四十尤羽求第四十一光古黄第卌二香許良第卌三􅒋落官第卌四殸口耕第卌五黄胡光第卌六辛息隣第卌七厶息夷第卌八髙古勞第卌九其渠之第五十章諸良第五十一生所庚第五十二冫筆夌第五十三彡所銜第五十四來落哀第五十五兒汝支第五十六而如之第五十七臣食隣第五十八羸力爲第五十九龜居追第六十元愚袁第六十一云王文第六十二雲王文第六十三匚甫良第六十四殳市朱第六十五瓜古花第六十六龍力鍾第六十七畨普官第六十八僉七廉第六十九天他前第七十西先兮第七十一无武扶第七十二凡符嚴第七十三名武并第七十四亭徒丁第七十五牙五加第七十六卑并移第七十七寜奴丁第七十八男奴含第七十九孚芳無第八十䧹憶水第八十一申失人第八十二虍荒烏第八十三居夌第八十四甘古三第八十五么於堯第八十六巛苦昆第八十七甾側持第八十八由以周第八十九女夷第九十冂古熒第九十一單都寒第九十二圭古隽第九十三許容第九十四興虛凌第九十五丹多千切第九十六知陟也第九十七金部第一玉篇七南色咸二反丨馬口中䥫也又思感反魯甘反丨也二或作銎正音丨懼戰憟也又斤斧柄孔也又音恐三俗或作錙正側持反丨銖也三䥊俗錆正七羊反精也二鐖居依反鈎名俗或作正鋒今芳容反兵刃端也四鎔音容鑄也鏞銿音容大鍾也二鋪普胡反丨陳也布也又去聲戸瓜反丨鍫也宋魏之間謂錘曰丨下又音吴錕丨山名二銷音消丨鑠也散也莫侯反与矛同長丈二建扵兵車也三釘音丁䥫丨也又去聲釘栓物也鎸鐫三俗䥴正子泉反也又戸圭反大鍾也四鋑古文同上又七九反丨刀也銞古鈞今决匀反均也法也陶也陶法均平無等差也又三十斤曰丨也二鍼今䥠正音針丨線也刾也又巨炎反人名也二鉗巨淹反丨索之類也鉆巨淹反持䥫夹也銵鉺鏗口耕反丨鏘金石聲也三同鏘七羊反鏗丨金玉聲也鈜戸萌反金聲也鑅上楚耕反下音嶸丨丨鍾聲也鍧呼萌友鏗丨鍾聲与鼔聲相雜也釭古紅反車丨轂口上䥫也又音江燈也鐹鍋古禾反温噐也又音果釣也二同俗鑱正士銜士懴二反犁䥫土具吴人呼也二銛息尖反利也尖也鋀通鍮正吐侯反丨石次於金也又徒口反二鈔初交𥘉敎二反取也又与抄同畧也鈐巨淹反兵丨又釣也鈿音田金花寳丨謂之金丨也鐐音聊有孔鑪也又紫磨金也又白銀美者也上又音料下音流義訓皆同二鎗楚庚反丨鼎也鏝莫官反泥丨也鉎音生䥫丨又音星䥫丨也鑚子官反丨刾也又子筭反錐丨也鐎音焦温器三足有柄者也又昨焦反鋋延禪二音方言云小矛也鏈丑延力延二反鈆鑛也鏻隣靈二音健皃也武巾反銳也武巾反筭稅也音煩廣刃斧也音冤鋤頭曲䥫也釗古尭止徭二反覿也逺也見也勉也又弩牙也魯刀反鑪鉺也鏖於刀反温噐也亦銅盆也鋻音堅剛也又音見丨刃也䤬鑼上音娑下音羅丨丨金銅噐也鐳音雷壺瓶也鍰戸関反六雨曰丨鋼音剛堅也精也俗鋩正音亡刃端也二鈆或作鉛正音縁丨鍚盲金也二鐃女交反丨鼔似鈴無舌又小鉦也軍法十長執丨也鉏士魚反田噐也又誅也又士吕反丨鋙不相當也鈗俗鈂正䤟今音沉錘属也錘音楚洽反錘秋金也三錬音東丨􅣾車轄也又俗音錬錍必支婢迷二反比金斧也鑲汝羊息羊女羊三反並兵戎噐也俗銓正音詮衡也又次也量度也二鐄音撗犬鍾也鍠音撗和也樂也又鍾聲也鎊普郎反丨削也鋃音郎丨鐺瑣頭也又鍾聲也鋿音常車丨輪䥫也鉠於京反鈴聲也俗鑏正女耕反丨丨金聲也二􅣏音孤丨也音卜錕音昆丨鋘䥫赤色可爲釰也鉦音征鐃也似鈴誤錞正音純丨干樂噐也下又音隊矛下銅也二鍪音牟兠丨首鎧也􅣱音賔丨䥫出罽賔國䥫中最利也舊蔵作錘音直追反錘直追反􅱨丨也正音孤今作俗音敦鑪音盧酒盆也又丨冶也舊藏作舒䤵俗音非正作扉戸丨也鎡錤上音兹下音其丨丨鋤別名也銶音求鑿属也俗音兹鈎俗鉤正古侯反丨抽也又屈䥫也又釰属二䤺合作釿釿音斤斫木噐也又冝引反齊也二鍬鐰二或作鍫正七遥反臿也三鎕銻上音唐下音提丨丨太齊兒也鍉音仾丨歃血噐也歃音所洽反上銜反鎞邊奚反釵丨也銕音提䥫名也鈹普皮反說文大針也玊篇刀也錟徒甘反長矛也鐔徒含反劒口也又淫尋二音亦劒鼻也又姓今鍯古文音忩大鑿中木也二新蔵作音忩俗音川鈋五禾反去角也圎也与隆反鉡音盤鉫音加又古荷反戸耕反古行反又去聲錂正今音陵金名二音留金名又殺也又力救反鑇經音義云茨奚反謂丨郭氏音子奚反丨持也在中阿含經第五十五卷俗音離䥡俗修秀牒三音經音義云冝作麸在中阿含經正鍴今音端濽也二銘莫經反丨記亦名也鍸音胡俗鏐正音流美金也二誤鑣正甫嬌反馬銜也二上音下音謹鈝同玊篇于今反在呪中鑫許今許運二反鈈俗鉟正符悲芳悲二反丨刃戈也二音床釖音刀禹愚反鈓或作銋今如林反丨濡塩韏也又如甚反鍖丨也韏音勸鍖音丑甚反二錭徒刀反丨銚也丁兮反䤞音尤䥩音微懸物鈎也鐻音渠丨耳之環也音鋤丨鳥白露也鈘巨金反持也鍝遇俱反鋸也鏍或作􅟋正落戈反銼丨小一金也二鎪俗通䤹正音搜馬耳也二鉷音紅弩牙昨閑反小鑿也誤舊蔵作鈎鎖千佛名在賢愚經中錅或作鑗正力脂反金属也二鏫力尸反丨也鍭侯候二音尓疋云金鏃箭羽也釪音于錞丨樂噐刑如鍾嗚以和鼔也音竒釡属又音蟻三足鼎百蘭丨又姓銂音州鐊俗鍚正音羊兵名又馬頟飾也二鑾落官反丨和鈴也鋮俗音成俗音鎔俗行交反或作鈃正音形酒噐似鍾而長頸二鉶音刑祭噐也鎢音烏丨錥温噐也錥音育音烏丨鏝又戸花反兩刃錘也錘音楚洽反鑙古兮反丨堅也鋂音梅大鐶也戸間反指丨也俗正賷齊二音利也二鑃其俱反兵噐㦸属也鑐音須鎻中丨也銖音殊分丨也俗正音俞祭名也二鐼符分反飾也又許運反䥫類鈳音阿丨䥈䥈音莽錏烏加反丨鍜也鍜戸加反錏丨也鈀音巴兵曺也又暜巴反方言云江東之鈚箭也音叉錢異名也誤鉈正鉇鍦二今失支反短矛也又俗視遮反四鍕二俗上音軍下音持梵語此云雙口澡灌也胡男反鎧别名也鋡胡男反受盛也音柔濡也謂䎡䥫也釚音求弩牙也鉜音浮丨鏂大釘七恭反短矛也又音䆫彼為反鉊属鉊之遥反淮南呼鐮也鉖徒宗反釣丨鏂烏侯反丨銗也銗音侯鏂丨錏鍜也彼為反鋸鉏也鐘音鍾樂噐也鈭即移此移二反丨錍斧也通正音弥青州人呼鐮也二鏔与支反㦸無刃也鐁音斯平木噐名鈚音毗犁丨别名也又疋迷反丨箭也音漂刀劒鞘下飾也又必妙反二食陵反二鎌鐮音㢘刀丨也亦廉也二同鏜音湯以䥫貫物鐦苦廻反鈇音夫鉞也丁含反鈖相承方貧反玉名鋰良冝反釾或作鎁正音耶鏌丨劒名鏌音莫二正今音尖鐫鋒二古文音𥘉音封正鐟今子含反無盖釘也二三俗鐈正音橋似鼎長足四音帝噐也音鈭二或作雌資二音正作鈭鏢音漂刀釰鞘下飾也又必妙反鐺音當銀丨也又音湯鼔聲也又俗楚更反也古文音初相居反上聲古鋛二俗鑛正古猛反金銀銅䥫璞也四鏁俗鎻正蘇果反䥫丨也二鑳通正音件管籥也籥音藥二俗鉹二正玉篇昌氏反釡也又甑也下又音移方言云甑也三鉅音巨澤名也又大也􅣾都果反車轄頭䥫也䤻徒果反車轄也又犁錧也錧音管車具也又音貫車軸頭䥫也又犁也鈄天口反姓也又香嚴作邪斗二音鋌徒頂反金銀丨也鏨才敢反丨鑿屬也又慚讒二音亦刀鑿義錪多他典二反小釡也俗鏟二正𥘉産反平木噐也又𥘉限反三亡敢反呪中字俗音􅍫䥈莫朗莫古二反鈷丨也鈷音古丨䥈也俗桑朗反苦管反丨縫也鈕女九反印丨也又姓鏋音滿精金也鈑布綰反錫金也釕音鳥丨鈌帶頭飾也䥵土了反䥫文也胡老反温噐也切韻又丨京錁音果江准云鐮也鋠時引反圎䥫也銑蘇典反金㝡有光澤者曰丨也俗古瓦反鍺丁果反車鐧丁果反丨鈹也䤾苦感反鎻連鐶也胡項反似鍾而長鉼必井反丨金胃之板也俗今亡范反馬首飾也二鈶音似鋋也奴礼反絡絲也䥯薄買反大䥫杖也鍇苦騃反䥫好也鑘落毎反鍡丨又音雷劒首飾也鍡烏賄反丨鑘不平皃鈏音引錫也鏾音散弩牙緩也正俗之展反撃也二丑免反丨物令長也釦音口金筋也鉉胡大反鼎耳錋徒口反酒噐也或作鍮今作鐙鋙䥏音語鉏丨樂噐也二来反連絲鈎曰丨鐪音魯釡属之酉反䤥居委反戻鋸齒也顉五感胡紺二反摇頭也又去音反曲頥也音罔二歩項反音矢作管反音銣尼主而遇二反鐥音善亡返反引也正作挽鍖丑甚反丨錐也音苟於許反又音烏居兩反錢也又孟康云丨錢貫䋲也鏙七罪反丨錯鱗甲也釥七小反好金又淨也必老反音散
