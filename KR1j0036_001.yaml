音而古稚反俗女六反音俻音甫臣部第五十八音堅音加音王臤慳看殸三音堅也又若見反上聲音返之忍反与同明也扵徃反背也音墮去聲俗所類所律二反音秘音貴入聲𦣱俗士革反𥘉革反蒲木反今作僕侍從人也羸部第五十九羸力為反丨瘦也極也痿也劣也疲也三落戈反魚身鳥翼獸也驘落戈反馬也落戈反縣名又音連鸁落戈反桑飛鳥也落戈反木名可為箭笴落戈反榖積也落戈反草名生水中也蠃落戈反水䖝􅑕属也又郎果反蜾丨蒲盧也郭璞云細腰蜂也嬴人姓贏以成反利也益也財長也有餘也二俗臝正郎果反赤體也二部第六十俗通正居追反水介虫也說苑曰丨五色似玉似金上髙象天下平法地又居求反下又音丘丨兹國名也二音丘國名俗音元正作黿俗音陁正作鼉二俗五髙反正作音㝵俗上音知下音誅作鼄也陟矢反俗并列反正作鼈部第六十一或作正蒲交廻吊二反牛脛相交也二二俗或作呼廻反正作􅳐丨尵下又許鬼反三徒迴反正作􅯁虺丨音衣居夭反五俗正音元似鼈而大也六烏光反上聲苦礼反二市勇反音始去聲俗与制反正作裳入聲音側音寂云部第六十二䢵音云邑名也二同音云乱也落戈反音牽音含上聲弥引反丨未也一音尾去聲棄弃䡖利反捐也三同音弃除也去也昌介反入聲㐬徒沒反水從穴中岀皃也扵業反音卒雲部第六十三或作烏感扵檻二反正作黤青黒色也或作他感徒感二反正作黮雲黒色霼虚豈反飛雲皃靉音愛丨靆雲興盛皃也俗靆正音代靉丨雲狀也二或作靅正芳味反靉丨雲布狀也又音佛二䨺徒罪反徒昆反霒於今反匸部第六十四匸甫良反受物噐也又胡礼反有所蔵也奩俗匳正力潜反香丨鏡丨盛物匣也二俗匯正口懐反澤名也又胡罪反水迴皃也二區豈俱反丨分別識也土兮反匾丨薄皃音詮薄也又竹器名也二俗正今音舎舩沒也四匡去王反丨正助輔也又姓匰音丹宗庿盛主噐也音盃匜夷遲二音徒聊徒田噐也古文則郎反厚也亦姓令作似泉反滋米竹噐上聲必典反丨廣薄也籕文音乃二俗正虫篇音彼又徒吊反田噐也又平聲二匪非尾反非也亦作篚三同叵普火反不可也又甚也烏口反丨擊也与敺同音䡄匣也匬羊主反㔶音感箱類一曰覆頭也又音貢小抔名去聲匶古文音舊乆也又尸丨在棺曰丨二匠疾亮反工丨匱彺位反匣也慳也竭也乏也入聲譬吉反偶也合也配也二也又四丈八爲丨故從八也匿尼力反蔵也隠也微也亡也隂也女力反虫食病也俗通匧正苦叶反函丨也二匵音獨匱也㔴俗正音弋大鼎也二匼苦合反丨迊与同古文月字殳部第六十五殳市朱反兵噐也釋名曰丨殊也長三尺無刃有憧挃於車上使殊離也又姓俗㱾正􅴶上二苦哀反下呼来反丨丨笑声㲀時人反喜也口動皃也音加烏官反正作剜㲂直耕反字書橦也郭迻又俗昌兩反俗宅耕反正作戸交反和雜溷乱也音皮或作正力塩反丨鼔今之杖鼔也二音頭専皃也注音胡大反舊蔵作敳五未反所有理也亦八九名也上聲毆烏口反擊也与敺同二音攺更也音毁春也乃后反乳也俗虚委反去聲􅐧或作毅正魚既反果敢有决也二俗以芮反正作聖也苦定反同磬石樂噐也殾息俊反俗字音救強撃殹扵計反擊中聲也奴候反乳也彀古候反張弓也古候反取牛羊乳也音殿入聲縠胡谷反羅丨也􅕪胡谷反螻蛄也穀胡谷反杸水聲胡谷反濁酒也音速榖丨動物也毇音作精細木也三古正音煞戮也法也下一又所拜反猛也疾也四俗胡角胡教二反糓俗二正古木反木名也三俗轂正古木反車丨也二古木反足跗也苦谷反土塹也苦谷反麻丨也苦谷反餅麹也䍍苦谷反未燒瓦也觳胡角苦角二反受三斗之噐也音喫功也漢書云功苦丨淡也角榖二音雙王名也榖俗二正呼木反日岀赤皃也三􅩸呼木反獸名似功而小食猕猴又名黄腰又丁木反丨速也許角反急束也許角反怒也歐吐也音笛對也當也四也也主也二俗音昨正作穿也苦角反鳥夘也或作呼木反毆声瓜部第六十六瓜古花反尓疋曰丨華也廣疋云龍蹄獸掌等丨也尓州名又丨部与爪部相􅐭爪音側絞反俗瓠正音胡丨瓢也又音護瓜丨也二今􅕧正音盧瓠丨也二俗古瓢今毗消反瓠丨杓也三二俗正穰二音瓜實也三作分布二字古文葫字窊凹也畖烏瓜反丨㽜地名在絳州二音零小瓜名也䉉音孤方也漢書云破丨爲圎也㼋音孤瓜也古侯反丨􅕕也正􅕕今落侯反丨苦丨也二俗㼔正音温瓜名也二徒昆反㼔丨瓜名也㼐部田反黄丨瓜名也苦圭反丨茹也㼕音當瓜瓠也俗禳娘二音正作瓤字上聲二俗胡果反㼌与主反微弱本不勝末也窳羊主反噐空中亦病也寙況兩反縣名也俗正奴罪反傷瓜也二力點反瓜名也至偃反瓢也郎果反去聲耶電反瓜丨也直禁反青皮瓜名也入聲二俗正徒結反瓜丨也三冬毒反瓠丨㼎或作瓟瓝二今蒲角反小瓜丨也三龍部第六十七龕今正苦甘反坎也塔也又龍皃也二聾盧紅反耳丨無所聞也㰍勒紅反丨筐也廣雅云舎也龓音籠丨頭与同或作䆍正落紅反禾病也二豅大谷礱音籠磨榖具也二蠪音籠赤駮如狐九尾音如小兒食人一名踦丨音籠築七丨榖也音籠大声也龔九容反人姓正或作令音堅龍鬐也鬐音耆三巫也􅶱音龍圭為龍文也二音籠赤也新蔵作壟壟力種反丘丨也二龖龘徒合反龍飛之皃也二同讋之渉反多言也畨部第六十八畨普官反丨禺縣名在廣州又音盤丨禾縣名在凉州又孚袁反丨次也音煩百合也北潘反部黨也第七十四名夜反名養反名也反皆呪中字亭部第七十五亭匠反亭音作亭夜反響梵音亭單反響梵字牙部第七十六去竒反牙邪也一武牙丑耕直耕二反丘主反齒病也卑部第七十七顰音頻眉蹙也舊蔵作脾鼙歩迷反小鼓也亦騎鼓也比移毗移二反見音義音卑井弭反客也俗正音彼相分解也二卑也反卑孕反二音敦寜部第七十八寜舌反寧也反寜壹反寜立反㲰乃庚反犬多毛也男部第七十九俗乃胡反奴了反丨也玉篇又丁列反撲也俗奴了奴到二反二俗音俗嬲正奴了尼几二反丨戲相擾也二音魯古文音脾奴到反孚部第八十孚芳無反信也芳無反卵化也㲗芳無反毛解也四俗他冬他動竹用三反俗直氏反山也乳人主反柔也俗莫附反俗西注妨附二反俗式熱反俗古麦反䧹部第八十一䧹籕文鷹字古膺今憶氷反胷也胸前下䖏曰丨也胸音㐫二噟古文音應亦去聲俗烏貢反譍扵證反以言對丨也俗徒頰反申部第八十二申失人反丨身也伸也重也容也又辰名大歲在丨曰涒灘涒音他昆反又州名亦姓舊蔵作音俞丑亮反通也又逹也或作􅉧正羊刀反小鼓在大鼓上撃之以引樂也二虍部第八十三虍荒烏反字林云文也膚音夫皮丨也又美也大也傳也或作正音盧飰噐也二音盧文也虖胡呼二音歎丨又姓虘昨何反文也又才都反䖉况于反吼也雐音呼鳥名也音盧与同正虜今音魯丨掠又擭也推也服也二虎其吕反栒丨所以懸鍾横曰栒縱曰丨亦作虚栒音息廵反其吕反飛丨天上神獸鹿頭龍身也鬳音彦鬲属也音匣虎習皃也虙音伏獸名又姓况于反部第八十四居凌反口孤反丨瘁也在胡反古文殂字音徂死也其拯反欲㽶也又疑等反梵語河名也二俗扵小反昌呪反丨敗悪氣也當故反敗也俗徒典反甘部第八十五甘古三反丨苦也又隴右州名山名又姓㽐許兼反香美也甞音常試味也或作㽑今徒含反長味又徒紺反二么部第八十六么幺扵堯反丨麽小也二音幽麁鳴也或作􅖨今憂幽二音微小也二扵尤反愁皃幻乎辦反詐也感也詐相欺眩以乱人目也音絶巛部第八十七巛古文音坤乹丨音訓俗正音荒人名二古文居其反甾部第八十八甾側持反田不耕曰丨也音扶小噐也俗音瓶張吕反盛米具又田噐也或作之恕反俻也俗正楚洽反又七廉反古噐也二由部第八十九籕文音盧瓦噐也俗音扶小噐也俗音瓶之庻反俻也音西音校部第九十正今音泥水潦所止為丨丘郭璞云頂上汗下也二音泥受水丘也音泥音靈冂部第九十一冂川韻古熒反逺也空也玉篇音苦瑩反冋今冏正古熒反象逺界也二音冝藏宗反玉篇孔也二誤舊蔵作矯居沼反詐也岡上四音古郎反下二無雨反初革反同上單部第九十二陟留反丁可反垂下皃今作嚲辴之忍丑忍二反大笑也奲車者反寛大也部第九十三四俗二今烏街烏瓜二反蝦簒之属也六音邦或作正苦圭反星名二俗正革買反丨盾属也盾音順二古八反音邦部第九十四許恭反恐也咎也悪也四七感反興部第九十五俗興正虚凌反舉也起也善也盛也歆也又州名山名從同具也二舋三變體釁正許靳反罪也又瑕隟也動也逺也古作衅隟音豈逆反四同上俗音横俗通音尾音遷丹部第九十六􅘎多千反山丨雘烏郭反丹也㥖倉紅反赤色也彤徒紅反赤色也又姓音籠赤色也知部第九十七三俗音知正作鼅丨鼄也三龍龕手鑑平聲卷第一
