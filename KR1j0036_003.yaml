body:
  text: 利二覞弋笑反普又音釋亦普觀㒵也弋笑反視誤也或作䚉正音契見也二覱子鑑疾䧟二反丨㒈髙危㒵也敢音許鑑反覎於劒反丨口墟名在富春清上也覶音乱好㒵又委曲新蔵作宅孟反又音省音次盗視也入聲胡的反巫丨也男曰巫女曰丨事鬼神師巫之類也􅹩或作覿正音笛見也上又之曰反亦也二覭莫笛反小見也覕莫結反不相見㒵也俗二正莫狄反求也三音厄也一日不見也芳烕反暫見㒵䚄音録眼曲丨也又音鹿倉歴反丨面柔也䙾音絁䙽火結反見也䚐他歴前歴二反目赤也或作音麦正作脉斜視也㒻音墨突前也䙸䙷音得取也与㝵同二面部第二二俗音氈之然失然二反都回反丨醜面也火含反面紅也䩇上竹咸反下許咸反丨丨出頭㒵上又丁含反下又火甘反䩌焦樵二音面燋枯黒也作三反長面㒵玉篇又音慙俗音疑俗音慈二俗音躭上聲䩋上二莫可反下一勒可反面慙㒵勔音免丨自強也俗古旱反面上黒也正作䵟俗䩉正音父与􅷯同類骨也二多旱反誠也信也又多也厚也又榖也三俗靦正他典反面慙也四二俗烏感反正作黤俗筆錦反二俗上烏感反下七感反面丨丨䩍力小反丨丨面白也䩆上側板反下奴板反丨丨面也䤄媔三俗通湎也又於阮反丨晚也俗音手俗音我贉徒感徒紺二反買物先入直也或作賭今音覩戯丨也二俗音古賋新蔵作皎丨然在廣弘明集第十二卷誤舊蔵作寡古瓦反䝪俗正私吕反䝴財問十也二於蹇反相當也而兖奴二反小有財也二猪几反當也胡管反䝹丨小有財也賱賰上於粉反下失允反丨丨富有也去聲俗一正雖酔反貨也二俗音貢正作賜也季反拏也以睡反丨㛪也㭺音掩二俗毗祭反正作弊困悪也二俗賦正音付丨頌也又斂也量也班也稅也三贅隹芮反聚也目結疾也四俗今正莫候反交易也市賣也又姓六二俗贍正常染反賙丨也三費芳未反耗也損也散也又房未反姓也音賣出物交易也䝮古文音縣与衒同䞉誤承證反正作賸也販方万反買賤賣貴也贈䝫鐙反送也以物相遺送也賑章刃反贍也濟救惠扷也又之忍反隱丨也䝩同上女利反肥丨皆俗正作膩三四俗正勒代反与也賜也五三俗正古候反贖也四䝭古候反禀給也賮徐刃疾刃二反深丨也又財貨也㑹礼也音賛住助導出也俗賂正音路遺丨也二賃乃禁反傭丨也借也貺許誑反賜也与也贔音備丨屓壯士作力㒵也屓虚噐反贔丨也䞋𥘉反丨施也俗呼个反俗郎个反俗羊睡徐酔二反正今舒制時二反賖也貸也二俗􅣢或作䞈正居偽反賭丨也又居委反二䝷俗正陟利反賑也亦貝也二􅉠音附贈死也助也一曰送死人車馬也五晏反偽物也䞄方庿反丨散与㧼亦同贄音至執丨也贚力用反貪丨五貫反丨弄具也􅚲力驗反市先入直也呼濫反戯物也玉篇又他濫反求位反二籠也新蔵作或作今音縣獸名似犬多力岀西海言對爭又胡大反二䝿居胃反与貴同新蔵作置在髙僧傳上帙中賧他濫反夷人以財贖罪也賵正芳貢反􅉠也贈也舊蔵作睇特計反視也俗墮正反正作夐逺也音例丨貨也彼義反益也上音候下音漏丨丨貪財之皃也贎音万贈貨也又音貹所敬反財冨也俗古㑹反賺俗正直陷反重賣也二私閏反丨益也良刃反貪食也二同䝯羊至神至二反重物次第也神至反呈也贁二俗音敗入聲俗作六反筫俗質正之曰反材謹正信也又音致之丨也二音得俗女乙反俗音脉俗呼括反正作眓視也俗䝱正香業反肚兩傍也二音責求也問罪也今作責贖神燭反戝賊昨則反戔丨虚用財物也二俗正賉今辛律反賑也三欠部第五魯官反迷惑不明也尺之反戯笑㒵也欷音希歔丨悲啼皃又上去二聲俗歔正音虚丨欷又吹丨又吁也二歕普門􅩌悶二反丨氣吹吐也歆許金反神食氣也去竒反丨傾也又於支反歎詞也火含反含笑㒵也歖許其反卒喜也音憂逆氣㰭許于反丨樂也欨况于反玉篇吐也㰬相倫反氣逆又信也或作今即移反歐也二歄古蛙古花二反丨也俗正五瓜反歄丨猶歄姽也二㰪於佳古携二反邪㒵㰨火佳反丨氣逆病也呼狭反歛呼談反欲也㱂音康榖不升謂之丨俗歑正音呼温吹氣息㒵也二音占欦許兼反笑也又貪欲也又火南火咸二反㰹許咸火陷二反笑也俗正音昏不可知也二或作正音遥氣出皃也二丹歎二音歟音余歎也音申㰦丨尸甘反言也香嚴又呼甘反歞川韻呼甘反沅湘人言也上岀新蔵下出舊蔵皆誤正作歌二或作歂今市縁反口引氣也又姓又俗音弗二歒俗正許喬反氣丨丨出也二上聲歐烏口反土也又平聲又姓口感反食未飽也又口合反丨歞癡㒵也歞音呼甘反二俗水名款二或作二古正苦管反至誠重叩也又憂也八㰤虚我苦嫁二反大笑也俗欼二正初紀反齧也三俗弞正音引笑不壞顔也又古文哂字二時忍反花而笑也欿胡感反欲得也歉苦點苦咸二反食不飽也㰝玉篇音巳欲也二俗哂忻二音正作弞欣二字平表反歐吐也㱅於起反去聲欶蘇奏反上氣也又所角反口噏也噏音吸欬苦愛反丨瘶氣逆也又於界反丨氣也㰦音去欠去也又音佉訓同許戒反怒聲与譮同又烏玄反俗通欭正於反喑丨歎也又平聲三丁練反呻也又奴叶反塞也於建反大呼用力也㰳衣嫁反畋丨驢啼也子笑反音漏歐小皃㐫悪也蘇吊反吟也与嘯同入聲䯉烏八反氣息不利也㱋苦角反髙也子六反欻悲㒵也或作正於六反愁㒵下又於栁反二􅸢呼甲反鼻息㒵於自反欮居月反發也正呼盍反大欶也俗㰱二今女洽山洽山輒三反皆丨血又楚洽反三山輒反堨欲通正居乙反口丨又音迄一許竭反休息亭止也俗正音色小怖也二歙許反反縣名又姓又書渉反點丨也又州名欪丑律許吉二反詞也又去吉反詞也又呼来反出氣也欱呼合反大歠也又呼洽反甞也俗或作歠正昌恱反大欱也三呼洽反氣逆也呼各反草肥死㒵呼北反唾聲川韻又作特反或作今虚業反丨氣也二俗正子荅反丨聲也二盧合反丨歁不滿也歝誤音亦正作丨猒也五角許角二反欥音逸辝也丑歴丑力二反痛也欯許吉反笑也歜昌玉反怒氣也又感反昌蒲𦵔也大部第六㚠許么反長大㒵音開大㒵於倫反泉水又水勢也俗音塗俗㚗正才邪反大口也玉篇又音邪二奩俗力潜反奔本門反走也奢失車反勝也侈也張也尖即潜反銳利也今正音誇奢也二音煩籠也又姓苦圭反星名也奓陟加陟嫁二反張也開也又尺氏反俗音㢘正作匳子侯反疾趍曰丨又祖苟反今作走二奝都聊反大也多也音嘺俗千奴反三俗音俗徂兮反俗口孤反音孤大㒵二同奃二或作􅐏今仾帝二音大也三三俗今音大也四㚓俗音来紀朱許力二反目邪視也古今音寛二音君㚙音加上聲奜芳尾反大也奛俗呼廣反正作爌開朗也奄衣􅚀反忽也止也蔵也匿也乆也取也又姓耎音䎡車者反寛也大也与同夭於兆反屈也奋古朗反今作㽘塩澤也又音本㚞俗所錦反恐怖三俗正音本草噐也又古朗反四俗古本反烏本反坐也㚏胡老反放也他老反長也夽魚吻反大也音此直大也祖朗祖浪二反大也莊也多力也健也疾也俗音傘盖也夵以染慈染二反上大下小也郭迻又陟加反夰古老反放也去聲奞峻信雖三音奮丨鳥張毛羽也俗夳􅕮皆音太三呼計反肥大芳万反酒宿也音乍夸丨自大也二俗音具音俻三俗奮正方問反進也動也振也起也又武㒵也又鳥將欲飛先丨也四奥烏告反深也蔵也内也主也又於六反直利反疋㒵反起釀也俗正音界二音受二入聲奕音亦大也又行也又䡖麗㒵二奯呼括反大開目也俗奪二正徒沽反失也三正㚔今尼輒反大聲下又音幸二羍他逹反羊未反也亦作俗音吸直日反大也方結反大也音域力大也居縛具縛二反健㒵也奤古文疋名反今作面文㒵耷都蓋反大耳也七六反水虫之属也俗之石反壴部第七壴中句反說文亡陳噐也玉篇又時注反或作丑良反音資二俗歩迷反俗音掏蘇朗反鼔匡木也或作正疋鄙反大也二或作音古又或音汾於冀反美也大也温柔聖克也下又哀痛聲也又姓二􆅄意乙二音貪也陟立反又鼔無聲也誤舊蔵作苦角反謹也善也􅿏俗倉歴反豆部第八俗豌正烏官反丨豆也二必迷反豆名也通䝁正音勞野豆也二郎侯反丨豆也俗音來丁侯反丁侯反小裂㒵也音頭専㒵音戸犬反剅兠婁二音小穿也或作䜽音俞變色豆也俗䜾正於金反䜷豆也又於滛反亦豆名二䜷七林反野生豆也豇音江丨豆也音流丨豆也䜶上音降下音雙丨丨胡豆也音其豆丨也俗尼衫平鍳上聲俗正音樹立也又僮僕未冠者也又姓二􅰹俗短断二音下斬反豆半生也䜸音每豆砕萁也俗苦海反正作塏去聲䜵俗䜴通正是義反塩丨也三㰯呼候反丨又音透唾丨也或作哣音漏音豆項丨眷圈二音黄豆也毭音豆􅪭罽也􅪭音分俗音務古文中句反今作壴陳噐也又注樹二音入聲俗於六呼麦二反正作䂸字𥘉六反小豆也䜺义白反磨豆也於月反豆也俗同上又烏官反四部第九二俗羈馬絆也居冝反寄也四罹音離心憂也䍦音離接丨白㡌也俗音曼俗芳無反居其反古文俗或作今渠營反驚視也三古文言字又俗呼旱反正作希丨也俗五髙反正作翶丨翔也古文音軍罤俗正音昆周人謂兄曰丨又古文作晜同二舊蔵作羅字力塩反上聲罯烏感反魚於蹇反大㒵也力九反魚梁也二同罷薄買反止也休也㱕也又音皮倦也止也弥忍反䍐呼旱反去聲罵詈俗上莫駕反丨力智反合從例四俗古罽正居例反氈類毛為之六罽居例反魚也二䍛上音路下音固丨丨取魚具也音眷亦還頭也罫音卦古恵反卦也奴案反也罜音洼小也入聲罸正房發反罪丨也俗通許玉反勉也二徒合反目相見也又音還睪音亦引繒皃或下同尼輒反伺視也又上同他盍反正作莫大羽飛㒵罬陟劣反捕鳥覆車一曰也罨烏合口合衣撿三反鳥也俗音蜀片部第十片普麵反半也判也開也也牌步皆反又薄佳反丨傍也牉音判丨合夫婦也又得偶而合也与眫亦同光黃二音郭迻又音古反􅖠或作牎正音䆫丨牗也二音當音枯􅟜上徒回反下素回反音籠音亭二同通牋正則千反丨表也二力朱反丨㸡築垣短板也一曰所以遏水也㸡去聲俗正許救反以鼻取氣也二防孝反玉篇云面瘡也或作二正烏貢反鼻塞病也二許噐許戒二反鼻息也烏外烏決二反喘息聲又火恠反丨卧聲䶍都計反玉篇丨噴氣也都厲反噴丨也五吊反折也又牛救反丨仰鼻也奴弄反多涕疾也疋詣反鼾音汗丨睡也眠中有聲也丘救反􅡩也入聲許六反川韻云顣鼻也顣音子六反俗音掘䶊尼六反􅦃俗䶎正呼洽反丨鼻息也二二或作今音九仰鼻也下一又音灰豕掘地也三烏葛反鼻丨也自部第十三臯音髙髙也局也澤也又九丨也或作正音綿視逺㒵也又不見㒵也二俗音匡正作眶二俗音音㱕舊蔵作臯音髙古文陟驕反二古文終字俗得侯反辠古文罪字音罪其兾反衆辞所及也渠義反丨及也相承殂外反大罪也二臭昌救反香丨也音息於葉反音視耒部第十四耒正盧對反丨耜田噐也神農作丨又力䡄反義同又力恱反禾麦知多少也俗耬正今音樓種具也三二古耘今音云鋤也除草也三􅜶同上􅵲筆苗反除田穢也耰音憂覆種也耆時二音麦下種也通二俗同上耚疋冝反耕也音䆫丨種種也耡士魚反助也又姓又士㩀反与鋤同音圭田噐也䎩側持反耕也上聲耦吾反耕也又姓䎧歩項反丨䥯噐䥯音薄買反耔音子擁苗噐也耜音似耒丨田噐也二同通今音丨種又地名二所冷反麦也去聲耗呼到反少也减也俗耨正奴豆反鋤也除草噐也又奴沃反二呼旦反耕也又冬丨莫半反不蒔田也所教所交二反丨田噐也他計反不耕而種也入聲渠玉反耕地也或作正亦釋二音耕㒵也二耫士革反也反土鎋反農具也直列反發丨也昌力羊力二反耕也俗或作正音測耕也又俗音即三音昔丨田也於劫反耕種也又去聲徒骨反耕耒間也䎪奴勒反榖丨或作耠今音合耕也二耤秦昔反丨田丨借也又古官名歲部第十五音印音誨呼㑹反鳥飛也居衛反傷也割也許穢反頬也於月反於月反二更部第十六甦音蘇㬲皆音添益也四相承子与土兼二反二夜部第十七丁夜反亭夜反又丁夜反二名夜反音謝去部第十八二俗正布官反丨運也又丨部黨累也三丘言反又音扶俗音音㱕弆音舉又去舉反蔵物也俗七感反正作慘音二同俗音結正作嚴又竹鳩是丑二反二古文奴郎反丁含反俗音干測于反音多二同音上聲二古音五三音武帚之乆反箕丨也去聲俗耳直例反豕也又二姓二二俗或作側救反正作丨不申也三二俗彚今音謂類也三彖通貫反象也彗祥歲反妖星名除舊布新之象也又音遂入聲俗息一反二或作正古文音六今作勠丨力也三二同上氣部第卄四氤氲上音因下於君反丨丨元氣也如雲非雲似煙不煙祥瑞氣也氛音焚元氣也又音芬符分反丨氲祥氣也俗音霄正作消倝部第卄五倝正􅩾今古按反明也又日光出也二音寒井垣亦國名又姓亦作韓同鶾音寒丨天鷄羽有五色也䮧寒翰二音丨蕃大馬又長毛也音蒲末反古按反丨赤色也幹古按反丨又姓翰侯按反鳥毛也髙飛也長也亦詞丨又姓又音寒丨天鷄羽有五色也雗音翰丨鵲也榦古岸反槙丨築垣板也又上声魚名清酒㲦長毛也侯按反丨天鷄尓疋去小虫赤身黒頭一名沙鷄也四俗斡正烏括反丨轉也二古文音朝辰且也俗古岸反又上聲古文陟遥反句部第卄六俗朐正其俱反脯也二俗劬扶二音耇古口反黄丨老也龍龕手鑑去聲卷第三
