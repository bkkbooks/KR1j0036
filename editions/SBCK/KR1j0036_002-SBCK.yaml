作今香句反醉怒也三䤑烏曠反醊丨酒也醊陟衛陟劣二反丨連􅀕也醼扵見反飲丨也半刃反酒漱口也盧暫反丨􅜠嗜酒也釂子􅀏反飲酒盡也醮子􅀏反奈丨也郎外反以酒泼地也側嫁反􅎹酒具也於念反苦味也􆁦玉篇乎孝反面上瘡也音制魚子醬也酎直又反三重釀酒也舊蔵作皰疋皃反面上生氣丨入聲俗古麦反正作馘截耳也酢在落反酬丨也又醋錯二音酪音落乳丨也酌章若反丨酒也又行也益也取也霑也挹也通醘正苦盍反酒噐也与榼同又俗音海二俗正普木反醋生白丨也二䤕許角反醋味也音末丨醏醬也醵或作今其虐其據二反合錢飲酒二俗正普末反酒氣也二二正醳今音亦苦酒也三音歴丨酪滓也香嚴又力底反䣾俗正音覓酪滓香嚴又於金於南二反酔聲也二俗子荅所甲二反酷苦沃反丨􅇥也甚也虐也俗居碧反齒部第十八齗齦語巾反齒根肉也下又康很反齧也又起限反齒聲也二五佳反丨齒不正皃士佳反丨齒不正也三同二俗或作䶥正側加鋤加二反丨齖齒不正也四齖音牙䶥丨也五鞋反齒不正也七何昨何二反齒丨也􅚖昨何反齒本也二俗或作齝正詩癡二音丨噍牛吐食也三二俗正卓皆反齧也三齡音令丨年也齬音魚齒不齊相值也又音語齟丨不相當也今齠正音條小兒髪也二俗羌魚反音陁齒不正也俗䶔正音池齒齗也二􅬺五咸反齒差皃二俗音酸或作正陟加反噍聲噍音才􅀏反二䶗苦加反犬齒也齵音愚齒落重生也又五婁反齱丨通齱正側求反丨齵齒偏也二或作齻正丁年反齒未也二䶞其欺二音齒也齤渠貟反齒曲也音連齒露䶣古哀反牙也俗音居二俗徂號反齙音包露齒也俗正七羊反齒也二隨凾音繒俗音牙従牙者正上聲齩五巧反齧也䶧同上又下巧反䶚或作齲正丘主反蠧也齒病朽缺也二齟士吕反丨齬也又才吕反魚綺反齧也俗齼正􅀄吕反齒丨二齳齫魚粉反丨齒也二􅨭上士板反下五板反丨丨齒不正也俗齴正魚蹇反齒露也二䶙其吕反齗腫也俗于彼反俗人勇反音所傷醋也魚蹇魚􅅯二反張口見齒也与齴亦同二二俗神尓反􆄓俗􅀄産反或作正冝引反齒齊也二齨其九反齒丨胃老人齒如曰也俗与少反俗􅀄礦反音餅大齒也音蟻齒也俗五巧反去聲齘胡戒五八五結三反皆切齒怒也䶩在􅍗反丨也又丨齧􅃿齒齩也又俗陟皆反音􅍗䶩也三俗或作齓今正初靳初謹二反毁齒也六二俗猪厠反俗力制反隨凾去合作䶩在􅍗反䶫􅬺魚欠反好齒皃下又五咸反亦齒差皃二同䶖渠禁反舌下病也丁䧟反剔齒也入聲嚙六俗齧正五結反噬也淺齩也七二俗正五各反口中上丨也三鎋瞎二音齧齒聲也又古軋反齰或作齚止鋤陌反齒齧也二䶪初八反齒利聲也齷於角反丨􅐅也􅐅初六反亷謹狀也又測角反齒相近聲齪測角反開孔具也補各反丨㗱也与㗘同㗱音精入反俗正盧去反齧聲也二䶛盧葛齧聲也俗䶤正胡刮反齒骨聲二俗昌折昌制二反正作掣牽也俗其略反齾五葛反獸食之餘曰丨也又五鎋反噐缺也俗通齕正胡結胡没二反齧也三俗齺正士角反齒相近皃也二䶢苦洽反齧咋皃又古洽反喉聲又俗加咸反汗色也俗于六反昨没􅀄栗二反齚丨也陟栗反齧聲二俗胡骨反齧也侯閤反丨齧聲也又他合反食也䶜胡谷反齒聲又古沃反治象牙也二俗音昨王作鑿音益尓疋云麋鹿齝之異名也又音逸麋鹿受食䖏也直栗徒結二反齧堅聲􅻱同上千結反丨齒也二同􅀻列反尓疋云羊曰丨又羊丗反䶦初革反齒相值也丁立反丨齒也俗轄瞎二音䶘音立齒聲又俗音拉俗􅝝正五轄反山中絶皃也又五結反㼘丨山危皃二耳部第十九二俗聡聦二正音忩聴聞明察也四二俗他丁反又去聲正作聴字通正丁含反丨耳也二通聸正都甘反丨耳也二􅸞側交反耳中鳴聲也䎿即由反耳鳴也聆音令聴也聱五髙五交二反与同不聴也二四俗聮正音連丨綴也又丨綿不絶也五俗或作耼正他甘反耳漫無輪老子名也又姓三聣俗五􅀆反俗音兹俗音聞俗上七容反下音容俗女加反徒丁反耳出􅁖汁也或作聎正他刀反耳明也二聹音寜耳枯又乃頂反丨曺樵二音耳鳴也音聊耳中鳴也在焦反耳鳴也俗音房耹音琴音也又巨廉反地名音工耳聞鬼也去竒反側耳也又一隻也耺音云耳中聲耾戸萌反耳語也随凾而容反毛飾也郭迻俗妨非千芮二反女江反耳中聲也聙音精聡聦皃也二古文聞字丁兼反耳小垂也二俗強俱反俗􅁘邪二音新蔵作聊上聲􅋍息勇反髙也毛堅也聜俗䏄正都礼反耳患膿也二􅂫走反聦惣名也俗音卷四俗俗通丁果反耳丨也五俗音俗音耳耵音頂丨聹耳垢也之善反耳門也聥俱雨反張耳有聞􅠓俗失冉反正作作海反半聾皃也戸瓦反地名俗或作正之忍反告也三二俗音好恥正􅐫里反慙也從心作耻二俗同上去聲三俗聵正五恠反聾也四或作居位反慚也俗毦正而志反羽毛飾也二妨也聘疋正反丨間也二俗所􅀉反二或作子貢反仍吏反以牲告神丨欲聴曰丨也仍吏反聴音未敢言也刵仍吏反截耳也誤莫􅃸反正作􅐙丨易也䎷音注丨􅀋也二或作聟二今音細女夫也与壻同四盧對反䏇疋妙反􅃪纔聞也七計反耳聴也俗䎺正音制入意也一曰聞也二音患他見反塞耳才喻反二所嫁反人姓入聲耴魚乙反聲丨魚鳥􅃺也又音􅂺丨耳國名聐五鎋反丨顡無所聞恢􅁅二音烏侯反又音同㽆音當㼵丨也㼺音唐瓷噐音刑酒噐似鍾而長頸二同二俗正音圭甑下孔也三正今都昆反噐似甌瓿二甉音銜乾瓦屋也音皆㼧瓦一曰噐也又莫八反㼗音亭甎也音雷屋棟瓦也落紅反字董築丨榖也音陁瓦盌丨音椀俗音胡上聲瓿甊上蒲口反下郎口反丨丨􅑥属也瓬甫雨反瓦也又音甫俗正踈雨反半瓦也又􅀄雨反甎石丨洗物也二甒音武甖丨㼴五口反盎名盎音烏朗反正㼬今音幸丨㼳有耳瓶也二㼳所景反㼬丨也㼦音拱也㼫胡瓦反大口也徒果反甌也㼮音叙瓪音扳丨瓦又俗北官反去聲或作瓮二正烏貢反瓶江瓦之大者也三㼜二俗烏浪反正作盎盆也瓽丁浪反大甕一曰井甃又大盆亦姓俗甃正側救反井丨也二楚鍳反􅑥属也俗甈正去例反尓疋云瓳也二音帝丨瓽大㼻也魚記反大甖也㽀直正反甖也古縣反底孔也胡懴反大盆也俗正土戰反噐縁也二舊本作古文夜字力救反也入聲苦結反丨瓶受一斗也甋音的瓴丨甎也音暦瓦噐也二俗正良渉盧叶二反踏瓦聲也三正今普八反車破聲又或同上二二新蔵舊蔵江西随函古獲反瓦噐也西川随函合作甖烏耕反亦瓦噐也在道地經罒㼣音百㼿丨井甃也正今郎的反有脚鼎也二俗音撃正作􅜘土丨俗苦結反正作㼤瓶也或作正辛律反不能行也二許勿反二俗正女刮反也亦刻出瓦也二即葉反半瓦曰丨也音卆音卓甓扶亦反瓴丨㼾塼也犬部第卄一猒俗正於閻反丨飽也犬甘􅁏心無丨足也又去聲二猜倉来反疑也恨也於竒反加也􅀝也長也施也歎也美也又上聲丨报狌或作猩正音生丨丨能言似猿聲如小兒二俗猨二正音􅀽大猢也猕猴之属三舊蔵作猨猕猴上音弥下音侯猿猱之属猱奴刀反猴属也㺀俗同上俗㹳正音吾猿属也二獑猢上士咸士銜二反下音胡丨丨似猿而白猊上􅂫官反下五􅀆反丨丨食虎豹也即師子出西國㹞犾玉篇皆語斤反犬爭也又俗音狄二狺同上音胡狢也又姓猫俗麦包反正作貓字俗正音加丨豕子路佩丨二㹢或作正音加丨玃也玉篇又音哥二􅃙於反獸名也或作正音胡丨㺃小犬也二猷音由従也若謀圖道也徒昆反小猪也狸力之反野猫也俗音毗正作貔汝羊反戎属也狉二俗作疋悲反狸子也今作豾通正五髙反犬髙四尺者曰丨也二猖音昌丨狂也㺎音容丨獸名也莫經反小也㺗充山反也音疑犬怒也又音拳縣名獅音師猛獸也又犬生二子也俗丁侯魚訖二反通獳正音獳朱丨獸名似狐而魚翼出則國有恐也又女溝反犬怒也二古文音捜春獵也俗獋正音毫熊虎聲二㹫音夷狨丨也狨音戎細布也獹音盧韓丨犬名必􅀆反丨犴獸也又牢獄也犴五干五二反与豻同胡地狗似狐而小又音寒俗􅐫知反俗遭曺二音俗丁年反音煩丨犬闘也􅏈音魂似犬人面也音柴其江反多毛亦作犹音􅀹犬吠聲也狙七余反子也又七慮反犬齧足也獶俗正奴刀反獸名又奴巧反犬驚也二㺜通正奴刀女交二反長毛犬也二猦音風丨􅳎獸如猿逢人則叩頭小打便死得風還活也音縁丨㺦兔走皃又丑戀反草中走也音連丨猭犬走皃也又􅐫人反義同狑音零犬也二同俗音毛或作正音思辯獄相察也又息利反二獠音聊夜獵也又張絞盧晧二反西南夷别名也許云反北方胡名丨䰞也猵音邊􅆩属猋必遥反群犬走也􅰉乙咸乙䧟二反犬吠聲也或作㹶今徒丁反猱丨猿也二音窮獸似虎食人也五閑反犬閒聲狍薄交反獸名目在腋下也俗獌正莫還反狼属也二獚音黃犬名犿獾呼官反野豚也二同俗都聊反俗獢正許憍反猲丨短喙犬也二俗音雄正作熊獸名或作音郎丨毒藥名猑古渾反丨禽獸名也􅽟音柴狼属也二同㹧於良反峱奴刀反山名也􅥡留栁二音似䑕而大食竹根也上聲猥烏毎反穢􅄂也不正而濫曰丨也􅀃文衆犬吠也狔蟻反猗丨也二俗狡正古巧反疾也健也猾也狂也二誤音保􅚦力水反飛丨獸也獎即兩反狗也俗音犬獖蒲夲反宋犬也又扶文反羊名玁或作獫正虚撿反丨狁玉篇云北狄也下又廉斂二音犬長牙喙也二音尹獮息淺反狄獵曰丨丨殺也或竹㺑正所檻反㺝丨犬吠聲也二㺝下斬反大囓聲也一曰􅁖犬吠不止也狗古口反犬也二同獬胡買反亦丨豸獸名􅳎莫口反猦丨獸名也玀經音義作阿婆二字上烏可反下蒲我反謂僂要而行也在樹提伽經中或作􅨓正神紙反獸名似狐岀則有兵也上又豕紙反二虚豈反楚人呼猪也又音希三俗羊苦常預二反正作墅字通㺒正奴巧反擾亂也又下巧反事露也二獷古猛反犬不可陌近也又居徃反丨平縣名直尓直買二反玉篇云似鹿一角也㺐側絞反正作䝖􅩅二俗上音巨下音虚去聲狃女又反習也就也又狐狸也又女九反相狎也􅜦虚噐反夏后氏有澆丨寒浞子名浞音士角反二俗正五晏五見二反逐虎犬也三尺制反狂犬别名也三俗愽教反古縣古􅁺二反􅄶􅇥也狾猘居例尺制征例三反狂犬别名二同獁莫嫁反獸名也㹿俗徒到反犽五嫁反獸名也或作音岸今作犴獸名狧或作正古外反狡丨小兒戯也又古邁反二余又反黒猿也古縣反躍也疾跳也狽俗音貝呼貫反文彩明皃也又姓也獟五吊反狂犬也俗狚正音旦獦丨似狼也獦音葛二㹸狠四俗音皃儀同也俗􅎜狖二正今余救反獸名似猿四㹨俗余救反音俻切韻云車軾也或作犺今苦浪反猰丨不順也二狩書救反冬獵也入聲㹮上知格反下莫百反丨丨驢父牛母也俗亦鐸二音俗烏各反俗女律反猎七雀反玉篇獸名又才藥反􅜧榖欲二音獨丨獸如赤豹五尾也俗音􅃴七藥反宋國良犬也􅀄洽反犬食也古文他歴反犳之若反獸名二俗㹺狧二今􅄍盍他合二反犬食也四音滑狡丨也二俗祖葛反俗二今古鎋反􅄂也又烏􅃛反丨貐獸名龍首食人也又苦結反丨抗不仁也貐音􅁃或作猲正許謁反丨獢短喙犬也又許葛反二俗正音即犬生三子也二許月反獸名又走也舊蔵作獵二俗正音㦸丨獸三狎胡甲反習也近也俗正村􅃿反丨暴疾也食丨也二獵良渉反捕丨也四時之田春曰狩夏曰苗秋曰捕冬曰丨俗獦正音葛丨狚似狼文質也又俗音良渉反狚音且二狹侯夾反隘也隘厄介反狄音笛北丨也又姓狢胡各反狐丨也俗玃正居縳反大猿属也二二或作今書藥反犬驚皃也三􅆩他逹反水㺃也音博丨䍫獸名似牛九尾四耳目在耳後也䍫音陁二俗正勒􅃿反丨篇射也三狊呼覓反犬目視又古覓反亦獸名猿属也豕部第卄二豕施是反猪别名也豬音猪徒昆反豕子也同上音加雄猪也与猳同豯音􅀆豕生三月也恱吹反豶名也豶音墳野猪也又音煩豲音元豕属豧芳無芳遇疋􅃸三反豕聲也又豕息􅁏也俗􅘻正古来戸来二反豕四蹄白二莫經反小也豜俗或作􅢢正音肩豕三􅀊曰丨三許衣許豈二反猪也豵今正子紅反豕生三子也二力屯反獸名也䝎他端反似豕而􅏂也又去聲音蒙似豕也豝音巴豕也􅻝音同獸似豕也豩古文百貧反毗連反猪也􅼞音雄豕獸名豱音温短項豕名􅂫干反豕也豠或作正云魚反豕属二胡刀反丨侠也亦州名奴刀反山名也上聲燹􅂫典許位二反野火也二俗䝐正羊捶羊委二反也又徒卧反猪别名也三豤康很反豕食皃也又去演反豕齧也音母獸名也䝏力主反䝎子也切韻雖主反玉篇士羽反小豬也二同去聲音惱雌狢也䝖音爪䝤丨之九反猛獸也去聲豿俗豹正包敎反丨似虎團文花黒而小於虎上又呼構反二貇二俗古䫉二正音皃儀容也五貁余救反獸名似猨俗俗通魚既反果决也二􅡐音四狸子􅤘踈吏反貉也二同䝢莫半反狼屬竹用反乳也正今皮􅀉反二䝞舊藏作舜在辯正論䝡音万獸名似狸俗古反入聲􅽜二俗二或作今貈出􅀃文出孝聲胡各反䝖属也七貊音陌蠻丨之􅀖也貘音陌食䥫獸也似熊黄黒色出蜀中也貀或作豽今女滑反獸名似狸也二貜居縛反大猨也音力遼東犬名也貉音陌北方獸名又胡各反地逹反水狗也与􅆩同部第卄四胡刀反大呼也也痛也號呼交反丨呷也又音豪丨也今甝正胡甘反白虎也二直離反虎聲又竹燻名䖜音銀孟虎爭聲二俗正五閑胡犬二反虎怒㒵也二上音烏下音徒楚人呼虎曰丨丨也或作音池胡交反音同黒虎上聲二或作今胡犬反獸名似犬多力一曰對爭岀西海三二俗或作音虎三去聲薄報反丨虎無杖手搏也二同二或作今魚既反虎息也三虥士諌普患二反虎毛淺也二同入聲䖖胡甲反虎習皃二䖛音索音覓􅀃文云白虎丨也所責反虎驚又詐逆反音革虎聲也旱丨也二音竹俗章欲反音域小兒􅀑也䰥音或􅀑丨旋風也二二俗音􅟕走部第卄六􅦇音俞越也過也又傷遇反馬丨前也趍通正七俞反走也疾行也二音希走㒵丨也䟇居依反走㒵也丁年反走㒵也許縁反疾走㒵也俗音羊疋昭反行疾㒵直離反輕薄㒵也趧音啼丨鞻四夷樂名或作今􅂑􅀻反倉卆也二誤新蕆作趄七余反趄七余反赼丨也趦俗赼正􅂑􅀻反丨趄不進也二通䟂正母官反行遲㒵也二彼爲反許其許記二反音由音余丨丨安行㒵戸來反㽜意也䟒渠貟反曲脚也音焉東夷舞䟃􅑗上二倉含反下一徒含反丨丨走㒵也音渠走也趪音黃丨丨舞㒵又張設㒵又音光䞮上博􅀌反下他胡反丨丨伏地㒵下又俗音徒俗趬正去堯反行輕㒵又去囂反亦起㒵二􅧱音􅀽玉篇云走也一曰各也音湯走㒵也又他曆反跳㒵俗趫正去遥巨二反善走又縁水也二䞴俗趟正上一陟交竹教二反下二竹知孟二反丨丨跳躍也䞚綺二音玉篇云丨丨鹿走㒵一曰行也七廉反俗赹正渠營反獨行㒵上又俗五髙反二通正直連反移也又張連反同行難也二或作正音賢疾走㒵二趖蘇禾反丨疾也趯䞤二同音劬走顧之㒵下又音憮健也二䞗倉來反􅀃文疑也七羊反趍走也上聲赻二俗音渠委反与跪同張丨也􆈍虚斗反俗趛牛錦反頭疾行也赾丘隱反跛行㒵䞨立弭反半歩也舉一足曰丨再舉曰歩与跬同安古反走䡖㒵正䞻今余拱反行㒵一曰頓走踏地也二䟎則散則且反散走也居許反行皃俗音了音糺式也二俗知奄反趡千水反走也趭子小反急也又子􅀏才􅀏二反走皃也又同上立忍去刃二反行㒵音此淺渡也趁尼展反踐也去聲趮則到反動也擾也又疾也䞯芳遇反疾行皃也二或作北諍反散丨也正作迸字千夜反丨脚立也俗趠正勑敎反行㒵也又􅃙角反逺也二俗音教􅽔俗音去趒他吊反越也又他洞反雀行也二俗䞳䞜三或作今芳遇疋􅃸蒲北三反丨僵也六䞬俗正他􅃸反自􅄬下也二俗撫鳯反正作􅸱香仲反瞢丨䞺徒困反都計反走皃也渠院反俗正今丁計反走也一曰窮也三二或作今丑側反跳也踰也二三俗趣正七句反丨向也又倉狗反丨馬掌馬官名也又七足七俱二反四音逝踰也趐俗音翅俗丑戀反正作猭犬走草中也許縣反走㒵又居聿反亦走􅇥也俗音造赲二俗力庻反俗音到俗薄半反正作叛趥千仲反行㒵䞪疾亮反行㒵也趂丑刃反逐也䞥音又走㒵音救䞭音迅入聲俗正于伐反超也逾也揚也又姓二䟏書藥反趯走也又音歴動也趢音鹿丨趗小也又音録丨小兒行也丑玉反丨小皃行㒵趗千木反趢丨也又七玉反俗正丑律反走也二二俗虚恱反􅱸羊即反進􅃐皃也通䞘正其訖反行皃也二赶其月反舉尾走也又音乹音陌越也今作驀䞚蒲末反同旱丨也俗正蒲末反行皃也又􅂑􅀻反倉卆也二去􅁻反走皃也音迹俗徒歴反正作丨也䞽所㦸反僵仆皃士洽反行疾㒵或作正丑格反半歩也二䟆音必玉篇原行㒵切韻丨行池也俗趯正他歴反丨跳㒵二俗渠􅟕反趌巨乙反直行也又音􅁻丨􅨤走㒵􅨤堅列反丨􅺻跳㒵又居謁反走㒵赽正今古穴反烏疾行也二􅺻居月反跳丨也趩音􅃙行聲也或作䞞今音佛走皃又普末反二䞷其月反行越也趉九勿反走皃趜渠竹反丨趍體不伸也俗通正所六反趜丨二俗䟌正才結反傍出前也又音􅁻走意也二䞵知劣紀劣二反小跳又走丨丨俗才恤反正作摧丨居聿反走􅇥也正䟐今音歷丨行㒵也二或作趚今正七迹反䟐丨也三正趞今七雀反行㒵二䟉之欲反小兒行皃也音結走皃音疫羽部第卄七䍿音黃羽舞名又音王翴音連丨翩飛相及也羾二或作正音紅虫飛皃也三蘇彫反羽翼也芳無反丨細毛也翪子紅反􅋍翅上㒵􅡇芳文反􅌭丨飛皃許么反也翏正今音聊髙飛皃也二翁烏紅反老稱也亦鳥頭毛又姓疋賔反飛㒵也䎕呼萌反群鳥弄翅也二同翃戸萌反虫飛也所臻反羽多也翑其俱反鳥羽也二同其俱反馬左足白也俗今巨嬌反丨飛皃二俗髙亦二音翹渠反舉也也危也逺皃也翶翔上五高反下音祥丨丨逍遥蟠廻自在皃也翩上音篇下音畨丨丨飛也又翻覆也翶翔㒵也翷通正力珎反分羽飛皃也二許縁反小飛虫也翢他刀徒刀二反羽葆幢也俗翎正音零鳥羽也二翍普碑反丨張之㒵胡郎反翓丨也通􅲏今許延反飛皃也二渠支反丨丨飛㒵也􅬾是支反群飛也翬音暉飛皃又雉五色俻也翲疋昭反鳥飛㒵翧音暄飛來也䎁俗音胡人名也俗翭正音侯飛聲也又羽􅀄生又去聲二音于飛皃二同􅨎翑翵其俱反鳥羽也又俱兩反曲羽也三同上聲䎂音保彩羽也正翦今音剪截羽也二去聲三俗翳正於計反葆也也障也隱也奄也又平聲四翡上扶未反赤羽雀也下七酔反音羽雀也雄曰翡雌曰翠二古翨三俗翄通翅正音施鳥兩羽也七翥之恕反飛也舉也􅔘呼㑹反鳥飛也二或作羿正音􅍗􅀎射人名􅀃文從羽也三二或作正羊制反鳥飛也三或作正音惠六翮之末又音曵亦鳯六翮也二二或作正徒到反舞者所執三於劒反劒羽入聲或作今盧盍反丨􅛑飛􅀄起皃二徒盍反丨俗今許聿反飛皃二俗正疋各歩各二反飛去也二奴勒反虫名也􅛑音塔飛盛皃也音押音六与戮同三䎀許月反飛皃􅢅翼羊即反輔也翅也􅂇也美也恭也又州名又姓二翋俗翌正羊即反明曰也二俗或作正行革反鳥羽本也三許逼反羽聲也音域飛聲也翕許及反火炙也百起也又動也歛合合聚盛也翖許及反人姓名也䎑音禄水上飛也翓胡結反丨飛上下也所甲反捷也又色立反疾飛也翣所甲山洽二反棺衣也形如扇以木為匡呼角反鳥􅏂也甫勿反舞者所執也許考反小鳥飛也二同毣音木思皃一曰濕毛也又莫角反好皃上盧合反下他合反丨丨飜飛㒵也蛡羊即反丨丨虫行㒵虎伯反飛疾㒵誤徒合反鳥毛也皿部第卄八皿旻永反噐丨也又盆丨也盟音明誓約也又音孟丨津河也盂今正音于盤丨飰噐也二苦廻反丨噐属也三俗盩二切韻􅉦玉篇張流反水曲曰丨又丨厔縣名厔音窒六盅丑中直中二反噐虚也二音温仁丨諸比􅀋也音雷噐也俗正音昭噐也二奴冬反二䀃郎奚反以瓢為飲噐也㿼俗正堅反醆也二盉和俰二音調五味噐也䀂上音安下音殘丨丨大噐九􅦝音羊杯也古文布胡反今作餔晚食也上聲盪徒朗反條丨揺動㒵又􅄍郎反丨突也䀁有右二音抒水噐也二同盙俗簠正匍夫二音丨簋􅀕噐也二俗簋正音䡄簠丨􅀕噐受斗二内圎外方也二盌古文烏管反小也今作椀音杜噐也音猛盨相主反丨負物几也又音所載醋也其矩反丨盨負載噐也俗盬今音古盬也􅖾也又不固也二或作今音古噐也二俗㿿今音雅酒噐也二古巧反噐也䀊古巧下巧二反温噐也又丨濁也籕文俗二或作音海宍醬也四去聲泴上聲羊主反病也又微弱也奴毎反傷􅀲也二力忝反􅀲名也平表反物落皃魚偃反瓢也音祖音禮俗音始踈瓦􅀄瓦二反古文礼字去聲音訓二古文音愛俗音練正作􅀲丨於靳反所依㩀也於刃反今作印同入聲二俗居碧居縳二反正合作攫字蒲角反􅀲丨也二􅚩徒結反􅀲丨從􅀲正二音弗香嚴又田結反小􅀲也音劣撮􅂑也二音福陟栗反丨音陟甲反俗正莫必反不見皃又貧字從此也二矢部第卅一矢式視反弓丨又正也直也施也陳也誓也同上矬蔵禾反丨短也二音増弋射矢也俗丑知反上必􅀆反下祖􅀆反丨丨短皃失羊七羊二反傷也二同於􅄹反呼官反俗音胡上聲矯居反妄也詐也從手者正三俗音短俗或作古矤正矧今失忍反詞也况也長也五䂔刑頂反小皃也二於巳反短皃也矲上薄買反下苦騃反丨丨短皃也去聲音智上兵吠反下牛吠反丨丨短小皃也俗音患入聲䂐竹律反短皃也又知劣反矱王縳反黍部第卅二􅁰今黍正舒吕反􅀃文云孔子曰丨可以為酒故從禾入水也二正黐今丑知反黏也所以捕鳥也二黏正黏今女廉反相著固合也二古文音胡今作黏也音誅黏皃或作正郎奚反衆也又姓又力脂反二音香上聲井弭白賣二反黍屬也􅭓正今音汝丨黏也二音謹黏黍皃去阮反黏皃今正苦典苦見二反穄別名也二䵜上奴董反下力延反丨丨菓子多也去聲所賣反不黏皃入聲䵑俗䵒正尼質反􅑟黏也二正䵗今蒲北反黍豆潰葉也又符逼反二俗正竹益反黏也二蒲結反正作馝大香也部第卅三郎古反丨薄也醎丨也音咸苦也不淡也古文同上古今才何反塩曰醎丨二竹咸反味七廉反水和塩又古斬反也音懷戎狄塩也乙懷反塩也亦作字音温戎狄云塩也音消煎塩音矜苦也上聲古斬反也也胡朗反塩澤也薄犬反蜀人呼塩也去聲在細反也同􅟍倉奏反南夷名塩也入聲音尺狩也又或音魯音接九部第卅四俗正許交反虎聲也二叴厹音求地名下又人久反獸跡足蹂地之䖏也二音兼音求俗烏光反正作訄丘求二音迫也俗正丸而二音丸屬也二􅠤渠追反鍾丨辟􅁖也俗馗正渠追反道也二音干股也烏光反香嚴又音注上聲俗口反正作檾野死草也俗時勇反足丨病也正作字古雅皮玉爵也二同俗丨正羊主反量也二斢㪹上天口反下郎斗反丨丨兵奪人物也去聲或作斣今都豆反乱也又角力走也又物之俱等也二入聲俗正音角量也平木斛也二音的量也苦洽反丨斫部第卅七舒吕反雀丨切韻小獸名善爲盗易曰艮爲丨也正今音離小䑕相銜行也二音終豹文䑕也正今音􅀆丨䑕也又甘口䑕所食之物至盡不痛也二音唐丨䑕一月三易膓也音煩丨䑕音錐䑕名上音精下音劬丨丨小䑕也鼮音亭丨似䑕豹文音斯丨䑕通􅤜今胡南反似䑕旡耳也二鼯音吾似䑕上聲正今房粉反地中行丨䑕也又扶文扶門二反二鼴音偃丨䑕似䑕形大如牛好偃河而飲水也􅴄音耳䑕耳而勇反丨䑕也音栁似䑕而大去聲二俗􅥨正子峻反石䑕出蜀中毛可爲筆三鼬余救反虫名似䑕余救反䑕屬鼤而問䑕名入聲驅正今音博丨也二䶅音洛䑕名也陁骨反鳥䑕同穴其鳥曰䳜其䑕曰丨丨如䑕而短尾也䳜余徒二音鼫音石丨䑕螻蛄也䶂的酌二音䑕名又才藥反䑕似兔而小也胡狄反名也益厄二音䑕属也部第卅八許兩反獻也祭也臨也向也歆也又奉上也二同章輪常輪二反二俗通正都昆反迫也又姓四俗正都昆反噐似甌瓿二舊蔵作鶉常倫反宜利反蘇浪反亡也二入聲俗歰正所立反不滑也従四止与濇同二􅵋必亦反跛也与躄同所立反枲部第􅞀一枲息里反麻有子曰丨無子曰苴也苴音七余反俗正子侯反麻榦也二昌真之忍二反纑也即由反聚也又束枲也郎到反麻莖大也渠眷反縁鞾􅒌也音代直質反帆索也子部第􅞀二孳子之反丨息也孖子之反􅀟也孡古文他哀反今作胎孜音兹厚也亦篤愛也孥音奴妻丨也孯二俗苦閑反正作掔同也俗音齊從糺二音孾於盈反孩兒也上聲㝃免晚二音子母相􅄙丨身也二或作孴正擬燿二音多盛皃也三古文音好玉篇音躰保小兒也㜽古文音子叙順二音音子去聲俗正今而遇反少小㓜稚也又生也又姓三古文音季竹用反俗蒼反正作美女皃俗許既反正作息也孠音寺孨士戀反謹也又立反戢丨聚皃音阻立反同上郭氏又音啾㝂音制蝗子也音既玉篇丑證反川也香嚴音孔音字入聲俗通孛正没蒲昧二反丨星也三孹俗博厄反正作擘分丨也鼔部第􅞀三皷通鼔今􅈜正公戸反鍾丨也字從􅠭音叨從皮者非也三於巾反皷聲也正今音同鼔聲也二或作瓦噐瓶也三徒含反瓦罌属也与壜同下江反甖属也同上古今音盧瓦噐也二音浮小􅇲也音雷罇丨酒噐也音尊酒噐也音零似瓶有耳音崔玉篇噐也香嚴素回反俗正音刑酒噐也其形似酒鍾二同音䟽於容反汲噐也音盧瓦噐也革鞋反古今音由瓦噐也二疾資反瓦噐也与瓷同上聲或作張吕反盛米噐也之酉反噐也徒啓反噐也香嚴音提今芳武反弓把巾也玉篇子乳反香嚴同上去聲音貫汲水噐也二俗正呼嫁反孔丨破裂也三時戰反噐縁也呼貢反孔丨也都念反音聖入聲苦恱反少也也破也古的反吹丨也老部第􅞀六呼昆反也音老􅫎二音陷丨也三汫口冷徂醒二反丨涏䨍俗正烏廻反又音營二古文􅀄向反􅀄也始也懲也音澄必亦反理也古反數也喜部第􅞀八囏皆古文古閑反丨難今作艱四古文奴干奴案二反今作難丨昜艱丨也嚭俗疋鄙反正作嚭大也俗乙䔬反正作温柔美大也古部第􅞀九俗辜正音􅀌罪也􅀒也二古文同上俗居􅁜反古文音敦嘏古雅反大也福也逺也隨函云誤合作方蹬反束棺下之二二古文音克勝也能也乃部第五十通戸圭反持也提也二俗戸圭許圭二反正作觽角錐也俗子泉反又戸圭反俗正丁果反木垂皃二㚉音古多債利也二俗古孕今羊證反懷丨也四章刃反二耐乃二音鼎大者曰丨也俗音勢俗普撃反正作劈剖裂也音力俗音卓里部第五十一俗正里之反福也又理也二干求反与同結病也二俗烏􅀆反正作水黑也俗音擎正作黥俗烏閑反正作黒色也音亡俗巨炎反正作淺黒色音毗狸里二音俗烏奚反美石黒色也俗於糺反俗七感反正作俗都感反正作垢黒俗烏感反正作黭丨黮二力巳反時證反音坎䧟二音坈穽也音迷丨似􅀛不中食音麻子奚反舁音余對舉也舀羊小反也抒水也二舅渠乆反母之兄弟也亦夫之父也又姓䑗徒朗反春也待米精也持尓反居許反共輿㒵也之睡反杵撃也之睡反杵臼也䑔二俗正音伐舂米又芳廢反䑗也三音昨穿丨也二同疋各反舂也玉篇又音挿音昔履也又古文鵲字亦人姓也部第五十六音虵又禃葛反音虵又舊蔵作馳在續髙僧傳第七卷㐌弋支羊氏二反卑也反丁也反足也反并也反俗音舐成二反二比部第五十七音毗小籠属也二同音勞二同音毗丨齊名音卑是部第五十八相承歸燥二音息淺反丨寡也匙正俗是支反丨筯也二􅬾是支反群飛㒵也韙于􅀑反是也俗正他礼反撗首杖名二㼵音弟小盆也音􅂑鶗徒了反之日反二首部第五十九与之反与頤同丨養也又也音專丨断首也俗䭭正音首人初産子也二渠追反丨龍又州名亦獸名似牛一足無角聲如雷皮可為鼔也二俗古文苦礼反今作也首至地也三俗馘正音截耳也又獲也或作聝二俗音甫正作果部第六十郎果胡果二反二夥胡果反楚人云多又五果反五果反又同上二初瓦反下又所瓦反二側巧反龍手鑑上聲卷第二
