决丨丨鳥名春分秋分鳴丨則衆務歇也鶱許言反飛舉皃鳩胡官反丨䳜鳥也正鵐今音無鳥名二䴁音愚鳥似秃鶖也鴜即移疾移二反水鳥也昌脂反与䲭同俗音烏於容反丨渠水鳥也俗音陵䲮俗元憍二音鳲音尸丨鳩也俗䳕正音浮丨鳩二䲥二俗鳩正居求反鴿也丨聚也三俗正鷏今音田蚊母鳥也三或作鷜今音樓野鵝也又力朱反鵱丨也二昨仙反丨丨鳥也􅉇通鵬正歩崩反大鳥也二巨支反鷄也或曰也鷛或作正音容丨渠鳥名似鴨鷄足也二鸍弥絁二音鳥名一名沉鳬似鴨而小也􅬩部迷反丨鷺水鳥也正鴖今音旻鳥似翠喙赤也二􅯝音愚鳥名現則大旱􅛯或作今弥遥反工雀即巧婦也二鶕俗正音竒丨䳜鳥名似烏三足六尾自爲牝牡丨音母二鴸音朱鳥名似人首也䳩於消反鳥名狀如山鷄也䳫渠惟反丨鴆鳥鶅側持反東方雉也鷷音遵西方雉名竒盆丨鳩鳥或作鳻今音大鳩二鶢二俗鷄爰工音鳼音文鳥名音松或作正音詩丨丨鳥名二音移鳥名音枚鳭上陟交反下女交反丨丨黄鳥也上又音焦与鷦同鷐音辰丨風鸇鳹巨淹反自啄鳥也又渠今反鶼音兼比翼鳥也或作鷣今余針反鷂之别名又弋􅀏反一曰負雀别名二鵧薄丁反二音針丨鴜水鳥名也音心鳥黒色也䴀上音蒙下音同丨丨水鳥也鸆語俱反鸅丨一名姻澤也姻音護音煩丨鴅鳥名鵻音隹小鳥也上聲俗䳅正音􅁓丨䳜鳥也似烏赤足二鵡䳇音武鸚也下又音母義同二隝或作島正都老反海中有山曰丨也又音鳥二烏了反水鳥名足近尾不能行也音府鳥名俗䴎或作鸓正力水反飛生鳥名紫赤色似蝠而長又音雷三昌兩反鶖鳥毛也䳝音部小鳥也鴙二俗直几反正作雉二鴇􅬪䳈四俗䳰三今音保大鳥也七鳸􅟾音戸鳥名二同􅕯音可丨鳥扶乗樹上拪也䴈或作正烏老反鳥名也二或作音戸今作􅟾音父丨鳼越鳥也莫項莫江二反鳥也薄顯反丨鵲也奴了反鳥名俗音鳥俗徐兩反与同又音鳥以小反雉鳴也又羊水反去聲鷙音至執鳥也謂鷹鸇之属能執衆鳥者也二鷲音就鳥名多子黒色也鷺音路白丨鳥也䲴鴆二俗正直禁反丨鳥也三或作鵏正音歩丨䜴鳥也二鷂羊􅀏反鷹丨也許運反丨鶘􅊲聲云恠鳥也鴳鷃烏㵎反丨雀也又鶬丨鳥也二鵋渠記反丨鴆鵂鶹鳥今之角鵄也䲦音大鳥名狀如鳬三曰有耳經自切青反在四阿含慕抄鷧乙䔬反鸕鶿也玉篇又音翳鷖於計反鳥似鳯也又烏号反鳬屬二俗正苦􅃸反鳥子也生而須哺曰丨自食曰三俗音貫俗䳚正苦旦苦葛二反丨鴡鳥似鷄冬無毛曰夜常鳴也二鴡音且䳚丨鳥也奏湊搆三音鴣上之夜反下古胡反丨丨鳥不衝北飛也音志鳥也音曳飛星鳥也䳲音振鳥名也正鶽今􅀻閏反飛也又音笋鷂也二音鴻也音􅇠木丨鳥有毛角也二同訓二音倉盖反丨鳩鳥入聲舊蔵作鸖三俗鸖正何各反似鵲而嘴長仙丨祥鳥也三䳽俗同上俗音足鵲七雀反􅀃文知太歳所在巢常背之与䧿同俗鸀正鳿上二之欲反下一魚欲反丨頭黄觜目足赤大如鴨六首鳥也鵓蒲􅃿反丨鴿也鶡胡葛反丨似鷄鬬必至死也鵒音欲鴝丨鳥也似反舌鳥兩翼班白爲異鶩音木又音務鳬属也或作正五暦反革丨鳥也二俗鶂或作正五暦反水鳥也博物志云雄雌相視而有孕也三鷢渠月反白丨鳥也陟格都歴二反鷄屬戇鳥也鸄經暦胡狄二反鳥名似烏倉白色也并列反鵂鶹別名也俗正并列并􅀕二反雉屬而小有冠也二鴩徒結反哺豉鳥也或作䳀䳀音逸鵏豉鳥也音積鳥名也鷽扵角胡角二反山鵲之屬也舊經切胡骨反三俗鶻正戸骨反鷹属也又骨滑二音丨鳩也又丨随陽鳥也四或作􅨰正音獨丨軬乙鳥也二俗鷟正七甬反丨也二音岳丨鳯屬也普木反鳥也䳭俗鶺或作正音積丨鴒鳥一名錢母大如鷰鵛下有錢文也三俗正音格鵋䳢鳥名也下又音洛鳥􅖂水鳥二􅣍音洛似鵰黒文赤頭也鴀音不䳕鳩出玉篇俗音􅁖水丨鳥也二鴗音立水㺃小青鳥似翆食魚一曰天㺃音畢丨鴋鳥名白面色也鸊二或作鷿今抶歴反丨鳥名似鳬而足近尾也三鳨音力似鳬而小也二同音畧鳥也居縳反三首鳥也􅨊音習丨鴣鳥名鵽知滑反黃雀也又當括反或作鷫正音宿西方神鳥也二鵙古覓反伯勞也鴷音列啄木鳥鵴居六渠六二反鳴鳩今布穀鳥也鴶古黠反丨鵴俗去謁反正作朅胡瞎反􅗾也􅗾軋葛二音丨鶡也鸐音濁山雉長尾也俗鴪正音聿飛快也二或作鷸正余律反鳥名二俗鶟正陁骨反丨鶘鳥名似雉青身白首也二䳳辛聿反小鳥名也或作鵱今音六丨鷜野鵝也二鶌九勿反丨鳩也又去勿反丨鳥名古叶反俗音宿鳪音􅁲雉丨䑕名也􅖂音􅁲烏丨水鳥似水也鵠胡沃反異鳥名也􅜈音乙丨鷰也木務二音与鶩同亦鳬属也馬部第十馬莫下反人乗丨以代勞釋名曰大司馬武也大惣武事也􅀃文云丨字四􅀧䮃五俗駈二通正俱反馳也奔也八字俗駰正音因白馬黒隂也又扵巾反二俗騠正音提駃丨馬也又丁奚反二馳直知反騖也走也奔也騖音務駝正駞今音陁馲丨也二驍古堯反丨􅀐武健良勇也俗驕正居喬反馬髙六尺也二驪音離馬深黒色也又姓䮖音昌馬名􅀐音竒又竒􅀉反乗也又姓騾盧戈反丨馬也騏音其丨驥馬也倉含反丨駕􅀃文云駕二馬右者曰丨也馴音旬善也從也擾也俗騱正音􅀆驒丨野馬名又馬前中白也二騜音皇馬名駩音詮白馬黒脣也駗力珎反馬色也驎通䮼正力珎反騏丨白馬黑脊也二駢部田反駕三馬也騚音前四蹄皆白也音乹騮馬􅆃黄也都年反馬􅋕白今戴星馬也音宣丨􅋕馬也俗駣正徒刀反馬四􅀊也二徒刀反丨駼馬獸名似馬也駼音徒騊丨獸也烏魂反丨驪俊馬也騟音俞紫色馬也俗騷正蘇遭反愁也二二俗博昆反走也二􅬼音回馬名䭹五剛反千里駒也或作正子紅反馬丨也二駸志反馬行疾也俗正今側鳩反廐御亦丨虞神獸也又姓三駑駘上音奴下音臺体馬也􅍡倉紅反馬色也二古䮔今子垂之累二反馬小白三俗驩正官反馬名也二籕文今音􅀲淺黃色馬也一曰黄馬黒喙也二驫甫休反馬走皃又徒合反音寒馬名音㽜驊丨周穆王馬二俗或作正音㽜馬白腹曰丨四直耕反玉篇馬住丨也騯音傍馬行盛皃也玉篇又音彭驊戸花反丨騮也音咸丨驩古縣名亦馬名駺音郎馬尾白也驣徒登反馬躍也䮫落侯反馬屬也騛音非玉篇云丨兎龍馬曰行三千里音来馬七尺也䮒普胡反馬名騅音佳馬色又姓駓芳悲反桃花馬色也䮊音夷馬名音離驢子也駒音俱馬一歳也他􅀆反駿馬名駨相輪反戸皆反馬姓和也戸圭反獸名似馬一角俗殷因二音駌扵元反汙面馬也馼音文丨王馬名也駪所臻反馬名騢胡加反馬赤白色􅄂也驠音煙馬竅白其俱反騤丨馬行也俗或作騤今渠追反強也盛也又馬行皃三郎奚反馬屬二同音煩生飬之皃音煩丨止􅑓音注馬左足白也入聲駃古穴反丨騠良馬生七日超母也騠音提馬􅄂色也駮百角反獸名二馲正通皆落託二音丨駞也下又知格反丨􅦢也二落託二音丨駞也字書云力負千斤也駱音落馬名又姓又俗作馲俗􅦢正莫百反馲丨驢父牛母也二􅖃蒲􅃿蒲角二反丨馬獸名似馬一角牛尾也馺􅂫合反馬行疾皃騄音鹿野馬也又音録丨駬駿馬也俗驖正徒結他結二反馬赤黒色也二䭿徒結余二反馬行疾也騳音獨馬行皃也䮷音獨騼丨野馬也騼音鹿丨䮷也􅤻音伏馬也􅳟音六丨良健馬也音角馬白額也驀莫百反􅀐也又踰也騞呼麦反行不止也又丨然忽也又与􅒂同出玉篇俗馹正音日驛馬也二驛音亦丨馬也􅦩音八馬八嵗也二或作正音葛馬走疾也三驋博末反馬怒也俗音折驧或作今渠竹反馬跳躍也一曰馬曲脊也二二俗或作正良渉反踐也四􅑓知立反䮭音覓馬多􅁖也驌音宿丨騻馬名俗音撃正作鸄鳥名騽爲立似入二反馬豪骨也音業丨丨馬髙大也䮱音逐馬丨獸名音末馬名或作聿述肆三音驈聿述二音黒馬白髀也去勿反丨産良馬也二同駜毗必平宻二反馬􅏂也去􅁻反馬色也他盍反丨馬行不進也陟革反丨獸名也馰音的丨鸕馬白額也或作䮥正音歴馬色也二􅎗俗馽正陟立反馬絆也二䮠音逼駞丨驆江西隨函音必􅤥徒合反馺丨馬行也部第十一阜房九反􅁜丨也釋名云厚也厚土曰丨廣疋云􅁟無石曰丨又長也服也財厚也三同隆六中反中央髙起也豐也大也盛也四俗陁陀二正徒何反丨不平皃下又丈尓反毁落也音普何反三陂彼為反禮記云澤畜水曰丨穿地亭水曰池俗正徒刀反正也化也喜也又瓦噐官也又音遥臯丨也二階音皆挮也級也登堂道也又丨陛也隄丁奚反防也䧜音唐隄也隍音皇池也無水曰丨有水曰池也俗音乹符支反城上女墻也俗隤正徒回反下墜也二俗隅正音愚四角也􅑍也二於支反丨氐縣名也俗正仍反登也躋也上也造也躋音祖西反二􅩪部迷反牢也所以拘罪人也又傍礼反与陛同俗音昆隨音随從也行也逐也又姓隋音随國名州名又徒果反落也音豪丨塹也与壕同正隑今五來反企立也二䧆音洪坈也陠博􅀌普􅀌二反屋上平也俗陙正音小阜名也二憶俱反陽居澤名也徐林反小堆阜也陯音輪山阜陷隇䧅上音威下音夷丨丨險阻也宅加反丘名也陑通隭二正音而地名又峻嶮也下又乃口反衆也三古辰反殿階次序也阹去魚反山谷為牛馬圏也䧢去俱反丨隅不安也亦傾側也俗䧦正許為反鄭地阪名二䦺音丁丘名音貞丘名音無地名隃音俞丨麋古縣名又相俞式朱二反北􅁜名又傷遇反鴈門也俗阬今音坑尓疋云虚也二或作今直尼反􅁜阪也二俗音憍䧓音周亭名去營反反也陬子侯反隅也又聚居也又側休反俗隮正祖􅀆計二反升也登也二俗力反二俗今音形連山中絶也又姓三二俗徐延反正作涎口液也二与專反隳今隓正許規反毀也二􆉐或作陪今薄回反丨厠也二二俗音哀新蔵作隅在髙僧􅀓上帙音歸陎音殊丨􅖮縣名許冝反毁也音風地名隀音重地名阬音五丨郡又姓又魚逺反亦姓敶二古文陳字二俗或作今丁戈反丨堆也亦小崖也又上聲四隚音堂丨殿基也䧣舊蔵作陛音因塞也􅬜音崔丨崩隤也古文丁􅀆反又人姓也阽余廉反臨危也音垂邊也􅖮樓縷二音縣名俗正隂今音音丨陽又姓三䧇音衣天丨縣名俗去王反俗音曼陻於真反上聲險香檢反􅁖危阻難也陜失冉反古縣今州名也隦普米反丨堄女墻也与埤陴四同又避支反或作俾倪非女墻義也阤施是反壊也又直尓反亦山毁落義或作陀陊二字阱疾井反丨也隴力勇反冢也又州名亦天水大城也於􅉖反墜也落也隒魚撿反山形如重甑也郭迻又檢斂二音俗安古反正作鄔二俗正傍礼反階丨也三昌善反魯邑人名持兖反道邊埤也埤音婢䧁况雨反郷名乃反亭名隌烏感反闇也阪音反大陂不平也胡買反山名又險也俗正落猥反丨果實垂又力追反都猥反二俗正音兖髙皃二陡阧音斗丨峻也二同隝都老反海丨与島同都老反丘名又音受各同鄂隔音革障也隈界也二同俗而渉反又新經作字䧕古又域字騭之日反馭馬也又定也俗音俗音竭俗音擲阞音勒地脉阜也俗陕三古胡甲反隘也四俗或作隰正音習濕也原丨也亦州名又姓三阨今阸正音厄限也礙也又危迫也二普逼反地裂也二同今或作音􅁲彭丨蠻夷國名二俗正音危皃也二䧊空谷反大阜也上五結反下五骨反不安也又石山戴􅁟也下又五回反音急階丨俗烏甲反俗他逹反隙隟三俗正豈逆又也裂也孔也四广部第十二广魚撿反因巖為屋也庁他丁反平丨舊蔵作麾音許爲反丨也在弘明集第二大卷中麾許爲反旌丨也玉篇今音休庇丨樹隂也二俗如佳反􅡸麻摩