body:
  text: 龍龕手鑑平聲卷第一釋行均字廣濟集金居音第一人如鄰第二言語軒第三心息林第四山所間第五車昌遮第六長布遙第七門莫奔第八刀都勞第九衣於希第十示巨支第十一牛語求第十二爿疾羊第十三文武分第十四支章移第十五皮符羈第十六方甫良第十七風方容第十八几武兵第十九亠徒侯第二十舟織流第草一毛莫袍第草二斤居欣第草三巾居銀第草四勾布交第草五矛莫浮第草六禾戶戈第草七隹織唯第草八弓居戎第草九田徒年第三十宀武延第卅一羊與章第卅二身失人第卅三尸式脂第卅四魚語居第卅五戈古禾第卅六囗玉非第卅七韋雨非第卅八音於金第卅九多得何第四十尤羽求第四十一光古黃第卌二香許良第卌三􅒋落官第卌四殸口耕第卌五黃胡光第卌六辛息鄰第卌七某息夷第卌八髙古勞第卌九其渠之第五十章諸良第五十一生所庚第五十二冰筆夌第五十三彡所銜第五十四來落哀第五十五兒汝支第五十六而如之第五十七臣食鄰第五十八羸力為第五十九龜居追第六十元愚袁第六十一云王文第六十二雲王文第六十三匚甫良第六十四殳市朱第六十五瓜古花第六十六龍力鍾第六十七畨普官第六十八僉七廉第六十九天他前第七十西先兮第七十一無武扶第七十二凡符嚴第七十三名武并第七十四亭徒丁第七十五牙五加第七十六卑并移第七十七寧奴丁第七十八男奴含第七十九孚芳無第八十鷹憶水第八十一申失人第八十二虍荒烏第八十三居夌第八十四甘古三第八十五么於堯第八十六川苦昆第八十七災側持第八十八由以周第八十九女夷第九十坰古熒第九十一單都寒第九十二圭古雋第九十三許容第九十四興虛凌第九十五丹多千切第九十六知陟也第九十七金部第一玉篇七南色咸二反丨馬口中鐵也又思感反魯甘反丨也二或作銎正音丨懼戰憟也又斤斧柄孔也又音恐三俗或作錙正側持反丨銖也三錆俗錆正七羊反精也二鐖居依反鈎名俗或作正鋒今芳容反兵刃端也四鎔音容鑄也鏞銿音容大鍾也二鋪普胡反丨陳也布也又去聲戶瓜反丨鍬也宋魏之間謂錘曰丨下又音吳錕丨山名二銷音消丨鑠也散也莫侯反與矛同長丈二建于兵車也三釘音丁鐵丨也又去聲釘栓物也鎸鐫三俗鐫正子泉反也又戶圭反大鍾也四鐫古文同上又七九反丨刀也銞古鈞今決勻反均也法也陶也陶法均平無等差也又三十斤曰丨也二針今䥠正音針丨線也刾也又巨炎反人名也二鉗巨淹反丨索之類也鉆巨淹反持鐵夾也銵鉺鏗口耕反丨鏘金石聲也三同鏘七羊反鏗丨金玉聲也鈜戶萌反金聲也鑅上楚耕反下音嶸丨丨鍾聲也鍧呼萌友鏗丨鍾聲與鼓聲相雜也釭古紅反車丨轂口上鐵也又音江燈也鐹鍋古禾反溫器也又音果釣也二同俗鑱正士銜士懴二反犁鐵土具吳人呼也二銛息尖反利也尖也鋀通鍮正吐侯反丨石次於金也又徒口反二鈔初交𥘉教二反取也又與抄同略也鈐巨淹反兵丨又釣也鈿音田金花寶丨謂之金丨也鐐音聊有孔爐也又紫磨金也又白銀美者也上又音料下音流義訓皆同二鎗楚庚反丨鼎也鏝莫官反泥丨也鉎音生鐵丨又音星鐵丨也鑽子官反丨刾也又子算反錐丨也鐎音焦溫器三足有柄者也又昨焦反鋋延禪二音方言云小矛也鏈丑延力延二反鉛礦也鏻鄰靈二音健貌也武巾反鋭也武巾反算稅也音煩廣刃斧也音冤鋤頭曲鐵也釗古堯止徭二反覿也逺也見也勉也又弩牙也魯刀反爐鉺也鏖於刀反溫器也亦銅盆也鋻音堅剛也又音見丨刃也䤬鑼上音娑下音羅丨丨金銅器也鐳音雷壺瓶也鍰戶關反六雨曰丨鋼音剛堅也精也俗鋩正音亡刃端也二鉛或作鉛正音緣丨鍚盲金也二鐃女交反丨鼓似鈴無舌又小鉦也軍法十長執丨也鉏士魚反田器也又誅也又士吕反丨鋙不相當也鈗俗鈂正鈂今音沉錘屬也錘音楚洽反錘秋金也三錬音東丨􅣾車轄也又俗音錬錍必支婢迷二反比金斧也鑲汝羊息羊女羊三反並兵戎器也俗銓正音詮衡也又次也量度也二鐄音撗犬鍾也鍠音撗和也樂也又鍾聲也鎊普郎反丨削也鋃音郎丨鐺瑣頭也又鍾聲也鋿音常車丨輪鐵也鉠於京反鈴聲也俗鑏正女耕反丨丨金聲也二􅣏音孤丨也音卜錕音昆丨鋘鐵赤色可為釰也鉦音征鐃也似鈴誤錞正音純丨干樂器也下又音隊矛下銅也二鍪音牟兜丨首鎧也􅣱音賔丨鐵出罽賔國鐵中最利也舊藏作錘音直追反錘直追反􅱨丨也正音孤今作俗音敦爐音盧酒盆也又丨冶也舊藏作舒扉俗音非正作扉戶丨也鎡錤上音兹下音其丨丨鋤別名也銶音求鑿屬也俗音兹鈎俗鉤正古侯反丨抽也又屈鐵也又釰屬二䤺合作釿釿音斤斫木器也又冝引反齊也二鍬鐰二或作鍬正七遙反臿也三鎕銻上音唐下音提丨丨太齊兒也匙音低丨歃血器也歃音所洽反上銜反鎞邊奚反叉丨也鐵音提鐵名也鈹普皮反説文大針也玊篇刀也錟徒甘反長矛也鐔徒含反劒口也又淫尋二音亦劒鼻也又姓今鍯古文音忩大鑿中木也二新藏作音忩俗音川鈋五禾反去角也圎也與隆反鉡音盤鉫音加又古荷反戶耕反古行反又去聲錂正今音陵金名二音留金名又殺也又力救反鑇經音義云茨奚反謂丨郭氏音子奚反丨持也在中阿含經第五十五卷俗音離鍱俗修秀牒三音經音義云冝作麩在中阿含經正鍴今音端濽也二銘莫經反丨記亦名也鍸音胡俗鏐正音流美金也二誤鑣正甫嬌反馬銜也二上音下音謹鈝同玊篇于今反在呪中鑫許今許運二反鈈俗鉟正符悲芳悲二反丨刃戈也二音床釖音刀禹愚反鈓或作銋今如林反丨濡鹽韏也又如甚反鍖丨也韏音勸鍖音丑甚反二錭徒刀反丨銚也丁兮反鈗音尤䥩音微懸物鈎也鐻音渠丨耳之環也音鋤丨鳥白露也鈘巨金反持也鍝遇俱反鋸也鏍或作􅟋正落戈反銼丨小一金也二鎪俗通鎪正音搜馬耳也二鉷音紅弩牙昨間反小鑿也誤舊藏作鈎鎖千佛名在賢愚經中錅或作鑗正力脂反金屬也二鏫力尸反丨也鍭侯候二音尓匹云金鏃箭羽也釪音于錞丨樂器刑如鍾嗚以和鼓也音竒釡屬又音蟻三足鼎百蘭丨又姓銂音州鐊俗鍚正音羊兵名又馬額飾也二鑾落官反丨和鈴也鋮俗音成俗音鎔俗行交反或作鈃正音形酒器似鍾而長頸二鉶音刑祭器也鎢音烏丨錥溫器也錥音育音烏丨鏝又戶花反兩刃錘也錘音楚洽反鑙古兮反丨堅也鋂音梅大鐶也戶間反指丨也俗正賫齊二音利也二鑃其俱反兵器戟屬也鑐音須鎖中丨也銖音殊分丨也俗正音俞祭名也二鐼符分反飾也又許運反鐵類鈳音阿丨䥈䥈音莽錏烏加反丨煆也煆戶加反錏丨也耙音巴兵曺也又暜巴反方言云江東之鈚箭也音叉錢異名也誤匜正鉇鍦二今失支反短矛也又俗視遮反四鍕二俗上音軍下音持梵語此云雙口澡灌也胡男反鎧别名也鋡胡男反受盛也音柔濡也謂耎鐵也釚音求弩牙也鉜音浮丨鏂大釘七恭反短矛也又音窗彼為反鉊屬鉊之遙反淮南呼鐮也鉖徒宗反釣丨鏂烏侯反丨銗也銗音侯鏂丨錏煆也彼為反鋸鉏也鐘音鍾樂器也鈭即移此移二反丨錍斧也通正音彌青州人呼鐮也二鏔與支反戟無刃也鐁音斯平木器名鈚音毗犁丨别名也又匹迷反丨箭也音漂刀劒鞘下飾也又必妙反二食陵反二鎌鐮音廉刀丨也亦廉也二同鏜音湯以鐵貫物鐦苦回反鈇音夫鉞也丁含反鈖相承方貧反玉名鋰良冝反釾或作鎁正音耶鏌丨劒名鏌音莫二正今音尖鐫鋒二古文音𥘉音封正鐟今子含反無蓋釘也二三俗鐈正音橋似鼎長足四音帝器也音鈭二或作雌資二音正作鈭鏢音漂刀釰鞘下飾也又必妙反鐺音當銀丨也又音湯鼓聲也又俗楚更反也古文音初相居反上聲古鋛二俗礦正古猛反金銀銅鐵璞也四鎖俗鎖正蘇果反鐵丨也二鑳通正音件管籥也籥音藥二俗鉹二正玉篇昌氏反釡也又甑也下又音移方言云甑也三巨音巨澤名也又大也􅣾都果反車轄頭鐵也䤻徒果反車轄也又犁錧也錧音管車具也又音貫車軸頭鐵也又犁也鈄天口反姓也又香嚴作邪斗二音鋌徒頂反金銀丨也鏨才敢反丨鑿屬也又慚讒二音亦刀鑿義錪多他典二反小釡也俗鏟二正𥘉産反平木器也又𥘉限反三亡敢反呪中字俗音􅍫䥈莫朗莫古二反鈷丨也鈷音古丨䥈也俗桑朗反苦管反丨縫也鈕女九反印丨也又姓鏋音滿精金也鈑布綰反錫金也釕音鳥丨鈌帶頭飾也䥵土了反鐵文也胡老反溫器也切韻又丨京錁音果江準云鐮也鋠時引反圎鐵也銑蘇典反金最有光澤者曰丨也俗古瓦反堵丁果反車鐧丁果反丨鈹也䤾苦感反鎖連鐶也胡項反似鍾而長鉼必井反丨金胃之板也俗今亡范反馬首飾也二鈶音似鋋也奴禮反絡絲也䥯薄買反大鐵杖也鍇苦騃反鐵好也鑘落每反鍡丨又音雷劒首飾也鍡烏賄反丨鑘不平貌鈏音引錫也鏾音散弩牙緩也正俗之展反擊也二丑免反丨物令長也扣音口金筋也鉉胡大反鼎耳錋徒口反酒器也或作鍮今作鐙鋙鋙音語鉏丨樂器也二來反連絲鈎曰丨鐪音魯釡屬之酉反䤥居委反戻鋸齒也顉五感胡紺二反搖頭也又去音反曲頥也音罔二步項反音矢作管反音銣尼主而遇二反鐥音善亡返反引也正作挽鍖丑甚反丨錐也音苟於許反又音烏居兩反錢也又孟康云丨錢貫繩也鏙七罪反丨錯鱗甲也釥七小反好金又淨也必老反音散去聲鑟求位反賈陷反照也明也鏡也察也哉也又音監二鑬舊藏作鑑苦蓋反甲之異名也亦通上聲俗煆正都貫反打鐵也鎚也小治也二徒悶反頑也不利也新藏作羊稅反利也錐刀鎽芒也鋸居去反刀丨也居去反樂器也鈙其禁反持止也又魚倚反釡也與䰙同鏇辝絹反轉軸裁器也又似金反丨圎轆轤也錠音定錫屬也又音殿鐙都鄧反鞍丨也又音登又徒口反鎩所例反矛戟屬也又所拜反剪翮也翮下革反銚徒反燒器也又音遙亦溫器又古田器也又他反音注丨也又姓鎚直類反好銅半孰也又直追反鐵丨也又都回反錬治王也古文同上鐞俗耨正奴豆反鋤丨也或呼髙反義同二釤所鑒反大錬也鐆俗鐩或作鐆正音遂陽丨可取火於日中也二俗正冨福二音釡而大口者也一曰小釡也二𨫼正鏊今五到反餅丨也三同上刨蒲效反治木器丨也又步交反丨刷也鍊音錬丨金也俗作錬者非錬音東錬從東音同上徒對反錬丨車轄也又息委反又徒果反今通正七亂反短矛也三鐜俗鐓正徒對反矛下銅也二鏤盧候反錯也雕也尅也又力誅反屬丨劒名錮音故鑄也又禁也塞也牢也俗匱或作求位反檻也正作饋餉也二銄俗式向反正作餉丨饋也鋽他弔反鉎丨也俗音亂鈾古文直救反釰音刃劒刃也錝子宋反金毛也鏆音貫臂鐶鈵悲詠反堅丨也􅐥亘反重鐶也鎎許既反弩戰也鉒之戍中句二反置也又選死人物也鍍音度以金飾物也又音徒鐬呼外反鈴聲􅎂音犬鉗丨又音弟以鎖加足也鈉而稅反鋭丨錣陟衛反針也鏏祥歲反大鼎也鏉所又反鐵鉎丨也又速侯蘇奏二反刻鏤也鐏徂寸反矛戟下銅也音惠鋭也又三隅弔也銴音誓車當結一曰銅生五色也又音曵鋇音貝柔鋌也鈗徒外反丨矛也鐱劒儉二音鑢音慮錯也古文音證鋥除孟反磨丨也義合作音計音剃䤝音硬音樹音二同音忌錗竹恚反釪銲侯按反丨金銀令相著也二同音素鋓音利丑辨反正銐今昌制直例二反除也利也二人絹反柔銀也二同䤳才夜反鏡丨居隂反鏧或作鑋今苦定反金聲也二鍄音亮銼麁卧反蜀呼鈷鉦也羊角反錑盧對反平木器也􅘜盧候反鏉丨也䤰玉篇乎鈞反香嚴音熒治器也二武鄧反玉篇鐶也玉篇所諫反鐵廷也又應法師音山卓反丨也二古文證字驗也俗冨福二音正鎪鎪同證古文音證四古文證字也入聲鐸徒各反大鈴也四俗鑿正音昨鏨也穿木器也玉鈼同上吳人云釡曰丨鉞三俗鉞正王伐反王斧也四鋨鐵二俗鐵二正他結反黑金也四俗今正音金鐵丨也三音煞鳥羽病也又長矛也俗正蒲末反樂器也二鑊胡郭反鼎也二俗鏃正作木反箭丨也三胡瞎反車頭鐵也鈒蘇合反丨鏤也又所立反鋋也戟也俗正音藥開丨也二鏕音鹿巨丨鄉名又於刀反與鏖同鑷尼輒反丨子也鋷輒聶二音丨子也二同錫先擊反鉛丨也又賜也與也鑠書藥反銷丨也二古今居玉反以鐵縛物也二鐲市玉反溫器也又直角反似鈴也市玉反兵器也又陟玉反钁丨也又斫也音欲炭鈎也刨音雹丨行形徑刑以扜也銍陟一反刈也又之日反縣名也鑕音質斧也錖音毒丨舌也音決舌也烏毒反白金也音卜丨􅣏魯矢也􅣏音孤俗鑮二正博薄二音似鍾而大也三音博鍾罄上橫木也盧盍反錫丨鉛屬也俗音朔鐝俗正其月反磨丨之貌二俗音釙匹角反金丨也出玉篇音結鐮別名也苦結反咸也又斷絶也又同上二鐯張略反钁也鋜士角反鎖足也鎉俗都盍反俗鑈正奴叶反小箱也二或作正玉篇音劈器也二俗普擊反二或作𨫔執薩至三音羊捶丨也亦田器也三鈌古穴乙穴二反破也居列反句孑戟也俗正鏑今都歷反箭鏃也三五各反劒端也音妾丑輒反級衣針又楚洽反鍬也鑡𥘉角反餅丨二同俗七昔反鐵古文直質反今作紩縫丨鏌音莫丨鎁劒名鎁音耶鍓俗鏶正集妾二音鐵銯也二鑩五各反以鐵作鈎物也鉀音申鎧屬又古盍反丨爐鍙火沃反銀也鉥食律反長針也魚乙反胡刮反釟音八治金也俗或作正音歷玉篇釡也三音歷丨鎗二同子略反或作正竹角反丨斧也二竹角反擊也與椓同俗釳正許訖反乘輿馬上搖翟尾者二鎍生革蘇各二反音薩鉿古合反尺鋌也或作銛正古活反無知貌香嚴又音闊二䥢倉歷反守夜鼓也鐍古穴反丨也俗鏚正倉歷反于丨斧鉞也二鐾或作鐴今必益反丨土犁耳也二或作鈠今音􅟕小矛也二錔他合反俗今普擊反裁木為器也二音聿針也居謁反金丨也钀魚列語謁二反馬勒傍鐵也鍎徒骨反覆丨鈯陀骨反也又小刀也釛音八金類也查轄反秦人云切草也鋝音刷玉篇云三丨為一斤也又音劣鋢俗同上普篾反江南呼鍬刃古叶反長丨劒名也䤶於業反椎丨甲器也鉣音劫帶鐵鉻音格陳公鈎也音毒丨丨等截也玄音賢很也又亭名仍如升反頻也重也因也就也乃也侘丑加丑亞二反丨傺失志也又他各反寄也香嚴音亡僧反惛也玉篇亡同反醉行也特丁反水止也僮音童僕也又癡也頑也又姓仳音毗醜貌也又符鄙芳比二反離也别也侁所臻反行貌也亦齊整貌僉七尖反同也咸也皆也倫音輪等也類也人也道理也俗僑正渠苗反寄也客也二古正佻今他堯反輕也佚也三仿音傍丨佯也又分兩反僾人丨相似又古文妃兩反佯音羊詐也又仿漫行也又音墻弱也又古文髣字如羊反丨伽王名也二俗正古文音仙止也上于山日丨也正從上今從山三二俗音劬正作衢俗子俞反也二俗音緾正作緾􅧷音科美貌也僖虛之反樂也戲也笑也俗或作僄今匹昭匹妙二反輕丨也三仙三俗或作三古文音仙丨遷也今作仙六俗傒正胡雞反東北夷名也二俗音飢佡仚許延反輕也二俗音徒佺音詮偓丨仙人名也俗正上咸反惡也儖丨也又𥘉鑒士陷二反輕雜言也二魯甘反形貌惡也俗正音牟均平齊等也二偳俗音端許緣反智惠了利也亦疾也又舞也伻普耕反使人也佂諸盈反行貌也二伀隻容反志及于衆也偟音皇睱也吐力反編絲繩也俗佪正音回避也二伹七余反拙人也又徂古反殘也俗音蛇儕音柴等也俗力梅反俗渠具二音正今音丨役也使也又喜也二二俗音悲俗偲正倉才反多才能也二通份正筆巾反質備也二俗音魚尩二俗去王去誑二反俗部田反俗音兜催倉回反迫促也五兮反丨㑮佯不知貌俘音敷囚也胡交反痛聲也倠許維反仳丨摸拇也傛音容丨華縣名音曺終也又音遭㑗音身人姓妤音余婕丨與妤同形或作正侀今音刑成也三傖助庾反吳人呼秦人作丨咱音髙毁也又渠久反與舅同亦姓侇音夷玉篇人名也倁俗音知俗音持俗口求反苦瓜反奢也與夸同又安卧反丨䐗痛也傫儽力追反懶懈貌也二同昌陵反宣揚美事也又好譽詮舉也又言也足也丘也占侸上丁兼反下當侯反丨丨輕薄也一日垂下貌上又音店儂音農我也俗正徒丁反丨息止定也二正今音眉草生水垂貌或作丨䔧垢腐貌二音孤商的二音音媌二偤音由侍也或車反倯息恭反丨恭怯貌也俗正渠容反丨倯可憎之貌也二渠追反使也佒音央傴也偧陟加反張也偣俗于廉反淨也音移笑丨丨音申佬音遼又所臻反正作侁二息廉反丨細也此是九子二字經文云仇子陀也在廣弘明集第七卷伽求迦反丨藍也俗音充俗音般佹居為反丨成也丁奚都禮二反二㑯俗音須又思王反市遙反照也明也庿也又丨穆也又市沼反介丨俗音希云小臣也一曰夙駕徽俗音暉正作徽美也仔音兹克也又音子草木盛也侽備二俗女咸反音頭俗丁年反蘇遭反驕也偎烏回反愛也又國名俗音皆上丘加反下于靴反丨丨癡貌也音尖俗汝占又正作誦多言也烏光反二古文金字􅟅或作僝正七間反惡罵也又士戀反見也具也二侌古文隂字仐音今俗音支許尤反祥也吉也美善慶息也侳昨禾反與矬同丨短也音旬同善也俜普丁反竛丨行不正也又作伶丨孤單貌從音從音推三同于金反又去聲音奴音徒上聲儉巨廣反丨少飢饉也偶吾口反諧合匹對也僂力主反傴丨俯身曲春也二俯仰上音免俯也玄頭也下魚兩反舉首也又時也為也二俯音甫俯丨也下首也俗正于蹇反仲也仆也倒也息也又姓二佷胡墾反丨戾難迥也僥古反抄也又于堯反俾并婢反使也從也職也二俗正尺氏反奢也泰也大也逺也三倚于蟻反因也住也依丨也音武歌丨也音武輕也慢也侵侵與古文侮同儛音武大也失意貌也偯于豈反丨哭餘聲也又大功之哭三曲而巳正幸今胡耿反僥丨又非分而得曰丨二俗伈正思審反丨丨貌二佇直吕反又立也偉于鬼反大也竒也重也四俗古文音散蓋也今作繖字傴于武反不申也背曲也儡落每反又郎對反丨丨子戲也又音雷丨同倮郎果胡瓦二反露體也二俗企正丘弭去智二反望也止也三侗上勒董反下他孔反丨丨未成器也下又直也一曰長大又音通大也僓他每反長好肥大也徒損反倱丨也倱胡本反丨四之一也警居影反窹也或也起也走也又音􅔡敬愼也儼魚撿反敬也坐思貌也估音古市稅也俚音里賴也聊也又蠻屬偠烏了反丨㒟細腰好貌也奴了反偠丨也床史反待也又姓㑿士巧反丨丨長貌也郭移又音巢俌音甫輔也倣方罔反丨學也正㑨今愚矩反容貌盛也二俗似或作徐姊反正作似相丨也二傡正今蒲猛反俱也並也又音並二俗胡管反俗羊主反正作窳仠古旱反丨長也僔子本反聚衆也又俗導存二音蘇感反頷丨搖頭也與㧲亦同俇時掌俱往二反丨遑遽貌也玉篇又渠往反枉也僸牛錦反玉篇動頭貌又居蔭反樂名九輦反偃丨傲也藕俗五口反蓮根俗或作于鬼反大風貌正作􅰜又俗胡每反二體蒲本反劣也又俗千內反獄名二俗通正音􅊰􅷗丨不媚貌也又虛􅊰反擔丨也四莫講莫江二反丨不媚也古迥苦類二反好貌也或作正阻史反脯也又脯有骨曰丨今作胏易曰食乾丨二于敏反憂也與愪同俗愚雨反侰俗僒正渠殞反㥯迫也二俗兆買反二俗音􅪠徒旱反大也古文上音乃下音災鬒之忍反新生羽而飛也仵音午偶敵又逆也又姓古文古典反小束也又音結㒄人善反意脆又失善反俴音踐淺也侱丈并反今作徎雨後徑也於阮反勸樂也佊音彼邪也敬也四尼教反丨不靜也伺思恣反候察也又平聲備音備防也救也具也慎也皆也咸也副也究也辦也成也又姓伨俗古殉今詞閏反逺也疾也以身從物也三易音易相輕慢也又音豉􅥚二俗偫通正直利反大也又會物也四侫乃定反諂媚偽善也又才德之稱也二俗正音貸借也施也假物與人也三仞音刃七尺也説文一尋也倒都告反丨也又上聲三俗皮證皮氷二反正作憑􅑀二字倩七正反借丨也又倉見反利也又好女笑貌俲俗效正胡孝反教也與學效三同二音計連丨也又音玄佷也俗音置正作置佁音態丨擬癡貌與儓同係胡計反以證反貌也誤仛正玉篇丑訝反嬌逸也又音託二傺丑例反侘丨也伉苦浪反丨儷敵對匹偶也又姓儷音麗伉丨也三俗魚據反正作御俸扶用反祿也奉也必刃反丨從也相也導也或作擯二俗音戀奴亂反丨弱也倀知孟反丨失道貌又丑良反僅音近才也餘也劣也少也又俗丁里反㑦郎計反佷丨也儩音賜盡也與亦同偋房正蒲徑二反隱僻無人處也又厠也與庰同㒃二俗女利反正作膩佑音右優也助也襯𥘉近反至也近也毗面反丨利也又人行不善更之則安故從人更聲更音更㐻俗內納二音正作內字古定反直也又五堅五莖二反㥯也又牛耕反俗價正音界丨也二介音界助優申閲也又大也耿也俗音政俗音貌或作正僣今子念反差也擬也三信古文音信也又持立也二㑁竹律反短貌也又音墜蒲木反童丨也又附也官名太丨也亦丨吏也伋音急繫于心趣于事也又孔丨人名侐許逼反清淨也仂音力勤也不懈也與力亦同偓烏角反丨佺仙人名又姓他括反丨可也又輕也俗音亦莫結反丨僣多詐也㑛速束音㒔丨也㒔獨蜀二音丨㑛短醜貌也佮口合反人姓又音合併丨聚也俠正俠今胡頰反任丨也又姓二俗音發佖毗必房密二反威儀備也溺古文奴的反今作溺字伲俗女乙反近也俗學角二音渠玉反丨促短小貌也促七王反速迫至近也俗正或作先結反動草聲也又鷙鳥之聲丨丨呻吟也三俗正先結反丨淨也二佅音未丨㒓肥貌又夷樂名他逹反佅丨也俗音劫㒒俗正呼叶反丨卑也二古文音尅俗俶正昌六反始也厚也作也動也二古文音宿傝他盍反丨儜劣也又丨儑不謹貌也儑五盍反傝丨不著事也􅳇私盍反傝丨不謹貌俗書約反俗五各反俗音列佾俗正音逸丨舞列也二佸括活二音會計也俗陀骨反音俗托音託毁也逼彼測反迫也與逼同俗倉歷反正作戚憂也疾反斜出也又利也便也㒤之涉反服也又天反急也偞二俗音儠良涉反長狀貌佶渠乙反間也正也佫胡各反人姓也倜他歷反丨儻也又陟流反伌俗音厄災丨俗徒活反音答仢酌杓二音丨流星名也音敕意愼丨又惕也俗呼結下結二反俾音必行貌玉篇又止也蒲木反俗呼叶反伳私列反音竹侄音質堅也牢也俗音察今僇正六二音癡行貌二傗㑉上丑六反下息六反丨丨不伸也僪巨聿反鬼無頭也㑻莫八反丨健貌也俗正呼八反㑻丨也二徒沒反傉奴沃反虜三字姓庫丨官氏也俗胡頰反和也俗音習五俗居列反正作子單丨又旡右臂也六俗子六反正作蹙急近逈丨也陟革反侼蒲沒反強也倉歷反與戚同憂懼也四獵質二音也羊列羊制二反俗直略反俗音燭㑫俗乃叶反又舊藏作棄在七佛神呪經古文億字古文音錫音折俗其列反又音列倬音卓大也詩云明貌也又玉篇丑角反偓丨旡禮也音割言部第三詒與支反贈言也又徒亥反相欺也譩音依痛聲俗或作諝正相􅹣私吕二反有才智之稱也三訏况于反大也音扶丨詞也誒許其反可忘之詞也衆語訩正今許容反訟也三徒回反譟也如鹽反多言也又流反􅨜音呼亦也古蛙反讕㤢也誧博孤普胡二反諫也又音普大也助也又音怖謀也落千反逸言又落旱反謾丨二諰山佳反語也誽女佳反言不正也步賔反北言也諞房連反巧言也又音辨噟接言也陟加反丨詉語不正貌詉女加反丨語不正也又奴故反恚惡言也歌古文音歌䜙五含反不專丨又謔弄言也詌音憨又上聲䛔女加反二同俗訞或作訮正許延反詞也怒也又五間反亦諍訟也又音天亦詞貌也三諅諆居之反丨謀也二苦回反丨調也謣音于女也二同訛五戈反丨􅍝也偽也詭也動也又化也言也二詮取全反敘也明也次也平也證也衡也音沉怒也又音甚信也讎市流反仇丨譏居依反諌也誹也問也譴也欣音欣喜也誈二俗通誣正音旡丨枉欺妄也又加也不信也四譕音無誘詞也古文音愆過也先奚反悲聲也又聲散也先奚息移二反該古哀反皆悉咸修義也又軍中約也諧户皆反和調偶合也諛羊珠反諂也訑通詑正徒何反欺也誑也二土禾反欺也玉篇又止支反多言也諼詐忘也喧譁也歡三同音喧囂丨也又音歡亦喧也譁􅹨音花喧丨也二謿摘交反謔也與嘲同俗正誇今苦瓜反大言也三譊女交反爭也恚呼也詨音交誇語也又音哮二俗正于喬反巧言也三䜈楚交反代人説也諲音因敬也訬楚交反健也酬市流反丨酢報答也陟流反丨張欺誑也􅑲音移自得之貌又淺意也又徒哥反避也俗正烏奚反誠也又烏禮反舊聲也二訋三俗䚮正音仍因也就也厚也又人之反四諶氏任反誠也䛘如林反信也念也音侯訡音吟丨歎也訕二俗訕正所姦所諌二反丨謗毁誹也三咨音資丨詢訪問也詢息旬反丨問咨懇也談俗正談今徒含徒感二反大也又姓三或作諳正烏含反憶也記也二諄章輪反至誠丨正也又之閏反告也丁寧也又佐熟罪苦也三章輪之閏二反言亂之貌也訂他丁徒頂二反評議也又丁定反逗遛也謜音詮言語和恱也諯士專尺絹二反相讓詷也又音専相責也撰音詮善言也又士眷反専敬也讒俗讒正士咸反譛也以言毁人也二五咸反知也又戲也喃女咸反詀丨也謓昌真反恚也怒也與瞋亦同呼荒孤荒故二反大呼號也許緣反智惠也詹聀廉反省也三俗詜正土刀反丨䛬言不節儉也四徒刀反詜丨也謳烏侯反呤也歌也五加五佳二反謊呼光反夢言也呼光反丨也讝俗古咸于衫二反胡丁反三周謨謨莫胡反謀也議也偽也二同詴烏回徒卧二反呼也又戶罪反四同星耶反詅郎丁反丨言相次也又音詮訧羽求反過也又作尤義亦同俗烏含反訶哥二音俗誗直廉反言利美也又人名音增加言也譻烏耕反丨􅘱小聲也謍音營丨青也説文小聲也通􅘱正女耕反譻丨也二或作宅江反正作丨骨也音苦江反嘻許其痛聲亦上聲談經音義音徒南反郭移俗子邪則何二反在兜沙經丑林反音占謠俗謡正余昭反歌丨尓匹云途歌謂之丨也二詓豈俱反謰音連二諃音琳善言也諪音亭調丨諴音咸和也戲也玉篇又音嵒亦弄人也謻直離反别也又音移水室門名也音渠詳音詳音􅐚䜞子為在細二反正作劑刀也二音詩女加反女加反絲丨語不解也楚尤反丨隂私小言也音𥘉栗反通正陟山他二反丨謾欺謾言也香嚴又丑山反二訅音求安也謀也信也訜上音分下音云音云三俗或作䜏正土禾反退言也五俗正音繩稱舉也二􅬢烏兮反相言噟辝也丑知丑秋二反相問而不知也又落代反誤也或作諏今子子子侯二反謀也二謘遲稚二音語丨也楚佳反興言也音由從也諻虔撗反語聲也訌戶公反渲潰也誴昨宗反謀丨樂謧力支郎兮二反弄語也諀符支反人名又匹婢反丨庀惡言也音斯數諌也又挮啼二音轉相誘語也䜅惟誰二音就也匹夷反􅍝也誀音而誘也古文音裁詵所臻反衆人言也徒刀反上聲詎其吕反詞也豈也不定也諂二俗讇諂二正丑染反丨誑也偽也侫也四三古訿訾二今子尓兹此子移三反罵言也毀丨也五音誣丨也詭居委反丨誑也責也隨惡也誘音酉道也引也進也教也俗音偶正謏通先了反小也誘為善也又蘇口所六二反俱訓同二古謇正居展反丨吃難言也三譣許撿反丨詖也謦口頂反丨咳通喉中氣也譭許委反謗也譛也二俗通正都禮反訶呰欺毁也下一又他歷反丨䛢狡猾也四警音景戒愼也寤也諩或作譜正音輔籍録也二誄正力水反銘也諡也誤同上通診正之忍反視也候也驗也二矧式引反詞也况也長也誔徒頂反詭詐也俗誂正徒了反丨弄相呼也二俗讜正多朗反直言也二譑居少反多言也又丘召反丨弄也讄力水反禱也謂禱于神祇也䛗今訨正旨止二音丨許也訐發人惡也二俗口本反正作懇二詃姑犬反誘也䛞音旱大言也競其兩反競言也諗音審告也謀也深諌也又如甚反誏音郎明也又姓虛偃反丨摶佷㑦也詪俗詪正胡典反諍語也又古恨反難語也二嘍力主反覼丨安曲也覼音落戈反諟音是審也諦也埋也正也俗音底正作詇於兩反早知也俗音母䚵他口反丨誘也噭音口先相口可口佷反惻也誃徒可反欺也兖允二音諓音踐諂也俗詗正火􅒯反明悟了知也又休正反二誘羊首反音犯二同訋丁了反拿也拿音女余反詁音古丨訓讞魚蹇魚列二反議獄也噂誻上倉本反下徒合反丨丨恚言也訯二俗誜或作正所瓦反強事言語也又所化反枉也四側雅反丨訝訶貌又子邪反丨詠也俗手獸二音郭氏音詡况雨反普也遍也和也大也音綺妄言也相承於俟反討他老反除去治罰也又羽也謑今正胡禮反耻辱也又許懈反怒言也二俗音酉去聲􅍝眉救反丨誤也詐也妄也譴去見反呵也責也怒也讓也問也亦姓誚才笑反責也呵也嬈也戲笑也誹謗正非味反下布浪反丨丨也諒音亮信也佐也知也譽余據反歌稱美德也又平聲又姓誑居况反欺也惑也古作㤮今廢諭音喻告也諌也譬丨也俗訪正芳妄反問也詢也二譮許介反怒聲也又俗音會許介反譀丨也噧今正火芥反大怒又譀丨也二譀許鑒反丨噧也誼音義理也冝也善也古文義字謾莫晏莫半莫官三反欺也諷方送反背文日丨又丨刾也謉居位反言丨也又耻也慚也謠古詷今音洞丨言急過也二倉弄反丨詷詞言急也􅰾於計反丨諦也譡丁浪反語中也諄正也直言也􅬫三俗訴今正乘故反告丨冕枉也五詐側嫁反偽妄不實也詖彼義反譣丨也反慧也侫也又彼為反辨諭也宴烏見反丨會也詛莊疏反呪丨令敗也或作話正胡卦反談言也又胡快反語丨也二譺冝記反啁小也又魚戒反欺也譢雖遂反告問諌讓也或作詫正丑嫁反誑也二謎莫計反急言也余制反多言也詬音後罵也訅二俗古訊正音信問也誠言也四認識丨也訒音刃難言也下又音忍純也二俗囈正魚祭反與藝同屏處語也二俗讖正𥘉禁反預也纎也其義纎微預測其事也二志音志記也譬匹義反丨諭也誡通正音戒言警丨勒也二諹余亮反謹也歡也諺音彥俗言也譟蘇到反群呼也三俗正莊禁反讒也毁也又子念反三䛳於劒反卜匿也丑利反笑也又陟里反丨言也誤音悟錯也訃音赴丨至也就也告喪也丑嫁反相誤也䛨俗音信詬呼透反怒也又若候反罵也又巧言徒對反怨也惡也􅦔音救止也荼也助也訝五嫁反嗟丨胡誤反志也認也䛠上都豆反下奴豆反丨丨不能言也􅒜或作音謝辝丨也諣呼霸呼卦呼賣三反疾言也無放反責也䛃五貫反新藏自切鞞僣反初近反識音志摽丨又音式知丨通今苦嫁反丨詬巧言才也二䛍方味反言急也良刃反詿古賣反誤也又胡卦反礙也詺彌併反丨諦也音悟一或作誤古文辨字四俗正音梵多言也二咒直又反洲丨古縣許縣言有所求也二同音弄音義䜒烏告反語丨也譧直陷反被誑也音號相欺也􆇏乃定反二誡音界敕也音豆證音正諌丨也彼義反謲七紺反伺也又俗音謬盧候反丨詬忽怒也謴古困反順言調弄之貌也古困反丨摩人也支義反快也竒寄反謀也二同誎七賜反數丨也諈所恚正恚二反諉丨纍也諉女恚反相囑也又過也又吐禾丨也訵丑利反玉篇笑貌誋音忌告也信也誠也又也䛈矢利反丨忘也音字名丨今作字䛾音素諳丨􅨣音弟審諦也䜋胡對反覺也悟也呼會反衆聲也詯乎內反休市䛪去仲反丨多言也䛩二俗䜑正烏故反相毁也三詯胡對反市丨又言長也下又音回二同二通正雖醉反言也詩云歌以丨止又慈恤反讓也二譓音惠多謀智曰丨也莫駕反多言也譵直類反怨言也詘二去勿居勿二反辝閉也二啜丁活反蒲沒反亂也亦言亂也新藏作説詍私列羊制二反多言也子亦反二莫八反渠業反辛聿反正作恤私列反江西經音作諤五各在廣弘明集音必𥘉栗反丨隂私語也音𥘉尤反二同詀叶涉反丨囁細語也又直陷反誑丨也與謙同又丁兼反轉言又竹咸反丨喃語聲也謖所六反起也許訖反語瞋聲也䚴五刮反訶也千結反言正也䛎呼決反怒訶也許擊反私也古麥反丨嚄疾言也嚄音獲謮音責丨怒也諽革客二音謹也詻五陌反丨教令嚴也謋伯反丨然也二同或作今古伯反丨丨多言貌也二詥音合諧也亦作合譶徒合反言疾也又直立反澀丨言不止也㒊音所立反或作今側洽反齊丨多言也二疾反多言也又口丨也䛚音略約丨歎美也五各反謇丨直言也䛢他谷反詆丨狡猾也諿七入反和也譃舊藏作謔許虐反郭氏俗音虛正今音牒反問也二烏合反音識音莫心部第四惇都昆反厚也撲也大也信也悝苦回反病也憂愁也又大也又音里亦憂也慳客間反也貪也惜也音希慕也也兾也憿古堯反堯也又俗古了反又音渠脂反敬也畏也怡與之反和也恱也恬徒兼反丨靖也愇音韋香嚴云恨也今正苦回反大也二慊力閻反丨惟也又苦忝反恨也音紕惡性也音綿忘也懵莫登反惛也悶也慙也又莫孔反慓匹遙反急也又俗必遙反也惛音昏忘也不明也憀音流悲恨也又音聊無丨賴也二恂息巡反順也信也懦人朱奴亂奴卧三反怯劣丨弱也三同憐俗通憐正音蓮哀矜愛念也二惸渠營反無兄弟日丨亦獨也慺力朱反恱也又力侯反丨丨謹敬見又力主反人姓也慞音章懼也惶音皇悚懼怕怖也憔昨焦反丨忰也與憔同去王反怯也憕直耕反失志貌又音澄平也音詮止也亦更攺也惴音專丨丨懼也又之睡反憂心也怦普耕反中直貌又心急也恲薄耕反丨誾好嗔貌呼萌反恲丨也音慙也於緣反憂悒也怔忪上音征下音鍾丨丨心動懼貌也惂俗慆正他刀反恱樂也二􅤷或作正音愛也二烏侯反與謳同吟也歌也恱樂也又業也又口侯反吝惜也出玉篇愈音俞丨和也恱也樂也俗倉何反忡敕中反憂也俞愈二音憂也懼也二恌二或作正音搖憂悸邪感也又他雕反輕薄貌二愢蘇來反意不合也多昆反厚也信也俗婪正盧含反貪也與婪同二怓女交反心亂也忶戶昆反心悶也胡交反快也女朱反心亂也懰力由反愁也怨也俗許其反母官反忘也悗母官反惑也俗音摩慩音連立泣貌憧昌容反往來貌也又俗宅江反丨幡正作幢㤝音充心動也懷音丕心丨也徒昆反悶也音牟愛也與恈同俗呼光反正作蒙掩也巨支反尓雅云丨丨惕丨愛也又是支反音門丨不明又亂也又音民亦亂也香嚴又力廷反俗㤉正苦加反巧丨伏態貌巧口交反二㦕力中反戶佳反心不平也又怨也又音佳二同氏林反信也􅢯丘廉反丨㥓意不安也香嚴又立咸反俗正音營衛也二誤音凡正作忚或作正呼兮反欺慢之貌也二慵蜀容反丨懶也火還反慢也又火玄反惠了也愾喜夷反喜貌􅋏所江反懼也左傳云駟氏丨㤿英廉反丨㥓不安意也又於劒反甘心也去竒反憾丨儉急也惃音昆亂也歡呼官反喜也又古玩反憂無吉也云殞二音憂也玉篇又恱也於堯反丨丨憂也怊敕霄反悵恨小絲細也三同惤古賢反布名憢許堯反丨丨懼也力應反憐也憴食陵反稱舉也與譝同悾苦紅苦貢苦江三反信也誠也慤也愃音宣戻人語快也恲匹庾反心悶也音哀音祥戶萌反於容反憂也又上聲憨呼甘反丨癡音移祇丨不憂事也忹音狂憸七廉反㤿詖也又息廉反科口也詖音彼義反二俗相輪反正作恂信也或作正去宫反憂貌也二音爭愋况袁切恨也和也之緣之瑞二反今作惴同愛心也憉上音彭下音亨丨丨自強嗔貌渠縈常倫二反心愁憂悶也悰藏宗反慮也一曰樂也愔於淫反靖也慅蘇刀反愁也恐也又音草二同憹奴冬反㦀恱又音懊丨也㦀音逢恱也下江反恨也第三卷二俗通正徒朗反放丨也或作婸四惲於粉反謀也議也厚也重也愐彌兖反思也募也𢙿其錦反心丨也正作澿字㦃踈簡𥘉簡二反全得也又也亦憶也愯意拱反懼也恉正今音指憶也二俗悄二正七小反憂貌又心無聊也三懙音與玉篇安也音舉玉篇謹也悿他點反弱也惀盧本反心思求眺事也又音輪欲知也眺音他了反恔古了反丨憭惠明也又胡教反憭音了照察也又音聊丨空貌也㥝名婢反止也惈音果敢也悱芳尾反口丨丨也音罔丨然失意貌也􅤷武姥二音愛也念也憮武姥二音失意貌也又音呼大也又音無空也音武音戶俗諝正私呂反與諝同才智之稱也二愺恅上音草下音老丨丨心亂也七感反痛也傖也上又青忝反丨悽也惼上於典反下方典反丨丨不順貌懆音草憂也愷苦海反和也康也大也樂也猜倉宰反恨也㥏他典反青徐胃慙為丨悓音現難也懺七典反怒也憬俱永反逺也愀正俗親小慈糾二反容色變也又在由反二忱徒敢他敢二反安也又氏任反信也愖同上懡上忙果反下郎可反丨丨面慙也俗正烏老反丨正之貌也或亦丨二音散丨扇也吕慮二音􅬝胡頂反丨恨也憫眉殞反丨默也武粉反音米盧敢反俗音老古文音厚恑居委反變也悔也懮於栁反受舒遲貌也又姿容也古文音草去聲慠二俗正五告反慢也蕩也倨也三俗吝二正良刃反丨惜貪鄙也三憚徒旦反難也怒也惡也畏也辝也驚也怬許異反欣也四俗惰今正徒卧反懶也不敬也懈怠也六憒古對反心亂也慨苦愛反也悶也歎息也音㨾悶莫本反慣閞患反丨習也俗悃正音困勞倦也二俗正其庶反畏也怖也玉篇又其居反心急也二惋烏貫反驚歎也又上聲宛也懼音具怖畏出驚恐也悍胡旦反猛也勇也慢慢莫晏反急也倨也易也二俗正昌志反志也又音試二懈古賣反懶憜也忰二俗正情醉反憔丨憂愁也又子對反恐貌三俗悷正郎計反𢤱丨拙惡也又憻丨悲吟也憻音二音亮丨也悢音亮恨也悲也怏於亮反情不足也亦不服貌也妨音訪悸其季反心動也氣不定也慻俗居倦反音義作眷廽顧也或作腃出阿差末經第五卷愠於問反怒也悖默作色也懀烏外烏快二反惡貌也忓音汗善也又古案反人姓又古安反丨擾也忤音悟逆也觸丨也悼徒到反衰也傷丨也或作正怪今古壞反丨異也驚也二懹人向反憚也難也忨五貫反貪也亦習也俗正音戒質也又力反急也二愒去例反恐人也息也又苦蓋反貪也又去謁反息也憾胡紺反積恨也㤥胡愛反患也苦也恨也㦈於蓋反青謹也愴𥘉亮反悽丨也俗音怕俗懠正在計反愁也怒也二憞徒對反惡心也又都昆反􅥋恫上千弄反下徒弄反丨丨不得志貌也下又音通痛也邃俗二正雖遂反意思深也三二或作􅞥正餘制反明也一曰習三悑正怖今普故反惶丨也二正憛今他紺反丨除懷憂也二俗忬正羊恕反安也恱也二悺古玩反憂也悎俗教角二音音惠愛也𢠲芳又反小怒也俗正音兾強力也二音帝悶也㦅俗直例反蒲悶反丨心也慁胡間反丨辱也怐正俗苦候古侯二反丨愁愚貌愗音茷二㤆芳方反丨恎急性貌恎徒結反慀胡計反恨足音卞喜貌俗怰正玉篇音縣二憂玊篇俗于救反心動也二同上支義反懻丨恨也害也通正則卧反折丨二俗正芳廢反怒也二㤄俗芳吠普沒二反許魏反丨忌也怚將恕反憍也惓渠眷反悶也􅰪于驗反意足也或作㤿忕太大二音奢也又音逝丨習怲悲命反憂心也俗怢正音退肆也又不進也又他沒反丨忽不悵也二居偽反諧也陟利反恐也恨也奴計反相丨摩又丨陀慖古對反恨也懗呼嫁反誑也與同慥七到反言行急也息箭反憂也愾許既苦愛二反大息也二俗教學二音懝五愛反病騃也惶也中止也又音嶷有所識也舊藏作懼音具俗莫報反怶俗披義反正作帔衣丨俗悲命反正作怲憂心也音戰烏故反入聲俗悖正蒲沒反亂也逆也或作悖二通二正莫結反輕也三怯欠業反懼也弱也正作怯怕音拍憺丨安靜也恓誤恤正須律反憂也撫丨也二悏愜謙叶反當也可也快也心伏也三恪苦各反勤心謙參也又虛敬也二俗愊正芳逼反困丨至誠也三惕也的反怵丨憂也愛也忍忉也又徒朗反不憂也怵音黜栗力乙反戰丨懼戚也正懌今音亦恱也樂也攺也二俗正五各反驚也二愶虛業反以威力相恐也戚清積反痛也悒音邑憂也不安貌惻初力反創也悲痛也㤨二俗直質反書丨也正作帙懾懾之涉反丨伏懼怯也又徒叶反懾丨也二恰苦甲反用心也忔今正許乞反喜也二俗㣿正之若反痛病也二三俗懎正音色悲恨也四俗於角反正從巾作惚音忽恍丨失志貌又俗音惙陟劣反疲也憂也協俗正音叶和也合也二俗㥛正紀力反息性相背也二怵丑律反丨惕也㤕丑律竹律二反憂心也又俗音􅫅胡甲反喜也忸女六反丨怩也正戄今許縳反驚懼也又日遽視也又渠縳反大視也二􅗘㤞徒各反微也二同恄許吉反怖也􅴇徒各反忖也俗音墨正作默俗𥘉責反熆俗胡榙反正作吹火丨也樂俗音樂慉丑六反驕也又許六反起也亦恨也音角愵奴歷反憂貌㥂他得反丨丨也劫却二音㤴二同昌涉丑輒二反休也玉篇心動也又或作丅兼他叶二反衣領也正合作二字怫音佛丨鬱也恎徒結反惡性也㥾女力尼乙二反愧也又他得反楚革反丨册也㥽楚革反耿介也㥘音劫強取俗正丘逆反心勞二忦古點反恨也又憂也又音介亦懼也二怽俗音末正作帓忘也怭毗必反怒也居六反音叱俗正音革智丨也二通正徒叶反恐懼也二㦦許擊反心不安也他沒反丨忽不悵也舊藏作玉篇音若心亂也在安般守意經俗正許聿反怒也二愎符逼反也恨也􅞕普結反丨然瞋也怍音昨慙也不思呼麥反丨丨辨快也二舊藏作豁寤上呼栝反下音悟在增一阿含經力恱反弱也少也鄙也與劣同懫音質止也㤢于六反心動也又音矣念也又俗音墮方六反平聲古二俗愆正去乾反過也失也四伊閻反丨犬甘內心無足也正今於鹽反安也二俗古都奚反今作二憨呼甘反愚癡甚也惒和禍二音琳法師云僻字也今作和字巧口交反丨恢伏態貌力間反地名俗倉紅反煴器也音惟二古文音謀音臣尺占反丨懘又徒叶反安也怤芳無反思也恱也忞音旻自勉強也又聖心也㦛音余恭敬也俗正息廉反疾利口也二恁音壬信也又音荏念也氏壬反誠也信也與同􅡣俗或作古文於求反志也亦丨愁也令作憂同三㥋衣扆二音念痛聲也奴刀反求咎二音怨丨也憌音瓊心憂也直陵反丨盛也又苦也又心也常古文常字悡玉篇音離恱也二於含反通正古文思字二俗憥正音勞共心也二音酬音離憂也二同里之反憂愁貌惢姊隨反善也又才捶反疑也又蘇果反亦心疑也音顛音昌通悠今音由遐也逺也智也思也二勤音勤殷丨音悲㤎音哥法也恃也蘇禾反丨題縣名音通痛也居陵反憐也慜也音金二俗音餘莣音亡草名似芋皮可為索也㦁音連玉篇云泣血也舊藏作慙音盧二古文惟字古顔反今作姦音臣客庚反音人今作仁二同上聲古今正丘隴反又丘用反丨懼也三愍慜眉忍反傷也悲也憐也二愈羊主反賢也勝也差也益也惹人者反亂也又音若䛳也䛳音于欠反六俗之領反正作齊也懇可佷反丨惻至誠也又信也又莫角反美也俗同上憼音景敬也古悶今莫本莫短二反煩也憤也愁悶也二慫正今息栱反驚也二音隱丨謹也㣽俗好怒二音音粉動也音甚急音隱丨謹也奴板反慙而面赤也與赧同又力至反戁奴板反悚懼也又人善反舊藏作恐丨頗在道地經古文悔字悹管貫二音丨丨憂無所依告也音愐思也忝音忝忿芳吻芳問二反怒也怘怙固二音古文音上音甚去聲許記反好也恱也悆羊恕反恱也安也豫也態他代反意丨也戇卓綘反愚丨也上一又呼貢反亦愚也三通憊正蒲拜反𤸈也二懟直類反怨也蠢俗正丑用丑龍丑江書容四反皆愚也二遜蘇困反順也愗􅐂三俗正莫候反盛也美也勉也與茷洞又愚癡貌也四慰于胃反安丨也江西隨亟音休建反二通憲正許建反法度也制禁也二慎時忍反古文今作慎廉謹也又音嗔寱魚祭反睡語也與寱同又音衛義同恙余亮反憂也病也噬也古文古隘反今作懈丨忌怠音代丨切韻音待俗之刃反音制始孕病兒也懘尺制反丨音不和也又丑例反音尺占反尺制反狂大别名也慸丑芥反極也劣也又音帶正今昌芮反玉篇謹也二之芮反卜問吉凶也懤或作正玉篇直又反憂也又同懤怨毒也香嚴又平聲二新藏作懿乙兾反美也大也又姓徒臥反懈丨也與惰同忥或作正許既反息也靜也二忍魚既反怒名也苦陷反陟監反慁胡困反悶亂也俗􅓆正徒且反難也怒也惡也與憚同二語靳反且也缺也㥶先代蘇則二反心安也正今音契怖也劇也二乂魚肺反困患貌二同音忌教也一曰謀也俗愛正音愛惠也又香嚴俗音氣二或作正力志反憂貌二古文患字音礙惶也亦騃也與懝同直絳反凶頑也恏又好二音懲也㤮于况反誤人又居况反丨望也音忌二同願音願善也敬也又專謹也二俗悥古文念字三俗音認二俗憩正去利反息也三古文惠字七浸反雲行也誤新藏作慮古文音絹今作狷􅜜古文皮兾反俗音曺古文古候反戀音甚音忌二烏故反憝音隊與憝同怨也惡也正訴今音素行也又所責反驚懼貌也憖魚吝反間也且也傷也㤂今邑反入聲惡為各反不善也俗同上愜謙叶反當也可也快也心伏也俗音撮取也又子括反丨榒也愙古恪正苦各反恭也敬也虛謙敬讓也二今愂正蒲沒反荒也昏亂也二古活反欲音欲好嗜逸也恧女六反慙也又寧句反憋并滅反急性貌又普滅反怒也慝他德反媹丨邪穢也他德反惡也亦差也惁音擊敬也二先擊反敬也又音擊音食二或作正今苦角反謹也誠也善也願也四㤲二或作苦叶反可也快也心伏也于六反玉篇悶也香嚴又音億安也二俗或作惄正奴歷反憂也思也又心之飢也四㦌音忽寢丨覺怒也香嚴又許􅟕蘇管二反懖古活反巨善也音道傷也與悼同香嚴又音卓或作慹通正之涉奴叶二反不動貌也三㤡音列憂心也二同𥘉力反愴也與惻同烏竹反􅊖三俗悉正息七反委也皆也説文從采也四哲陟列反與哲同智也又俗先擊反㤫三俗德古音德下一縣名也五尼乙反同昵又他德反同慝山部第五崖雅皆反髙岸也山際邊也岩古巖玉篇同巖五銜反峯也險也峻也崿也三二俗嵯正昨何反丨峨山髙峻貌也三俗峨正五何反嵯丨山貌也二崑昆音昆丨崘山也二同崙崘魯昆反崑丨山名二嵩嵩息戎反山髙貌也又姓二𡵨巨支反山名又州名又姓𥘉今反丨差不齊貌也與參同﨑嶇上去竒反下去俱反丨丨傾側也岴俗嶇正去魚反丨﨑山路也二巑岏上在丸反下五官反山峻鋭貌也都年反山頂也二古崩正北弘反摧也又天子死曰丨也三岨七余反山戴圡也又莊所反與阻同正俗同上三嵎音愚山名俗峹正音徒山名也三嵞音徒古國名亦縣名通正直尼都奚二反山名也二屳音仙也入山隱曰丨也又許延反輕舉貌也音號山名亦姓溪音溪巖丨也與磎亦同􅸊俗嶙二或作正力珍反丨峋深崖狀也四峋息倫反嶙丨也俗􅼏正吟琴二音岑丨也二岑士今反丨􅼏山小而髙也又姓崟音吟嶔丨髙峻貌也􅋂俗嶔正去今反丨崟也二嶅俗正五髙反山多小石也二㞥土今反入山深貌也三俗正士衫反山峻險也四音徒山弇或作崦正英廉反丨嵫山下有虞泉曰所入也又于檢反義同二嵫正嵫今子之反崦丨山名曰所入處也二崍嵦上音來下五來反丨丨山也奴刀反山名也嶩奴刀反平丨山名在齊地嶚音聊丨巢山貌也􅥲子聊昨焦二反嶚丨山小尖髙貌俗嶀正他胡反丨􅌘山名􅌘音時證反二俗奴刀反專音端末也十也亦正也二俗或作三古今音剛山脊也七㟏通正火含反大谷也二音波丨家山名也二古文音之俗正五男口含二反丨山崿也二俗嵌正口銜反丨巖山坎傍孔也又去炎反二俗筆巾反古文音封二崡音咸丨谷山又紀力反亦山名也音前音蘇􅡳二或作嶒正疲陵反丨山貌也三􅲠三或作崚正今音陵丨嶒山貌五崏二俗岷三或作岷正音旻山名亦州名六􅦂戶圭反人姓或作巋今丘追反小山而衆也又丘䡄反丨然髙峻貌二􅠌口耕反谷名在麗山音羊嶧丨山名子紅反九丨山名巃嵸上盧紅落董二反下子紅資董二反丨丨山峭貌崳音偷㠢上烏乖反下戶乖反丨丨不平貌也㟍音郎峻丨山名冬日所入處􅩩或作上音聊丨崖虛也二俗峘正胡官反大山也又音恆山名二音臨離利二音誤古恩反正作根蛝二字俗嶠或作嶠今渠嬌渠庿二反山鋭而髙也又山道也三古文音憂二俗正戶交丨亟山名三坻音陀音看諸請二音三俗正尺之反羽盛也二岥俗音坡嵟都回徒外二反許云反巨反山名也崽山皆反自高而侮人也又小佳反呼彼之稱也岹岧徒聊反丨嶤髙山貌也二二或作巇正今許竒反嶮丨巔危也四音流嶣或作嶕正昨焦反丨嶢山危也二嶤或作嶢正五聊反嶕丨也二嶄士銜反丨巖貌也古文邦字國也又姓或作岓正音祈山傍石也二屸音洪峕訔古文音時二㟀音連與專反合作沿崷字由反丨崒也音盈俗􅶪或作去弓反二音玄音傍雞奚二音崸二或作正五江反山名也三于緣反山曲也巆俗嵤或作嶸正戶萌反崢丨山峻貌也下又音榮義同三古文音從上音賔下音流父文反崔昨回反丨嵬又倉回反丨人姓峞五回反山髙貌也古文南字二俗古嶜今昨淫反山嵒四俗巍正魚韋反丨丨髙貌也二古文音民敷容反草木盛也音玄許危許格二反岯音丕山名音回􆃓或作嶺正音零山深貌二崲音皇經音義云或作直魚反與同嵍音毛江西隨亟音巨支反子于反丨隅二同音旡崌音居丨山名也㟉上音髙下音勞泉巳上六字取一面呼之音眉山名所臻反山交也音鄰崢七庚反丨峥山貌崝七耕反丨峭也俗音抽岣俱句二音丨嶁山名嶁力朱反山頂也崆苦江反丨􅱔山貌又音空丨洞亦山名音携洞音同崆丨山名古峗令音危三丨山名二北登反音俗音歸許冝反同巇險丨也多干反山丨也歲峟音又音印嶳二古文音地雖醉反徒紺反俗一正胡化戶花二反西嶽山名亦州名又姓三其禁反或作嵣今徒浪反丨㟐山名二㟐莫浪反嵣丨也古文誓字古文音歲二同上三屶音會音后音致乢音蓋入聲俗嶨正苦角胡角二反大山多大石曰丨二千各反許月反山貌􅴀苦沃反山貌所立反三士角反二同􅻟新經作濯在廣弘明集岬音甲音業㟳音栗山名俗烏甲反音壁俗崨正疾葉反丨䃳山連延也䃳良涉反二俗􅝝正五結反屼丨山貌又五轄反山中絶貌也二音渴士力反丨嶷㠅音福族音族嶷魚力反𡵨也岌魚及反山髙貌也二俗正今五各反崖丨重巘山也四俗正五各反亦山峯也二豈二俗屺正子結反山髙貌也古文今作三嶽音嶽山丨也俗士角反經音義作鏃嵽徒結反丨嵲髙山貌也嵲五結反嵽丨也􆀠音兀山貌亦山名也􅣊音密山形如堂音木口盍反或作崛正渠物反山短而髙二崫魚勿反山也又特立也又同上俗所急反俗正音直山直也屹魚訖反丨崒山貌也昨沒反丨屼山貌二同屴崱上音力下士力反山峻貌嶭俗二正五㵧伍結二反嶻丨三殊六反嶖徒合反苦郭反峊或作正五結反山髙貌也二音律正俗音必山道邊堂也二嶻才葛才結二反丨山名也或作正魚列反臣僕庶丨之事謂賤子也又姓又五葛反二玉篇之出反草一丨香嚴音莫丨反峽侯夾反巫丨山名岞或作岝俗士格反丨峉山貌又音昨丨崿山高貌二同峉五格反岝丨也音攝嶧音亦山名崞音郭州名縣名也音莫五葛反崉二俗音積正作脊背丨曷喝二音俗音或峪谷欲二音古文音古文昔字古文音木古文音若音若音滅車部第六輿音余事也多也載也又去聲方丨縣名輸式朱反髙也盡也更也轅音袁車丨也音當車丨也俗今正音渠車也三軒許言反丨車也又姓俗䡣正音魂車軛也又音軒車前舉也一輼俗輬正上一音溫下二音涼車名閇即溫開即涼也二俗􅟁二或作輷轟二正呼宏反衆車聲六軻苦何苦我苦個三反居貧轗丨不過也俗轗正口甘口感口紺三反丨軻坎滯迍厄也二􅬈音盛膏器也輇音銓車下卑輪也又七專反無輪車名也輲市專反旡輪車名也俗正今借官反車曲轅也亦與同三䡴尺容反陷陳車也又直降反衝城戰也䡩或作耕反車聲也二轂口耕反車鞕也又車堅牢也二匡狂二音車戾也或作輣正薄萌反兵車又樓車也二軯薄萌反車聲也輄今􅵬正音光車下橫木也二俗正軖今音狂丨絲具也三軨音令車闌也音令丨輅漠廄名丨也轠雷壘二音丨轤車屬也又不絶人擊也俗音英二俗音禾二俗輜正側持反重車又丨軿車也又楚持反三軿音瓶輜丨兵車也又步田反四面屏也輏俗輶正由酉狖三音輕車也二軥俗軥正古侯反車丨心木也又古候反丨槅也又巨俱反車軏也二音修丨輕載喪車也輖音周重載也音心軥丨木也音廉車􅦿也音氶軺車後登也音搖玉篇云大夫之車也又音韶輘魯登反車聲也俗正所咸反車聲也二轁二俗他刀反正作輡藏也䡘音田丨丨衆車聲音瓶丨也音楚監反輈張流反車轅也音禾音衡俗音渠俗音余俗􅸽正音唐丨輬軘軨二徒昆反兵車也輬音郎􅸽丨車也􅙲孚袁反車大箱也䡮即容反車迹也輁渠容反丨逐所支棺軝巨支反藥草俗音工䡆音容車行貌輰音羊丨䡵車也俗他雷反軙或作歧匙底三音輪也倉紅反轞車載囚也匹庾薄庾二反車聲也俗輗正五兮反車轅端持衡木也二輀俗通正音而喪車也二俗音咨轃正今則前反大車簣也二音籠車軸頭也輫音裴車箱也俗軤正音呼人姓二轘音還丨轅也又地名又音患車裂人也轙冝蟻二音車上環㘘所貫車也音孤大骨又盤骨也轂苦胡反車也又山名亦姓二或作今音柴連車一曰却連柩堂也又七移反三他回反車盛貌二同輴輴敕輪反載柩車也二同轒扶分反丨䡝兵車也又房吻反於云反轒丨又於粉反經音義作轒扶分反兵車名經文是比丘名在七女經中郭氏又俗胡罪反古文苦于反今作看丨視也􅚳音田丨喜恱貌也音軫轇音交丨葛戟形也轈七交反詩云兵車若巢以望也輎所交反兵車也軳薄毛反戾也又車輇也䡐音陀疾馳也􅛓舊藏作軒籕文音車上聲或作􅰬今盧感反輡丨也二軟通而兖反柔也弱也音車丨也與同輦力展反輿也人挽車也又姓通耳丁禮反大車故也二􅎮通軫正之忍反車後橫木也又動也亦姓二之忍反丨迹也轉也與後橫木也見經音義尼展反轢也輾知演反丨轉也又姓又女箭反水丨也􅞮無返反引也又音方車也輔音父助也弼也又丨也音隱車聲也二同俗女久反軵而隴反推車或作居勇反也於綺於義二反車丨也䡊音反車耳䡄居水反法也車迹也説文字樣皆從九安古反車頭中也輠胡罪胡瓦二反車轂頭轉克又果禍二音一卑脂角也俗才敢反正作槧削板牘也䡔音啓至也輕也而隴反車丨二軹音紙縣名也輆上苦海反下徒亥反丨丨不平貌也䡱舊藏作轉正今奴可反撓也二軡俗輡正苦感反丨􅰬車行不平也二俗正音揔輪也二輑牛隕反車軸也又昆群二音音乃撓也又奴可反正二今眉殞亡盡二反車兔下軛也三或作軬今音飯車丨也二轏士限反車名士所乘也輚士限反埤倉云卧車亦兵車也又載柩車丨也俗轑正音老車軸也二音栁載柩車也輮人久反車􅦿也轞車聲胡黯反田車也二軓音犯車前也一曰車當前丨也俗而隴反正作軵輨音管車轂端鐵也俗引反去聲正今音貌引也二俗音問時正反軔音刃礙車輪木也俗正魚向反丨轎也二俗轎正渠庿反斬車也又音僑小車也二俗􅚫正許建反二俗音祕俗正他計反唾聲也二叀轊祥歲胡桂二反皆車軸鐵也上一又時釗反望也三䡲士戰反軒輞也俗於亮反輅今正音路車丨也古天子所乘之車曰丨二輳倉奏反輻丨也輩輩蒲昧反比也又北昧反等丨亦比類也二於教反有機車也音丨車彗也俗胡頰反軾音識車前也軏俗正月兀二音丨車轅端曲木也二轕正今音葛轇丨載刑也二或作今直列反車丨二真逆反車丨也或作䡾正五葛反車載髙也二乾音訖軼徒結反車相過也􅮣苦盍反車聲也俗直六反正作丨艫也艫音盧軜音納驂馬內也繫於軾前者也镸部第七長布遙反長貌也又布休反俗今正相俞反則丨也三二俗髭今正音資丨鬚也四四俗通正子紅反毛亂也六子紅反馬丨二俗髦正音毛選也俊也又丨鬣也鬣音良葉反三七俗通正莫班反花丨也借用字正莫賢反燒煙盡眉也九音而頰上毛多貌又獸多毛也女耕反丨也三俗正音坤去髮也四俗正如羊反丨亂毛也又乃庚反䰃丨亂髮貌也二正䰃今蒲庚反丨鬤亂髮貌也二去王反丨鬤也髫正今音條小兒髮也二䦋今正五髙反長大貌也二䰉步官反丨頭屈髮也又音伴卧髮也俗古文丑容反丨直也二二俗胡加反􅜚子邪反長歎也謨母二音俗直良知兩二反俗今音彌長久也二髟音衫屋翼也又長髮貌又必么反三俗邊兮反正作箄冠飾俗落禾反二俗音求俗或作鬐今渠脂反馬項上丨也三俗正匹昭反髮貌也二俗鉗紺二音俗匹綿反嗟子邪反丘山名音分三俗山交反江西隨亟音以長反丨舉也郭氏又俗音徒亂反䯭䯹息廉反好髮也二同三俗正士耕反丨鬡毛髮亂貌四俗士金反俗通髽正側瓜反婦人喪冠也三俗音繒鬔二俗髼正薄紅反丨髮亂也三鬆二俗正私宗息共二反丨也又音送丨也三息恭反燕云長也鬗莫官反髮長貌也魯甘反髮踈貌鬑音廉丨鬋也一曰長貌鬋音煎女鬢垂貌又音剪䯾音凋小貌留髮也又音呪少髮也一曰多髮正髶今而容反髮多亂貌又音二髮飾也二正鬞今女江反髮多也二正今音三䰐丨毛垂也二或作鬈正渠貟反髮好也又胡人髮也二髬音丕髮亂散貌也鬅鬙上音朋下音僧丨𬒳髮貌亦髮短貌䰈昨何反髮多貌䯽芳于反髮好貌又音部音夫髻夲也又音竹露髻也䰕盧驢二音毛黑長貌鬃才宗反髻髙大貌渠客反亂髮也七恭反髮亂也他來反丨婦人偽髮也渠支反長丨國名丨長於身也汝鹽反頷毛也俗髾正所交反髮毛也二鬟戶關反髻丨也髿上素禾反鬖丨貌又音沙髟丨垂貌也力之反髬丨髮起也音客飾丨一曰髮長也二音弟儀禮云王婦𬒳丨玉篇又剔釋二音同􅚎剪髮也鬕莫嫁反婦人結髮帶也正䰎今立愧反屈髮綰髻也二或作今音贊髮光澤也又姊未反二䯸音次美髮也今或作正音次以漆塗器也三䰁輔救反忽見也芳救反假髻也又匹力反皆變體音聖義同七子峻反丨同子寸反委髮也入聲髮二今髮正音發頭丨也三正俗古活反結丨也又俗音計二􅺹七俗正良涉反鬚丨也八镻徒結反䭮音拂額前髮也俗􅚎正他歷施隻二反説文云除髮也二俗音飾俗弗隋二音首飾也鬠音活以組束髮也組音祖鬜苦八反秃丨也三同俗正北末反玉篇云大髻也二音卜鬚髯也一正今居六反亂髮也二鬘舊藏作門部第八門正門今莫奔反丨戶也又問也聞也字從兩戶合為丨也一俗關正古還反扄也以木橫持門也二䦐二俗開正音開通也解也三闍視遮反又音都闉丨城上重門也誤闉正音因丨闍也二閼于禮反丨氏姓也又阿葛反止也塞也閂俗烏瓜反閶音昌丨闔也闈音韋宫中門謂之丨也俗窺正大規反小視也二𨵦羊朱反窺丨小視也閨音圭閣也反䦌丑任反直開也入聲古今音恱簡丨閥丨也二閥音伐丨閲自序也閦四俗今正𥘉六反衆也正從三人如衆字下從三人是也餘皆變體六閚俗音立闒徒盍反門樓上屋也古闢今便亦反開也啓也二俗侐正靜也閾許逼反門限也三門籥音藥門鍵戶丨也俗闋正苦穴反止也終也二俗通闔正胡塔反閶丨門扇也三闑五結魚列二反門間中礙也或作臬闥他逹反門屏閴闟許及反戟多也又俗音闒徒結反暗丨鄭城門也䦖胡結反丨也䦚俗呼活反正作大奯大開也閘烏甲反開閉門也又音甲俗烏結反食塞也俗呼目反俗音側闃俗􅞔正苦覓反寂靜也二二俗正苦穴反丨無門户也三俗鬩今正許擊反也恨也戾也又相怨也三俗音恱䦪烏轄反門扇聲闊二俗闊正苦活反逺也廣也三俗胡頰反俗音獲又呼伯反破物也俗闕正去月反門觀也缺也門兩傍闕然為道也又去也過也失也不供也亦姓二䦝呼麥反丨門也胡沃反門聲胡結反門聲也丁結反門閇也閰居六反間丨也芳逼反塞也䦍音兀丨枯也闕二俗去月反䆷缺血二音無門户也刀部第九刋口干反丨定除削也二俗今力之反王篇割也三俗正里之反剝也割也二俗正所班反定也削也除也二苦姑反剖判屠破也同上二俗刓正五丸反圎削也三俗剶正丑全子全二反丨去皮也二俗音麻正􅗴今借官反剃髮也又音剪二渠幽反無角龍也與虬同二俗步交反古文居言反剾㓱上烏侯苦侯二反下音頭丨丨刀開物剜裏也又足刲也剴古哀五來二反大鎌也二曰摩㔁香嚴音尞丨鈎也俗正士銜反丨刾也二户圭反廣匹云挑剜刲丨削也刲苦圭反剜刾也二同或作正他凋反丨剔也二烏玄反曲剪也剔也􅺶二古文烏玄反水出深而不流曰丨剅嘗侯反穿也尺容反短矛也音凋二正音前舊藏作郗音丑脂反雕玉篇丁么反琢也又舊藏作割字苦姑反俗劘正音摩削也二𥘉佳初加二反丨又小矛也又𥘉嫁反㓽音崇鍤屬也㓳丁兮反剅丨以刀解物也二同􅧠匹迷反丨削也正今音西刻􅩊也二剘俗音其􅧉音鈎關西呼鎌也音崩或作劁今昨焦反短刈草也又笑也二古花反割也烏官反俗音夷古懷反斷也二㓚音功削也刣之容反二丁聊反斷也俗刟正今丁聊反以取禾穗也三俗㔌正祖侯且侯二反細斷切也又才奏反􅸺丨二􅸺音婁丨小穿也又音漏丨㔌細切也􅿦音賢自刎頭也剜烏官反􅿦削也音離分破也又音禮亦刀刾也俗音音從音離上聲剖普口反判也破也析也剡羊冉反削也利也又時冉反縣名㓟匹美反丨剝也無正文假借用俗剗正𥘉簡反丨削也與鏟亦同二俗刎正武粉反丨頭也二剿或作剿正子小反丨絶也二剸剬二同旨兖反細割也上又度官反截也下又音端齊也剮俗古瓦古禾二反剆勒可反擊也亦斫也􅰙茲損反減也截也剞居綺反丨工人曲刀也􅩊𥘉兩反皮傷也旨善反也叧俗古馬反居偃反丨吃語也又禮反戰名初巳反割物也二刌倉本反細切又割也劋子小反絶也俗剄正古頂反斷首也二㓠音點斫也二俗二正薑酉反出罪也四去聲劑情細反分段丨截也劓通正魚器反割鼻也二創𥘉向反始也𥘉也俗音銼倉卧反丨斫也二刵而志反斷耳也藾七賜反棘丨也又盧逹反蒿丨也常照反自強也又姓與邵亦通俗剃他計反除髮也二居稅反傷也割也㔀俗剠正音亮取也冶也䇢也奮也亦作掠二􅓑或作剩正食證反丨長也二剽匹妙反強取也又輕也㔋盧擔反利刀也相承七念反䚯古弔反呼也二檜括二音斷也刏俗刉正古對反丨刀使利也二郎計反割破也二同俗或作音丨割也又音螺二郭氏皆毳察二音斷也三徒亂反􅕻居衛反剖丨斷割也又音厥剚側使反丨刃也與倳同二二俗義諌反划古卧反鎌丨又音果刈也音赦俗正苦怪反茅類也又姓二音計草名縣名州名又姓舊藏作制音故􅧉古文同上二音樹入聲劇俗劇正竒逆反增也更甚于前也二音伐小罪也加罪于人曰丨剌盧達反澼也戾也又丨賜反刾七亦反丨穿也又七賜反針丨也刖音月斷也足刑也又五刮反俗音恤刕音叶同力也又玉篇音歷低反人姓劈普擊反剖也破也裂也剖音普口反割正今音葛剝丨斷截也二或作剝正百角反丨落刾割傷害去皮也二戮音六刑也煞也辱也又病也刮古刷反丨削也刷所劣反也清也剔他曆反解也二刻苦得反丨鏤也又剝也二剋同上必也殺也急也自伐也二俗正𥘉轄也丨柱也三削息約反刻丨也音叶思也俗正𥘉一反割物聲也又俗音刾二刜拂佛二音擊也斫也破也剫徒各反治王也又斫也㓢音洛木無節也二俗割正苦洽反入也三都盍反相著聲二曰丨鈎也五骨反舟危也二或作正力一反細切也三劂居月反剞丨曲刀也良涉反削也擇也二同絶子恱反丨斷物也剭屋握二音丨誅刑名剟陟劣反刋也胡麥反錐刀剋也俗劫劫二正音劫強取也三俗都盍反他歷他計二反割也劅竹角反刑丨也竹角反草木矢也又陟孝反􅱅妾業二音繢麻也剒倉各反斫也俗盧骨反劄竹洽反刾著也魝或作㓩正音結刺理角也二剆之石反劙也􅽒郎活反削丨正鍔今五各反劍丨也二俗割盡二音剨呼麥反破聲籕文􅒠苦郭反解也裂也二士洽反川韻云切聲又玉篇𥘉洽反義同丁木反丨力鋤也􅤏丁木反力鋤也又烏加反自刎也玉篇又乙雅反人質反剝也又知教反音割音則二音易衣部第十衣於希反丨裳丗本胡曺作丨白通云丨者隱也裳者障也所以隱形自障蔽也裭三俗正直知反蓐衣也又曰氈又池尓反易曰以訟受服終朝三丨也三大衣也四二俗正奴郎反袋也橐也有底曰丨無底為橐丨音託三只渠支反僧丨支尼服也音浮聚也又余救反服飾也又音褒裒俗褒正博毛反丨進揚美也又姓又寬衣貌也二俗袍正薄毛反長襦也二裴蒲回反衣長也又姓袪去魚反去也抽也舉也古褰正去乾反摳衣也二襟䘳音金袍襦之袂也亦衣帶也二襟音金衣小帶也又其禁反古袤今者牟延丨也廣也玉篇又衣地也去聲又都聊反死人衣也二古今音脂敬也二裝音莊丨束也又側亮反丨飾也衾去音反丨𬒳也裨音卑丨輔增助也又與也附也又附支反副將也又姓䙬俗音瓔䙔烏侯烏后二反小兒延衣也褘許歸反后祭服也又音韋襌音丹有表而無裏也俗音衫音佂丨松小兒衣也幒俗衳正音鍾丨也亦小禈也二衷音中善也道也中也正也又褻中衣也襠音當雨丨衣也襤魯甘反丨縷也俗正今音衣襟也又力主反襤丨衣破弊也三褕俞搖二音丨狄近身衣也二俗襝或作正處占反丨䄖蔽膝衣也四裙音群裾音居衣丨裮音昌衣披不帶俗音雄強也音圭婦人上服口丨又長襦也俗繃正比爭反束貌衣也與繃同二袾誅姝二音衣也又俗朱注二音俗音孝長也俗正汝鹽反衣緣也二夷啼二音衣名也衦或作今音干包衣即大袖衣也二襑音尋衣博大又他感反衭音夫衣前襟也俗通襦正人朱反短衣也二䘰羶延二音㠾丨牛領上衣也㠾音怨􅥗正褈今尺容反丨褣衣也二褣音容褈丨也褌音昆內衣也二俗二或作齊正音資丨纕喪服也五䙞俗音登毛帶也薄紅反尓匹云衱也褆音啼衣服好貌也俗音袁垂衣也音鞋衣袖也䘽五兮五禮二反梳丨桂衣飾也裗音流䘽丨也音胡丨𧜥也俗衯正音芬長衣也二正俗􅗒今音衫小襦也三襛女容而容二反丨花貌褵丑知反禮裳上衣袩俗􅙭通正丁兼丁叶二反衣領也三通正古侯反單衣也二袀居勻反戎衣也䘯所反衣也袽女余反易曰衣有丨裪徒刀反福丨衣袖也襎音煩丨卷帊幞貌䙟音韋重衣貌又垂也凋鳥二音短衣也􆁫邪二古文邪牙二音襓音饒劒衣褿正今昨勞反裙也又衣也又音遭二裀音因近身衣也褍音端衣長又衣正幅女加反衣弊也褮音熒衣開孔也又音縈鬼衣也舊藏作齎祖兮反在三法度論褷所冝反􅗒丨毛羽大也二俗奴當反裯音紬單𬒳也上聲䙨二俗裹正古火反苞也也三俗正烏可反丨袲衣貌也二袲奴可反褒丨衣好貌也音戶福也三俗袞二或作衮今古本反天子丨龍服也六綻文限反衣縫解也袒徒旱反丨裼也又音綻衣縫解也裼音先反同二又音展衣貌也裸郎果反赤體也又胡瓦反褓上居兩反負兒衣也下音保褅也褅音替奴了反丨也二俗褾二或作褾正井眇反袖端丨也五必小悲夭二反衣袖也玉篇又匹小反俗音吕祭名也息拱子冢二反單衣也䘨􅤨上音皎下音了丨丨行騰小袴也音啓二同衦古旱反搌衫也俗屣所二音俗褚正知吕反裝衣也二裏音里中丨二俗正古典反纊著衣也三孔反丹榖衣也俗音紙正作只音偃衣交領也裺衣撿于劒二反衣縫緣也褊方緬反衣急也又小狹也或作裋今音樹弊布襦也二􅮌音散裲音兩裖或作袗正之怒反袨服也二尺斂反丨俗袧正音苟祭服也二或作袳正尺氏反衣長也二襖烏老反袍丨也衪俗袉正袘今徒可反裾也又他可反長舒貌也又紳帶也三䘾苦管反袴襱也力勇力董二反襱力董直隴盧紅三反皆裙袴異名䘢知吕反衣丨又弊衣陟是知几二反䘢丨也俗正都感反𬒳緣也二舊藏作禍俗音禍音吕姓也裎丑領反軍衣褞于粉反丨袿也音雨丨縣名也音綺好貌也古裷正去逺反薎也二袑正今市少反袴上也二今正徐兩反二音稔卧席也襧陟几反無衣也一曰衣二同胡感反壅耳也與㥛同俗他尓反奪衣也二音阻俗公本反正作裘褧丘頴反去聲製音制作也正也斷也裁衣也二同俗古裕正羊句反衣物饒也又道也也寬也三二俗古或作今余制反逺也衣裾也邊也苗丨也又容也裔正同上六袨音縣好衣也又美也黑衣也袋音代盛物丨也袢音判無色也又音煩絺褐當暑葛服也袔音賀𧜥袖也二同或作衸今音界布衣幅也又胡界反輔裙也二􅘼上音界下力佐反丨丨婦人上衣也袖目就反衣𬒮也袂彌蔽反衣袖也俗正所拜反衣袂縫也二襻普患尺衣丨也俗后託二音俗音被或作袒二今陟扇反皇后衣也三裱方反領巾也又表出料軍䙃惰唾二音無袂衣也或作正簿報反衣前襟也二才夜反小見衣丨也薄蓋反衣被也衽汝反衣襟也襯𥘉近反近身衣也襚音遂送死人衣也古莧反古衣也倉見反丨袨好衣貌他貫反皇后大服也又以絹反褦俗正音罷裙也二音問襘古外反帶結也襇古莧反丨裙袏音佐單衣也褑音院佩帶也襊麁最子外二反衣遊漨也二同褅俗音弟正從不祭名􅙳𥘉迓反𥘉懈二反裙分也音例旡後鬼也正從不作袸在見反小帶也音例殘帛也今作㡂䙢子孕反汗襦也褹魚祭反復襦也襬披義反衣丨也襸正今音贊衣好貌也二二俗正他計反丨裂手取也又輔也三襈士戀反裙緣也裞他外以稅書芮三反大功巳上送凶衣也舊藏作救􅠷音替小貌衣也褎余救以周二反服飾盛貌今作字二入聲襪亡發反足衣也籕文襲今祥入反因也及也入也重也合也二裼先擊反袒衣也俗裓二正古得反衣前襟也三裂音列分