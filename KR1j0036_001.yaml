也孿孿生患所眷二反雙生子也二俗變今彼眷反丨化也又姓二俗音變又舊藏作畜也倍音困五俗音祕馬丨也正作轡入聲􅝂三俗蘇叶反和也部第卌五口耕反敵也於淫反聲和靖也呼形反香之逺聞也音輕不可進貌二陶韶二音俗他登反鼓聲冬沖二音音橋大磬也力冬反聲貌也陶韶二音上聲二俗通音古同鼓三苦頂反去聲俗正苦定反右樂器也周禮云鳬氏為丨也二二俗正苦定反盡也三古候反張弓也音塊乙利反美也入聲苦角反今作觳二胡谷反谷縠二音呼木反今作日出赤貌黃部第卌六必連卑淺二反直尼反音輕􅳱昌終反黃色也隨函云合作輝字又俗尺善反黇他兼反黃色也黅音今黃色又音欽徒昆反黃色也他昆反黃色亦人名音撗織也許兼反黃名也又水炎反陟兼反黃也直廉反赤黃色也俗正䵎今他端反黃色又他門反三音輕上聲音亥黈天口反冕前纊也䵐昌善反黃色也口限反丨黃色也䵋榮美反丨黃色也斢他口反丨兵奪人物也通䵏正音老草色也一曰黃色人二去聲黊胡卦反解黃色入聲音莫辛部第卌七音孤辭音詞訟也以丨解理也辝同上古文音詞丨理也音渠一音忩百耕反􅢲所臻反多也所臻反羽多也音臻丨小栗也或作音孤上聲辨符蹇反别也理也惠也反俗蒲莧反辨同上罪人相訟詐丨如刀故從刀也二辮薄典反交也辡方免符蹇二反罪人相訟詞也又音詵方𬗟反憂也亦曰急也古文罪字去聲古文蒲幻反與辦同辦同上力致也瓣同上瓜丨三匹莧反小貌白也又蒲幻反小見也入聲俗正辟今婢亦反法也除也又芳亦反又必亦反君也三俗辣正郎逹反辛丨二音革觪音角二北激反同壁某部第卌公息夷反自營也又古文音􅌹某某也自是也丨擅也參參𥘉今反丨差不齊貌也又倉含反近也又所今反丨辰也二二古文徒字年事二音音三厸古文鱗字尖僣二音古弘反二音香古文祖兮反又俗古兮反古文祖兮反分糞二音掃棄也二同客庚反古文年字古文星字音玄古文音穹音幽音關織貫抒也音齊上聲古文徐姊反今作獸名厽力委反丨土為墻又力追才兮二反古文音頂俗斚二正音買玉爵也三音矢俗或作軬今音飯車丨三奙音本草器小筐也二音纍音止谷即委反畚音本同畚去聲古文音帝二同素古文音素音至古文音帝才笑反入聲音福二古文音六音音邑音覓音木髙部第卌九三俗正口交反擊頭也又口教反四三俗奴當反七暗反二俗陟降反又呼凍反又呼念反呼俠反生部第五十二甥音生外丨也又姓三俗音生正作䇠􅙷古文人字穰壤二音音皇花榮也與葟同俗所臻反又上聲又張長二音甡所臻反衆多也所交反甠俗殅正音情雨夜晴見星也二音青東方色也又千定反義同蕤儒佳反葳丨花垂貌又丨賔五月律名也俗尼鹽反眚所耿反過也音斗許鬼反二莫孔反奴困反正作懶弱也三音外俗音臭俗音勢冰部第五十三冰筆夌反丨凍也同水字凋音刀丨落傷弊也又半傷也凌今正力水反水也又水丨也二澌音斯凌丨也凛巨金反寒貌又力稔反亦寒丨也凄七兮反寒也詩云丨其以風也音含寒貌滄音倉寒貌皮水反水聲也皮疑反託也又皮一命反臧俗則郎反正作臧善也厚也二音冰良生反音治下江反正作鞏今作也上聲巨郢反寒噤也凖古文音準枃也平也度也古逈反滄寒也古文衣撿反今作奄忽止藏匿也生錦反音慎去聲俗女智反二古文於禁反七禁反丨冷音既音大入聲冽音列寒也上胡甲反下又甲反俗字正作泄二字水凍相著也溧音栗丨列寒風也五十七俗需正相俞反卦名二尼干反二籕文音而俗正如之奴禾二反九屬二胹音而音而古稚反俗女六反音備音甫臣部第五十八音堅音加音王臤慳看殸三音堅也又若見反上聲音返之忍反與同明也于往反背也音墮去聲俗所類所律二反音祕音貴入聲𦣱俗士革反𥘉革反蒲木反今作僕侍從人也羸部第五十九羸力為反丨瘦也極也痿也劣也疲也三落戈反魚身鳥翼獸也騾落戈反馬也落戈反縣名又音連鸁落戈反桑飛鳥也落戈反木名可為箭笴落戈反榖積也落戈反草名生水中也螺落戈反水蟲􅑕屬也又郎果反蜾丨蒲盧也郭璞云細腰蜂也嬴人姓贏以成反利也益也財長也有餘也二俗裸正郎果反赤體也二部第六十俗通正居追反水介蟲也説苑曰丨五色似玉似金上髙象天下平法地又居求反下又音丘丨兹國名也二音丘國名俗音元正作黿俗音陀正作鼉二俗五髙反正作音得俗上音知下音誅作蛛也陟矢反俗并列反正作鱉部第六十一或作正蒲交回吊二反牛脛相交也二二俗或作呼回反正作􅳐丨尵下又許鬼反三徒回反正作􅯁虺丨音衣居夭反五俗正音元似鱉而大也六烏光反上聲苦禮反二市勇反音始去聲俗與制反正作裳入聲音側音寂云部第六十二鄖音云邑名也二同音云亂也落戈反音牽音含上聲彌引反丨未也一音尾去聲棄棄輕利反捐也三同音棄除也去也昌介反入聲㐬徒沒反水從穴中出貌也于業反音卒雲部第六十三或作烏感于檻二反正作黤青黑色也或作他感徒感二反正作黮雲黑色霼虛豈反飛雲貌靉音愛丨靆雲興盛貌也俗靆正音代靉丨雲狀也二或作靅正芳味反靉丨雲布狀也又音佛二䨺徒罪反徒昆反霒於今反匸部第六十四匸甫良反受物器也又胡禮反有所藏也奩俗奩正力潛反香丨鏡丨盛物匣也二俗匯正口懷反澤名也又胡罪反水回貌也二區豈俱反丨分別識也土兮反匾丨薄貌音詮薄也又竹器名也二俗正今音舍船沒也四匡去王反丨正助輔也又姓匰音丹宗庿盛主器也音杯匜夷遲二音徒聊徒田器也古文則郎反厚也亦姓令作似泉反滋米竹器上聲必典反丨廣薄也籕文音乃二俗正蟲篇音彼又徒吊反田器也又平聲二匪非尾反非也亦作篚三同叵普火反不可也又甚也烏口反丨擊也與驅同音䡄匣也匬羊主反㔶音感箱類一曰覆頭也又音貢小抔名去聲匶古文音舊久也又尸丨在棺曰丨二匠疾亮反工丨匱彺位反匣也慳也竭也乏也入聲譬吉反偶也合也配也二也又四丈八為丨故從八也匿尼力反藏也隱也微也亡也隂也女力反蟲食病也俗通篋正苦叶反函丨也二櫝音獨匱也㔴俗正音弋大鼎也二匼苦合反丨匝與同古文月字殳部第六十五殳市朱反兵器也釋名曰丨殊也長三尺無刃有憧挃於車上使殊離也又姓俗㱾正􅴶上二苦哀反下呼來反丨丨笑聲㲀時人反喜也口動貌也音加烏官反正作剜𢿵直耕反字書橦也郭移又俗昌兩反俗宅耕反正作戶交反和雜溷亂也音皮或作正力鹽反丨鼓今之杖鼓也二音頭専貌也注音胡大反舊藏作敳五未反所有理也亦八九名也上聲毆烏口反擊也與驅同二音攺更也音毁春也乃后反乳也俗虛委反去聲􅐧或作毅正魚既反果敢有決也二俗以芮反正作聖也苦定反同磬石樂器也殾息俊反俗字音救強擊殹于計反擊中聲也奴候反乳也彀古候反張弓也古候反取牛羊乳也音殿入聲縠胡谷反羅丨也􅕪胡谷反螻蛄也穀胡谷反殳水聲胡谷反濁酒也音速榖丨動物也毇音作精細木也三古正音煞戮也法也下一又所拜反猛也疾也四俗胡角胡教二反穀俗二正古木反木名也三俗轂正古木反車丨也二古木反足跗也苦谷反土塹也苦谷反麻丨也苦谷反餅麴也䍍苦谷反未燒瓦也觳胡角苦角二反受三斗之器也音喫功也漢書云功苦丨淡也角榖二音雙王名也榖俗二正呼木反日出赤貌也三􅩸呼木反獸名似功而小食獼猴又名黃腰又丁木反丨速也許角反急束也許角反怒也歐吐也音笛對也當也四也也主也二俗音昨正作穿也苦角反鳥卯也或作呼木反毆聲瓜部第六十六瓜古花反尓匹曰丨華也廣匹云龍蹄獸掌等丨也尓州名又丨部與爪部相􅐭爪音側絞反俗瓠正音胡丨瓢也又音護瓜丨也二今􅕧正音盧瓠丨也二俗古瓢今毗消反瓠丨杓也三二俗正穰二音瓜實也三作分布二字古文葫字窊凹也畖烏瓜反丨畹地名在絳州二音零小瓜名也觚音孤方也漢書云破丨為圎也㼋音孤瓜也古侯反丨􅕕也正􅕕今落侯反丨苦丨也二俗㼔正音溫瓜名也二徒昆反㼔丨瓜名也㼐部田反黃丨瓜名也苦圭反丨茹也㼕音當瓜瓠也俗禳娘二音正作瓤字上聲二俗胡果反㼌與主反微弱本不勝末也窳羊主反器空中亦病也寙況兩反縣名也俗正奴罪反傷瓜也二力點反瓜名也至偃反瓢也郎果反去聲耶電反瓜丨也直禁反青皮瓜名也入聲二俗正徒結反瓜丨也三冬毒反瓠丨㼎或作匏瓝二今蒲角反小瓜丨也三龍部第六十七龕今正苦甘反坎也塔也又龍貌也二聾盧紅反耳丨無所聞也櫳勒紅反丨筐也廣雅云舍也龓音籠丨頭與同或作䆍正落紅反禾病也二豅大谷礱音籠磨榖具也二蠪音籠赤駮如狐九尾音如小兒食人一名踦丨音籠築七丨榖也音籠大聲也龔九容反人姓正或作令音堅龍鬐也鬐音耆三巫也􅶱音龍圭為龍文也二音籠赤也新藏作壟壟力種反丘丨也二龖龘徒合反龍飛之貌也二同讋之涉反多言也畨部第六十八畨普官反丨禺縣名在廣州又音盤丨禾縣名在涼州又孚袁反丨次也音煩百合也北潘反部黨也第七十四名夜反名養反名也反皆呪中字亭部第七十五亭匠反亭音作亭夜反響梵音亭單反響梵字牙部第七十六去竒反牙邪也一武牙丑耕直耕二反丘主反齒病也卑部第七十七顰音頻眉蹙也舊藏作脾鼙步迷反小鼓也亦騎鼓也比移毗移二反見音義音卑井弭反客也俗正音彼相分解也二卑也反卑孕反二音敦寧部第七十八寧舌反寧也反寧一反寧立反㲰乃庚反犬多毛也男部第七十九俗乃胡反奴了反丨也玉篇又丁列反撲也俗奴了奴到二反二俗音俗嬲正奴了尼几二反丨戲相擾也二音魯古文音脾奴到反孚部第八十孚芳無反信也芳無反卵化也㲗芳無反毛解也四俗他冬他動竹用三反俗直氏反山也乳人主反柔也俗莫附反俗西注妨附二反俗式熱反俗古麥反鷹部第八十一鷹籕文鷹字古膺今憶氷反胸也胸前下處曰丨也胸音凶二噟古文音應亦去聲俗烏貢反譍于證反以言對丨也俗徒頰反申部第八十二申失人反丨身也伸也重也容也又辰名大歲在丨曰涒灘涒音他昆反又州名亦姓舊藏作音俞丑亮反通也又逹也或作􅉧正羊刀反小鼓在大鼓上擊之以引樂也二虍部第八十三虍荒烏反字林云文也膚音夫皮丨也又美也大也傳也或作正音盧飰器也二音盧文也呼胡呼二音歎丨又姓虘昨何反文也又才都反呼况于反吼也雐音呼鳥名也音盧與同正虜今音魯丨掠又擭也推也服也二虎其吕反栒丨所以懸鍾橫曰栒縱曰丨亦作虛栒音息巡反其吕反飛丨天上神獸鹿頭龍身也鬳音彥鬲屬也音匣虎習貌也虙音伏獸名又姓况于反部第八十四居凌反口孤反丨瘁也在胡反古文殂字音徂死也其拯反欲㽶也又疑等反梵語河名也二俗于小反昌呪反丨敗惡氣也當故反敗也俗徒典反甘部第八十五甘古三反丨苦也又隴右州名山名又姓馦許兼反香美也嘗音常試味也或作醰今徒含反長味又徒紺反二么部第八十六么么于堯反丨麼小也二音幽麁鳴也或作􅖨今憂幽二音微小也二于尤反愁貌幻乎辦反詐也感也詐相欺眩以亂人目也音絶川部第八十七川古文音坤乾丨音訓俗正音荒人名二古文居其反災部第八十八災側持反田不耕曰丨也音扶小器也俗音瓶張吕反盛米具又田器也或作之恕反備也俗正楚洽反又七廉反古器也二由部第八十九籕文音盧瓦器也俗音扶小器也俗音瓶之庶反備也音西音校部第九十正今音泥水潦所止為丨丘郭璞云頂上汗下也二音泥受水丘也音泥音靈坰部第九十一坰川韻古熒反逺也空也玉篇音苦瑩反坰今冏正古熒反象逺界也二音冝藏宗反玉篇孔也二誤舊藏作矯居沼反詐也岡上四音古郎反下二無雨反初革反同上單部第九十二陟留反丁可反垂下貌今作嚲辴之忍丑忍二反大笑也奲車者反寬大也部第九十三四俗二今烏街烏瓜二反蝦篡之屬也六音邦或作正苦圭反星名二俗正革買反丨盾屬也盾音順二古八反音邦部第九十四許恭反恐也咎也惡也四七感反興部第九十五俗興正虛凌反舉也起也善也盛也歆也又州名山名從同具也二舋三變體釁正許靳反罪也又瑕隟也動也逺也古作釁隟音豈逆反四同上俗音橫俗通音尾音遷丹部第九十六􅘎多千反山丨雘烏郭反丹也㥖倉紅反赤色也彤徒紅反赤色也又姓音籠赤色也知部第九十七三俗音知正作鼅丨蛛也三龍龕手鑑平聲卷第一
