  text: 龍龕手鑑上聲卷第二釋行均字廣濟集手書九第一蟲許偉第二水書䡄第三火呼果第四土他魯第五草倉老第六口苦后第七女尼吕第八鳥丁了第九馬莫下第十阜房九第十一廣魚撿第十二廠呼旱第十三侯古第十四米莫禮第十五雨王矩第十六酉羊九第十七齒昌里第十八耳而止第十九瓦五寡第二十犬苦泫第草一豕施是第草二直尓第草三虎呼古第草四鬼居偉第草五走子口第草六羽王矩第草七皿旻永第草八文兩第草九爪側巧第三十矢或視第卅一黍書吕第卅二鹵郎古第卅三九居有第卅四几居履第卅五斗當口第卅六書吕第卅七享許兩第卅八此雌氏第卅九止諸市第四十枲息里第􅞀一子即里第􅞀二鼓公五第􅞀三小私少第􅞀四缶方九第􅞀五老盧計第卌六井子請第卌七喜虛里第卌八古公五第卌九乃奴海第五十里力止第五十一爾兒氏第五十二凵丘犯第五十三黽莫杏第五十四􅍫其九第五十五也羊者第五十六比卑履第五十七是常紙第五十八首書九第五十九果古火第六十手部第一揈火橫反丨擊也五俗下一又玉篇音叉正敕皆反以拳加物也六扠丑佳反以拳加人也亦作俗摣正責加反丨手取物也又與􆂯抯略同二千多反丨合和也二二俗正呼毛反除田草曰丨三撾陟瓜反丨捶也三俗倉丸七亂二反正作鑽􅗋二字丨擲也摫二俗或作正居隨反裁也四丑居反丨蒲也二俗拏拿二正女加反並相牽引也又搦也玉篇又乃下反下又女余反亦相牽引也三都甘反丨任也負也舉也以木荷物也探他含反丨取也二摧昨回反折也阻也挫也捫音門丨摸也以手撫摩也摹俗摸正莫胡反以手丨搭也又音莫捫丨也二攀俗正普斑反丨引也接也二摽匹遙反丨擊也土凋反丨撥也又徒了反丨動也二㩲渠貟反丨變也冝也也平也重也始也稱也又姓縳謀反丨抱也二俗搖正羊昭反丨動也作也又姓四擒擒二今擒正及林反丨捉也急持也三排步皆反傍丨用在身傍禦攻也托俗撓正呼髙反丨攪也下又奴巧反丨亂也二挻式延反丨擊也柔也和也取也長也掊蒲交反手丨也又俗音浮攙士咸反丨刾也又楚銜反丨上船也揗二俗正音巡手相安慰也又俗音順摩丨也三搜俗或作􅊧正所丘反求也索也聚也三俗音挑搯士刀反丨捾也又俗苦甲反捾音烏活反抽二俗正音抽丨拔也除也去也引也三摳苦侯反丨衣攐衣又豈俱反訓同又俗昌朱反户丨也攐音去乾反揩口皆反摩拭也又苦反摸也法也拭也捐音緣棄也攢在丸反聚也又音讃訟也二俗正蘇刀反爮也刮也三宅耕反撞也觸也與三同掁直庚反觸也撜直庚反又俗都鄧反正從木音緣果名也二俗攘正汝羊反除也逐也也又揎𬒮出臂以手御也又而亮揖丨也音伊入反三撑丑庚反撥也又丨拄也拑巨淹反持也摶徒官反丨風也摶三俗同上四扡音他曳也二俗直尼反正從土二三俗疾羊反船柱也捎所交反蒲丨良馬名也又也又相焦反搖動也音彡抔步侯反手掬物也俗莊牡二音正作裝字側交反丨搯也又側巧反亦亂搔也俗音慈掑音其攜今攜正圭反持也提也二俗丑皆楚佳二反正作搋字奴何反丨也􅵶乙皆反推也又背負貌挨烏皆反倚也又于騃反打也又于攺反亦擊也又俗音族擡音臺丨舉也抄初交初教二反丨掠取也與鈔同挼素回反擊也又奴禾反丨莏也又摧也捼奴回反摧也又手摩物也攎音丨斂盧也俗正素何反摩丨也二挲同上揌蘇臺反擡丨也又俗音惣搒白盲反丨輔也又笞也打也搼或作捲正拳今渠貟反力也也屈手也三正通音上舉也又俗音拸音移加也又弋紙反攄丑居反舒張散布也攓去反丨綰也亦縮也音新攡音離張也操倉刀反持也又七到反志也俗掔正苦間苦堅二反固五厚也持也二搴去反丨衣也與褰同二俗通正楚尤反手丨也四揂揫即由反聚也細也二五堅反揧破也又摩也俗正徒刁反擇也捾出也二子紅反撮也把髮也俗通摱正莫官反丨覆也三拈奴恬反手指取物也都回反丨撲物也許為反謙也作也又裂也亦指丨也抨普耕反彈也五髙反擊貌也搬盤婆二音除也又披散也又婉轉貌拼伯耕反繩丨也又從也攺也俗或作拋今正普包反丨擲也投也又普教反丨車也四音持也又俗音鋪撣徒干反丨觸也又丨碁石也亦掉也又上去二聲抪王篇普胡反開張遍布也又博胡反展舒也又俗音搪音唐丨揬也通或作攕正所咸反好手貌也又息廉反三救九朱反玉篇法也切韻盛士也詩云丨之儒從木者音求揪俗音秋正作楸抯側加反挹也又徐野咨野才野三反皆取也拫根反急引也俗支耆二音撕音西提也俗必迷反正作抬二俗丑之反正作笞擵俗攠二或作音摩丨抄也三擓苦懷反揩摩也扏俗求二音音韋選也摷正或作落堯側交二反擊也二扏音求緩也亦從木作朹丨繫梅也據音居拮丨手病也二俗苦回反揎音宣手發衣也二同搸二字郭移音同音臻聚也又琴瑟音房連反不咽也苦回反又音開二俗玉郎反俗耳由人久二反正作揉屈太也音孫捫丨摸􅟥也七巡子寸二反推也又人名姓香嚴又九反俗扟或作正所臻反從上擇取物也三步皆反音彌批匹迷反推轉擊示也又房密反舊藏作渕烏玄反深也扳音班挽也又古文攀字引也摞力戈反理也或作摞字二俗音靈窗丨俗宅加反正作揁玉篇音貞引也郭移又音丑人反通摐三俗摐正七容反丨打也又音窗亦打鐘鼓也五攐二正攑今立言反舉也正丨衣也下又音舉起也三音堅縣名又音賢地名于尢反丨屈撏士占徐林二反丨取也攬魯甘反丨持也舊藏作舊藏作羾音紅蟲飛音名音咨二俗音剛舉也苦胡反空也也㧫音而搦也舊藏作標擟或作正音彌丨狗山名也二揋烏灰反丨掎又國名㨡戶昆胡本二反手推也揄音俞丨揚詭言也又動也又徒侯徒口二反引也俗音正作櫩屋丨擂音雷研物擁俗古掤今音氷以手覆矢又弓強也又俗音三音余共也摪音將扶丨也二同扛音江舉鼎少説文云撗對舉也今摎正音交束也橈也又音流亦絞縳也又姓二俗音來正作棶木名也或作撢今余針反探也又玉篇音潭丨二抲音呵丨下江反丨䉶帆䉶音雙女皆反揩丨摩拭也捿俗音西正作捿鳥丨扔音仍引也又列也掄音輪手轉也又力昆反擇也一曰貫也悮􆁗正𢹍今許羈反擊也三去魚反擊也𢭂音勞丨閉也二許嬌反玄丨星名正從木二捈他胡反卧引也徐廉反丨􅎥草木也揱音消長貌又所角反纎也又長臂也又所教反木上小也攏音籠房丨又力董反丨略又物丨籌也酒律摛丑知反舒也又俗音離山丨因音因就也抿音旻撫也擠祖兮反丨排也摏書容反撞也鏗口耕反琴聲也古文戶公反搈音容不安也二俗音劉正作木名也揚音羊舉也導也明也拪音西俗音音牟俗正似泉似戀二反揎也轉也二挮俗啼躰二音音耶捶都回反􅎥也又直追反棒丨也又丨髻也音或作扷也俗音踈撋如緣反説文云按摧急也都昆反上聲俗揣今正𥘉委反量也虔也試也動也除也又搖也又音釧度也又俗音搏三拯此字無疊韻取蒸字上聲丨拔也救也上舉也助也二抆武粉反丨拭也擾俗正而􅜲反丨亂也煩也二拖徒可反引也又音施持物惠人也拖俗同上掩古正音母手丨指也二攞勒可反丨裂也捛二俗正音吕師丨也與旅字同三攪古反手丨動也俗抱正薄老反捉也持也二㨐方垢反衣上擊也俗撚正奴典反以指丨續緊也二㨋昌者反丨裂物壞也玉篇又諸也反擊也扯同上撼胡感反丨動也九展反丨搌醜長貌也又俗音擅􅌹丨也搌知演反束縳也又丑免反丨也烏絞反丨拉也擺捭北買反丨撥也亦姓二古文音指摌所簡反以手㧡物也㧡音亥動也㧲蘇感反丨搖動也俗㧬正音拱厄持也二奴鳥反􅎥也于許反打聲也摾俗巨兩反㨊或作撱今羊捶反棄也又撞也又他果反器文狹長也二二俗正音動也三摙力展反擔運物也搴􅠡九輦反也二同拐俗古買反正作拐老人杖也揃即淺反切也古挸或作擟正古典反丨振拭面也三抮呼典反引戾也音紙丨掌也説文云側手擊也二俗烏騃反下又竹例反俗音動俗音栁捆苦本反丨取也直尓反二攤奴伹反按也又他丹反丨開亦緩也俗竹几之日陟栗三反攩他朗反丨擴捶打也又胡曠反亦打丨也晃俗胡廣反正作晃讀書床揃即淺反丨滅也二擏居影反所以正弓居影反丨除音粉動也俗扮正一房吻反握也又芳粉反二俗摻二今所斬反執抉也三烏感反手覆也抂于往反或作搑正而勇反推貌也二㧴音我也音魯搖丨正今許偃反手約物也二摬于丙反申打也撑俗音掌摷子小反菜似薺俗拲二正居悚反兩手共持也下一又居王反義同三𢶙許委反手丨傷也音兆扭女九反丨手轉貌又陟有反丨按也俗音唯正作埻射的也又宅耕反撙則損反促也挫趍也撼俗胡感反俗音顯義合作捴俗㧾古捴今音惣普也皆也合也衆也四擔多旱反笞也又俗音抌章反㧋火犬反捵也捵丑展反丨出也音好掞舒染反動也俗傍禮反正作梐敕里反去聲控苦貢反持也引也告也音患以身貫甲也又古還反又去聲也昌制反曳也制也又昌折反掣二俗昌制反俗􆄬正苦浪反丨舉也拒也遮也捍也二悮抗今苦浪反義同上四撞直降反擊也刺也搗也又宅江反丨突也二俗正古候反擩也擩音人注反三挫祖卧反摧也折也音亮一取也也笞也治也正今時戰反專丨也二掾以絹反官名也必刃反棄也排也厈也挊弄三俗貢反二俗正余制反又羊設反牽引拖丨也三捩郎計力結二反拗丨也又琵琶撥也今正古代反滌也􅑄也又許既反拭也􅑄音潛二同俗烏半反手丨也正作腕挂俗通挂正古賣反懸丨也止也二挍音教撿丨又􅊲丨也二俗皮證皮氷二反依几也正作措倉故反舉丨也投也捕音步丨捉也援于眷反丨衛護助也又于願反亦姓按烏漢反抑也安也揾烏困烏沒二反以手捺物之貌也撩力吊反治病也又丨擲也又力鳥反扶也又力堯反取物也捍音汗丨也扞音汗衛也以手丨也又古旱反丨投物也音厄展反古文音拜古􅫵二或作捃今居運反也拾也取也四薄報反鳥伏卵也俗㨾正余亮反揩摸拭丨也二􅠜俗抃通拚正皮變反擊也三輔過反布也揚也放也棄也揀練簡二音丨擇也摜古患反丨帶也擋丁浪反拼丨也二俗音舊正作柩尸在棺曰丨正今作紺反手丨物也又子敢反二二俗正陟利反到也又劫財也又陟里反指也三挏俗音洞摓扶用反切韻勞灼龜兆也莫貢反㩨音惠裂也又卦也俗音謝撌俗求位反丨檻也又丘位反俗音悟或作正其記反諱也二俗掆正古浪古郎二反梢舁舉也二古文音亂理也通擩正人注反丨莝手進物也又奴豆反丨不解也二俗力刃反正作撛所拜反拚舊藏作古反也㩌方味反川韻云南人呼相也㧦呼縣反擊也徒弔丨反同掉俗蒲拜反次火也許既反捸俗特計反正作下也又縣名亦人姓捔音角掎丨也又土角反攙丨也搠俗音朔握于角反持也把也搦女角反持也又尼白反捉丨也又正也􅟥蘇各反丨模也插三俗插正今初洽反刾入也五扱初洽反引也取也級也也俗掐正苦甲反捻也爪丨也二掘渠物反穿斸也􅓯音陟玉反挹伊入反酌也斟也持也又音邑鳥短氣也伊入反丨讓也進也又相居反取水具也掇多括反拾丨也又陟劣反亦拾取也搮力乙反以手丨物也攉古嶽反揚丨大舉也又苦嶽反擊也扮俗扴正古八反手指丨物也二抓二俗擘正悲厄反分丨也以手治物也三音卓擊也推也又俗音掾五俗正疾反尅獲也欣也勝也成也疾也獵也六挾俗挾正胡貼反懷藏持護也二拹二俗拉正郎合反摧折拗丨也三或作又竹聲正盧盍反與粒訓同二搚與拉擸俱同又摺丨相和也摺之涉反疊也又音拉敗也𢶍才盍反擸丨和雜也又私盍反搕丨糞也搕烏合反以手蓋丨也又丨糞也㨁常職反柱杖也又俗直􅊂反搏輔各匹各二反皆擊也㩵五割反擊也又才結反五割反伐木餘丨也皆俗正從木作枿五拆二俗音坼普木反拂略打聲也二俗拓正㩉通都盍反手打也又俗音塔四或作撻正他逹反打丨也二俗拔正蒲八反丨擢也盡也又蒲未反回丨也二丨目也抉伊決反出也又挑也二他反除也誤也遺也又徒活反解丨也捾烏括反取也又胡官反亂摩也揳先結反㩢丨不方正也二㨝同上丨也二俗正莫結反丨也二俗所六反正作縮音葉度也又音牒摺丨也二俗音搦拂芳勿反擊也除也去也拭也劈房益反撫心也古扼扼二今音厄持挽捉握也三挓俗知格反裂也張也正作磔二揬徒骨反搪丨也俗挬正俗通蒲沒反按也三押音甲丨捒也又音鴨丨署也捒楚草反扶丨也又所草反丨擇取物也又所去反裝也捻奴貼反指丨也􅡼音雹相丨也音叶二俗或作拓正音託手承物也又姓又之石反四摑古麥反挻丨打也或作二撤直列反除去壞滅也又發丨也拀之六昌六二反丨止也樂器也音滅手拔也摩丨也抹音未丨摋麋也音抹丨也揥他歷反手挑丨也又丑列飾也搙女角反揾也又奴豆反柱也摝音鹿振也渠列反強暴也捇呼麥反丨掘土也經音義又丑格反開也掝呼麥反丨裂也摕徒結反捎取也又音弟取也又音帶捶也撲普木反打丨也又俗音朴撅居月反撥物也託頓二音或作捊正郎括反手也也摩也取也或作乎下又俗他得徒得二反二㧹俗正他得反擊也又俗音特二二俗其月反正作盧葛反撥丨手披物也揑二俗捏正年結反捻也捺也三舊藏作音張草反普活反艾丨也攃蒼葛反足動草聲亦揩也抶丑栗反丨打也挌音格打也又音恪亦擊也也又止也正也􅠎苦擊苦弔二反旁擊也擊胡狄反符丨説文二尺書也又苦吊反旁擊也俗正苦結反丨提也持也又苦計反手也二㧊俗正普未反推丨也二􅚹普厄反射中聲也俗正末反逼也又排也二俗同上二俗音必正作㮿丨鉢羅花樹也經音義作蹴于六反指丨也應是掓字音式六反拾也在阿含經弟九卷郎沒反俗掓正今式六反拾也三阻立反丨斂也㩧音朴擊也又音雹打聲也抇戶骨反牽物動轉也拮音古丨據手病又音結義同挃徒結反􅎥也又陟栗反撞也抈音月折也又俗五活反正作相去樹皮也擷胡結反捋取又􅍑結反蒲北方擊也㧙音筆也二同舊藏作剝在阿育王壞目因緣經也托之石反拾也又作拓紀逆反持也古反丁結陟栗二反撞也與挃同居玉反持也抐內骨奴困二反揾丨按物水中也摵子六反到也又所責反殞落貌搭音塔摸丨又音答打也扢居􅡧古忽戶骨古代四反昔摩也擽音略擊也搰胡骨反掘地也俗擆正張略反置也二㩨音雪滅丨也撫俗音亦俗正千木反玉篇促也二􅳥與即反拭也俗古麥七入二反撧子雪反手丨斷也二或作似絶反拔也二挒音列也扐音木曰乘抾去劫反挹也子列反摘去也胡結􅍑結二反束縳也俗或作正昨沒反手丨也四螽􅏑二正音終丨蟴蟲名也五蟴音斯丨也蚣俗虹正音紅丨霓也又音降青丨也二蛟音交丨龍也螻上音婁下音孤或云仙蛄蟪蛄石皆螻姑之異名也蠄俗螭正丑知反無角龍也二音毗蟲名古或作蚍今音毗蜉也四蜉音浮蚍丨也俗俗通融正以戎反知也朗也又姓也三蚖二俗螈古蚖今愚袁五官二反蠑丨守宫蚚蜴蝘蜓四種異名也四蜈蚣上音吳下音公蝍蛆䖵蜒也能制蛇下又音鍾蟲螽蟲也蚰蜒上音由下音延江南大者蜈蚣小者丨丨也俗蝣正音由蜉丨也朝出暮死蟲或作䖻二蠑音策丨蚖蚚蜴别名也俗音公俗螝正居追胡對二反蠶蛹也二蟬音蟬蜩也不食之蟲仲夏月丨始鳴也螇音兮丨螰蟲名似蟬也螕邊奚反牛虱也蠅余承反蒼丨蟲也螟莫經反丨蛉桑蟲也毛詩云食苗心蟲曰丨蛛音蛛蜘丨也或作徒登徒得二反正作􅠀二字食禾蟲也蜪徒刀他刀二反尓匹云蝗子也俗通正五髙反蟹屬也三俗螋正音搜蛷丨也二俗蛷正音求丨蟲名也二舊藏作螳蛇弋支反逶丨也莊子云𬗋衣朱冠也蝭啼帝二音寒蟬鳴也蛇古蛇正食遮反毒蟲也又姓又弋支反丨丘地名又音也亦人姓二或作蜱正符支反蛸蟷也又彌搖反亦蟲名蠰音霜齒桑蝎蟲也又傷餉二音蟷音當丨蜋亦螳蜋也蛸音梢蟰子喜子也又音消丨蟲即􅡯蟭也又長腳蜘蛛又姓蟯音饒人腹中蟲又去消反二俗螵正符消匹消二反丨蛸蟲名也三蟰蘇凋反丨蛸長攲桑蟲也二俗蛔或作今音回人腹中丨蟲也四蝤音由木中蟲也又即由疾由二反丨蛑似蟹而大生海邊也蛑或作蛑今音牟蝤丨似蟹而大二蛉音零蟲名也汝占反大蛇也蛅汝占反黑丨食檀木蟲也螐音烏蚅丨蠋蟲大如指白色也莫汪反螻蛄也蠐上音齊下音曺蟲名也蟥音黃丨蛢音蒲結反蛢音瓶以翼鳴蟲或作蟾正職廉反丨蜍蝦蟇也又視廉反丨光月彩也二蜍音諸踞丨一頭數尾長二三尺左右有腳狀如蠶可食也蜍署魚反丨也又音余蜘蛛也加蟲音加米中蟲也蟛蟛音彭丨蝟似蟹而小也二同俗或作今音移尓匹云蝓丨螺􅑕也又音斯守宫别名也三蜞音其蟛丨似蟹而小也蚐俗或作正直尼反蟻卵也三俗尺之反正作嗤笑也音義敕之反香嚴寺之反猿音爰亦猴年五百歲化為玃螉烏紅反蠮丨也蠮音噎蝖音喧蠀螬也蠀取私反丨螬蝎化也􆂰二或作蛬正渠容居悚二反蟋蟀也三蛩渠容反丨巨也蠊音廉蜚丨蟲名正蟫今徒含反衣中白魚也二蟡為反涸水精一身兩頭似蛇可取魚鱉也蜲于為反丨蛇也蚵音何蛶蠪蝑相居反蜙丨也蜙息恭反丨蝑蟲名也俗正部田符真二反丨珠也二音螊音咸海蟲可食也郎禾郎果二反二或作今音秋次丨也三音因蝚音柔蟲名也渠惟反蟲名也蜊力脂反蛤丨也音緣蝗子也一曰蟻子蝩直容反蠶晚生者也又職容反丨􅏑蟲名也俗戶交胡刀二反蛝間根二音蟲名所江反蟲名䗔音侯蟲也蟼音亰丨蛙也􅡻音啼螳丨小蟬也俗煩盤二音䖶音豕掘地也蜻音青丨蜓亦蟪蛄别名也又音精丨蚙也力􅌹反蟲名也蚶呼談反􅑕屬也蟉正通渠幽反丨幽龍也又音聊也二虬渠幽居幽二反無角龍也都聊反丨蟉茅中小蟲也音離分破也又音亦刀刾也音梨同蟍螏丨也蟍同上蝓音俞丨蝸牛又神朱反虷胡安反丨蟹一名蜎蟲也蚷俗螶正音渠獸名也二俗或作蟂今徒紅反鳥蟲名三或作蟭今音焦䗚丨螳蜋卵也二䖢彌遙反蠶初生也或作音蛾蠶丨也蚿音賢馬丨蟲也一曰百足􅰏音錢鳴丨也本集作蛛蛭二字經音義作丨非也蚟音王丨孫蟲名丨一名蜻蚓即今促織也䖽或作力脂反蜛音居丨蜍也蟱音無也􅪔音風玉篇蟲窟也音沙螓音奏蜻蟲似蟬而小丨蠜音煩蛗螽蟲也蠪音籠赤駮如狐九尾爪音如小貌食人名䗁丨又虰蟲亦獸名也虰丑丁反蠪丨也上聲蠢赤尹反出也作也動搖貌也又與偆蠢四同二姑五反丨毒媚惑也蠹神也蠹音都固反又音野二蠓莫孔反蚊丨也蟣居豈反蝨子也蜚非尾反咸丨蟲也又扶沸反神異經云南方蚊翼下有丨蟲生於九卵子復生九而俱去蚊亦不知也明目者見之又古飛字今古音早丨也二俗蚪正音斗蝌丨蟲也二蟻魚綺反大曰蚍蜉小曰丨子二蚓音引蚯丨也􅑕二俗蚌通蚌正白項反丨蛤也四繭古典反蠶衣也蠕二俗通正而兖反蟲動貌又而久反丨蠢蟲名也四舕􅽣蠎四俗正莫朗反最大蛇王也五蛘羊掌反痛丨也又蟻名與癢癢亦同蚠俗蚡正房粉反丨鼠也與蚡同又平聲二音婦丨螽蟲也俗正於典反丨蜓也二二俗蜓正徒典反守宫異名也又音廷蜻丨也三於逺反丨蟻蚯蚓也蛹余隴反蠶丨也音禮大船名也音禮小船輔也蚥音甫蜛丨螳蜋别名也又音父蟾蜍别名也俗蜢正音猛蚱丨蟲名二蜆或作蜆今音現赤頭黑蟲一名縊女善自縊也又音顯小蟲也二䗆音管雨下蟲名也余兩反蟲丨蜄俗􅜹正蜃今時忍時刃二反海丨大蛤屬也三􅡂上音暑下音負丨丨蟲名俗音里魚名蜽上音下音兩丨丨蟲名也又石之精也蛔呼罪反土丨毒蟲也又俗音回二俗音險蝺舊藏作瑀音雨石似玉也蟢音喜丨子蟲也蜾音果丨羸蟲名許兩反蟲丨也巨豈反蟬也去聲螚奴代反小虻蟲也螮音帶丨蝀虹也蚋蚋而稅反蚊丨也下又而恱反二蠆今蠆正丑芥反毒蟲也二俗螙古蠹正當故反食木蟲也三音惠丨蛄也他外書芮他卧亦雪四反皆蛇蟬昜皮也䖭音眷丨蠾别名也蠣力制反蚌蛤屬也蠔俗正音次蟲似也二蚝七志反丨毛蟲有毒也䗲良刃反熒火也音射蟲名音愛蚤音造蛀二或作今音注蟲名三舊藏作􆈚蘇到反疥丨舊藏作蘇因反丨水舊藏作嗽蘇奏反香句反么蠶也苦到反丨􅔒蝎蟲螅俗去例反正作憩息也蠟鋤嫁反年終祭名與􅹒同䖨或作蟅正蔗隻二音􅡂蝜蟲名也二蟃音万螟蛉蟲也失亮反桑繭蟲也蟦扶沸反蠐螬蟲也蝟音謂蟲名毛如針又彭丨或作䗯正音進蟲名二音務蠡名也二同經音義同餌蠫郎計反割破也又俗音螺二蛽俗音貝同丑芥反毒蟲也二入聲二俗或作螫正施隻反又呵各反蟲行毒也四二或作正呼各施隻丑略三反蟲行毒也三俗蠍正香謁反螫人蟲也二蝎音曷蟲名也又俗同上蠈層則反食禾蟲也尓匹云食節曰丨五俗蝨正音瑟蟣丨也六俗正音特食禾蟲也二蝠音福蝙丨也俗音蟔上音織下音墨方言云蝙蝠異名也蛺蛺古叶反丨也二同正今徒叶反蛺丨也二俗蛭正音質水丨蟲也二俗蜴正音亦蜥丨也二俗蜤二或作蜥正先擊反丨蜴也四先擊反丨也音覓蜇奴葛反蠚螫也又知列反俗正音色蟲名也二螰音鹿螇丨蟲名蟪蛄也古歷反螇丨水蟲名也蚸音歷尓匹二丨蟲名也俗正他逹反蝲丨也二蝲正俗郎葛反丨蟽也二􅜽音積蟲名也或作螏今音疾丨蟍也二魚列反蟲蝗鳥獸之怪也蟘他德反蟲名也蟄直立反蟲藏丨也蠛莫結反丨􅵷小蟲風春雨磑者也虴蛨上知格反下莫百反蟲名也䗷音憶小蜂也蠟俗通正盧盍反丨也二蚱音責丨猛蟲也直炙反蠋直玉反丨蟲名又之欲市玉二反皆蟲名音或蟲名短爪狀如鱉三四寸有三足含砂射人久則為害也又音域蚅音厄丨蠋大如指似蠶蟲也之欲反蚩丨又音蜀也螚奴勒反蟲名似虻而小青班色齧人也俗正蒲結反蟥蛢蟲二䗇渠竹反蟾蜍别名也􅠸子六反蝍丨蚇蠖也蚇蠖上昌石反下鳥郭反丁丨出伸蟲也蠮烏結反丨螉細腰蜂也螉音翁音略渠丨朝生暮死蟲也蛶音劣尓匹云髙珂蟲也又郎活反義同蟋音悉丨蟀蛬也或作蟀正音率蟋丨也二蠞音截丨似蟹生海中也􅨒音劫石丨蟲形似龜腳得春雨即生于石上也知列反今作蜇同䖩毗必反黑蜂也䘁或作􅝺正列反丨似蟬而小也二音伇丨蟲名蛚音列蜻丨蟋蟀也蛥音舌丨蛈蟪名也蝍即節二音丨蛆蜈蚣也正音瓦蛤蟹屬也俗同上蝁烏各反蛇名二同蚗古穴反丨蛥蟪蛄蟲名也𧈟尼質反小蟲也􅉶女力反蟲食病也螲陟栗反螻蛅物也蛣去吉反丨蟲名音匝俗魚列反􅻯俗音特音弋蟲丨也􅧳正蛤今古合反􅑕也二蟆音莫小蚊也二同蝮芳福反丨蛇也色如綬帶最毒或云􅳐俗音略正作􅡯布各反丨蜼螳蜋外也音哲蝃音拙蛛也水部第三淹于炎反丨久也留也滯也漬也敗也也洴音瓶澼丨也澼音普的反湔則前反洗也又音箭亦水名潛俗正音潛丨沒也藏也沉也深也止也二沿沿音緣丨緣也順流而下曰丨二同餐俗音喰涎湺三俗今涎正似延反口液也五俗正音魚燧人之丗天下多水故教以丨又水名二浮泡上伏牟反下音拋浮