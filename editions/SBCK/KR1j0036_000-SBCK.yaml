front:
  text: 夢溪筆談云幽州僧行均集佛書中字為切韻訓詁凡十六萬字分四卷號龍龕手鏡燕僧智光為之序甚有詞辨契丹重熙二年集契丹書禁甚嚴傳入中國者法皆死熈寕中有人自虜中得之入傳欽之家蒲傳正帥浙西􅂑以鏤板其序末舊云重熙二年五月序蒲公削去之觀其字音韻次序皆有理法後世殆不以其為燕人也右夢溪􅀁談如此􅎾四十年前讀之偶扵萬曆己酉過杭州購得此書乃髙深甫家􅀁藏宋板宋􅁓也深甫有印記前序有統和十五年丁酉乃宋太宗至道三年也寔契丹原本非蒲帥重梓于浙西者計今七百餘年卷帙完好夢溪􅀁云重熙二年者又後統和三十餘年予考其序摠有一十八萬九千六百餘字也行均字廣濟智光字法炬夢溪未詳矣
  hash: sha256:a4125dc35c229d8d4dc2eb98a65e520c0fa850bf355c4d28a4aa254b2d7449b4
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1j0036_SBCK_000-1a}
body:
  text: 崇禎戊寅元夕徐􅎾興公識新修龍龕手鑑序燕臺憫忠寺沙門智光字法炬撰夫聲明著論迺印度之宏綱觀跡成書寔支那之令躅印度則始摽天語厥号梵文載彼貫線之花綴以多羅之葉開之以字縁字界分之以男聲女聲支那則創自軒轅制扵沮誦代結繩於旣徃成進牘以相㳂辯之以㑹意象形審之以指事轉注洎乎史籀變古文爲大􅂐程邈變小􅂐爲隸書蔡邕刋定於石經束晳網羅扵竹􅂤九流競􅕽若百谷之朝宗七畧遐分比衆星之拱極㝷源討本備載扵埤蒼廣蒼叶律諧鍾咸究於韻英韻譜專門則字統􅀃文開牖則方言國語字學扵是乎昭矣矧復釋氏之敎演扵印度譯布支那轉梵􅀙唐雖匪差於性相披敎悟理而必正扵名言名言不正則性相之義差性相之義差則修斷之路阻矣故祇園髙士探學海洪源凖的先儒導引後進揮以寳燭啓以随凾郭迻但顯扵人名香嚴唯標扵寺号流傳􅀊乆抄寫時訛寡聞則莫曉是非博古則徒懷惋歎不逢敏逹孰為編修有行均上人字廣濟俗姓于氏􅂀演靑齊雲飛燕􅀳善扵音韻閑扵字書覩香嚴之不精寓金河而載緝九仞功績五變炎凉具辯宫商細分喉齒計二萬六千四百三十餘字注一十六萬三千一百七十餘字并注惣有一十八萬九千六百一十餘字無勞避席坐奉師資詎假擔簦立祛疑滯沙門智光利非切玉分忝斷金辱彼告成見命序引推譲而寜容閣筆俛仰而強為抽毫矧以新音徧扵龍龕猶手持於鸞鏡形容斯鍳妍醜是分故目之曰龍龕手鑑惣四卷以平上去入爲次隨部復用四聲列之又撰五音圖式附扵後庶力省功倍垂益扵無窮者矣時統和十五年丁酉七月一日癸亥序
