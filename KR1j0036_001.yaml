body:
  text: 去聲鑟求位反賈陷反照也明也鏡也察也哉也又音監二鑬舊蔵作鑑苦盖反甲之異名也亦通上聲俗鍜正都貫反打䥫也鎚也小治也二徒悶反頑也不利也新蔵作羊稅反利也錐刀鎽芒也鋸居去反刀丨也居去反樂噐也鈙其禁反持止也又魚倚反釡也与䰙同鏇辝絹反轉軸裁噐也又似金反丨圎轆轤也錠音定錫属也又音殿鐙都鄧反鞍丨也又音登又徒口反鎩所例反矛㦸属也又所拜反剪翮也翮下革反銚徒反燒噐也又音遥亦温噐又古田噐也又他反音注丨也又姓鎚直類反好銅半孰也又直追反䥫丨也又都回反錬治王也古文同上鐞俗鎒正奴豆反鋤丨也或呼髙反義同二釤所鍳反大錬也䥙俗鐩或作鐆正音遂陽丨可取火於日中也二俗正冨福二音釡而大口者也一曰小釡也二𨫼正鏊今五到反餅丨也三同上鉋蒲効反治木噐丨也又歩交反丨刷也鍊音錬丨金也俗作錬者非錬音東錬從東音同上徒對反錬丨車轄也又息委反又徒果反今通正七乱反短矛也三鐜俗鐓正徒對反矛下銅也二鏤盧候反錯也彫也尅也又力誅反属丨劒名錮音故鑄也又禁也塞也牢也俗鐀或作求位反檻也正作饋餉也二銄俗式向反正作餉丨饋也鋽他弔反鉎丨也俗音乱鈾古文直救反釰音刃劒刃也錝子宋反金毛也鏆音貫臂鐶鈵悲詠反堅丨也􅐥亘反重鐶也鎎許既反弩戰也鉒之戍中句二反置也又选死人物也鍍音度以金飾物也又音徒鐬呼外反鈴聲􅎂音犬鉗丨又音弟以鏁加足也鈉而稅反銳丨錣陟衛反針也鏏祥歳反大鼎也鏉所又反䥫鉎丨也又速侯蘇奏二反刻鏤也鐏徂寸反矛㦸下銅也音惠銳也又三隅弔也銴音誓車當結一曰銅生五色也又音曵鋇音貝柔鋌也鈗徒外反丨矛也鐱劒儉二音鑢音慮錯也古文音證鋥除孟反磨丨也義合作音計音剃䤝音硬音樹音二同音忌錗竹恚反釪銲侯按反丨金銀令相着也二同音素鋓音利丑弁反正銐今昌制直例二反除也利也二人絹反柔銀也二同䤳才夜反鏡丨居隂反鏧或作鑋今苦定反金声也二鍄音亮銼麁卧反蜀呼鈷鉦也羊角反錑盧對反平木噐也􅘜盧候反鏉丨也䤰玉篇乎鈞反香嚴音熒治噐也二武鄧反玉篇鐶也玉篇所諫反䥫廷也又應法師音山卓反丨也二古文證字驗也俗冨福二音正䤹鎪同䥌古文音證四古文證字也入聲鐸徒各反大鈴也四俗鑿正音昨鏨也穿木噐也玉鈼同上吴人云釡曰丨䤦三俗鉞正王伐反王斧也四鋨䥫二俗鐵二正他結反黒金也四俗今正音金䥫丨也三音煞鳥羽病也又長矛也俗正蒲末反樂噐也二鑊胡郭反鼎也二俗鏃正作木反箭丨也三胡瞎反車頭䥫也鈒蘇合反丨鏤也又所立反鋋也㦸也俗正音藥開丨也二鏕音鹿鉅丨郷名又於刀反与鏖同鑷尼輒反丨子也鋷輒聶二音丨子也二同錫先撃反鉛丨也又賜也与也鑠書藥反銷丨也二古今居玉反以䥫縛物也二鐲市玉反温噐也又直角反似鈴也市玉反兵噐也又陟玉反钁丨也又斫也音欲炭鈎也䥤音雹丨行形勁刑以扜也銍陟一反刈也又之日反縣名也鑕音質斧也錖音毒丨舌也音决舌也烏毒反白金也音卜丨􅣏魯矢也􅣏音孤俗鑮二正博薄二音似鍾而大也三音博鍾罄上横木也盧盍反錫丨鈆属也俗音朔鐝俗正其月反磨丨之㒵二俗音釙疋角反金丨也出玉篇音結鐮別名也苦結反咸也又断絶也又同上二鐯張畧反钁也鋜士角反鏁足也鎉俗都盍反俗鑈正奴叶反小箱也二或作正玉篇音劈噐也二俗普撃反二或作䥍執薩至三音羊捶丨也亦田噐也三鈌古穴乙穴二反破也居列反句孑㦸也俗正鏑今都歷反箭鏃也三五各反劒端也音妾丑輒反級衣針又楚洽反鍬也鑡𥘉角反餅丨二同俗七昔反鉄古文直質反今作紩縫丨鏌音莫丨鎁劒名鎁音耶鍓俗鏶正集妾二音䥫銯也二鑩五各反以䥫作鈎物也鉀音申鎧属又古盍反丨鑪鍙火沃反銀也鉥食律反長針也魚乙反胡刮反釟音八治金也俗或作正音歴玉篇釡也三音歴丨鎗二同子畧反或作正竹角反丨斧也二竹角反撃也与㭬同俗釳正許訖反乗輿馬上揺翟尾者二鎍生革蘇各二反音薩鉿古合反尺鋌也或作銛正古活反無知皃香嚴又音闊二䥢倉歴反守夜皷也鐍古穴反丨也俗鏚正倉歴反于丨斧鉞也二鐾或作鐴今必益反丨土犁耳也二或作鈠今音􅟕小矛也二錔他合反俗今普撃反裁木為噐也二音聿針也居謁反金丨也钀魚列語謁二反馬勒傍䥫也鍎徒骨反覆丨鈯陁骨反也又小刀也釛音八金類也查鎋反秦人云切草也鋝音刷玉篇云三丨爲一斤也又音劣鋢俗同上普篾反江南呼鍬刃古叶反長丨劒名也䤶於業反椎丨甲噐也鉣音劫帶䥫鉻音格陳公鈎也音毒丨丨等截也伭音賢很也又亭名仍如升反頻也重也因也就也乃也侘丑加丑亞二反丨傺失志也又他各反寄也香嚴音亡僧反惛也玉篇亡同反醉行也特丁反水止也僮音童僕也又癡也頑也又姓仳音毗醜皃也又符鄙芳比二反離也别也侁所臻反行皃也亦齊整皃僉七尖反同也咸也皆也倫音輪等也類也人也道理也俗僑正渠苗反寄也客也二古正佻今他堯反輕也佚也三仿音傍丨佯也又分兩反僾人丨相似又古文妃兩反佯音羊詐也又仿澷行也又音墻弱也又古文髣字如羊反丨伽王名也二俗正古文音仙止也上扵山日丨也正從上今從山三二俗音劬正作衢俗子俞反也二俗音緾正作緾􅧷音科美皃也僖虚之反樂也戲也笑也俗或作僄今疋昭疋妙二反輕丨也三僊三俗或作三古文音仙丨遷也今作仙六俗傒正胡雞反東北夷名也二俗音飢佡仚許延反輕也二俗音徒佺音詮偓丨仙人名也俗正上咸反悪也儖丨也又𥘉鍳士陷二反輕雜言也二魯甘反形皃悪也俗正音牟均平齊等也二偳俗音端許縁反智惠了利也亦疾也又舞也伻普耕反使人也佂諸盈反行皃也二伀隻容反志及扵衆也偟音皇睱也吐力反編絲繩也俗佪正音廻避也二伹七余反拙人也又徂古反殘也俗音虵儕音柴等也俗力梅反俗渠具二音正今音丨役也使也又喜也二二俗音悲俗偲正倉才反多才能也二通份正筆巾反質備也二俗音魚㑌二俗去王去誑二反俗部田反俗音兠催倉囘反迫促也五兮反丨㑮佯不知皃俘音敷囚也胡交反痛聲也倠許維反仳丨摸拇也傛音容丨華縣名音曺終也又音遭㑗音身人姓伃音余婕丨与妤同形或作正侀今音刑成也三傖助庾反呉人呼秦人作丨倃音髙毁也又渠乆反与舅同亦姓侇音夷玉篇人名也倁俗音知俗音持俗口求反苦瓜反奢也与夸同又安卧反丨䐗痛也傫儽力追反嬾懈皃也二同昌陵反宣揚美事也又好譽詮舉也又言也足也丘也佔侸上丁兼反下當侯反丨丨輕薄也一日垂下皃上又音店儂音農我也俗正徒丁反丨息止定也二正今音眉草生水垂皃或作丨䔧垢腐皃二音孤商的二音音㑤二偤音由侍也或車反倯息恭反丨恭怯皃也俗正渠容反丨倯可憎之皃也二渠追反使也佒音央傴也偧陟加反張也偣俗扵廉反淨也音移笑丨丨音申佬音遼又所臻反正作侁二息廉反丨細也此是九子二字經文云仇子陁也在廣弘明集第七卷伽求迦反丨藍也俗音充俗音般佹居為反丨成也丁奚都礼二反二㑯俗音須又思王反市遥反照也明也庿也又丨穆也又市沼反介丨俗音希云小臣也一曰夙駕徽俗音暉正作徽美也仔音兹克也又音子草木盛也侽㑲二俗女咸反音頭俗丁年反蘇遭反驕也偎烏回反愛也又囯名俗音皆上丘加反下扵靴反丨丨癡皃也音尖俗汝占又正作誦多言也烏光反二古文金字􅟅或作僝正七閑反悪罵也又士戀反見也具也二侌古文隂字仐音今俗音支許尤反祥也吉也美善慶息也侳昨禾反与矬同丨短也音旬同善也俜普丁反竛丨行不正也又作伶丨孤單皃从音從音推三同扵金反又去声音奴音徒上聲儉巨广反丨少饑饉也偶吾口反諧合匹對也僂力主反傴丨俯身曲春也二俛仰上音免俯也伭頭也下魚兩反舉首也又時也爲也二俯音甫俛丨也下首也俗正扵蹇反仲也仆也倒也息也又姓二佷胡墾反丨戾難㢠也儌古反抄也又扵堯反俾并婢反使也從也軄也二俗正尺氏反奢也泰也大也逺也三倚扵蟻反囙也住也依丨也音武歌丨也音武輕也慢也侵侵与古文㑄同㒇音武大也失意皃也偯扵豈反丨哭餘聲也又大功之哭三曲而巳正倖今胡耿反儌丨又非分而得曰丨二俗伈正思審反丨丨皃二佇直吕反又立也偉于鬼反大也竒也重也四俗古文音散盖也今作繖字傴扵武反不申也背曲也儡落毎反又郎對反丨丨子戲也又音雷丨同倮郎果胡瓦二反露體也二俗企正丘弭去智二反望也止也三侗上勒董反下他孔反丨丨未成噐也下又直也一曰長大又音通大也僓他毎反長好肥大也徒損反倱丨也倱胡本反丨四之一也儆居影反窹也或也起也走也又音􅔡敬愼也儼魚撿反敬也坐思皃也估音古市稅也俚音里頼也聊也又蠻属偠烏了反丨㒟細腰好皃也奴了反偠丨也床史反待也又姓㑿士巧反丨丨長皃也郭迻又音巢俌音甫輔也倣方罔反丨學也正㑨今愚矩反容皃盛也二俗佀或作徐姉反正作似相丨也二傡正今蒲猛反俱也並也又音並二俗胡管反俗羊主反正作窳仠古旱反丨長也僔子本反聚衆也又俗導存二音蘇感反頷丨揺頭也与㧲亦同俇時掌俱往二反丨遑遽皃也玉篇又渠徃反枉也僸牛錦反玉篇動頭皃又居䕃反樂名九輦反偃丨傲也㒖俗五口反蓮根俗或作于鬼反大風皃正作􅰜又俗胡毎反二体蒲本反劣也又俗千内反獄名二俗通正音􅊰􅷗丨不媚皃也又虚􅊰反擔丨也四莫講莫江二反丨不媚也古迥苦類二反好皃也或作正阻史反脯也又脯有骨曰丨今作胏易曰食乾丨二于敏反憂也与愪同俗愚雨反侰俗僒正渠殞反㥯迫也二俗兆買反二俗音􅪠徒旱反大也古文上音乃下音灾㐱之忍反新生羽而飛也仵音午偶敵又逆也又姓古文古典反小束也又音結㒄人善反意脆又失善反俴音踐淺也侱丈并反今作徎雨後徑也於阮反勸樂也佊音彼邪也敬也四尼教反丨不静也伺思恣反候察也又平聲備音備防也救也具也慎也皆也咸也副也究也辦也成也又姓伨俗古侚今詞閏反逺也疾也以身從物也三㑥音易相輕慢也又音豉􅥚二俗偫通正直利反大也又㑹物也四侫乃定反諂媚僞善也又才德之稱也二俗正音貸借也施也假物与人也三仞音刃七尺也說文一㝷也倒都告反丨也又上聲三俗皮證皮氷二反正作凭􅑀二字倩七正反借丨也又倉見反利也又好女笑皃俲俗傚正胡孝反教也与學効三同二音計連丨也又音玄佷也俗音置正作置佁音態丨儗癡皃与儓同係胡計反以證反皃也誤仛正玉篇丑訝反嬌逸也又音託二傺丑例反侘丨也伉苦浪反丨儷敵對匹偶也又姓儷音麗伉丨也三俗魚據反正作御俸扶用反禄也奉也必刃反丨從也相也導也或作擯二俗音戀奴亂反丨弱也倀知孟反丨失道皃又丑良反僅音近纔也餘也劣也少也又俗丁里反㑦郎計反佷丨也儩音賜盡也与亦同偋房正蒲徑二反隱僻無人䖏也又厠也与庰同㒃二俗女利反正作膩佑音右优也助也儭𥘉近反至也近也毗面反丨利也又人行不善更之則安故從人㪅聲㪅音更㐻俗内納二音正作内字古定反直也又五堅五莖二反㥯也又牛耕反俗价正音界丨也二介音界助优申閱也又大也耿也俗音政俗音皃或作正僣今子念反差也擬也三㐰古文音信也又持立也二㑁竹律反短㒵也又音墜蒲木反童丨也又附也官名太丨也亦丨吏也伋音急繫扵心趣扵事也又孔丨人名侐許逼反清淨也仂音力勤也不懈也与力亦同偓烏角反丨佺仙人名又姓他括反丨可也又輕也俗音亦莫結反丨僣多詐也㑛速束音㒔丨也㒔獨蜀二音丨㑛短醜㒵也佮口合反人姓又音合併丨聚也俠正侠今胡頬反仼丨也又姓二俗音發佖毗必房密二反威儀俻也㲻古文奴的反今作溺字伲俗女乙反近也俗學角二音渠玉反丨促短小皃也促七王反速迫至近也俗正或作先結反動草聲也又鷙鳥之聲丨丨呻吟也三俗正先結反丨淨也二佅音未丨㒓肥皃又夷樂名他逹反佅丨也俗音刧㒒俗正呼叶反丨卑也二古文音尅俗俶正昌六反始也厚也作也動也二古文音宿傝他盍反丨儜劣也又丨儑不謹皃也儑五盍反傝丨不著事也􅳇私盍反傝丨不謹皃俗書約反俗五各反俗音列佾俗正音逸丨舞列也二佸括活二音㑹計也俗陁骨反音俗侂音託毁也偪彼測反迫也与逼同俗倉歴反正作慼憂也疾反斜岀也又利也便也㒤之渉反服也又天反急也偞二俗音儠良渉反長狀皃佶渠乙反閑也正也佫胡各反人姓也倜他歴反丨儻也又陟流反伌俗音厄災丨俗徒活反音荅仢酌杓二音丨流星名也音敕意愼丨又惕也俗呼結下結二反俾音必行皃玉篇又止也蒲木反俗呼叶反伳私列反音竹侄音質堅也牢也俗音察今僇正六二音癡行皃二傗㑉上丑六反下息六反丨丨不伸也僪巨聿反鬼無頭也㑻莫八反丨健皃也俗正呼八反㑻丨也二徒没反傉奴沃反虜三字姓庫丨官氏也俗胡頬反和也俗音習五俗居列反正作子單丨又旡右臂也六俗子六反正作蹙急近逈丨也陟革反侼蒲没反強也倉歴反与戚同憂懼也四獵質二音也羊列羊制二反俗直畧反俗音燭㑫俗乃叶反又舊蔵作弃在七佛神呪經古文億字古文音錫音折俗其列反又音列倬音卓大也詩云明皃也又玉篇丑角反偓丨旡礼也音割言部第三詒与支反贈言也又徒亥反相欺也譩音依痛聲俗或作諝正相􅹣私吕二反有才智之稱也三訏况于反大也音扶丨詞也誒許其反可忘之詞也衆語詾正今許容反訟也三徒廻反譟也如塩反多言也又流反􅨜音呼亦也古蛙反讕㤢也誧博孤普胡二反諫也又音普大也助也又音怖謀也落千反逸言又落旱反謾丨二諰山佳反語也誽女佳反言不正也歩賔反北言也諞房連反巧言也又音辯噟接言也陟加反丨詉語不正皃詉女加反丨語不正也又奴故反恚悪言也謌古文音歌䜙五含反不專丨又謔弄言也詌音憨又上聲䛔女加反二同俗訞或作詽正許延反詞也怒也又五閑反亦諍訟也又音天亦詞皃也三諅諆居之反丨謀也二苦回反丨調也謣音于女也二同訛五戈反丨􅍝也偽也詭也動也又化也言也二詮取全反叙也明也次也平也證也衡也音沉怒也又音甚信也讎市流反仇丨譏居依反諌也誹也問也譴也訢音忻喜也誈二俗通誣正音旡丨枉欺妄也又加也不信也四譕音無誘詞也古文音愆過也先奚反悲聲也又聲散也先奚息移二反該古哀反皆悉咸脩義也又軍中約也諧户皆反和調偶合也諛羊珠反謟也訑通詑正徒何反欺也誑也二土禾反欺也玉篇又止支反多言也諼詐忘也諠譁也讙三同音喧囂丨也又音歡亦喧也譁􅹨音花諠丨也二謿摘交反謔也与嘲同俗正誇今苦瓜反大言也三譊女交反爭也恚呼也詨音交誇語也又音哮二俗正扵喬反巧言也三䜈楚交反代人說也諲音因敬也訬楚交反健也詶市流反丨酢報荅也陟流反丨張欺誑也􅑲音移自得之皃又淺意也又徒哥反避也俗正烏奚反誠也又烏礼反舊聲也二訋三俗䚮正音仍因也就也厚也又人之反四諶氏任反誠也䛘如林反信也念也音侯訡音吟丨歎也䚲二俗訕正所姦所諌二反丨謗毁誹也三諮音資丨詢訪問也詢息旬反丨問諮懇也䜖俗正譚今徒含徒感二反大也又姓三或作諳正烏含反憶也記也二諄章輪反至誠丨正也又之閏反告也丁寜也又佐熟罪苦也三章輪之閏二反言乱之皃也訂他丁徒頂二反評議也又丁定反逗遛也謜音詮言語和恱也諯士專尺絹二反相譲詷也又音専相責也譔音詮善言也又士眷反専敬也䜛俗讒正士咸反譛也以言毁人也二五咸反知也又戯也諵女咸反詀丨也謓昌眞反恚也怒也与瞋亦同謼荒孤荒故二反大呼號也許縁反智惠也詹聀廉反省也三俗詜正土刀反丨䛬言不節儉也四徒刀反詜丨也謳烏侯反呤也歌也五加五佳二反謊呼光反夢言也呼光反丨也讝俗古咸于衫二反胡丁反三周謨謩莫胡反謀也議也僞也二同詴烏回徒卧二反呼也又戸罪反四同星耶反詅郎丁反丨言相次也又音詮訧羽求反過也又作尤義亦同俗烏含反訶哥二音俗誗直廉反言利美也又人名音増加言也譻烏耕反丨􅘱小聲也謍音營丨青也說文小聲也通􅘱正女耕反譻丨也二或作宅江反正作丨骨也音苦江反譆許其痛聲亦上聲䜖經音義音徒南反郭迻俗子邪則何二反在兠沙經丑林反音占䚺俗謡正余昭反歌丨尓疋云途歌謂之丨也二詓豈俱反謰音連二諃音琳善言也諪音亭調丨諴音咸和也戯也玉篇又音嵒亦弄人也謻直離反别也又音移水室門名也音渠詳音詳音􅐚䜞子爲在細二反正作劑刀也二音詩女加反女加反絲丨語不解也楚尤反丨隂私小言也音𥘉栗反通正陟山他二反丨謾欺謾言也香嚴又丑山反二訅音求安也謀也信也訜上音分下音云音云三俗或作䜏正土禾反退言也五俗正音䋲稱舉也二􅬢烏兮反相言噟辝也丑知丑秋二反相問而不知也又落代反誤也或作諏今子子子侯二反謀也二謘遲稚二音語丨也楚佳反興言也音由從也諻䖍撗反語聲也訌戸公反渲潰也誴昨宗反謀丨樂謧力支郎兮二反弄語也諀符支反人名又疋婢反丨䚹悪言也音斯數諌也又挮啼二音轉相誘語也䜅惟誰二音就也疋夷反􅍝也誀音而誘也古文音裁詵所臻反衆人言也徒刀反上聲詎其吕反詞也豈也不定也謟二俗讇諂二正丑染反丨誑也僞也侫也四三古訿訾二今子尓兹此子移三反罵言也毀丨也五音誣丨也詭居委反丨誑也責也隨悪也誘音酉道也引也進也教也俗音偶正謏通先了反小也誘為善也又蘇口所六二反俱訓同二古謇正居展反丨吃難言也三譣許撿反丨詖也謦口頂反丨欬通喉中氣也譭許委反謗也譛也二俗通正都礼反訶呰欺毁也下一又他歴反丨䛢狡猾也四警音景戒愼也寤也諩或作譜正音𥙷籍録也二誄正力水反銘也謚也誤同上通診正之忍反視也候也驗也二訠式引反詞也况也長也誔徒頂反詭詐也俗誂正徒了反丨弄相呼也二俗讜正多朗反直言也二譑居少反多言也又丘召反丨弄也讄力水反禱也謂禱于神祇也䛗今訨正旨止二音丨許也訐發人悪也二俗口本反正作懇二詃姑犬反誘也䛞音旱大言也誩其兩反競言也諗音審告也謀也深諌也又如甚反誏音郎明也又姓虚偃反丨摶佷㑦也䛉俗詪正胡典反諍語也又古恨反難語也二謱力主反覼丨安曲也覼音落戈反諟音是審也諦也埋也正也俗音底正作詇於兩反早知也俗音母䚵他口反丨誘也噭音口先相口可口佷反惻也誃徒可反欺也兖允二音諓音踐謟也俗詗正火􅒯反明悟了知也又休正反二䛻羊首反音犯二同訋丁了反挐也挐音女余反詁音古丨訓讞魚蹇魚列二反議獄也譐誻上倉本反下徒合反丨丨恚言也訯二俗誜或作正所瓦反強事言語也又所化反枉也四側雅反丨訝訶皃又子邪反丨詠也俗手獸二音郭氏音詡况雨反普也遍也和也大也音綺妄言也相承於俟反討他老反除去治罸也又羽也謑今正胡礼反耻辱也又許懈反怒言也二俗音酉去聲􅍝眉救反丨誤也詐也妄也譴去見反呵也責也怒也譲也問也亦姓誚才笑反責也呵也嬈也戯笑也誹謗正非味反下布浪反丨丨也諒音亮信也佐也知也譽余據反歌稱羙德也又平聲又姓誑居况反欺也惑也古作㤮今癈諭音喻告也諌也譬丨也俗訪正芳妄反問也詢也二譮許介反怒聲也又俗音㑹許介反譀丨也䜕今正火芥反大怒又譀丨也二譀許鍳反丨䜕也誼音義理也冝也善也古文義字謾莫晏莫半莫官三反欺也諷方送反背文日丨又丨刾也謉居位反言丨也又耻也慚也䚻古詷今音洞丨言急過也二倉弄反丨詷詞言急也􅰾於計反丨諦也譡丁浪反語中也諄正也直言也􅬫三俗訴今正乗故反告丨冕枉也五詐側嫁反僞妄不實也詖彼義反譣丨也反慧也侫也又彼爲反辯諭也讌烏見反丨㑹也詛莊䟽反呪丨令敗也或作話正胡卦反談言也又胡快反語丨也二譺冝記反啁小也又魚戒反欺也譢雖遂反告問諌譲也或作詫正丑嫁反誑也二䛧莫計反急言也余制反多言也訽音後罵也訅二俗古訊正音信問也誠言也四認識丨也訒音刃難言也下又音忍純也二俗讛正魚祭反与藝同屏䖏語也二俗䜟正𥘉禁反預也纎也其義纎微預測其事也二誌音志記也譬疋義反丨諭也誡通正音戒言警丨勒也二諹余亮反謹也讙也諺音彦俗言也譟蘇到反群呼也三俗正莊禁反䜛也毁也又子念反三䛳於劒反卜匿也丑利反笑也又陟里反丨言也誤音悟錯也訃音赴丨至也就也吿喪也丑嫁反相誤也䛨俗音信詬呼透反怒也又若候反罵也又巧言徒對反怨也悪也􅦔音救止也荼也助也訝五嫁反嗟丨胡誤反誌也認也䛠上都豆反下奴豆反丨丨不能言也􅒜或作音謝辝丨也諣呼覇呼卦呼賣三反疾言也無放反責也䛃五貫反新蔵自切鞞僣反初近反識音志摽丨又音式知丨通今苦嫁反丨詬巧言才也二䛍方味反言急也良刃反詿古賣反誤也又胡卦反礙也詺弥併反丨諦也音悟一或作誤古文辯字四俗正音梵多言也二䛆直又反洲丨古縣許縣言有所求也二同音弄音義䜒烏告反語丨也譧直陷反被誑也音号相欺也􆇏乃定反二䛺音界敕也音豆証音正諌丨也彼義反謲七紺反伺也又俗音謬盧候反丨詬忽怒也謴古困反順言調弄之皃也古困反丨摩人也支義反快也竒寄反謀也二同誎七賜反數丨也諈所恚正恚二反諉丨累也諉女恚反相嘱也又過也又吐禾丨也訵丑利反玉篇笑皃誋音忌告也信也誠也又也䛈矢利反丨忘也音字名丨今作字䛾音素諳丨􅨣音弟審諦也䜋胡對反覺也悟也呼㑹反衆聲也詯乎内反休市䛪去仲反丨多言也䛩二俗䜑正烏故反相毁也三䛛胡對反市丨又言長也下又音回二同二通正雖醉反言也詩云歌以丨止又慈䘏反譲也二譓音惠多謀智曰丨也莫駕反多言也譵直類反怨言也詘二去勿居勿二反辝閉也二諁丁活反蒲没反乱也亦言乱也新蔵作說詍私列羊制二反多言也子亦反二莫八反渠業反辛聿反正作恤私列反江西經音作諤五各在廣弘明集音必𥘉栗反丨隂私語也音𥘉尤反二同詀叶涉反丨讘細語也又直䧟反誑丨也与謙同又丁兼反轉言又竹咸反丨諵語聲也謖所六反起也許訖反語瞋聲也䚴五刮反訶也千結反言正也䛎呼决反怒訶也許撃反私也古麦反丨嚄疾言也嚄音獲謮音責丨怒也諽革客二音謹也詻五陌反丨敎令嚴也謋伯反丨然也二同或作今古伯反丨丨多言皃也二詥音合諧也亦作合譶徒合反言疾也又直立反澀丨言不止也㒊音所立反或作今側洽反齊丨多言也二疾反多言也又口丨也䛚音畧約丨歎美也五各反謇丨直言也䛢他谷反詆丨狡猾也諿七入反和也譃舊蔵作謔許虐反郭氏俗音虚正今音牒反問也二烏合反音識音莫心部第四惇都昆反厚也撲也大也信也悝苦回反病也憂愁也又大也又音里亦憂也慳客閑反也貪也惜也音希慕也也兾也憿古尭反尭也又俗古了反又音渠脂反敬也畏也怡与之反和也恱也恬徒兼反丨靖也愇音韋香嚴云恨也今正苦回反大也二慊力閻反丨惟也又苦忝反恨也音紕悪性也音綿忘也懵莫登反惛也悶也慙也又莫孔反慓疋遥反急也又俗必遥反也惛音昏忘也不明也憀音流悲恨也又音聊無丨頼也二恂息廵反順也信也懦人朱奴亂奴卧三反怯劣丨弱也三同怜俗通憐正音蓮哀矜愛念也二惸渠營反無兄弟日丨亦獨也慺力朱反恱也又力侯反丨丨謹敬見又力主反人姓也慞音章懼也惶音皇悚懼怕怖也憔昨焦反丨忰也与顦同去王反怯也憕直耕反失志皃又音澄平也音詮止也亦更攺也惴音專丨丨懼也又之睡反憂心也怦普耕反中直皃又心急也㥊薄耕反丨誾好嗔㒵呼萌反㥊丨也音慙也於縁反憂悒也怔忪上音征下音鍾丨丨心動懼皃也惂俗慆正他刀反恱樂也二􅤷或作正音愛也二烏侯反与謳同吟也歌也恱楽也又業也又口侯反恡惜也岀玉篇愉音俞丨和也恱也楽也俗倉何反忡敕中反憂也俞愈二音憂也懼也二恌二或作正音揺憂悸邪感也又他彫反輕薄皃二愢蘇來反意不合也多昆反厚也信也俗惏正盧含反貪也与婪同二怓女交反心亂也忶戸昆反心悶也胡交反快也女朱反心乱也懰力由反愁也怨也俗許其反母官反忘也悗母官反惑也俗音摩慩音連立泣皃憧昌容反徃來皃也又俗宅江反丨幡正作幢㤝音充心動也怌音丕心丨也徒昆反悶也音牟愛也与恈同俗呼光反正作蒙掩也巨支反尓雅云丨丨惕丨愛也又是支反音門丨不明又乱也又音民亦乱也香嚴又力廷反俗㤉正苦加反㤍丨伏態皃㤍口交反二㦕力中反戸佳反心不平也又怨也又音佳二同氏林反信也􅢯丘廉反丨㥓意不安也香嚴又立咸反俗正音營衛也二誤音凡正作忚或作正呼兮反欺慢之皃也二慵蜀容反丨嬾也火還反慢也又火玄反惠了也忾喜夷反喜皃􅋏所江反懼也左傳云駟氏丨㤿英廉反丨㥓不安意也又於劒反甘心也去竒反憾丨儉急也惃音昆乱也懽呼官反喜也又古玩反憂無吉也云殞二音憂也玉篇又恱也於尭反丨丨憂也怊敕霄反悵恨小絲細也三同惤古賢反布名憢許尭反丨丨懼也力應反怜也憴食陵反稱舉也与譝同悾苦紅苦貢苦江三反信也誠也慤也愃音宣戻人語快也恲疋庾反心悶也音哀音祥戸萌反於容反憂也又上聲㦑呼甘反丨癡音移祇丨不憂事也忹音狂憸七廉反㤿詖也又息廉反科口也詖音彼義反二俗相輪反正作恂信也或作正去宫反憂皃也二音爭愋况袁切恨也和也之縁之瑞二反今作惴同愛心也憉上音彭下音亨丨丨自強嗔皃渠萦常倫二反心愁憂悶也悰蔵宗反慮也一曰楽也愔於滛反靖也慅蘇刀反愁也恐也又音草二同憹奴冬反㦀恱又音懊丨也㦀音逢恱也下江反恨也第三卷二俗通正徒朗反放丨也或作婸四惲於粉反謀也議也厚也重也愐弥兖反思也募也㦗其錦反心丨也正作澿字㦃踈簡𥘉簡二反全得也又也亦憶也愯意拱反懼也恉正今音指憶也二俗悄二正七小反憂皃又心無聊也三懙音与玉篇安也音舉玉篇謹也悿他點反弱也惀盧本反心思求眺事也又音輪欲知也眺音他了反恔古了反丨憭恵明也又胡教反憭音了照察也又音聊丨空皃也㥝名婢反止也惈音果敢也悱芳尾反口丨丨也音罔丨然失意皃也􅤷武姥二音愛也念也憮武姥二音失意皃也又音呼大也又音無空也音武音戸俗㥠正私呂反与諝同才智之稱也二愺恅上音草下音老丨丨心亂也七感反痛也傖也上又青忝反丨悽也惼上於典反下方典反丨丨不順皃懆音草憂也愷苦海反和也康也大也樂也㥒倉宰反恨也㥏他典反青徐胃慙爲丨悓音現難也忏七典反怒也憬俱永反逺也愀正俗親小慈糺二反容色變也又在由反二忱徒敢他敢二反安也又氏任反信也愖同上懡上忙果反下郎可反丨丨面慙也俗正烏老反丨正之皃也或亦丨二音散丨扇也吕慮二音􅬝胡頂反丨恨也憫眉殞反丨黙也武粉反音米盧敢反俗音老古文音厚恑居委反變也悔也懮於栁反受舒遲皃也又姿容也古文音草去聲慠二俗正五告反慢也蕩也倨也三俗悋二正良刃反丨惜貪鄙也三憚徒旦反難也怒也惡也畏也辝也驚也怬許異反忻也四俗惰今正徒卧反懶也不敬也懈怠也六憒古對反心乱也慨苦愛反也懣也歎息也音㨾懣莫本反慣閞患反丨習也俗悃正音困勞倦也二俗正其庻反畏也怖也玉篇又其居反心急也二惋烏貫反驚歎也又上聲宛也懼音具怖畏出驚恐也悍胡旦反猛也勇也慢慢莫晏反急也倨也易也二俗正昌志反志也又音試二懈古賣反嬾憜也忰二俗正情醉反憔丨憂愁也又子對反恐皃三俗悷正郎計反𢤱丨拙惡也又憻丨悲吟也憻音二音亮丨也悢音亮恨也悲也怏於亮反情不足也亦不服皃也㤃音訪悸其季反心動也氣不定也慻俗居倦反音義作眷廽頋也或作腃岀阿差末經第五卷愠於問反怒也悖黙作色也懀烏外烏快二反惡皃也忓音汗善也又古案反人姓又古安反丨擾也忤音悟逆也觸丨也悼徒到反衰也傷丨也或作正恠今古壊反丨異也驚也二懹人向反憚也難也忨五貫反貪也亦習也俗正音戒質也又力反急也二愒去例反恐人也息也又苦盖反貪也又去謁反息也憾胡紺反積恨也㤥胡愛反患也苦也恨也㦈於盖反青謹也愴𥘉亮反悽丨也俗音怕俗懠正在計反愁也怒也二憞徒對反惡心也又都昆反􅥋恫上千弄反下徒弄反丨丨不得志皃也下又音通痛也㥞俗二正雖遂反意思深也三二或作􅞥正餘制反明也一曰習三悑正怖今普故反惶丨也二正憛今他紺反丨除懐憂也二俗忬正羊恕反安也恱也二悺古玩反憂也悎俗教角二音音惠爱也㤱芳又反小怒也俗正音兾強力也二音帝悶也㦅俗直例反蒲悶反丨心也㥵胡閑反丨辱也怐正俗苦候古侯二反丨愁愚皃愗音茷二㤆芳方反丨恎急性皃恎徒結反慀胡計反恨足音卞喜皃俗怰正玉篇音縣二㤑玊篇俗于救反心動也二同上支義反懻丨恨也害也通正則卧反折丨二俗正芳廢反怒也二㤄俗芳吠普没二反許魏反丨忌也怚將恕反憍也惓渠眷反悶也􅰪扵驗反意足也或作㤿忕太大二音奢也又音逝丨習怲悲命反憂心也俗㥆正音退肆也又不進也又他没反丨忽不悵也二居偽反諧也陟利反恐也恨也奴計反相丨摩又丨陁慖古對反恨也懗呼嫁反誑也与同慥七到反言行急也息箭反憂也愾許旣苦爱二反大息也二俗教學二音懝五愛反病騃也惶也中止也又音嶷有所識也舊蔵作懼音具俗莫報反怶俗披義反正作帔衣丨俗悲命反正作怲憂心也音戰烏故反入聲俗悖正蒲没反乱也逆也或作誖二通二正莫結反輕也三怯欠業反懼也弱也正作㹤怕音拍憺丨安静也恓誤恤正湏律反憂也撫丨也二悏愜謙叶反當也可也快也心伏也三恪苦各反勤心謙叅也又虚敬也二俗愊正芳逼反困丨至誠也三惕也的反怵丨憂也愛也㣼忉也又徒朗反不憂也怵音黜慄力乙反戰丨懼戚也正懌今音亦恱也樂也攺也二俗正五各反驚也二愶虚業反以威力相恐也慽清積反痛也悒音邑憂也不安皃惻初力反創也悲痛也㤨二俗直質反書丨也正作帙懾慴之渉反丨伏懼怯也又徒叶反懾丨也二恰苦甲反用心也忔今正許乞反喜也二俗㣿正之若反痛病也二三俗懎正音色悲恨也四俗於角反正従巾作惚音忽怳丨失志皃又俗音惙陟劣反疲也憂也恊俗正音叶和也合也二俗㥛正紀力反息性相背也二怵丑律反丨惕也㤕丑律竹律二反憂心也又俗音􅫅胡甲反喜也忸女六反丨怩也正戄今許縳反驚懼也又日遽視也又渠縳反大視也二􅗘㤞徒各反微也二同恄許吉反怖也􅴇徒各反忖也俗音墨正作嘿俗𥘉責反㥺俗胡榙反正作吹火丨也㦡俗音樂慉丑六反驕也又許六反起也亦恨也音角愵奴歷反憂皃㥂他得反丨丨也刧却二音㤴二同昌渉丑輙二反休也玉篇心動也又或作丅兼他叶二反衣領也正合作二字怫音佛丨欝也恎徒結反惡性也㥾女力尼乙二反愧也又他得反楚革反丨冊也㥽楚革反耿介也㥘音刼強取俗正丘逆反心勞二忦古點反恨也又憂也又音介亦懼也二怽俗音末正作帓忘也怭毗必反怒也居六反音叱俗正音革智丨也二通正徒叶反恐懼也二㤸許撃反心不安也他没反丨忽不悵也舊蔵作玉篇音若心乱也在安般守意經俗正許聿反怒也二愎符逼反也恨也􅞕普結反丨然瞋也怍音昨慙也不思呼麦反丨丨辯快也二舊蔵作豁寤上呼栝反下音悟在増一阿含經力恱反弱也少也鄙也与劣同懫音質止也㤢扵六反心動也又音矣念也又俗音墮方六反平聲古二俗愆正去乹反過也失也四伊閻反丨犬甘内心無足也正今於塩反安也二俗古都奚反今作二憨呼甘反愚癡甚也惒和禍二音琳法師云僻字也今作和字㤍口交反丨恢伏態㒵力閑反地名俗倉紅反煴噐也音惟二古文音謀音臣尺占反丨懘又徒叶反安也怤芳無反思也恱也忞音旻自勉強也又聖心也㦛音余恭敬也俗正息廉反疾利口也二恁音壬信也又音荏念也氏壬反誠也信也与同􅡣俗或作古文於求反志也亦丨愁也令作憂同三㥋衣扆二音念痛聲也奴刀反求咎二音怨丨也憌音瓊心憂也直陵反丨盛也又苦也又心也㦂古文常字悡玉篇音离恱也二於含反通正古文思字二俗憥正音勞共心也二音酬音离憂也二同里之反憂愁皃惢姉随反善也又才捶反疑也又蘇果反亦心疑也音㒹音昌通悠今音由遐也逺也智也思也二懃音勤慇丨音悲㤎音哥法也恃也蘇禾反丨題縣名音通痛也居陵反怜也慜也音金二俗音餘莣音亡草名似芋皮可為索也㦁音連玉篇云泣血也舊蔵作慙音盧二古文惟字古顔反今作姦音臣客庚反音人今作仁二同上聲古今正丘隴反又丘用反丨懼也三愍慜眉忍反傷也悲也怜也二愈羊主反賢也勝也差也益也惹人者反乱也又音若䛳也䛳音扵欠反六俗之領反正作齊也懇可佷反丨惻至誠也又信也又莫角反美也俗同上憼音景敬也古懣今莫本莫短二反煩也憤也愁悶也二慫正今息栱反驚也二音隱丨謹也㣽俗好怒二音音粉動也音甚急音隱丨謹也奴板反慙而面赤也与𧹞同又力至反戁奴板反悚懼也又人善反舊蔵作恐丨頗在道地經古文悔字悹管貫二音丨丨憂無所依告也音愐思也㤁音忝忿芳吻芳問二反怒也怘怙固二音古文音上音甚去聲許記反好也恱也悆羊恕反恱也安也豫也態他代反意丨也戇卓綘反愚丨也上一又呼貢反亦愚也三通憊正蒲拜反㾞也二懟直類反怨也惷俗正丑用丑龍丑江書容四反皆愚也二愻蘇困反順也愗􅐂三俗正莫候反盛也美也勉也与茷洞又愚癡皃也四慰扵胃反安丨也江西隨亟音休建反二通憲正許建反法度也制禁也二㥲時忍反古文今作慎廉謹也又音嗔㦣魚祭反睡語也与䆿同又音衛義同恙余亮反憂也病也噬也古文古隘反今作懈丨忌怠音代丨切韻音待俗之刃反音制始孕病兒也懘尺制反丨音不和也又丑例反音尺占反尺制反狂大别名也慸丑芥反極也劣也又音帶正今昌芮反玉篇謹也二之芮反卜問吉凶也㦞或作正玉篇直又反憂也又同懤怨毒也香嚴又平聲二新蔵作懿乙兾反美也大也又姓徒臥反懈丨也与惰同忥或作正許旣反息也靜也二忍魚旣反怒名也苦陷反陟監反慁胡困反悶乱也俗􅓆正徒且反難也怒也悪也与憚同二語靳反且也缺也㥶先代蘇則二反心安也正今音契怖也劇也二㣻魚肺反困患皃二同音忌教也一曰謀也俗㤅正音愛惠也又香嚴俗音氣二或作正力志反憂皃二古文患字音礙惶也亦騃也与懝同直絳反兇頑也恏又好二音懲也㤮于况反誤人又居况反丨望也音忌二同愿音願善也敬也又專謹也二俗悥古文念字三俗音認二俗憩正去利反息也三古文恵字七浸反雲行也誤新蔵作慮古文音絹今作狷􅜜古文皮兾反俗音曺古文古候反恋音甚音忌二烏故反憝音隊与譈同怨也悪也正愬今音素行也又所責反驚懼皃也憖魚恡反閑也且也傷也㤂今邑反入聲惡爲各反不善也俗同上㥦謙叶反當也可也快也心㐲也俗音撮取也又子括反丨榒也愙古㤩正苦各反恭也敬也虚謙敬讓也二今愂正蒲没反荒也昏乱也二古活反慾音欲好嗜逸也恧女六反慙也又寕句反憋并滅反急性皃又普滅反怒也慝他徳反媹丨邪穢也他德反悪也亦差也惁音擊敬也二先擊反敬也又音擊音食二或作正今苦角反謹也誠也善也愿也四㤲二或作苦叶反可也快也心伏也扵六反玉篇悶也香嚴又音億安也二俗或作惄正奴歴反憂也思也又心之飢也四㦌音忽寑丨覺怒也香嚴又許􅟕蘇管二反懖古活反巨善也音道傷也与悼同香嚴又音卓或作慹通正之渉奴叶二反不動皃也三㤠音列憂心也二同𥘉力反愴也与惻同烏竹反􅊖三俗悉正息七反委也皆也說文從采也四悊陟列反与哲同智也又俗先擊反㤫三俗惪古音德下一縣名也五尼乙反同暱又他德反同慝山部第五崖雅皆反髙岸也山際邊也岩古喦玉篇同巖五銜反峯也險也峻也崿也三二俗嵯正昨何反丨峨山髙峻皃也三俗峨正五何反嵯丨山皃也二崑崐音昆丨崘山也二同崙崘魯昆反崑丨山名二嵩崧息戎反山髙皃也又姓二𡵨巨支反山名又州名又姓𥘉今反丨差不齊皃也与叅同﨑嶇上去竒反下去俱反丨丨傾側也岴俗㠊正去魚反丨﨑山路也二㠝岏上在丸反下五官反山峻銳皃也都年反山頂也二古崩正北弘反摧也又天子死曰丨也三岨七余反山戴圡也又莊所反与阻同正俗同上三嵎音愚山名俗峹正音徒山名也三嵞音徒古囯名亦縣名通正直尼都奚二反山名也二屳音仙也入山隱曰丨也又許延反輕舉皃也音号山名亦姓嵠音溪巖丨也与磎亦同􅸊俗嶙二或作正力珎反丨峋深崖狀也四峋息倫反嶙丨也俗􅼏正吟琴二音岑丨也二岑士今反丨􅼏山小而髙也又姓崟音吟嶔丨髙峻皃也􅋂俗嶔正去今反丨崟也二㠂俗正五髙反山多小石也二㞥土今反入山深皃也三俗正士衫反山峻險也四音徒山弇或作崦正英廉反丨嵫山下有虞泉曰所入也又扵檢反義同二嵫正嵫今子之反崦丨山名曰所入䖏也二崍嵦上音来下五来反丨丨山也奴刀反山名也嶩奴刀反平丨山名在齊地嶚音聊丨巢山皃也􅥲子聊昨焦二反嶚丨山小尖髙皃俗嶀正他胡反丨􅌘山名􅌘音時證反二俗奴刀反耑音端末也十也亦正也二俗或作三古今音剛山脊也七㟔通正火含反大谷也二音波丨家山名也二古文音之俗正五男口含二反丨山崿也二俗嵌正口銜反丨巖山坎傍孔也又去炎反二俗筆巾反古文音封二崡音咸丨谷山又紀力反亦山名也音前音蘇􅡳二或作嶒正疲陵反丨山皃也三􅲠三或作崚正今音陵丨嶒山皃五崏二俗㟩三或作岷正音旻山名亦州名六􅦂戸圭反人姓或作巋今丘追反小山而衆也又丘䡄反丨然髙峻皃二􅠌口耕反谷名在麗山音羊嶧丨山名子紅反九丨山名巃嵸上盧紅落董二反下子紅資董二反丨丨山峭皃崳音偷㠢上烏乖反下戸乖反丨丨不平皃也㟍音郎峻丨山名冬日所入䖏􅩩或作上音聊丨崖虚也二俗峘正胡官反大山也又音恒山名二音臨離利二音誤古恩反正作根蛝二字俗㠐或作嶠今渠嬌渠庿二反山銳而髙也又山道也三古文音憂二俗正戸交丨亟山名三𡊇音陁音㸔諸請二音三俗正尺之反羽盛也二岥俗音坡嵟都回徒外二反許云反巨反山名也崽山皆反自高而侮人也又小佳反呼彼之稱也岹岧徒聊反丨嶤髙山皃也二二或作巇正今許竒反嶮丨巔危也四音流嶣或作嶕正昨焦反丨嶢山危也二嶤或作嶢正五聊反嶕丨也二嶃士銜反丨喦皃也古文邦字囯也又姓或作岓正音祈山傍石也二屸音洪峕訔古文音時二㟀音連与專反合作㳂崷字由反丨崪也音盈俗􅶪或作去弓反二音玄音傍鷄奚二音崸二或作正五江反山名也三扵縁反山曲也巆俗嵤或作嶸正戸萌反崢丨山峻皃也下又音榮義同三古文音従上音賔下音流父文反崔昨回反丨嵬又倉回反丨人姓峞五回反山髙皃也古文南字二俗古嶜今昨淫反山嵒四俗巍正魚韋反丨丨髙皃也二古文音民敷容反草木盛也音玄許危許格二反岯音丕山名音回􆃓或作岭正音零山深皃二崲音皇經音義云或作直魚反与同嵍音毛江西随亟音巨支反子于反丨隅二同音旡崌音居丨山名也㟉上音髙下音勞㟫巳上六字取一面呼之音眉山名所臻反山交也音鄰崢七庚反丨峥山皃崝七耕反丨陗也俗音抽岣俱句二音丨㟺山名㟺力朱反山頂也崆苦江反丨􅱔山皃又音空丨峒亦山名音携峒音同崆丨山名古峗令音危三丨山名二北登反音俗音㱕許冝反同巇險丨也多干反山丨也歲峟音又音印嶳二古文音地雖醉反徒紺反俗一正胡化戸花二反西岳山名亦州名又姓三其禁反或作嵣今徒浪反丨㟐山名二㟐莫浪反嵣丨也古文誓字古文音歲二同上三屶音㑹音后音致乢音盖入聲俗嶨正苦角胡角二反大山多大石曰丨二千各反許月反山皃􅴀苦沃反山皃所立反三士角反二同􅻟新經作濯在廣弘明集岬音甲音業㟳音栗山名俗烏甲反音壁俗崨正疾葉反丨䃳山連延也䃳良渉反二俗􅝝正五結反屼丨山皃又五鎋反山中絶皃也二音渇士力反丨嶷㠅音福㞺音族嶷魚力反𡵨也岌魚及反山髙皃也二俗正今五各反崖丨重巘山也四俗正五各反亦山峯也二岂二俗㞯正子結反山髙皃也古文今作三嶽音岳山丨也俗士角反經音義作䃚嵽徒結反丨嵲髙山皃也嵲五結反嵽丨也􆀠音兀山皃亦山名也􅣊音密山形如堂音木口盍反或作崛正渠物反山短而髙二崫魚勿反山也又特立也又同上俗所急反俗正音直山直也屹魚訖反丨崪山皃也昨没反丨屼山皃二同屴崱上音力下士力反山峻皃嶭俗二正五㵧伍結二反嶻丨三殊六反嶖徒合反苦郭反峊或作正五結反山髙皃也二音律正俗音必山道邊堂也二嶻才葛才結二反丨山名也或作正魚列反臣僕庻丨之事謂賤子也又姓又五葛反二玉篇之岀反草一丨香嚴音莫丨反峡侯夹反巫丨山名岞或作岝俗士格反丨峉山皃又音昨丨崿山高皃二同峉五格反岝丨也音攝嶧音亦山名崞音郭州名縣名也音莫五葛反崉二俗音積正作脊背丨曷喝二音俗音或峪谷欲二音古文音古文昔字古文音木古文音若音若音滅車部第六輿音余事也多也載也又去聲方丨縣名輸式朱反髙也盡也更也轅音袁車丨也音當車丨也俗今正音渠車也三軒許言反丨車也又姓俗䡣正音魂車軶也又音軒車前㪯也一輼俗輬正上一音温下二音涼車名閇即温開即涼也二俗􅟁二或作輷轟二正呼宏反衆車聲六軻苦何苦我苦个三反居貧轗丨不過也俗轗正口甘口感口紺三反丨軻坎滯迍厄也二􅬈音盛膏器也輇音銓車下卑輪也又七專反無輪車名也輲市專反旡輪車名也俗正今借官反車曲轅也亦与同三䡴尺容反陷陣車也又直降反衝城戰也䡩或作耕反車声也二䡰口耕反車鞕也又車堅牢也二匡狂二音車戾也或作輣正薄萌反兵車又樓車也二軯薄萌反車声也輄今􅵬正音光車下横木也二俗正軖今音狂丨絲具也三軨音令車闌也音令丨輅漠廐名丨也轠雷壘二音丨轤車屬也又不絶人擊也俗音英二俗音禾二俗輜正側持反重車又丨軿車也又楚持反三軿音瓶輜丨兵車也又歩田反四面屏也輏俗輶正由酉狖三音輕車也二軥俗軥正古侯反車丨心木也又古候反丨槅也又巨俱反車軏也二音修丨䡖載喪車也輖音周重載也音心軥丨木也音廉車􅦿也音氶軺車後登也音揺玉篇云大夫之車也又音韶輘魯登反車聲也俗正所咸反車聲也二轁二俗他刀反正作輡蔵也䡘音田丨丨衆車聲音瓶丨也音楚監反輈張流反車轅也音禾音衡俗音渠俗音余俗􅸽正音唐丨䡙軘軨二徒昆反兵車也䡙音郎􅸽丨車也􅙲孚袁反車大箱也䡮即容反車跡也輁渠容反丨逐所支棺軝巨支反藥草俗音工䡆音容車行皃輰音羊丨䡵車也俗他雷反軙或作歧匙底三音輪也倉紅反轞車載囚也疋庾薄庾二反車聲也俗輗正五兮反車轅端持衡木也二輀俗通正音而喪車也二俗音咨轃正今則前反大車簣也二音籠車軸頭也輫音裴車箱也俗軤正音呼人姓二轘音還丨轅也又地名又音患車裂人也轙冝蟻二音車上環㘘所貫車也音孤大骨又盤骨也軲苦胡反車也又山名亦姓二或作今音柴連車一曰却連柩堂也又七移反三他廻反車盛皃二同䡅輴敕輪反載柩車也二同轒扶分反丨䡝兵車也又房吻反於云反轒丨又於粉反經音義作轒扶分反兵車名經文是比丘名在七女經中郭氏又俗胡罪反古文苦于反今作看丨視也􅚳音田丨喜恱皃也音軫轇音交丨葛㦸形也轈七交反詩云兵車若巢以望也輎所交反兵車也軳薄毛反戾也又車輇也䡐音陁疾馳也􅛓舊藏作軒籕文音車上聲或作􅰬今盧感反輡丨也二軟通而兖反柔也弱也音車丨也与同輦力展反輿也人挽車也又姓通耳丁礼反大車故也二􅎮通軫正之忍反車後横木也又動也亦姓二之忍反丨跡也轉也與後橫木也見經音義尼展反轢也輾知演反丨轉也又姓又女箭反水丨也􅞮無返反引也又音方車也輔音父助也弼也又丨也音隠車声也二同俗女乆反軵而隴反推車或作居勇反也於綺於義二反車丨也䡊音反車耳䡄居水反法也車跡也說文字様皆從九安古反車頭中也輠胡罪胡瓦二反車轂頭轉克又果禍二音一卑脂角也俗才敢反正作槧削板牘也䡔音啓至也輕也而隴反車丨二軹音紙縣名也輆上苦海反下徒亥反丨丨不平㒵也䡱舊藏作轉正今奴可反撓也二軡俗輡正苦感反丨􅰬車行不平也二俗正音揔輪也二輑牛隕反車軸也又昆群二音音乃撓也又奴可反正二今眉殞亡盡二反車兔下軛也三或作軬今音飯車丨也二轏士限反車名士所乗也輚士限反埤倉云卧車亦兵車也又載柩車丨也俗轑正音老車軸也二音栁載柩車也輮人乆反車􅦿也轞車聲胡黯反田車也二軓音犯車前也一曰車當前丨也俗而隴反正作軵輨音管車轂端䥫也俗引反去聲正今音皃引也二俗音問時正反軔音刃礙車輪木也俗正魚向反丨轎也二俗轎正渠庿反斬車也又音僑小車也二俗􅚫正許建反二俗音秘俗正他計反唾聲也二叀轊祥歲胡桂二反皆車軸鐵也上一又時釗反望也三䡲士戰反軒輞也俗於亮反輅今正音路車丨也古天子所乗之車曰丨二輳倉奏反輻丨也軰輩蒲昧反比也又北昧反等丨亦比類也二於教反有機車也音丨車彗也俗胡頬反軾音識車前也䡇俗正月兀二音丨車轅端曲木也二轕正今音葛轇丨載刑也二或作今直列反車丨二真逆反車丨也或作䡾正五葛反車載髙也二乾音訖軼徒結反車相過也􅮣苦盍反車聲也俗直六反正作丨艫也艫音盧軜音納驂馬内也繫於軾前者也镸部第七長布遥反長㒵也又布休反俗今正相俞反則丨也三二俗髭今正音資丨鬚也四四俗通正子紅反毛乱也六子紅反馬丨二俗髦正音毛選也俊也又丨鬣也鬣音良葉反三七俗通正莫班反花丨也借用字正莫賢反燒煙盡眉也九音而頰上毛多㒵又獸多毛也女耕反丨也三俗正音坤去髮也四俗正如羊反丨乱毛也又乃庚反䰃丨乱髪㒵也二正䰃今蒲庚反丨鬤乱髪㒵也二去王反丨鬤也髫正今音條小兒髪也二䦋今正五髙反長大㒵也二䰉歩官反丨頭屈髪也又音伴卧髪也俗古文丑容反丨直也二二俗胡加反􅜚子邪反長歎也謩母二音俗直良知兩二反俗今音弥長乆也二髟音衫屋翼也又長髪㒵又必么反三俗邊兮反正作箄冠飾俗落禾反二俗音求俗或作鬐今渠脂反馬項上丨也三俗正疋昭反髪㒵也二俗鉗紺二音俗疋綿反䦈子邪反丘山名音分三俗山交反江西隨亟音以長反丨舉也郭氏又俗音徒乱反䯭䯹息廉反好髮也二同三俗正士耕反丨鬡毛髪乱㒵四俗士金反俗通髽正側瓜反婦人䘮冠也三俗音繒鬔二俗髼正薄紅反丨髪乱也三䯳二俗正私宗息共二反丨也又音送丨也三息恭反燕云長也鬗莫官反髪長㒵也鲁甘反髪踈㒵鬑音廉丨鬋也一曰長㒵鬋音煎女鬢垂㒵又音剪䯾音凋小皃留髪也又音呪少髪也一曰多髪正髶今而容反髪多乱㒵又音二髪飾也二正鬞今女江反髪多也二正今音三䰐丨毛垂也二或作鬈正渠貟反髪好也又胡人髪也二髬音丕髪乱散㒵也鬅鬙上音朋下音僧丨𬒳髪㒵亦髪短㒵䰈昨何反髪多㒵䯽芳于反髪好㒵又音部音夫䯻夲也又音竹露髻也䰕盧驢二音毛黒長㒵鬃才宗反髻髙大㒵渠客反乱髪也七恭反髪乱也他来反丨婦人偽髪也渠支反長丨囯名丨長於身也汝塩反頷毛也俗髾正所交反髪毛也二鬟戸関反髻丨也髿上素禾反鬖丨㒵又音沙髟丨垂㒵也力之反髬丨髪起也音客飾丨一曰髪長也二音弟儀禮云王婦𬒳丨玉篇又剔釋二音同􅚎剪髪也鬕莫嫁反婦人結髪帶也正䰎今立愧反屈髪綰髻也二或作今音賛髪光澤也又姉未反二䯸音次美髪也今或作正音次以漆塗噐也三䰁𥙷救反忽見也芳救反假髻也又疋力反皆變體音聖義同七子峻反丨同子寸反委髪也入聲髮二今髮正音發頭丨也三正俗古活反結丨也又俗音計二􅺹七俗正良渉反䰅丨也八镻徒結反䭮音拂額前髪也俗􅚎正他歴施隻二反說文云除髪也二俗音飾俗弗隋二音首飾也鬠音活以組束髪也組音祖鬜苦八反秃丨也三同俗正北末反玉篇云大髻也二音卜䰅髯也一正今居六反乱髪也二䰋舊蔵作門部第八門正門今莫奔反丨戸也又問也聞也字従兩戸合為丨也一俗關正古還反扄也以木横持門也二䦐二俗開正音開通也解也三闍視遮反又音都闉丨城上重門也誤闉正音囙丨闍也二閼扵礼反丨氏姓也又阿葛反止也塞也閂俗烏瓜反閶音昌丨闔也闈音韋宫中門謂之丨也俗闚正大規反小視也二𨵦羊朱反窺丨小視也閨音圭閤也反䦌丑任反直開也入聲古今音恱簡丨閥丨也二閥音伐丨閱自序也閦四俗今正𥘉六反衆也正従三人如衆字下從三人是也餘皆變體六閚俗音立闒徒盍反門樓上屋也古闢今便亦反開也啓也二俗䦗正靜也閾許逼反門限也三門龠音藥門鍵戸丨也俗闋正苦穴反止也終也二俗通闔正胡塔反閶丨門扇也三闑五結魚列二反門間中礙也或作臬闥他逹反門屏閴闟許及反㦸多也又俗音闒徒結反闇丨鄭城門也䦖胡結反丨也䦚俗呼活反正作大奯大開也閘烏甲反開閉門也又音甲俗烏結反食塞也俗呼目反俗音側闃俗􅞔正苦覓反寂靜也二二俗正苦穴反丨無門户也三俗䦧今正許擊反也恨也戾也又相怨也三俗音恱䦪烏鎋反門扇聲䦢二俗闊正苦活反逺也廣也三俗胡頬反俗音獲又呼伯反破物也俗闕正去月反門觀也缺也門兩傍闕然為道也又去也過也失也不供也亦姓二䦝呼麦反丨門也胡沃反門聲胡結反門聲也丁結反門閇也閰居六反閑丨也芳逼反塞也䦍音兀丨枯也闕二俗去月反䦑缺血二音無門户也刀部第九刋口干反丨定除削也二俗今力之反王篇割也三俗正里之反剥也割也二俗正所班反定也削也除也二苦姑反剖判屠破也同上二俗刓正五丸反圎削也三俗剶正丑全子全二反丨去皮也二俗音麻正􅗴今借官反剃髪也又音剪二渠幽反無角龍也与虬同二俗歩交反古文居言反剾㓱上烏侯苦侯二反下音頭丨丨刀開物剜裏也又足刲也剴古哀五來二反大鎌也二曰摩㔁香嚴音尞丨鈎也俗正士銜反丨刾也二户圭反廣疋云挑剜刲丨削也刲苦圭反剜刾也二同或作正他凋反丨剔也二烏玄反曲剪也剔也􅺶二古文烏玄反水出深而不流曰丨剅甞侯反穿也尺容反短矛也音凋二正音前舊蔵作郗音丑脂反㓮玉篇丁么反琢也又舊蔵作割字苦姑反俗劘正音摩削也二𥘉佳初加二反丨又小矛也又𥘉嫁反㓽音崇鍤属也㓳丁兮反剅丨以刀解物也二同􅧠疋迷反丨削也正今音西刻􅩊也二剘俗音其􅧉音鈎関西呼鎌也音崩或作劁今昨焦反短刈草也又笑也二古花反割也烏官反俗音夷古懷反断也二㓚音功削也刣之容反二丁聊反断也俗刟正今丁聊反以取禾穗也三俗㔌正祖侯且侯二反細断切也又才奏反􅸺丨二􅸺音婁丨小穿也又音漏丨㔌細切也􅿦音賢自刎頭也剜烏官反􅿦削也音離分破也又音礼亦刀刾也俗音音從音離上聲剖普口反判也破也析也剡羊冉反削也利也又時冉反縣名㓟疋美反丨剥也無正文假借用俗剗正𥘉簡反丨削也与鏟亦同二俗刎正武粉反丨頭也二剿或作剿正子小反丨絕也二剸剬二同旨兖反細割也上又度官反截也下又音端齊也剮俗古瓦古禾二反剆勒可反擊也亦斫也􅰙茲損反减也截也剞居綺反丨工人曲刀也􅩊𥘉兩反皮傷也旨善反也叧俗古馬反居偃反丨吃語也又礼反戰名初巳反割物也二刌倉本反細切又割也劋子小反絶也俗剄正古頂反断首也二㓠音點斫也二俗二正姜酉反出罪也四去聲劑情細反分段丨截也㓷通正魚噐反割鼻也二創𥘉向反始也𥘉也俗音剉倉卧反丨斫也二刵而志反断耳也䓶七賜反棘丨也又盧逹反蒿丨也常照反自強也又姓与邵亦通俗剃他計反除髮也二居稅反傷也割也㔀俗剠正音亮取也冶也䇢也奮也亦作掠二􅓑或作剰正食證反丨長也二剽疋妙反強取也又輕也㔋盧擔反利刀也相承七念反䚯古弔反呼也二檜括二音断也刏俗刉正古對反丨刀使利也二郎計反割破也二同俗或作音丨割也又音螺二郭氏皆毳察二音断也三徒乱反􅕻居衞反剖丨断割也又音厥剚側使反丨刃也与倳同二二俗义諌反划古卧反鎌丨又音果刈也音赦俗正苦恠反茅類也又姓二音計草名縣名州名又姓舊蔵作制音故􅧉古文同上二音樹入聲劇俗劇正竒逆反増也更甚扵前也二音伐小罪也加罪扵人曰丨剌盧達反澼也戾也又丨賜反刾七亦反丨穿也又七賜反針丨也刖音月断也足刑也又五刮反俗音恤刕音叶同力也又玉篇音歴仾反人姓劈普撃反剖也破也裂也剖音普口反割正今音葛剥丨断截也二或作剥正百角反丨落刾割傷害去皮也二剹音六刑也煞也辱也又病也刮古刷反丨削也刷所劣反也清也剔他暦反解也二刻苦得反丨鏤也又剥也二剋同上必也殺也急也自伐也二俗正𥘉鎋也丨柱也三削息約反刻丨也音叶思也俗正𥘉一反割物聲也又俗音刾二刜拂佛二音撃也斫也破也剫徒各反治王也又斫也㓢音洛木無節也二俗㓣正苦洽反入也三都盍反相著聲二曰丨鈎也五骨反舟危也二或作正力一反細切也三劂居月反剞丨曲刀也良渉反削也擇也二同㔃子恱反丨断物也剭屋握二音丨誅刑名剟陟劣反刋也胡麦反錐刀剋也俗刦刧二正音刧強取也三俗都盍反他歴他計二反割也劅竹角反刑丨也竹角反草木矢也又陟孝反􅱅妾業二音繢麻也剒倉各反斫也俗盧骨反劄竹洽反刾著也魝或作㓩正音結刺理角也二㔏之石反劙也􅽒郎活反削丨正㓵今五各反劍丨也二俗割盡二音剨呼麦反破聲籕文􅒠苦郭反解也裂也二士洽反川韻云切聲又玉篇𥘉洽反義同丁木反丨力鋤也􅤏丁木反力鋤也又烏加反自刎也玉篇又乙雅反人質反剥也又知教反音割音則二音易衣部第十衣於希反丨裳丗本胡曺作丨白通云丨者隠也裳者障也所以隠形自障蔽也裭三俗正直知反蓐衣也又曰氈又池尓反易曰以訟受服終朝三丨也三大衣也四二俗正奴郎反袋也橐也有底曰丨無底爲橐丨音託三衹渠支反僧丨支尼服也音浮聚也又余救反服飾也又音褒裒俗褒正博毛反丨進揚羙也又姓又寛衣皃也二俗袍正薄毛反長襦也二裴蒲回反衣長也又姓袪去魚反去也抽也舉也古褰正去乹反摳衣也二襟䘳音金袍襦之袂也亦衣帶也二衿音金衣小帶也又其禁反古袤今者牟延丨也廣也玉篇又衣地也去聲又都聊反死人衣也二古今音脂敬也二裝音莊丨束也又側亮反丨飾也衾去音反丨𬒳也裨音卑丨𥙷増助也又与也附也又附支反副將也又姓䙬俗音瓔䙔烏侯烏后二反小兒延衣也褘許歸反后祭服也又音韋襌音丹有表而無裏也俗音衫音佂丨松小兒衣也䙂俗衳正音鍾丨也亦小禈也二衷音中善也道也中也正也又褻中衣也襠音當雨丨衣也襤魯甘反丨縷也俗正今音衣襟也又力主反襤丨衣破弊也三褕俞摇二音丨狄近身衣也二俗襝或作正處占反丨䄖蔽膝衣也四裙音群裾音居衣丨裮音昌衣披不帶俗音雄強也音圭婦人上服口丨又長襦也俗䙖正比爭反束皃衣也与繃同二袾誅姝二音衣也又俗朱注二音俗音孝長也俗正汝塩反衣縁也二夷啼二音衣名也衦或作今音干包衣即大袖衣也二襑音㝷衣博大又他感反衭音夫衣前襟也俗通襦正人朱反短衣也二䘰羶延二音㠾丨牛領上衣也㠾音怨􅥗正褈今尺容反丨褣衣也二褣音容褈丨也褌音昆内衣也二俗二或作齊正音資丨纕䘮服也五䙞俗音登毛帶也薄紅反尓疋云衱也褆音啼衣服好皃也俗音袁垂衣也音鞋衣䄂也䘽五兮五礼二反梳丨桂衣飾也裗音流䘽丨也音胡丨䘸也俗衯正音芬長衣也二正俗􅗒今音衫小襦也三襛女容而容二反丨花皃褵丑知反礼裳上衣袩俗􅙭通正丁兼丁叶二反衣領也三通正古侯反單衣也二袀居匀反戎衣也䘯所反衣也袽女余反易曰衣有丨裪徒刀反福丨衣䄂也襎音煩丨卷帊幞皃䙟音韋重衣皃又垂也凋鳥二音短衣也􆁫衺二古文邪牙二音襓音饒劒衣褿正今昨勞反裙也又衣也又音遭二裀音因近身衣也褍音端衣長又衣正幅女加反衣弊也褮音熒衣開孔也又音縈鬼衣也舊蔵作齎祖兮反在三法度論褷所冝反􅗒丨毛羽大也二俗奴當反裯音紬單𬒳也上聲䙨二俗裹正古火反苞也也三俗正烏可反丨袲衣皃也二袲奴可反襃丨衣好皃也音戸福也三俗袞二或作衮今古本反天子丨龍服也六䘺文限反衣縫解也袒徒旱反丨裼也又音綻衣縫解也裼音先反同二又音展衣皃也裸郎果反赤體也又胡瓦反褓上居兩反負兒衣也下音保䙗也䙗音替奴了反丨也二俗褾二或作褾正井眇反䄂端丨也五必小悲夭二反衣䄂也玉篇又疋小反俗音吕祭名也息拱子冢二反單衣也䘨􅤨上音皎下音了丨丨行騰小袴也音啓二同衦古旱反搌衫也俗屣所二音俗褚正知吕反裝衣也二裏音里中丨二俗正古典反纊著衣也三孔反丹榖衣也俗音紙正作只音偃衣交領也裺衣撿扵劒二反衣縫縁也褊方緬反衣急也又小陿也或作裋今音樹弊布襦也二􅮌音散裲音兩裖或作袗正之怒反袨服也二尺斂反丨俗袧正音苟祭服也二或作袳正尺氏反衣長也二襖烏老反袍丨也衪俗袉正袘今徒可反裾也又他可反長舒皃也又紳帶也三䘾苦管反袴襱也力勇力董二反襱力董直隴盧紅三反皆裙袴異名䘢知吕反衣丨又弊衣陟是知几二反䘢丨也俗正都感反𬒳縁也二舊蔵作禍俗音禍音吕姓也裎丑領反軍衣褞扵粉反丨袿也音雨丨縣名也音綺好皃也古裷正去逺反薎也二袑正今市少反袴上也二今正徐兩反二音稔卧席也襧陟几反無衣也一曰衣二同胡感反壅耳也与㥛同俗他尓反奪衣也二音阻俗公本反正作裘褧丘頴反去聲製音制作也正也断也裁衣也二同俗古裕正羊句反衣物饒也又道也也寛也三二俗古或作今余制反逺也衣裾也邊也苗丨也又容也裔正同上六袨音縣好衣也又美也黒衣也袋音代盛物丨也袢音判無色也又音煩絺褐當暑葛服也袔音賀䘸袖也二同或作衸今音界布衣幅也又胡界反𥙷裙也二􅘼上音界下力佐反丨丨婦人上衣也袖目就反衣𬒮也袂弥蔽反衣袖也俗正所拜反衣袂縫也二襻普患尺衣丨也俗后託二音俗音被或作襢二今陟扇反皇后衣也三裱方反領巾也又表出料軍䙃惰唾二音無袂衣也或作正簿報反衣前襟也二才夜反小見衣丨也薄盖反衣被也衽汝反衣衿也襯𥘉近反近身衣也襚音遂送死人衣也古莧反古衣也倉見反丨袨好衣㒵他貫反皇后大服也又以絹反褦俗正音罷帬也二音問襘古外反帶結也襉古莧反丨裙袏音佐單衣也褑音院佩帶也襊麁㝡子外二反衣遊漨也二同褅俗音弟正從不祭名􅙳𥘉迓反𥘉懈二反裙分也音例旡後鬼也正從不作袸在見反小帶也音例殘帛也今作㡂䙢子孕反汗襦也褹魚祭反複襦也襬披義反衣丨也襸正今音賛衣好㒵也二二俗正他計反丨裂手取也又𥙷也三襈士戀反裙縁也裞他外以稅書芮三反大功巳上送凶衣也舊蔵作救􅠷音替小皃衣也褏余救以周二反服飾盛皃今作字二入聲襪亡發反足衣也籕文襲今祥入反因也及也入也重也合也二裼先擊反袒衣也俗裓二正古得反衣前襟也三裂音列分襞丨破也褥与蜀反氈丨也袜音末丨肚也又俗亡發反袼音落樞丨小兒次衣也袷侯夹反衣領也裨二俗裌正古洽反複衣也三古正複今音福絮丨也三䘸音亦丨絳也俗䙝正私列反哀衣也二襗徒各反䙝衣也又音亦衣也襡音獨韜蔵也又音蜀長􆁼也俗襮正𥙷各反衣領也二䙏音短袂衫也又單衣也二俗或作正音牒重衣也四􅜵正􅰂今苦盍反丨襠前後兩當衣也二褡音荅横小被也俗音福北末反襏北末反丨雨衣也北末反蠻夷蔽膝衵入質女質二反婦人近身衣􅰁古穴反衣䄂俗二或作正今冬毒反衣背縫也五俗裻正音篤新衣聲也又先篤反二姉入七入二反襟縁襭胡結反以衣盛物也音歴纒裏也袟俗袠正直質反書衣也二三俗或作房玉反丨頭也今從巾同四二俗音識切丨也二襩正今市玉反袴衫別石也㡁音袴二俗他盍反正作俗先結二對二反衱音劫衣領也俗音葛字俗裛正扵汲扵功扵輒三反書囊又丨坌衣香也二褽襞必益反丨衣也二衲音納𥙷丨鈇也俗正紀力其力二反衣領也亦作二正襀今音積襞也二䘦形質反近身服与衵同襵陟葉之渉二反襞也衣丨也褶音習袴丨又音牒袷也袷音洽俗䙘正子六反好衣㒵二都活丁外二反丨祤縣名從文丨正三俗的酌二音正作音均戎衣也側洽反丨畧絜束㒵也䘿渠物反衣短也袕音穴鬼衣又長衣也䘚干没昨没二反初角反短衣也袺結憂二音柱也又持衣也古沃反祭贈也丁大反衣至地也三同袥音託開衣領令大也紀力反衣領也徒叶反与㲲同音習礻部第十一礻巨支反相也此字与衣示三部相渉祠音詞祭也祁巨脂反盛也又縣名又姓又俗音時禕於冝反珎美皃也祅今䄏正扵反灾也二禳正汝羊反謝也除也音桂亦祭也禖莫盃反郊祭名也祅呼煙反胡神官品也或作祧今正凋反逺祖庿也二古籕文祺今音其福也祥也二俗或作今音曺祭豕先也入音糟棧也三二或作之延反正作栴禛音眞以貢受福祩朱注二音詋也祝也禌俗音兹息也礽音仍福也䄉音俄盛皃禗音思不安欲去也俗音饒劒衣也俗音端禧許其反福也吉也禯女容而容二反丨華也俗女余反衣有丨也俗落紅反俗音纎小也所冝反丨毛羽入也二音脂丨敬也禈許韋反祭服也䄄俗音因衣也俗乙皆反禎音貞祥也善也斯移二音福也䃼俗音初俗音元裡俗力之反川韻同禈音昆内衣也又舊蔵作嫓疋許反配也俗音希䄇音程帶也又丑領反俗直良知兩二反禵俗禔正支帝二音福也二俗古莖反俗音良俗音勤俗通正音脂敬也又丨承也三祊𥙷盲反庿門傍祭也二同俗音廵俗音㩲俗音戎丨衣俗音康禋音因祭也敬也古文音紫祭天燔丨禨居衣反祥也祾魯登反祭也福也靈也音羊道上祭也一曰道神又音啇又俗音錫袒衣也音傷道上祭也祲省正子心子鴪二反曰傍祅氣也二禉俗正由酉二音丨燎祭天𬗋也二誤音音純反正作稕上聲䄡三俗正都老反祭也請也永福也四祜胡古反福也音吕祭山川名也益琰反丨禳也䃾音比以豚祀司命也禩二或作祀今音似年也一曰祭丨三禑俗音偶俗𥿄只二音祤音雨祋丨縣名也音倚好皃也俗舊蔵作禍二二或作二正息淺反祭餘肉也四俗都感反𬒳也二俗吐敢反毛衣也卑小反䄂端也正従衣二俗正古旱反二二俗禍二正胡果反灾丨也四禇丑吕反人姓二新蔵作音𥙷誤合作獷古猛反音免俗也尓反䄒誤如枕反正作稔歳丨也俗或作正奴礼反祖丨也又姓下一又俗古典反纊著衣也二祢俗通奴礼反祖丨也古文音鬼或作祳正侍忍反祭名也二古文杜字或作禫正徒感反祭名也二禂都老反牲馬祭也又俗音紬祉丑里反福也禄也祪居委反毁庿之祖祮俗祰正音苦禱也又祭名又音榖二音所祭神米也二同音吕相承音誘音阻去聲祐音又福也神助也祶俗禘正音弟大祭名也二䄌陟稅反重祭也禬古外反祭福又曰除灾禍舊蔵作救俗音賛衣好㒵禐王眷反佩也羊制反祭名羊制反𬒳也俗新蔵作袴祄俗戒械二音王作祄俗音戒正作㮫上衣也䄈音豆祭丨又音祥縁也俗郎佐反婦人衣也音藝複𥜗也又女介反亦市𥜗也正從衣二音頼墮壞也舊蔵作居運反子對反月祭名也同上俗音詠俗音奉俗音利丑救反舊蔵作枯俗扶祕反俗直利反禡莫嫁反祭名又師旅所止地也祼音貫祭名又俗胡瓦反禷音類祭上帝也祔音附合葬又祭名俗䄂今力救反留祀祝丨又俗音䄂二直又反福也又丨祝䄍床嫁反年終祭名禊胡計反丨飲也禲音例無後鬼也俗之閏反呼到反入聲奴沃反愛小兒也古文音即社丨俗知草反俗皆八反正作稓俗徂未反禴礿音藥祭名二同䃽俗正音拂除灾求福亦㓗也又方吠反二蒲末反俗音禄俗音兀俗䄆正音活祠也二禢他合反二祏音石宗庿主也大夫以丨爲主祫侯甲反祭名也祰古沃反祭贈也都活丁外二反丨祤縣名也三笈刼二音衣交領也正從衣音亦重祭名也俗音蜀長𥜗也俗子昔反襞也舊蔵作螺五篇直輙反丨蟄也禚之若反地名又五榖皮也又音榖与䅵亦同呼角反牛部第十二㸹二俗即羊反正作將二渠幽反牛角也牟莫浮反牛聲又過也陪也進也大也又姓今作牟音㝷牛也符悲反㑛牛聲㑛音速居言反獸名似牛也烏耕反牛也俗丑居反正作摴將水二音俗士㽵反丨榻也俗通音収犐㸰苦禾反牛無角也二同牠徒禾反牛無角也俗音蹄俗二正音叨牛行遲㒵三㸫俗犍正居乹反又音乹丨牛也又縣名二牽啓堅反引也連也挽也二犇博昆反驚也又衆牛走也与奔亦同牷音全體完曰丨也犛犛牦六俗今正莫包反說文丨牛也又力之反亦牛也八字俗則郎反羊也正今烏閑反黒色牛也二四俗犁通犂正郎奚反耕墾之具也又結也六普耕反牛色駁如星也玉篇于吟反在神呪中也又胡紺反又隨文有多釋也二俗音犎音封野牛也㸼芳容反丨牛也音秦異牛名也􅥠音容似牛領有也犫或作犨今赤周反曰色牛也又姓二音眉牟含反犩語韋魚貴二反尓疋云蜀山有大牛重數千斤即䕫牛也如延反犙蘇含山幽二反牛三歳也牰音抽求子牛也㸪脣廵二音牛行遲也俗作郎反正作丨牁也㹉音元獸如牛也俗正音懷丨牛獸似牛四角人目也二俗七羊反正作槍香嚴又七剛反牛也或作犅正音剛持丨亦特牛也二牞居求反大力也俗音皇正今息營反牛馬赤色也二牥音方牛未調也犘音麻丨牛重千斤岀巴山或作􅧄俗今如匀反黄牛黒脣也三莫江反牛白黒雜也良亮二音牻牛駮雜色也音徒黃牛虎文也敷昭敷沼二反牛黄白色也犝音童牛無角也魚容反獸名似豕也二俗犓正測于反養牛曰丨也三通正饒繞二音牛伏也二犈音權牛黒耳也又音眷尓疋云牛脚黒曰丨也音飛獸似牛白首一目也犌音加牛絶有力也音那獸似牛尾白也正犠俗許冝反丨牲書云色純曰丨也二古文方字䍧則郎反丨羊也音牽上聲口吼二音牛鳴也二俗通正丁礼反丨觸也四二俗牝正毗忍反雌也畜母也三莫厚反雄也畜父也牯音古丨牛也音吼夔牛子也二㸸音吼夔牛子也又音嘔特牛也又音口舊蔵作緬犃蒲口反丨㸸偏髙又牛頭短也音你㹚今烏猛反玉篇云喚牛子聲也二􅣕音敏獸如牛也或依今而勇反水牛也二㹏音謹牛馴也㹌音産畜丨畜牲也俗音丑㹂限遣頡三音牛佷不徙皃牳音母牛也去聲俗正古候反丨取牛羊乳也二其禁反牛舌下病也今正音芥犍牛也二俗犕正音俻牛見齒也二牸音字丨牛也犔許旣反牛病也博盖反牛二歳也又普盖反尔疋云牛躰長曰丨犚扵胃反牛黒耳也俗或作音紹眉也二俗音古擊也攷俗音􅊲撃打也俗必礼反丨㪒也又普礼必詣二反俗研礼反㪏丨撃聲也又音倪㪙苦果苦卧二反研理也俗口忝口減二反正作歉敄音武強也俗呼可反舊蔵怍音力小反長也又古文音俗丁礼反俗力小反長皃先孔反推丨摶擊也敘音序次也俗昌尹反敾音善相承竹几反斂良舟反収也又姓啟口礼反同啓攺音以大丞又古海反音癸􅛷俗烏口反正作敺丨撃也音敢去聲散音散丨壊分離也又上聲二敝毗𬒮反困也劣也敗也極也效胡孝反致也斆胡教反學也􅊲也成也音敬或作思醉反魚既反果敢也音教義敬二音二音變音致或作音乱音炭丨獸無文章皃也㪇俗蘇見反散也句反丨勇也二俗莫半反三俗赦正音舎霄也四香嚴巨記反古文陣字古文音寺音敝同音宋二音救音况入聲音笛丨對當匹也又軰也主也通㪍正蒲没反丨卆旋放之皃也二敜奴叶反塞也亦持也俗敕正音敕勞也固也正也誠也古文今作敕二敫擊叫二音歌也又音藥光景梳皃也俗正女角反古文今作搦字二正斁今音亦猒也二誤經音義云熱變二字在四諦經古文穆字古文穆字敌下刮反㪤俗音必敋格虢二音擊或作而渉反㪉古合反㑹也􅐁俗徒活反俗音卓擊也􅢴音車􅯹上於叶於輒二反下尼輒尼叶二反丨丨令相著也俗他逹反擊也丑角反又音濁丑六反病丨也俗音佛音煞三同敀音拍大折也又音伯同迫逼也近也部第十五章反丨持丨度也說文云無點又此部与文支三部俗字相濫故出之耳俗宅耕反俗普胡反正作古文音陳音底隠也音魯音散三音變俗以芮反音燭隂州也又音卓刑也俗蘇叶反㩽古文敕字音散音食古文音教古文音施皮部第十六俗正扶文反大鼔長八尺也二俗二或作音皮三俗陟耕猪猛二反俗音遭俗音韋七廵反􅬯俗翍或作披今普皮反丨張開散也三俗側持反俗鞁正音靴二俗皹通皸正音軍足病也又